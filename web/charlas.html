<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Esta página es mapa.html con la categoría fija: mismos eventos, mismos
     filtros, mismo panel. Lo único propio es el <head>, la cabecera con el
     animal guía y las dos constantes de abajo. Todo lo demás está en mapa.css
     y mapa.js, compartidos por las cinco páginas del mapa. -->

<!-- Red de seguridad, no la seguridad: la misma CSP de mapa.html, copiada tal
     cual. La explicación de cada directiva —y de por qué NO van
     frame-ancestors ni upgrade-insecure-requests— está ahí, una sola vez. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; worker-src blob:; connect-src 'self' https://*.basemaps.cartocdn.com https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Charlas y seminarios en Santiago — Loica</title>
<meta name="description" content="Charlas, conversatorios y seminarios abiertos de Santiago, en un mapa. Filtra por hoy, mañana, este finde o gratis.">
<link rel="canonical" href="https://loicasantiago.cl/charlas.html">
<meta property="og:title" content="Charlas y seminarios en Santiago — Loica">
<meta property="og:description" content="Charlas, conversatorios y seminarios abiertos de Santiago, en un mapa. Filtra por hoy, mañana, este finde o gratis.">
<meta property="og:image" content="https://loicasantiago.cl/og-default.png">
<meta property="og:url" content="https://loicasantiago.cl/charlas.html">
<meta property="og:site_name" content="Loica">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- `integrity` no es adorno: unpkg sirve lo que el paquete tenga publicado, y
     una versión republicada o un unpkg comprometido inyectaría JavaScript en
     la página con todo el dominio a su disposición. Con el hash, el navegador
     compara antes de ejecutar y si no calza no carga nada. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V"
      crossorigin="anonymous">
<!-- El ?v= es el cache-buster del sitio y va PAREJO en las once páginas, en
     mapa.css/mapa.js y en la plantilla de exportar_web.py: si se toca uno de
     esos archivos, se sube el número en todos (README, "sube el cache-buster"). -->
<link rel="stylesheet" href="loica.css?v=29">
<link rel="stylesheet" href="mapa.css?v=29">
</head>
<body>
<div id="app">
  <header>
    <div class="barra" id="barra"></div>
    <!-- El animal guía con el nombre de la categoría: lo pinta
         pintarCabezaCat() en mapa.js. Es el <h1> de la página. -->
    <div class="cabeza-cat" id="cabeza-cat"></div>
    <div class="riel-fecha" id="riel-fecha">
      <div class="segmentado" id="fechas" role="group"></div>
      <span class="cuenta-rango" id="cuenta-rango"></span>
      <!-- El buscador va acá, a la altura de Hoy/Mañana/7 días/Finde. En
           celular arranca plegado en la lupa; desde 560px el campo está
           siempre abierto (ver el bloque .buscador en mapa.css). -->
      <div class="buscador">
        <button type="button" class="lupa" id="lupa"></button>
        <div class="campo-buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>
          <input type="search" id="buscar" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false">
          <button type="button" class="borra-buscar" id="borra-buscar" hidden>✕</button>
        </div>
      </div>
    </div>
    <div class="filtros" id="filtros" role="group"></div>
  </header>

  <main>
    <div id="mapa"></div>
    <div id="loica-vuelo" aria-hidden="true"></div>
    <div class="aviso" id="aviso" hidden></div>

    <section class="panel-lista" id="panel" aria-label="Lista de eventos">
      <div class="tirador" id="tirador" role="button" tabindex="0"
           aria-label="Arrastra para ver más eventos"><div class="barra-tirador"></div></div>
      <div class="conteo">
        <span class="atiende" id="atiende" aria-hidden="true"></span>
        <div class="conteo-num"><b id="conteo">…</b> <span id="conteo-txt">eventos</span></div>
        <span class="conteo-estado" id="conteo-estado"></span></div>
      <div class="afinar" id="afinar"></div>
      <div class="lista" id="lista"></div>
    </section>

    <article class="ficha" id="ficha" aria-live="polite"></article>
  </main>
</div>
<nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj"
        crossorigin="anonymous"></script>
<script src="loica.js?v=29"></script>
<script>
  /* Lo único propio de esta página: qué archivo es y qué categoría muestra.
     mapa.js las lee al arrancar; PAGINA manda en la barra de navegación y
     CATEGORIA_FIJA recorta el catálogo (la clave de CATEGORIAS en loica.js). */
  const PAGINA = "charlas.html", CATEGORIA_FIJA = "charla";
</script>
<script src="mapa.js?v=29"></script>
<!-- Cloudflare Web Analytics: el mismo beacon y el mismo token público de las demás páginas (la explicación está en mapa.html). -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "05b8b07df9224b248d539904774ba661"}'></script>
</body>
</html>
