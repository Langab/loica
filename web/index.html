<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras.
     - `upgrade-insecure-requests` tampoco va: en Pages no hace nada (https +
       HSTS) y en el servidor local abierto desde el celular por la IP de la
       red subía loica.js y loica.css a un https:// inexistente, y la página
       quedaba en blanco. El detalle está en mapa.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Loica — ¿Qué hay hoy en Santiago?</title>
<meta name="description" content="Todos los panoramas de Santiago en un solo lugar: mapa, calendario y recomendaciones. Gratis y de los otros.">
<link rel="canonical" href="https://loicasantiago.cl/">
<meta property="og:title" content="Loica — ¿Qué hay hoy en Santiago?">
<meta property="og:description" content="Panoramas gratis y de los otros, en un mapa. Fiestas, teatro, ferias, clases y conciertos de Santiago de Chile.">
<meta property="og:image" content="https://loicasantiago.cl/og-default.png">
<meta property="og:url" content="https://loicasantiago.cl/">
<meta property="og:site_name" content="Loica">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loica.css?v=23">
<style>
  body{overflow-x:hidden}

  /* ============================================================
     HERO — la cordillera con el elenco parado encima
     La promesa de la marca es "un paseo por Santiago", así que la primera
     pantalla es literalmente eso: los cerros, los nueve animales haciendo de
     señalética y la Loica cruzando por arriba. Cero foto de stock.
     ============================================================ */
  .hero{position:relative;overflow:hidden;background:var(--fondo-elevado);
    border-bottom:2.5px solid var(--contorno)}
  /* Manchas de color plano, sin degradados: son las de la serigrafía.
     En oscuro se mezclan con `screen`: sin eso, el amarillo sobre azul-950
     daba un café grisáceo que parecía una mancha de humedad. */
  .hero .mancha{position:absolute;border-radius:50%;opacity:.16;pointer-events:none}
  /* Y el amarillo se cambia por el rojo de marca: un amarillo desaturado
     sobre azul oscuro no se lee como color, se lee como suciedad. */

  
  :root[data-tema="oscuro"] .hero .mancha{mix-blend-mode:screen;opacity:.26}
  :root[data-tema="oscuro"] .hero .m2{background:var(--c-musica)}
  .hero .m1{width:340px;height:340px;background:var(--c-fiesta);top:-130px;left:-90px}
  .hero .m2{width:280px;height:280px;background:var(--c-otros);top:-60px;right:-80px}
  .hero .m3{width:220px;height:220px;background:var(--c-deporte);bottom:120px;right:12%}

  /* Dos columnas: el texto y la anfitriona. La Loica deja de ser un adorno
     que cruza el cielo y pasa a ser la guía del proyecto: llega volando,
     se posa junto al título y recién ahí saluda. */
  .hero-interior{position:relative;max-width:960px;margin:0 auto;
    padding:var(--e-10) var(--e-5) 0;z-index:2;text-align:left;
    display:grid;grid-template-columns:1fr auto;gap:var(--e-2) var(--e-8);
    align-items:center}
  .hero h1{font-size:clamp(34px,8.4vw,58px);line-height:1.04;margin-bottom:var(--e-4)}
  .hero h1 .subrayado{
    position:relative;white-space:nowrap;color:var(--acento);
  }
  /* Subrayado dibujado a mano: la única curva del sistema, y se gana el lugar
     porque cae justo en la palabra que promete el producto. */
  .hero h1 .subrayado svg{
    position:absolute;left:0;right:0;bottom:-.12em;width:100%;height:.26em;overflow:visible;
  }
  .hero .bajada{font-size:var(--t-md);color:var(--tinta-suave);line-height:1.6;
    max-width:560px;margin:0 0 var(--e-6)}
  .hero-botones{display:flex;gap:var(--e-3);justify-content:flex-start;flex-wrap:wrap;
    margin-bottom:var(--e-6)}

  /* Los números en vivo: salen del JSON, no están escritos a mano */
  /* Cuatro cifras en dos filas de dos. En una sola fila no caben dentro de la
     columna del hero, y envueltas 3+1 la cuarta parecía pegada después. */
  .cifras{display:grid;grid-template-columns:repeat(2,1fr);
    gap:var(--e-4) var(--e-5);max-width:470px}
  .cifra{display:flex;align-items:center;gap:var(--e-2);text-align:left}
  .cifra b{font-family:var(--fuente-marca);font-size:var(--t-xl);line-height:1;
    display:block;color:var(--tono,var(--tinta));font-variant-numeric:tabular-nums}
  .cifra span{font-size:var(--t-xs);color:var(--tinta-tenue);font-weight:600;line-height:1.3;
    display:block;max-width:120px}
  /* En celular las tres cifras van en una sola fila apretada: envueltas se
     leían como tres párrafos sueltos flotando sobre las manchas. */
  @media(max-width:600px){
    .cifras{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--e-3) var(--e-2)}
    .cifra{flex-direction:column;gap:2px;text-align:center;align-items:center}
    .cifra svg{width:28px;height:28px}
    .cifra b{font-size:var(--t-lg)}
    .cifra span{max-width:none;font-size:11px}
  }

  /* --- El paseo --- */
  .paseo{position:relative;height:196px;margin-top:var(--e-6)}
    .desfile{
    position:absolute;inset:auto 0 18px 0;display:flex;align-items:flex-end;
    justify-content:center;gap:clamp(2px,2.4vw,22px);padding:0 var(--e-3);
  }
  /* Ya no marchan todos con el mismo balanceo: cada animal entra a escena
     con su propia historia (el Degú sale de la tierra, la Chinchilla llega
     tarde y aplaude) y después se queda con su tic. Eso vive en loica.css
     (MASCOTAS: partes y tics); acá solo el botón. */
  .desfile .bicho-hero{
    display:block;background:none;border:0;padding:0;cursor:pointer;
    transform-origin:bottom center;transition:transform var(--rebote);
  }
  .desfile .bicho-hero:hover{transform:translateY(-10px) scale(1.08)}
  /* Nueve animales: a 375px, nueve por 40px más los espacios se pasaban del
     ancho de la pantalla y el último quedaba cortado por la mitad. */
  .desfile .bicho-hero svg{width:clamp(33px,9vw,74px);height:auto}

  /* La anfitriona. Llega volando desde fuera de la pantalla, aterriza al
     lado del título y el globo aparece después: primero se posa, después
     habla. Una sola Loica en escena — es la guía, no un enjambre. */
  .hero-guia{display:flex;flex-direction:column;align-items:center;gap:var(--e-3);
    padding-bottom:var(--e-2)}
  #loica-guia{animation:loica-llega 1.15s cubic-bezier(.25,0,.35,1) .25s both}
  #loica-guia svg{width:clamp(150px,19vw,224px);height:auto;display:block}
  #loica-guia.posada{animation:loica-flota 4.4s ease-in-out .2s infinite}
  @keyframes loica-llega{from{transform:translate(-52vw,70px) rotate(-10deg)}
                         to{transform:none}}
  @keyframes loica-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .globo{
    position:relative;background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-lg);padding:9px 14px;box-shadow:var(--repisa-2);
    font:700 var(--t-sm)/1.35 var(--fuente-marca);max-width:236px;text-align:center;
    opacity:0;transform:translateY(8px) scale(.92);
    transition:opacity var(--rebote),transform var(--rebote);
  }
  .globo.visible{opacity:1;transform:none}
  .globo::after{
    content:"";position:absolute;bottom:-8.5px;left:50%;width:13px;height:13px;
    background:var(--fondo-elevado);border-right:2.5px solid var(--contorno);
    border-bottom:2.5px solid var(--contorno);transform:translateX(-50%) rotate(45deg);
  }

  /* ============================================================
     SECCIONES
     ============================================================ */
  section{max-width:960px;margin:0 auto;padding:var(--e-10) var(--e-5)}
  .titulo-seccion{display:flex;align-items:center;gap:var(--e-3);margin-bottom:var(--e-2)}
  .titulo-seccion h2{font-size:var(--t-2xl)}
  section > .sub{color:var(--tinta-suave);margin:0 0 var(--e-6);font-size:var(--t-md);
    max-width:620px;line-height:1.6}

  /* --- Los cuatro destinos --- */
  .destinos{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:var(--e-4)}
  .destino{
    position:relative;overflow:hidden;text-decoration:none;color:var(--azul-900);
    background:var(--tono);border:3px solid var(--contorno);border-radius:var(--r-xl);
    padding:var(--e-5) var(--e-5) var(--e-6);box-shadow:var(--repisa-4);
    transition:transform var(--rapido),box-shadow var(--rapido);
    display:flex;flex-direction:column;min-height:186px;
  }
  .destino.tinta-clara{color:#fff}
  .destino:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--contorno)}
  .destino:active{transform:translateY(4px);box-shadow:0 2px 0 var(--contorno)}
  .destino b{font-family:var(--fuente-marca);font-size:var(--t-xl);line-height:1.1;
    margin-bottom:var(--e-2);position:relative;z-index:2}
  /* Sin opacity: blanco al 90% sobre el verde daba 3,9:1 y la bajada es de
     13px. El color de la tarjeta ya está elegido para pasar 4,5:1 en blanco
     puro; bajarle la opacidad al texto tiraba abajo ese cálculo. */
  .destino span{font-size:var(--t-sm);line-height:1.5;position:relative;z-index:2;
    max-width:82%}
  .destino .flecha{margin-top:auto;font-size:var(--t-lg);font-weight:800;position:relative;z-index:2}
  /* La mascota asoma por la esquina como marca de agua. La opacidad va en el
     contenedor y no en el color: si no, los rellenos fijos del animal (la
     pechera roja, la gola crema) quedaban a full y se veían como manchas. */
  .destino .asoma{position:absolute;right:-18px;bottom:-20px;opacity:.3;z-index:1;
    transition:transform var(--medio)}
  .destino:hover .asoma{transform:translate(-6px,-6px) rotate(-6deg)}

  /* --- Panoramas de hoy --- */
  .hoy-caja{background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--repisa-2)}
  .hoy-caja .tarjeta:last-child{border-bottom:0}
  .hoy-pie{padding:var(--e-4);text-align:center;border-top:1px solid var(--borde)}

  /* --- El elenco --- */
  .elenco{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--e-4)}
  .bicho{
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    padding:var(--e-5) var(--e-4);text-align:center;box-shadow:var(--repisa-2);
    transition:transform var(--rapido),box-shadow var(--rapido);
  }
  .bicho:hover{transform:translateY(-4px);box-shadow:var(--repisa-4)}
  .bicho svg{margin:0 auto var(--e-2);transition:transform var(--rebote)}
  .bicho:hover svg{transform:scale(1.1) rotate(-4deg)}
  .bicho b{display:block;font-family:var(--fuente-marca);font-size:var(--t-lg)}
  /* La pastilla usa la versión OSCURA del color de la familia, no la fuerte.
     Con la fuerte, el naranjo daba 2,6:1 en blanco y el turquesa 4,05:1: la
     etiqueta que dice de qué se hace cargo cada animal quedaba ilegible. El
     animal de arriba sí lleva el color fuerte, así que la tarjeta no pierde
     nada de fuerza. */
  .bicho .rol,.fb-cuerpo .rol{
    display:inline-block;font-size:var(--t-xs);font-weight:800;text-transform:uppercase;
    letter-spacing:.06em;color:#fff;background:var(--tono-tinta);border:2px solid var(--contorno);
    border-radius:var(--r-pill);padding:3px 10px;margin:5px 0 var(--e-2);
  }
  .bicho p{margin:0;font-size:var(--t-sm);color:var(--tinta-suave);line-height:1.5}
  /* Ahora son botones: heredan lo de arriba pero el navegador les pone su
     propio tipo y alineación, así que se los devolvemos. */
  button.bicho{width:100%;font:inherit;color:inherit;cursor:pointer;display:block}
  .bicho .lupa{
    display:block;margin-top:var(--e-3);font-size:var(--t-xs);font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;color:var(--tono-tinta);opacity:0;
    transform:translateY(4px);transition:opacity var(--rapido),transform var(--rapido);
  }
  .bicho:hover .lupa,.bicho:focus-visible .lupa{opacity:1;transform:none}
  .pista-elenco{
    margin:calc(var(--e-4) * -1) 0 var(--e-6);font-size:var(--t-sm);
    color:var(--tinta-tenue);font-weight:600;
  }

  /* --- La ficha del animal ---
     Telón oscuro y tarjeta con la misma repisa dura del resto. Se abre desde
     la tarjeta chica y cuenta de dónde salió el bicho. */
  .telon{
    position:fixed;inset:0;z-index:60;background:rgba(10,14,26,.62);
    display:grid;place-items:center;padding:var(--e-4);
    animation:telon-entra .16s ease-out;
  }
  /* Sin esto el telón arranca ABIERTO y vacío tapando la portada entera: el
     atributo `hidden` del HTML oculta vía `[hidden]{display:none}` de la hoja
     del navegador, y cualquier `display` declarado acá le gana. Toda regla que
     ponga display sobre un elemento con `hidden` necesita su pareja. */
  .telon[hidden]{display:none}
  @keyframes telon-entra{from{opacity:0}to{opacity:1}}
  .ficha-bicho{
    position:relative;width:min(480px,100%);max-height:88vh;overflow:hidden;
    display:flex;flex-direction:column;
    background:var(--fondo-elevado);border:3px solid var(--contorno);
    border-radius:var(--r-xl);box-shadow:var(--repisa-4);
    animation:ficha-entra .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes ficha-entra{from{transform:translateY(18px) scale(.94);opacity:0}
                         to{transform:none;opacity:1}}
  /* La cabeza toma el color de la familia del animal, como el pin del mapa */
  .fb-cabeza{
    background:var(--tono);border-bottom:3px solid var(--contorno);
    padding:var(--e-6) var(--e-5) var(--e-4);display:grid;place-items:center;
  }
  .fb-cabeza svg{width:132px;height:auto}
  .fb-cerrar{
    position:absolute;top:var(--e-3);right:var(--e-3);z-index:1;
    width:38px;height:38px;border-radius:var(--r-pill);cursor:pointer;
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    box-shadow:var(--repisa-1);font-size:0;
  }
  /* La X se dibuja con dos trazos: un carácter "×" cambia de forma con cada
     tipografía y quedaba descentrado. */
  .fb-cerrar::before,.fb-cerrar::after{
    content:"";position:absolute;top:50%;left:50%;width:15px;height:2.5px;
    background:var(--contorno);border-radius:2px;
  }
  .fb-cerrar::before{transform:translate(-50%,-50%) rotate(45deg)}
  .fb-cerrar::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .fb-cerrar:hover{background:var(--fondo-hundido)}
  /* Scrollea el cuerpo, no la tarjeta entera: si scrollea la tarjeta, la X
     —que está posicionada contra ella— se va de vista en pantallas chicas. */
  .fb-cabeza{flex:none}
  .fb-cuerpo{padding:var(--e-5);overflow-y:auto}
  .fb-cuerpo h3{font-size:var(--t-2xl);line-height:1.1;margin:var(--e-2) 0}
  .fb-oficio{margin:0 0 var(--e-5);color:var(--tinta-suave);line-height:1.6;
    font-size:var(--t-md)}
  .fb-cuerpo h4{
    font-family:var(--fuente-ui);font-size:var(--t-xs);font-weight:800;
    text-transform:uppercase;letter-spacing:.07em;color:var(--tinta-tenue);
    margin:0 0 var(--e-2);
  }
  /* La historia es lo que se vino a leer: va más grande que la bajada y con
     más interlínea. El color del animal no llega como una línea al costado
     sino como la tinta entera de la hoja, que es como imprime una serigrafía:
     la MISMA tinta pasa dos veces, plena arriba en la cabecera y clara acá
     abajo. Así el relato queda firmado por el bicho sin gastar un adorno.

     Sobre el pastel el texto va en azul FIJO y no en var(--tinta): el pastel
     es el mismo en los dos temas y la tinta se vuelve crema de noche, o sea
     crema sobre crema. Es la misma trampa anotada en .cierre. */
  .fb-historia{
    margin:0 0 var(--e-5);font-size:var(--t-md);line-height:1.72;
    background:var(--tono-suave);color:#1E2A4A;
    border:2.5px solid var(--contorno);border-radius:var(--r-md);
    box-shadow:var(--repisa-2);padding:var(--e-4) var(--e-4) calc(var(--e-4) + 2px);
  }
  @media(max-width:600px){
    .ficha-bicho{max-height:92vh}
    .fb-cabeza svg{width:104px}
    .fb-cuerpo h3{font-size:var(--t-xl)}
  }

  /* --- Cierre ---
     El fondo va en azul-900 fijo y NO en var(--tinta): la tinta se invierte a
     crema en modo oscuro, así que la banda quedaba crema con texto crema
     encima. Invisible. Acá el par es siempre el mismo en los dos temas. */
  .cierre{background:var(--azul-900);color:var(--arena-100);text-align:center;
    padding:var(--e-12) var(--e-5);border-top:3px solid var(--contorno);margin-top:var(--e-8)}
  .cierre h2{color:#fff;margin-bottom:var(--e-3)}
  .cierre p{max-width:520px;margin:0 auto var(--e-6);opacity:.86;line-height:1.62}
  .cierre .boton.secundario{background:transparent;color:var(--arena-100);
    border-color:var(--arena-200);box-shadow:0 4px 0 var(--arena-400)}
  .cierre .boton.secundario:hover{background:rgba(250,243,231,.12)}
  .botones{display:flex;gap:var(--e-3);justify-content:center;flex-wrap:wrap}
  .pie{text-align:center;padding:var(--e-6) var(--e-5);color:var(--tinta-tenue);font-size:var(--t-xs)}

  @media(max-width:600px){
    /* Las manchas están calculadas para 1200px de ancho. A 375px la de 340
       tapaba media pantalla y el hero se leía como un fondo abstracto, no
       como una portada. Se achican y se corren a los bordes. */
    .hero .m1{width:190px;height:190px;top:-90px;left:-70px}
    .hero .m2{width:170px;height:170px;top:-50px;right:-60px}
    .hero .m3{display:none}
    /* La guía pasa arriba del título y todo vuelve a centrarse */
    .hero-interior{padding:var(--e-6) var(--e-4) 0;grid-template-columns:1fr;
      gap:var(--e-4);text-align:center}
    .hero-guia{order:-1;padding-bottom:0}
    #loica-guia svg{width:122px}
    .hero .bajada{font-size:var(--t-base);margin-inline:auto}
    .hero-botones{gap:var(--e-2);margin-bottom:var(--e-5);justify-content:center}
    .hero-botones .boton{flex:1;min-width:150px;padding:12px var(--e-4);font-size:var(--t-base)}
    .paseo{height:150px;margin-top:var(--e-5)}
    .desfile{bottom:10px;gap:1px}
    section{padding:var(--e-8) var(--e-4)}
    .titulo-seccion h2{font-size:var(--t-xl)}
    .destino{min-height:auto}
    .destino span{max-width:100%}
  }
  /* Cada animal del desfile es un botón que lleva a su categoría, y con el
     dedo medían 34x37. Nueve celdas de 44 no caben en 375px, así que se
     reparte el ancho entero entre los nueve sin huecos: quedan pegados y en
     ~41px cada uno, que es todo lo que da la pantalla. El dibujo sigue igual;
     crece la caja. */
  @media(max-width:600px) and (pointer:coarse){
    .desfile{gap:0;padding:0 var(--e-2)}
    .desfile .bicho-hero{
      flex:1;min-width:0;min-height:48px;
      display:flex;align-items:flex-end;justify-content:center;
    }
  }
  @media(prefers-reduced-motion:reduce){
    .desfile .bicho-hero{animation:none}
    #loica-guia,#loica-guia.posada{animation:none}
  }
</style>
</head>
<body class="con-nav-inferior">
<div class="barra" id="barra"></div>

<header class="hero">
  <span class="mancha m1" aria-hidden="true"></span>
  <span class="mancha m2" aria-hidden="true"></span>
  <span class="mancha m3" aria-hidden="true"></span>
  <div class="hero-interior">
    <div class="hero-texto">
      <h1 id="h-titulo"></h1>
      <p class="bajada" id="h-bajada"></p>

<script>
/* La raíz del sitio era el mapa hasta este cambio, así que hay links dando
   vueltas por WhatsApp con la forma `.../#/e/<id>`. Se reenvían al mapa en vez
   de dejarlos caer en la portada sin el evento que venían a ver. */
const enlaceViejo = location.hash.match(/^#\/e\/(.+)$/);
if(enlaceViejo) location.replace("mapa.html#/e/" + enlaceViejo[1]);

pintarBarra("index.html");

/* Un color por destino. Son los mismos de la navegación, así que llegar al
   mapa desde la portada y desde la barra inferior se siente igual. */
const DESTINOS = [
  {url:"mapa.html",       tono:"--c-musica",  claro:true,  masc:"condor",     t:"pMapaT",  d:"pMapaD"},
  {url:"calendario.html", tono:"--c-cultura", claro:true,  masc:"chinchilla", t:"pCalT",   d:"pCalD"},
  {url:"talleres.html",   tono:"--c-clases",  claro:true,  masc:"chincol",    t:"pTallerT",d:"pTallerD"},
  {url:"descuentos.html", tono:"--c-descuento", claro:true, masc:"guaren",   t:"pDctoT",  d:"pDctoD"},
  {url:"comer.html",      tono:"--c-comer",   claro:true,  masc:"quiltro",  t:"pComerT", d:"pComerD"},
  {url:"blog.html",       tono:"--c-fiesta",  claro:true,  masc:"culpeo",     t:"pBlogT",  d:"pBlogD"},
  {url:"nosotros.html",   tono:"--c-libre",   claro:true,  masc:"pudu",       t:"pQuienT", d:"pQuienD"},
];

function pintarPortada(){
  const T = (k) => t(k);

  /* --- Hero --- */
  // El acento va aparte y no como "la última palabra": el subrayado tiene que
  // caer entero sobre "por Santiago", que es lo que amarra la frase con la
  // cordillera dibujada justo debajo.
  document.getElementById("h-titulo").innerHTML =
    `${escapar(T("pTitulo"))} <span class="subrayado">${escapar(T("pTituloAcento"))}
       <svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">
         <path d="M4 13c46-8 104-10 192-4" fill="none" stroke="var(--acento)"
               stroke-width="7" stroke-linecap="round"/></svg></span>`;
  document.getElementById("cordillera").innerHTML = cordillera();
  document.getElementById("h-bajada").textContent = T("pBajada");
  document.getElementById("h-cta").textContent = T("pVerMapa");
  document.getElementById("h-cta2").textContent = T("pVerHoy");
  /* La anfitriona: vuela, aterriza, saluda — en ese orden. Con
     prefers-reduced-motion aparece ya posada y con el globo puesto.
     En cambios de idioma solo se actualiza el saludo: la llegada es una. */
  const guia = document.getElementById("loica-guia");
  const globo = document.getElementById("loica-globo");
  globo.textContent = t("pSaludo");
  const posarse = () => {
    guia.innerHTML = cuerpo("loica", "var(--acento)", 224, {anima:true});
    guia.classList.add("posada");
    globo.classList.add("visible");
  };
  if(!guia.dataset.lista){
    guia.dataset.lista = "1";
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) posarse();
    else{
      guia.innerHTML = cuerpo("loica", "var(--acento)", 224, {pose:"volando", anima:true});
      guia.addEventListener("animationend", posarse, {once:true});
    }
  }

  // El desfile: los once, cada uno con su retardo (--d) para que entren de a
  // uno y no parpadeen al mismo tiempo. `entra` dispara las entradas y se va
  // a los 4,3 s para que los tics de reposo tomen el relevo (las dos
  // animaciones se disputan el mismo `animation` del SVG).
  const desfile = document.getElementById("desfile");
  desfile.innerHTML = ELENCO.map((a, i) =>
    `<button class="bicho-hero" style="--d:${(i * .22).toFixed(2)}s"
             data-ir="${a.clave}" title="${escapar(a[IDIOMA][0])}"
             aria-label="${escapar(a[IDIOMA][0])} — ${escapar(a[IDIOMA][1])}">
       ${cuerpo(a.clave, a.hex, 74, {anima:true})}</button>`).join("");
  if(!desfile.dataset.entro){
    desfile.dataset.entro = "1";
    desfile.classList.add("entra");
    setTimeout(() => desfile.classList.remove("entra"), 4300);
  }
  // Antes solo bajaban la página hasta el elenco. Ahora abren la ficha del
  // animal directamente: es el mismo gesto y responde la pregunta que uno se
  // hace al ver la fila de bichos, que es "¿y este quién es?".
  document.querySelectorAll(".bicho-hero").forEach(b =>
    b.onclick = () => abrirBicho(b.dataset.ir));

  /* --- Secciones --- */
  document.getElementById("s-hoy-t").textContent = T("pHoyTitulo");
  document.getElementById("s-dest-t").textContent = T("pDondeIr");
  document.getElementById("s-elenco-t").textContent = T("pElencoT");
  document.getElementById("s-elenco-d").textContent = T("pElencoD");
  document.getElementById("s-cierre-t").textContent = T("pCierreT");
  document.getElementById("s-cierre-d").textContent = T("pCierreD");
  document.getElementById("c-cta").textContent = T("agregar");
  document.getElementById("c-cta2").textContent = T("nosotros");

  document.getElementById("destinos").innerHTML = DESTINOS.map(d =>
    `<a class="destino${d.claro ? " tinta-clara" : ""}" href="${d.url}"
        style="--tono:var(${d.tono})">
       <b>${escapar(T(d.t))}</b>
       <span>${escapar(T(d.d))}</span>
       <span class="flecha" aria-hidden="true">→</span>
       <span class="asoma" aria-hidden="true">${cuerpo(d.masc, "#fff", 118, {tinta:"#fff"})}</span>
     </a>`).join("");

  document.getElementById("s-elenco-pista").textContent = T("pHistoriaPista");
  document.getElementById("elenco").innerHTML = ELENCO.map(a =>
    `<button class="bicho" type="button" data-bicho="${a.clave}"
             style="--tono:${a.hex};--tono-tinta:${a.tinta}">
       ${cuerpo(a.clave, a.hex, 96, {anima:true})}
       <b>${escapar(a[IDIOMA][0])}</b>
       <span class="rol">${escapar(a[IDIOMA][1])}</span>
       <p>${escapar(a[IDIOMA][2])}</p>
       <span class="lupa">${escapar(T("pHistoriaT"))} →</span>
     </button>`).join("");
  document.querySelectorAll("[data-bicho]").forEach(b =>
    b.onclick = () => abrirBicho(b.dataset.bicho));
}

/* ---------- LA FICHA DEL ANIMAL ----------
   Cada uno cuenta cómo llegó a hacerse cargo de lo suyo. Es una humorada, pero
   cumple un trabajo: la señalética se aprende antes si el animal tiene motivo
   de estar ahí. El Quiltro no es "el de comer", es el que lleva veinte años
   parado en la puerta de los locales. */

// A dónde manda el botón del pie. El mapa todavía no filtra por categoría
// desde la URL, así que los que viven en él llevan al mapa entero y no a un
// filtro inventado; los dos que tienen página propia llevan a la suya.
const CASA_DEL_BICHO = {guaren:"descuentos.html", quiltro:"comer.html", chincol:"talleres.html"};

/* El pastel de cada animal: la misma familia de su relleno fuerte, un paso
   claro. Es la segunda pasada de tinta de la ficha (ver .fb-historia). Vive
   acá y no en ELENCO porque ELENCO es de loica.js y lo comparten nueve páginas;
   el pastel solo lo necesita esta. */
const SUAVE = {
  loica:     "var(--rojo-200)",           condor:    "var(--c-musica-suave)",
  culpeo:    "var(--c-fiesta-suave)",     chinchilla:"var(--c-cultura-suave)",
  chincol:   "var(--c-clases-suave)",     pudu:      "var(--c-libre-suave)",
  degu:      "var(--verde-200)",          guaren:    "var(--c-descuento-suave)",
  chungungo: "var(--c-deporte-suave)",    pinguino:  "var(--c-charla-suave)",
  quiltro:   "var(--c-comer-suave)",
};

let bichoPrevio = null;   // a quién devolverle el foco al cerrar

function abrirBicho(clave){
  const a = ELENCO.find(x => x.clave === clave);
  if(!a) return;
  const [nombre, rol, oficio, historia] = a[IDIOMA];

  bichoPrevio = document.activeElement;
  const ficha = document.getElementById("ficha-bicho");
  ficha.style.setProperty("--tono", a.hex);
  ficha.style.setProperty("--tono-tinta", a.tinta);
  ficha.style.setProperty("--tono-suave", SUAVE[clave] || "var(--fondo-hundido)");
  // El animal grande va en tinta fija: la cabecera es de color pleno y en modo
  // oscuro el contorno crema sobre el color se perdía.
  document.getElementById("fb-cabeza").innerHTML =
    cuerpo(clave, a.hex, 132, {tinta:"#1E2A4A", pose:"celebrando", anima:true});
  document.getElementById("fb-rol").textContent = rol;
  document.getElementById("fb-nombre").textContent = nombre;
  document.getElementById("fb-oficio").textContent = oficio;
  document.getElementById("fb-historia-t").textContent = t("pHistoriaT");
  document.getElementById("fb-historia").textContent = historia;
  const ir = document.getElementById("fb-ir");
  ir.href = CASA_DEL_BICHO[clave] || "mapa.html";
  ir.textContent = t("pHistoriaVer");
  const cerrar = document.getElementById("fb-cerrar");
  cerrar.setAttribute("aria-label", t("pHistoriaCerrar"));

  document.getElementById("telon").hidden = false;
  document.body.style.overflow = "hidden";
  cerrar.focus();
}

function cerrarBicho(){
  document.getElementById("telon").hidden = true;
  document.body.style.overflow = "";
  if(bichoPrevio && bichoPrevio.focus) bichoPrevio.focus();
  bichoPrevio = null;
}

document.getElementById("fb-cerrar").onclick = cerrarBicho;
// Solo el telón cierra al tocar fuera; un clic dentro de la tarjeta no.
document.getElementById("telon").addEventListener("click", e => {
  if(e.target.id === "telon") cerrarBicho();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !document.getElementById("telon").hidden) cerrarBicho();
});

/* --- Los cuatro panoramas de la portada ---
   Solo cuatro: la portada invita, no reemplaza al mapa. Pero elegir "los
   cuatro primeros" de una lista ordenada tenía dos defectos que se veían
   juntos en la misma pantalla.

   TODOS DEL MISMO ANIMAL. El orden era editorial —lo lúdico primero, las
   charlas al final— y después por hora. Como teatro, ferias y fiestas
   compartían el primer tramo y el teatro es el que más publica, las cuatro
   tarjetas salían azules: la portada anunciaba una ciudad que solo hace
   teatro. Ahora se toma UNA de cada categoría, así que las cuatro caritas son
   distintas y de una mirada se ve que la ciudad hace cosas diferentes.

   SIEMPRE LAS MISMAS. Al ser un orden fijo sobre datos que cambian una vez al
   día, quien entraba dos veces veía lo mismo. Ahora la categoría que abre se
   sortea dentro de su tramo editorial y el evento se sortea dentro de su
   categoría: cada visita trae otra cosa sin perder el criterio de que lo
   lúdico va antes que un seminario.

   Y SE PREFIERE LO QUE EMPIEZA HOY. Las exposiciones en curso también están
   "hoy" —corren de mayo a septiembre— y como se ordenaba por fecha de inicio
   se tomaban las más viejas: bajo el título "Hoy en Santiago" aparecía una
   muestra con la fecha "29 MAY", que se lee como un error. Las temporadas
   siguen entrando, pero solo si lo que arranca hoy no alcanza para cuatro. */
const PRIORIDAD = {feria:0, teatro:0, fiesta:0,
                   musica:1, cine:1, arte:1, aire_libre:1, familia:1, deporte:1,
                   otros:2, clases:2, idiomas:2,
                   charla:3};

const revolver = lista => {                     // Fisher–Yates
  const a = lista.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const alAzar = lista => lista[Math.floor(Math.random() * lista.length)];

function cuatroDeHoy(delDia, todos){
  const base = delDia.length ? delDia : todos;
  const arrancaHoy = ev => mismaFecha(new Date(ev.inicio), new Date());
  const propios = base.filter(arrancaHoy);
  const fuente = propios.length >= 4 ? propios : base;

  const porCat = {};
  fuente.forEach(ev => (porCat[ev.categoria] ||= []).push(ev));

  // Las categorías se recorren tramo por tramo y REVUELTAS dentro del tramo.
  const cats = [0, 1, 2, 3].flatMap(tramo =>
    revolver(Object.keys(porCat).filter(c => (PRIORIDAD[c] ?? 2) === tramo)));

  const elegidos = [];
  for(const c of cats){
    if(elegidos.length === 4) break;
    elegidos.push(alAzar(porCat[c]));
  }
  // Si hoy hay menos de cuatro categorías, se completa al azar sin repetir.
  if(elegidos.length < 4){
    const resto = revolver(fuente.filter(ev => !elegidos.includes(ev)));
    elegidos.push(...resto.slice(0, 4 - elegidos.length));
  }
  // Se muestran en orden de hora: la lista se lee como el día que viene.
  return elegidos.sort((a, b) => a.fecha - b.fecha);
}

/* --- Datos en vivo: las cifras y los panoramas de hoy ---
   Números escritos a mano se vuelven mentira en una semana. Estos salen del
   mismo JSON que el mapa. */
function pintarDatos(evs){
  const hoy = evs.filter(ev => sesionEnRango(ev, "hoy"));
  const gratis = evs.filter(ev => ev.gratis);
  const fuentes = new Set(evs.map(ev => ev.fuente)).size;

  const cifra = ([n, txt, tono, masc]) =>
    `<div class="cifra" style="--tono:${tono}">
       ${carita(masc, tono, 34)}
       <span><b>${n}</b>${escapar(txt)}</span>
     </div>`;
  document.getElementById("cifras").innerHTML = [
    [evs.length, t("pTotalD"), "var(--acento)", "loica"],
    [gratis.length, t("pGratisD"), "var(--gratis)", "degu"],
    [fuentes, t("pFuentesD"), "var(--c-cultura)", "chinchilla"],
  ].map(cifra).join("");

  /* La cuarta cifra vive en otro archivo y se pide aparte a propósito: si el
     catastro de bancos falla, la portada se pinta igual con tres. */
  cargarDescuentos().then(d => {
    document.getElementById("cifras").insertAdjacentHTML("beforeend",
      cifra([d.total, t("pDctoCifra"), "var(--c-descuento-tinta)", "guaren"]));
  }).catch(() => {});

  const caja = document.getElementById("hoy-caja");
  caja.innerHTML = "";
  document.getElementById("s-hoy-d").textContent =
    hoy.length ? `${hoy.length} ${hoy.length === 1 ? t("evento") : t("eventos")}.`
               : t("pHoyVacio");

  caja.classList.add("lista-anima");
  cuatroDeHoy(hoy, evs).forEach(ev => caja.appendChild(
    tarjetaEvento(ev, e => location.href = "mapa.html#/e/" + e.id)));

  const pie = document.createElement("div");
  pie.className = "hoy-pie";
  pie.innerHTML = `<a class="boton secundario" href="mapa.html">${escapar(t("verMas"))} →</a>`;
  caja.appendChild(pie);
}

pintarPortada();
cargarEventos().then(pintarDatos).catch(() => {
  document.getElementById("hoy-caja").innerHTML =
    `<div class="vacio">${cuerpo("loica","var(--tinta-tenue)",88,{pose:"durmiendo"})}
     <p>No pude cargar los panoramas.<br>
     <a class="boton secundario" style="margin-top:12px" href="mapa.html">${escapar(t("pVerMapa"))}</a></p></div>`;
});

window.addEventListener("loica:idioma", () => {
  pintarPortada();
  cargarEventos().then(pintarDatos).catch(() => {});
});
</script>
