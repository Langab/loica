  sala1:      {es:"sala con función",  en:"screen showing",  pt:"sala com sessão"},
  enCartelera:{es:"en cartelera", en:"now showing", pt:"em cartaz"},
  comercial:  {es:"De mall",   en:"Multiplex", pt:"De shopping"},
  arte:       {es:"Cine arte", en:"Arthouse",  pt:"Cine arte"},
  cerca:      {es:"Cerca mío", en:"Near me",   pt:"Perto de mim"},
  doblada:    {es:"Doblada",   en:"Dubbed",    pt:"Dublado"},
  subtitulada:{es:"Subtitulada",en:"Subtitled",pt:"Legendado"},
  comuna:     {es:"Comuna",    en:"District",  pt:"Comuna"},
  limpiar:    {es:"Limpiar filtros", en:"Clear filters", pt:"Limpar filtros"},
  vacio:      {es:"No hay funciones con esos filtros",
               en:"No showings with those filters",
               pt:"Não há sessões com esses filtros"},
  vaciopista: {es:"Prueba sacando algún filtro o mirando otro día",
               en:"Try removing a filter or looking at another day",
               pt:"Tente tirar um filtro ou olhar outro dia"},
  sinCartelera:{es:"Esta cadena no publica sus horarios donde se puedan leer. La sala está acá para ubicarla; la cartelera está en su sitio.",
               en:"This chain does not publish readable showtimes. The cinema is here so you can find it; its listings live on their own site.",
               pt:"Esta rede não publica horários legíveis. O cinema está aqui para localizá-lo; a programação fica no site deles."},
  verOficial: {es:"Ver su cartelera oficial", en:"See their official listings", pt:"Ver a programação oficial"},
  hoyNo:      {es:"Sin funciones publicadas para este día", en:"No showings published for this day", pt:"Sem sessões publicadas para este dia"},
  revisado:   {es:"Revisado el", en:"Checked", pt:"Revisado em"},
  sinHorarios:{es:"salas más en el mapa sin horarios publicados",
               en:"more cinemas on the map without published showtimes",
               pt:"salas a mais no mapa sem horários publicados"},
  compra:     {es:"Comprar en el cine", en:"Buy at the cinema", pt:"Comprar no cinema"},
  min:        {es:"min", en:"min", pt:"min"},
  buscar:     {es:"Buscar una película", en:"Search for a film", pt:"Buscar um filme"},
  verTrailer: {es:"Ver el tráiler", en:"Watch the trailer", pt:"Ver o trailer"},
  queVer:     {es:"¿Qué película veo?", en:"What should I watch?", pt:"Que filme eu vejo?"},
  cabraPresenta:{es:"Estas son las películas de la semana, sin horarios encima: de qué trata cada una y su tráiler. Cuando ya sepas cuál, el botón de la ficha te lleva a dónde y a qué hora la dan.",
               en:"These are this week's films, with no showtimes in the way: what each one is about, and its trailer. Once you know which, the button on the card takes you to where and when it is on.",
               pt:"Estes são os filmes da semana, sem horários no meio: do que trata cada um e o trailer. Quando souber qual, o botão da ficha leva você a onde e a que horas passa."},
  enCatalogo: {es:"películas esta semana", en:"films this week", pt:"filmes esta semana"},
  enCatalogo1:{es:"película esta semana", en:"film this week", pt:"filme esta semana"},
  verHorarios:{es:"Ver horarios", en:"See showtimes", pt:"Ver horários"},
  salasCortas:{es:"salas", en:"screens", pt:"salas"},
  salaCorta:  {es:"sala",  en:"screen",  pt:"sala"},
  leerMas:    {es:"Leer más", en:"Read more", pt:"Ler mais"},
  leerMenos:  {es:"Leer menos", en:"Read less", pt:"Ler menos"},
  sinSinopsis:{es:"sin sinopsis publicada: el circuito de barrio no la escribe en ninguna parte que se pueda leer",
               en:"without a published synopsis: the neighbourhood circuit does not write one anywhere readable",
               pt:"sem sinopse publicada: o circuito de bairro não a escreve em lugar legível"},
  vacioPelis: {es:"No hay películas con esos filtros",
               en:"No films with those filters",
               pt:"Não há filmes com esses filtros"},
  vacioPelisPista:{es:"Prueba sacando la comuna, el circuito o el idioma.",
               en:"Try removing the district, the circuit or the language.",
               pt:"Tente tirar a comuna, o circuito ou o idioma."},
  sinPeli:    {es:"Ninguna película con ese nombre", en:"No film by that name",
               pt:"Nenhum filme com esse nome"},
  sinPeliHoy: {es:"No la dan este día, pero sí", en:"Not showing this day, but it is on",
               pt:"Não passa neste dia, mas sim"},
  sinPeliPista:{es:"No está en la cartelera de estos días. Revisa cómo se escribe, o prueba con una palabra sola.",
               en:"It is not in these days' listings. Check the spelling, or try a single word.",
               pt:"Não está na programação destes dias. Confira a grafia, ou tente uma só palavra."},
  sinPublicar:{es:"Los cines todavía no publican este día",
               en:"The cinemas have not published this day yet",
               pt:"Os cinemas ainda não publicaram este dia"},
  sinPublicarPista:{es:"Las cadenas cargan sus horarios con dos o tres días de anticipación, y los jueves cambian la cartelera. Mira los días marcados en el riel de arriba.",
               en:"The chains load their showtimes two or three days ahead, and listings change on Thursdays. Check the days marked in the strip above.",
               pt:"As redes carregam os horários com dois ou três dias de antecedência, e às quintas trocam a programação. Veja os dias marcados na faixa acima."},
  yaEmpezaron:{es:"Las funciones de hoy ya empezaron",
               en:"Today's showings have already started",
               pt:"As sessões de hoje já começaram"},
  yaEmpezaronPista:{es:"Mira mañana, o busca la película para ver qué día la dan.",
               en:"Try tomorrow, or search the film to see which day it is on.",
               pt:"Veja amanhã, ou busque o filme para ver em que dia passa."},
  soloBarrio: {es:"las cadenas todavía no publican este día: esto es lo que hay",
               en:"the chains have not published this day yet — this is what there is",
               pt:"as redes ainda não publicaram este dia — isto é o que há"},
  sinPublicarRiel:{es:"sin cartelera publicada", en:"no listings published yet",
               pt:"sem programação publicada"},
  ojo:        {es:"Loica no vende entradas ni sabe si quedan: cada horario te deja en la boletería del cine.",
               en:"Loica does not sell tickets and cannot tell you if seats are left: every showtime takes you to the cinema's own box office.",
               pt:"A Loica não vende ingressos nem sabe se ainda há lugares: cada horário leva você à bilheteria do cinema."},
};
const tr = clave => T[clave][IDIOMA];

/* Comparar títulos como los escribe una persona: "odisea" tiene que encontrar
   "La Odisea" y "peliculas" a "Películas". Se bajan tildes y mayúsculas de los
   dos lados; nada más, porque una búsqueda que adivina de más frustra más que
   una que no encuentra. */
const plano = txt => (txt || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

const calzaBusqueda = peli => !busqueda || plano(peli.titulo).includes(plano(busqueda));

/* ---------- EL MAPA ----------
   Círculos y no pines-animal: son 44 puntos y la lección de mapa.html es que
   los marcadores DOM se pagan caro en el arrastre. El color dice si la sala
   tiene función ese día; el pin apagado sigue estando porque su dirección es
   la mitad de la respuesta. */
let mapa = null, popup = null, hayMapa = false;
const esOscuro = () => document.documentElement.dataset.tema === "oscuro"
  || (!document.documentElement.dataset.tema && matchMedia("(prefers-color-scheme: dark)").matches);

/* Las mismas teselas que el mapa de panoramas y el de talleres, copiadas tal
   cual y no reinventadas: que las tres páginas se vean iguales es la mitad de
   que se sientan del mismo sitio.

   Acá había un `glyphs: null` y costó un mapa entero. MapLibre valida el
   estilo antes de montarlo y `glyphs` tiene que ser una cadena o no estar:
   con null el estilo se rechaza, el evento `load` NUNCA se dispara y
   `montarCapas()` —que cuelga de ese evento— no llega a correr. El resultado
   no es un mapa feo, es un rectángulo en blanco sin un solo pin, porque la
   capa de cines jamás se agregó. Ninguna otra página del sitio declara
   `glyphs`, y esta tampoco debe. */
const TESELAS = {
  claro:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",
  claroEtiquetas:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
  oscuro:"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
  oscuroEtiquetas:"https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",
};
const urlesTeselas = clave => ["a","b","c"].map(s =>
  TESELAS[clave].replace("{s}", s).replace("{r}", devicePixelRatio > 1.5 ? "@2x" : ""));

function estiloMapa(){
  const t = esOscuro() ? ["oscuro","oscuroEtiquetas"] : ["claro","claroEtiquetas"];
  return {version:8,
    sources:{
      base:{type:"raster", tiles:urlesTeselas(t[0]), tileSize:256,
            attribution:'© OpenStreetMap © CARTO'},
      etiquetas:{type:"raster", tiles:urlesTeselas(t[1]), tileSize:256},
    },
    layers:[{id:"base",type:"raster",source:"base"},
            {id:"etiquetas",type:"raster",source:"etiquetas"}]};
}

try{
  mapa = new maplibregl.Map({
    container:"mapa-cines", style:estiloMapa(),
    center:[-70.645,-33.46], zoom:11.2, attributionControl:{compact:true}
  });
  hayMapa = true;
}catch(e){
  document.getElementById("mapa-cines").innerHTML =
    `<div class="vacio" style="padding-top:var(--e-12)">${cuerpo("cabra","var(--tinta-tenue)",88,{pose:"durmiendo"})}
     <p><b>Este navegador no puede dibujar el mapa</b><br>La lista funciona igual.</p></div>`;
}

if(hayMapa){
  mapa.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-left");
  // El mapa nace antes de que su caja tenga tamaño final (ver mapa.html).
  (() => {
    const caja = document.getElementById("mapa-cines");
    let ancho = 0, alto = 0;
    new ResizeObserver(() => {
      if(caja.clientWidth === ancho && caja.clientHeight === alto) return;
      ancho = caja.clientWidth; alto = caja.clientHeight;
      mapa.resize();
    }).observe(caja);
  })();
  /* `montarCapas` se llama DESDE eventos de MapLibre, y una excepción ahí
     dentro se la traga el despachador: no aparece en la consola, no rompe la
     página y no deja rastro. Así fue como una expresión mal anidada en
     `circle-radius` dejó el mapa sin un solo pin durante dos commits, con el
     mapa base dibujándose perfecto al lado. Ahora se atrapa, se dice fuerte y
     se muestra el aviso: un mapa sin pines es un mapa roto, no un mapa vacío. */
  const montar = () => {
    try{ montarCapas(); }
    catch(e){
      console.error("no pude montar la capa de cines:", e);
      avisarMapaCaido(e.message || String(e));
    }
  };
  mapa.on("load", montar);
  mapa.on("styledata", () => { if(!mapa.getLayer("cines-pin")) montar(); });
  new MutationObserver(() => mapa.setStyle(estiloMapa()))
    .observe(document.documentElement, {attributes:true, attributeFilter:["data-tema"]});

  /* Un mapa que no carga no puede verse como un mapa vacío.
     Cuando el estilo se rechazaba por el `glyphs: null` de más arriba, esta
     página mostraba un rectángulo crema del alto de la pantalla y nada más:
     parecía que Santiago no tenía cines. El error existía y estaba en la
     consola, pero la consola no la mira quien entra a ver qué película dan.
     Estas dos redes lo dicen en pantalla y dejan la lista funcionando, que es
     lo que de verdad contesta la pregunta. */
  mapa.on("error", ev => avisarMapaCaido(ev?.error?.message || ""));
  setTimeout(() => { if(!mapa.getLayer("cines-pin")) avisarMapaCaido(""); }, 9000);
}

/* El aviso se RETIRA solo cuando el mapa aparece.
   Sin esto la red de seguridad se convertía en el problema: un mapa que
   simplemente iba lento —3G malo, CDN fría— montaba su capa al segundo doce y
   quedaba con un cartel de "no pude dibujar el mapa" pegado encima de un mapa
   que estaba funcionando. Un aviso que contradice lo que se ve abajo es peor
   que no avisar. */
let mapaAvisado = null;
function sacarAvisoMapa(){
  mapaAvisado?.remove();
  mapaAvisado = null;
}
function avisarMapaCaido(detalle){
  if(mapaAvisado || !hayMapa || mapa.getLayer("cines-pin")) return;
  const caja = document.getElementById("mapa-cines");
  // Son DOS fallas distintas y decirlas igual es mentir a medias: el mapa
  // puede no haber llegado, o puede estar dibujado y perfecto y ser los PINES
  // los que faltan. Con el bug de la expresión anidada pasaba lo segundo, y el
  // cartel decía "no pude dibujar el mapa" encima de Santiago dibujado entero.
  const hayLienzo = mapa.isStyleLoaded && mapa.isStyleLoaded();
  const aviso = document.createElement("div");

  if(hayLienzo){
    // El mapa sirve: el aviso es una cinta angosta arriba y no un bloque que
    // tape lo que sí se puede usar.
    aviso.className = "aviso-mapa";
    const b = document.createElement("b");
    b.textContent = {es:"No pude poner los cines en el mapa",
                     en:"Could not place the cinemas on the map",
                     pt:"Não consegui pôr os cinemas no mapa"}[IDIOMA];
    aviso.append(carita("cabra", "currentColor", 20), b,
      document.createTextNode(" " + {es:"— están todos en la lista, con su dirección.",
                                     en:"— they are all in the list, with their address.",
                                     pt:"— estão todos na lista, com o endereço."}[IDIOMA]));
  } else {
    aviso.className = "vacio";
    aviso.style.cssText = "padding-top:var(--e-12);position:relative;z-index:2";
    aviso.innerHTML = cuerpo("cabra", "var(--tinta-tenue)", 88, {pose:"durmiendo"});
    const texto = document.createElement("p");
    const fuerte = document.createElement("b");
    fuerte.textContent = {es:"No pude dibujar el mapa",
                          en:"Could not draw the map",
                          pt:"Não consegui desenhar o mapa"}[IDIOMA];
    texto.append(fuerte, document.createElement("br"),
      document.createTextNode({es:"La lista de abajo tiene los mismos cines, con su dirección.",
                               en:"The list below has the same cinemas, with their address.",
                               pt:"A lista abaixo tem os mesmos cinemas, com o endereço."}[IDIOMA]));
    aviso.appendChild(texto);
  }
  caja.appendChild(aviso);
  mapaAvisado = aviso;
  if(detalle) console.warn("mapa de cines:", detalle);
}

function datosGeo(){
  return {type:"FeatureCollection", features:cinesVisibles()
    .filter(c => c.lat !== null && c.lat !== undefined)
    .map(c => ({type:"Feature",
      geometry:{type:"Point", coordinates:[c.lon, c.lat]},
      properties:{id:c.id, nombre:c.nombre, comuna:c.comuna,
                  url:c.url, funciones:funcionesDe(c.id).length,
                  elegido:c.id === cineElegido ? 1 : 0,
                  arte:c.circuito === "arte" ? 1 : 0}}))};
}

function montarCapas(){
  // El guardia mira la CAPA y no la fuente. Con la fuente alcanzaba mientras
  // las dos se agregaban juntas o ninguna; cuando `addLayer` falló y
  // `addSource` había pasado, este `return` impedía cualquier reintento y el
  // mapa se quedaba para siempre con datos y sin pines.
  if(!hayMapa || mapa.getLayer("cines-pin")) return;
  if(!mapa.getSource("cines")) mapa.addSource("cines", {type:"geojson", data:datosGeo()});
  mapa.addLayer({id:"cines-pin", type:"circle", source:"cines",
    paint:{
      /* La sala elegida crece: es el acuse de recibo de que se apretó ESE pin
         y no el de al lado, que a este zoom queda a pocos píxeles.

         El `case` va DENTRO de las paradas del `interpolate` y no al revés, y
         esa vuelta no es estilo: MapLibre lo exige. Su validador dice
         `"zoom" expression may only be used as input to a top-level "step" or
         "interpolate" expression`, así que un `interpolate` sobre el zoom
         metido dentro de un `case` hace reventar `addLayer` entero. Costó
         caro: el mapa base se dibujaba perfecto y no había un solo pin, que es
         el síntoma que menos se parece a "una expresión mal anidada". */
      "circle-radius":["interpolate",["linear"],["zoom"],
        10, ["case",["==",["get","elegido"],1], 9, 5],
        14, ["case",["==",["get","elegido"],1], 15, 10]],
      // El fucsia de la Cabra para la sala con función; el circuito de cine
      // arte va con el relleno claro para separarlo del mall de un vistazo.
      "circle-color":["case",["==",["get","arte"],1], "#F1D0EE", "#A51D99"],
      "circle-stroke-width":["case",["==",["get","elegido"],1], 4, 2.4],
      "circle-stroke-color":esOscuro() ? "#EDE7DE" : "#1E2A4A",
      // Sin función ese día el pin se atenúa, no desaparece: la dirección
      // sigue siendo la respuesta a "qué cine tengo cerca".
      "circle-opacity":["case",["==",["get","elegido"],1], 1,
                        ["==",["get","funciones"],0], .38, .95],
    }});
  // Apretar un cine muestra SU cartelera. Antes esto abría un globo con un
  // link que había que apretar de nuevo para llegar a los horarios: dos pasos
  // para la única pregunta que trae a alguien a esta página.
  mapa.on("click", "cines-pin", e => elegirCine(e.features[0].properties.id));
  mapa.on("mouseenter", "cines-pin", () => mapa.getCanvas().style.cursor = "pointer");
  mapa.on("mouseleave", "cines-pin", () => mapa.getCanvas().style.cursor = "");
  sacarAvisoMapa();
  pintarMapa();
}

function pintarMapa(){
  if(!hayMapa || !mapa.getSource("cines")) return;
  mapa.getSource("cines").setData(datosGeo());
}

/* Elegir una sala: el panel pasa a mostrar SOLO su cartelera y el mapa se va
   hacia ella. Volver a apretarla la suelta, igual que un chip de filtro. */
function elegirCine(id){
  cineElegido = (cineElegido === id) ? "" : id;
  vista = "cines";
  mostrando = 24;
  popup?.remove();

  const sala = cinePorId(cineElegido);
  if(sala && hayMapa && sala.lat != null){
    // Se centra un poco más arriba que el pin porque en celular el panel se
    // come el tercio de abajo de la pantalla.
    mapa.easeTo({center:[sala.lon, sala.lat],
                 zoom:Math.max(mapa.getZoom(), 13.4),
                 offset:[0, -Math.min(110, mapa.getContainer().clientHeight * .18)],
                 duration:600});
  }
  pintarTodo();
  document.getElementById("lista").scrollTop = 0;
  // En celular el panel está en reposo (40% de la pantalla): con la cartelera
  // recién elegida hay que subirlo o el primer horario queda tapado.
  if(sala && innerWidth < 880) subirPanel(1);
}

/* ---------- DATOS ---------- */
fetch("cine.json", {cache:"no-cache"}).then(r => r.json()).then(d => {
  CINES = d.cines || [];
  PELICULAS = d.peliculas || [];
  generado = d.generado || "";
  diasCartelera = d.dias || 4;
  montarBuscador();
  pintarTodo();
}).catch(() => {
  // Se pintan igual el riel y los filtros. `pintarDias` y `pintarFiltros` solo
  // se llamaban desde `pintarTodo()`, que solo corre si el fetch salió bien:
  // con el archivo caído la cabecera quedaba a medio construir —dos franjas
  // vacías— y la página se veía ROTA en vez de degradada. Con las listas en
  // cero se dibujan los siete días y ningún filtro, que es honesto.
  pintarNombresAccesibles();
  pintarDias();
  pintarFiltros();
  document.getElementById("lista").innerHTML =
    `<div class="vacio">${cuerpo("cabra","var(--tinta-tenue)",96,{pose:"durmiendo"})}
       <p><b>${escapar({es:"No pude cargar la cartelera",
                        en:"Could not load the listings",
                        pt:"Não consegui carregar a programação"}[IDIOMA])}</b><br>${
         escapar({es:"Vuelve a intentar en un rato. Los cines del mapa siguen en su dirección de siempre.",
                  en:"Try again in a while. The cinemas on the map are still at their usual address.",
                  pt:"Tente de novo mais tarde. Os cinemas do mapa continuam no endereço de sempre."}[IDIOMA])}</p></div>`;
});

window.addEventListener("loica:idioma", () => {
  const campo = document.getElementById("buscar");
  if(campo){ campo.placeholder = tr("buscar"); campo.setAttribute("aria-label", tr("buscar")); }
  pintarTodo();
});

/* El día que se está mirando, como fecha. `dia` es un desplazamiento desde
   hoy y no una fecha fija: si alguien deja la pestaña abierta hasta pasada la
   medianoche, "Hoy" sigue queriendo decir hoy. */
const fechaEn = i => {
  const f = new Date(); f.setHours(0,0,0,0); f.setDate(f.getDate() + i); return f;
};
const fechaDelDia = () => fechaEn(dia);
const claveFecha = f => `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}-${String(f.getDate()).padStart(2,"0")}`;

const cinePorId = id => CINES.find(c => c.id === id);

/* Las funciones que pasan TODOS los filtros, con su película pegada. Es la
   lista de la que salen las tres vistas y también el mapa: si el filtro de
   idioma deja fuera una sala, su pin también se apaga.

   `todaLaSemana` es lo único que separa al catálogo de las otras dos vistas:
   ahí la pregunta no es "¿qué dan el jueves?" sino "¿qué hay para ver?", y una
   película no se elige por el día. Todo lo demás —comuna, circuito, idioma,
   búsqueda, la función que ya empezó— se aplica igual, porque ésos sí cambian
   si la película está a tu alcance. */
function funcionesVisibles(todaLaSemana){
  const hoy = claveFecha(fechaDelDia());
  const ahora = new Date();
  const salida = [];
  PELICULAS.forEach(peli => {
    if(!calzaBusqueda(peli)) return;
    peli.funciones.forEach(f => {
      if(!todaLaSemana && f.inicio.slice(0,10) !== hoy) return;
      // Una función que ya empezó no se ofrece: nadie compra entrada para
      // algo que partió hace cuarenta minutos. Sin el `esHoy` de antes, que
      // sobraba —las de los otros días están todas por delante— y que en la
      // semana entera habría dejado pasar las de esta mañana.
      if(new Date(f.inicio) < ahora) return;
      if(idiomaFiltro && f.idioma !== idiomaFiltro) return;
      const cine = cinePorId(f.cine);
      if(!cine) return;
      if(circuitoFiltro && cine.circuito !== circuitoFiltro) return;
      if(comunaFiltro && cine.comuna !== comunaFiltro) return;
      salida.push({...f, peli, cine});
    });
  });
  return salida;
}

const funcionesDe = id => funcionesVisibles().filter(f => f.cine.id === id);

/* Las salas que salen en el mapa y en la lista. Con filtros de sala puestos
   (circuito, comuna) se recorta el catastro entero; el filtro de idioma no
   saca salas del mapa, apaga las que quedan sin función. */
function cinesVisibles(){
  return CINES.filter(c =>
    (!circuitoFiltro || c.circuito === circuitoFiltro) &&
    (!comunaFiltro || c.comuna === comunaFiltro));
}

/* Distancia en línea recta, en km. Sirve para ORDENAR, no para prometer
   cuánto se camina: a escala de ciudad el plano alcanza y de sobra. */
function distanciaKm(a, b){
  return Math.hypot((a[0] - b[0]) * 111.32, (a[1] - b[1]) * 92.6);
}

/* Qué hay publicado en un día, IGNORANDO los filtros y la hora.
   Es una pregunta distinta de la que contesta `funcionesVisibles()`: no es
   "¿qué puedo ver?" sino "¿el cine ya publicó este día?". Sin separarlas, un
   día sin cartelera y un día donde los filtros dejaron todo fuera se ven
   idénticos, y la página le echa la culpa a los filtros —que es justo lo que
   hacía—. Devuelve también cuántas son de las cadenas, porque un día con una
   sola función del Normandie no está vacío pero tampoco está publicado. */
function loPublicado(indice){
  const f = new Date(); f.setHours(0,0,0,0); f.setDate(f.getDate() + indice);
  const clave = claveFecha(f);
  const ahora = new Date();
  let total = 0, cadenas = 0, porDelante = 0;
  PELICULAS.forEach(p => p.funciones.forEach(fn => {
    if(fn.inicio.slice(0,10) !== clave) return;
    total++;
    if(new Date(fn.inicio) >= ahora) porDelante++;
    const cine = cinePorId(fn.cine);
    if(cine && cine.circuito === "comercial") cadenas++;
  }));
  return {total, cadenas, porDelante};
}

/* Los nombres accesibles se pintan como todo lo demás.
   Estaban escritos a mano en el HTML y en español: en inglés y portugués el
   lector de pantalla seguía diciendo "Arrastra para ver más". El `placeholder`
   del buscador sí se repintaba, así que el patrón ya estaba y a estos tres se
   les pasó — que es justo cómo se cuela este bicho, uno por uno. */
function pintarNombresAccesibles(){
  const poner = (id, texto) => { const n = document.getElementById(id); if(n) n.setAttribute("aria-label", texto); };
  poner("tirador", {es:"Arrastra para ver más", en:"Drag to see more",
                    pt:"Arraste para ver mais"}[IDIOMA]);
  poner("limpiar-buscar", {es:"Borrar la búsqueda", en:"Clear the search",
                           pt:"Limpar a busca"}[IDIOMA]);
  poner("panel", `${tr("cines")} · ${tr("enCartelera")}`);
}

function pintarTodo(){
  pintarNombresAccesibles();
  pintarDias(); pintarFiltros(); pintarLista(); pintarMapa();
}

/* El buscador se cablea UNA vez: el input vive en el HTML y nunca se vuelve a
   crear, así que conserva foco y cursor mientras se escribe. */
function montarBuscador(){
  const campo = document.getElementById("buscar");
  const limpiar = document.getElementById("limpiar-buscar");
  campo.placeholder = tr("buscar");
  campo.setAttribute("aria-label", tr("buscar"));

  const aplicar = () => {
    busqueda = campo.value;
    limpiar.hidden = !busqueda;
    // Con una sala apretada, buscar una película devolvería solo las funciones
    // de ESA sala y no se entendería por qué faltan las demás. Se suelta, igual
    // que hace el botón de la vista "Películas".
    cineElegido = "";
    // La pregunta "¿en qué cines la dan?" la contesta la vista de películas:
    // una ficha con el afiche y todas sus salas debajo. Desde el catálogo no
    // se sale: ahí buscar es acotar lo que se está mirando, y saltar de vista
    // a media palabra le cambiaría la pantalla bajo los dedos a alguien que
    // solo estaba filtrando.
    if(busqueda && vista !== "catalogo") vista = "peliculas";
    mostrando = 24;
    pintarTodo();
  };

  campo.addEventListener("input", aplicar);
  campo.addEventListener("keydown", ev => {
    if(ev.key === "Escape"){ campo.value = ""; aplicar(); }
  });
  limpiar.onclick = () => { campo.value = ""; aplicar(); campo.focus(); };

  // El botón que lleva a "qué película veo": abre el catálogo de la semana,
  // suelta la sala y deja a la Cabra presentando desde arriba. Es la misma
  // vista que la tercera pestaña; ésta es la puerta que se ve sin buscarla.
  const queVer = document.getElementById("que-ver");
  queVer.querySelector(".que-ver-masc").innerHTML = carita("cabra", "currentColor", 26);
  queVer.querySelector(".que-ver-txt").textContent = tr("queVer");
  queVer.setAttribute("aria-label", tr("queVer"));
  queVer.onclick = () => {
    vista = "catalogo"; cineElegido = ""; mostrando = 24;
    recienPresenta = true;
    // Si venía un texto en el buscador, el catálogo lo respeta; si no, muestra
    // todas. En cualquier caso se sube al tope.
    pintarTodo();
    document.getElementById("lista").scrollTop = 0;
    // El catálogo no usa el mapa: en celular el panel se sube del todo para
    // que la carátula entre entera.
    if(innerWidth < 880) subirPanel(2);
  };
}

/* El riel del día. Solo los días que la cartelera de verdad tiene cargados:
   las cadenas publican tres o cuatro, y ofrecer una semana sería mostrar
   días vacíos que parecen un error del sitio y no del cine. */
function pintarDias(){
  const cont = document.getElementById("dias");
  cont.setAttribute("aria-label", {es:"Día",en:"Day",pt:"Dia"}[IDIOMA]);
  // En el catálogo no hay día que elegir, y un control visible que no mueve lo
  // que se está mirando es peor que no tenerlo: se esconde y en su lugar queda
  // escrito qué se está mirando. Vuelve solo al salir de esa vista.
  cont.hidden = vista === "catalogo";
  document.getElementById("rango-semana").textContent = vista === "catalogo"
    ? {es:`Los próximos ${diasCartelera} días`, en:`The next ${diasCartelera} days`,
       pt:`Os próximos ${diasCartelera} dias`}[IDIOMA]
    : "";
  const opciones = [];
  for(let i = 0; i < diasCartelera; i++){
    const f = new Date(); f.setHours(0,0,0,0); f.setDate(f.getDate() + i);
    const etiqueta = i === 0 ? t("hoy") : i === 1 ? t("manana")
      : `${t("dias")[(f.getDay() + 6) % 7]} ${f.getDate()}`;
    opciones.push([i, etiqueta, i === 0]);
  }
  // Los días sin cartelera se marcan pero NO se esconden ni se deshabilitan:
  // el jueves aparece en cero el lunes y se llena el miércoles en la noche, así
  // que hay que poder mirarlo. Atenuado dice "todavía no", deshabilitado diría
  // "nunca", y son cosas distintas.
  cont.innerHTML = opciones.map(([i, etiqueta, destacado]) => {
    const p = PELICULAS.length ? loPublicado(i) : null;
    // Dos avisos distintos, porque son dos cosas distintas: el día que no
    // existe todavía y el día que solo tiene circuito de barrio. Hoy son
    // cuatro de siete —el 27 en cero y el 28, 29 y 30 sin ninguna cadena— así
    // que callarlo sería dejar que el riel prometa una semana que no hay.
    const vacio = p && p.total === 0;
    const flaco = p && p.total > 0 && p.cadenas === 0;
    const aviso = vacio ? tr("sinPublicarRiel") : flaco ? tr("soloBarrio") : "";
    return `<button type="button" data-dia="${i}" aria-pressed="${dia === i}"
       class="${destacado ? "destacado " : ""}${vacio ? "sin-cartelera-dia" : flaco ? "dia-flaco" : ""}"
       ${aviso ? `title="${escapar(aviso)}"` : ""}>${escapar(etiqueta)}</button>`;
  }).join("");
  cont.querySelectorAll("button").forEach(b => b.onclick = () => {
    dia = Number(b.dataset.dia); mostrando = 24; pintarTodo();
  });

  const fecha = generado
    ? new Date(generado).toLocaleDateString(localeDe(), {day:"numeric", month:"long"})
    : "";
  document.getElementById("cuenta").innerHTML = fecha
    ? `${carita("cabra","var(--c-cine-tinta)",18)} ${escapar(tr("revisado"))} ${escapar(fecha)}`
    : "";
}

function pintarFiltros(){
  const cont = document.getElementById("filtros");
  cont.innerHTML = "";
  cont.setAttribute("aria-label", `${tr("comuna")} · ${tr("cines")}`);

  const chip = (etiqueta, activo, tono, alPulsar, dibujo) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.style.setProperty("--tono", tono);
    b.setAttribute("aria-pressed", activo);
    b.innerHTML = (dibujo || "") + " " + escapar(etiqueta);
    b.onclick = alPulsar;
    cont.appendChild(b);
    return b;
  };

  // Cerca mío: el navegador pregunta, y si dice que no la página sigue
  // funcionando ordenada por cartelera. Nunca se guarda la posición.
  chip(tr("cerca"), !!miPosicion, "var(--c-cine)", () => {
    if(miPosicion){ miPosicion = null; pintarTodo(); return; }
    if(!navigator.geolocation){ estadoGeo = "no"; pintarTodo(); return; }
    estadoGeo = "pidiendo"; pintarTodo();
    navigator.geolocation.getCurrentPosition(
      p => { miPosicion = [p.coords.latitude, p.coords.longitude]; estadoGeo = ""; pintarTodo(); },
      () => { estadoGeo = "no"; pintarTodo(); },
      {timeout:8000, maximumAge:300000});
  }, `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none"
        stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/>
        <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>`);

  const sep = document.createElement("span");
  sep.className = "separa-chips";
  cont.appendChild(sep);

  chip(tr("comercial"), circuitoFiltro === "comercial", "var(--c-cine)",
    () => { circuitoFiltro = circuitoFiltro === "comercial" ? "" : "comercial"; mostrando = 24; pintarTodo(); },
    carita("cabra", circuitoFiltro === "comercial" ? "#FAF3E7" : "#A51D99", 22));
  chip(tr("arte"), circuitoFiltro === "arte", "var(--c-cine)",
    () => { circuitoFiltro = circuitoFiltro === "arte" ? "" : "arte"; mostrando = 24; pintarTodo(); },
    carita("chinchilla", circuitoFiltro === "arte" ? "#FAF3E7" : "#1B6FD1", 22));

  const sep2 = document.createElement("span");
  sep2.className = "separa-chips";
  cont.appendChild(sep2);

  chip(tr("subtitulada"), idiomaFiltro === "subtitulada", "var(--c-cultura)",
    () => { idiomaFiltro = idiomaFiltro === "subtitulada" ? "" : "subtitulada"; mostrando = 24; pintarTodo(); });
  chip(tr("doblada"), idiomaFiltro === "doblada", "var(--c-cultura)",
    () => { idiomaFiltro = idiomaFiltro === "doblada" ? "" : "doblada"; mostrando = 24; pintarTodo(); });

  const comunas = [...new Set(CINES.map(c => c.comuna).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  cont.appendChild(desplegable(tr("comuna"), comunas.map(c => [c, c]),
    comunaFiltro, v => { comunaFiltro = v; mostrando = 24; pintarTodo(); }));

  if(circuitoFiltro || comunaFiltro || idiomaFiltro){
    const limpiar = document.createElement("button");
    limpiar.type = "button";
    limpiar.className = "chip";
    limpiar.textContent = "✕ " + tr("limpiar");
    limpiar.onclick = () => {
      circuitoFiltro = ""; comunaFiltro = ""; idiomaFiltro = "";
      mostrando = 24; pintarTodo();
    };
    cont.appendChild(limpiar);
  }
}

function desplegable(etiqueta, opciones, valor, alCambiar){
  const caja = document.createElement("span");
  caja.className = "chip-select";
  const elegida = opciones.find(([v]) => v === valor);
  caja.innerHTML = `<b>${escapar(elegida ? elegida[1] : etiqueta)}</b>
    <select aria-label="${escapar(etiqueta)}" data-vacio="${valor ? "0" : "1"}">
      <option value="">${escapar(etiqueta)}</option>
      ${opciones.map(([v, txt]) =>
        `<option value="${escapar(v)}" ${v === valor ? "selected" : ""}>${escapar(txt)}</option>`).join("")}
    </select>`;
  caja.querySelector("select").onchange = e => alCambiar(e.target.value);
  return caja;
}

/* ---------- LA LISTA ---------- */
const horaCorta = iso => new Date(iso).toLocaleTimeString(localeDe(),
  {hour:"2-digit", minute:"2-digit", hour12:false});

/* El botón de una función. Es un enlace de verdad —no un div con onclick—
   para que se pueda abrir en otra pestaña, y sale por urlSegura porque la
   dirección la escribió el cine, no nosotros. */
function botonHora(f){
  const destino = urlSegura(f.url) || urlSegura(f.cine.url);
  const etiqueta = [f.formato, f.idioma ? tr(f.idioma) : ""].filter(Boolean).join(" · ");
  const nodo = document.createElement(destino ? "a" : "span");
  nodo.className = "hora";
  if(destino){
    nodo.href = destino;
    nodo.target = "_blank";
    nodo.rel = "noopener noreferrer";
    nodo.title = `${tr("compra")} — ${f.cine.nombre}`;
  }
  const hora = document.createElement("span");
  hora.textContent = horaCorta(f.inicio);
  nodo.appendChild(hora);
  if(etiqueta){
    const chico = document.createElement("small");
    chico.textContent = etiqueta;
    nodo.appendChild(chico);
  }
  return nodo;
}

function datosPeli(peli){
  return [peli.clasificacion, peli.duracion ? `${peli.duracion} ${tr("min")}` : ""]
    .filter(Boolean).join(" · ");
}

/* El afiche. Si el cine no publicó uno va una claqueta, no la Cabra.
   Acá había una carita de la Cabra y estaba mal por dónde vive esto: `afiche`
   se llama una vez por película, dentro de una lista que scrollea, así que en
   un día con varias funciones de barrio —que son justo las que no traen
   póster— salían seis u ocho cabras idénticas en fila. La mascota repetida
   deja de ser información y pasa a ser textura. La claqueta es un símbolo, no
   un personaje, y puede repetirse sin gastar a nadie. */
function afiche(peli, ancho, alto){
  const src = urlSegura(peli.poster);
  if(src){
    const img = document.createElement("img");
    img.src = src; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    img.width = ancho; img.height = alto;
    return img;
  }
  const caja = document.createElement("div");
  caja.style.cssText = `width:${ancho}px;height:${alto}px;flex:none;display:grid;
    place-items:center;border:2px solid var(--contorno);border-radius:var(--r-sm);
    background:var(--c-cine-suave)`;
  const lado = Math.round(ancho * .62);
  caja.innerHTML = `<svg viewBox="0 0 24 24" width="${lado}" height="${lado}" aria-hidden="true"
      fill="none" stroke="#7E1574" stroke-width="1.9" stroke-linejoin="round">
      <rect x="2.6" y="8.4" width="18.8" height="12.4" rx="2.2"/>
      <path d="M2.9 8.4 6.9 3.6l3.6 4.8M9.9 8.4l4-4.8 3.6 4.8"/>
      <path d="M17.1 8.4 21.1 3.6" stroke-linecap="round"/></svg>`;
  return caja;
}

function tarjetaCine(cine, funciones){
  const caja = document.createElement("article");
  caja.className = "cine" + (cine.circuito === "arte" ? " arte" : "")
                          + (cine.id === cineElegido ? " elegido" : "");
  caja.id = "cine-" + cine.id;

  // La cabecera ES el botón: apretar la sala —en el mapa o en la lista— deja
  // su cartelera sola en el panel. Va como <button> de verdad y no como un div
  // con onclick para que se llegue con el teclado y se anuncie como control.
  const cab = document.createElement("button");
  cab.type = "button";
  cab.className = "cine-cab";
  cab.setAttribute("aria-expanded", cine.id === cineElegido);
  cab.onclick = () => elegirCine(cine.id);
  // Acá había una carita de la Cabra por tarjeta. Con 44 salas eso son 44
  // cabras idénticas: cuando la mascota se repite deja de ser información y
  // pasa a ser textura, y encima ocupa el lugar donde debería ir el nombre.
  // El circuito ya se distingue solo — la tarjeta de cine arte va con el
  // pastel de la familia y la de mall con el fondo elevado.
  const texto = document.createElement("div");
  const titulo = document.createElement("h3");
  titulo.textContent = cine.nombre;
  // El circuito va ESCRITO. Al sacar las 44 caritas repetidas —que eran
  // textura— se fue con ellas el único canal que no era color: la forma
  // cambiaba, cabra contra chinchilla. Quedó la tarjeta distinguiéndose solo
  // por su pastel de fondo, y nada puede depender solo del color. Una
  // etiqueta de texto sirve mejor que la carita en las dos direcciones: se ve
  // sin distinguir tonos y además se ANUNCIA, cosa que la mascota nunca hizo
  // porque va aria-hidden.
  const sello = document.createElement("span");
  sello.className = "cine-circuito";
  sello.textContent = cine.circuito === "arte" ? tr("arte") : tr("comercial");
  const donde = document.createElement("div");
  donde.className = "cine-donde";
  // La comuna solo se agrega si la dirección no la trae ya: Cinemark escribe
  // "Av. Américo Vespucio 1501, Local CN 100, Cerrillos" y sin esto la línea
  // terminaba en "Cerrillos · Cerrillos".
  const sinTildes = x => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const yaDice = cine.comuna && sinTildes(cine.direccion).includes(sinTildes(cine.comuna));
  donde.textContent = [cine.direccion, yaDice ? "" : cine.comuna].filter(Boolean).join(" · ");
  texto.append(titulo, sello, donde);
  cab.append(texto);

  if(miPosicion && cine.lat != null){
    const lejos = document.createElement("span");
    lejos.className = "cine-lejos";
    lejos.textContent = distanciaKm(miPosicion, [cine.lat, cine.lon]).toFixed(1) + " km";
    cab.appendChild(lejos);
  }
  caja.appendChild(cab);

  if(!funciones.length){
    const nota = document.createElement("div");
    nota.className = "sin-cartelera";
    // "navegador" quiere decir que su cartelera no se puede leer desde un
    // programa; cualquier otra cosa es que hoy no hay funciones cargadas.
    nota.textContent = cine.funciones === 0 ? tr("sinCartelera") : tr("hoyNo");
    const oficial = urlSegura(cine.url);
    if(oficial){
      const a = document.createElement("a");
      a.href = oficial; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = " " + tr("verOficial") + " →";
      nota.appendChild(a);
    }
    caja.appendChild(nota);
    return caja;
  }

  // Dentro de la sala, una fila por película, con la primera función primero.
  const porPeli = new Map();
  funciones.forEach(f => {
    if(!porPeli.has(f.peli.clave)) porPeli.set(f.peli.clave, []);
    porPeli.get(f.peli.clave).push(f);
  });
  [...porPeli.values()]
    .sort((a, b) => a[0].inicio.localeCompare(b[0].inicio))
    .forEach(lista => {
      const peli = lista[0].peli;
      const fila = document.createElement("div");
      fila.className = "peli";
      const cab2 = document.createElement("div");
      cab2.className = "peli-cab";
      cab2.appendChild(afiche(peli, 34, 50));
      const bloque = document.createElement("div");
      const nombre = document.createElement("div");
      nombre.className = "peli-nombre";
      nombre.textContent = peli.titulo;
      const datos = document.createElement("div");
      datos.className = "peli-datos";
      datos.textContent = datosPeli(peli);
      bloque.append(nombre, datos);
      cab2.appendChild(bloque);
      fila.appendChild(cab2);

      const horas = document.createElement("div");
      horas.className = "horas";
      lista.sort((a, b) => a.inicio.localeCompare(b.inicio))
           .forEach(f => horas.appendChild(botonHora(f)));
      fila.appendChild(horas);
      caja.appendChild(fila);
    });
  return caja;
}

/* El catálogo de la semana: una entrada por película, con en cuántas salas
   está y si todavía alcanza hoy. Sale de las MISMAS funciones que las otras
   dos vistas, así que un filtro puesto arriba se nota acá igual.

   El orden es por alcance —cuántas salas, después cuántas funciones— y no por
   circuito: ordenar por gusto sería editorializar una lista que existe para
   que cada quien elija. El cine arte no queda escondido igual, porque la
   página tiene un chip que lo deja solo. */
function catalogoSemana(funciones){
  const hoy = claveFecha(fechaEn(0));
  const porPeli = new Map();
  funciones.forEach(f => {
    let entrada = porPeli.get(f.peli.clave);
    if(!entrada){
      entrada = {peli:f.peli, cines:new Set(), funciones:0, hoy:false};
      porPeli.set(f.peli.clave, entrada);
    }
    entrada.cines.add(f.cine.id);
    entrada.funciones++;
    if(f.inicio.slice(0,10) === hoy) entrada.hoy = true;
  });
  return [...porPeli.values()].sort((a, b) =>
    b.cines.size - a.cines.size || b.funciones - a.funciones
    || a.peli.titulo.localeCompare(b.peli.titulo));
}

/* La ficha del catálogo: carátula, de qué se trata, el tráiler y un botón a
   los horarios. Ni un horario adentro — para eso está el botón. */
function tarjetaFicha(entrada){
  const peli = entrada.peli;
  const caja = document.createElement("article");
  caja.className = "ficha";
  caja.appendChild(afiche(peli, 104, 154));

  const cab = document.createElement("div");
  const titulo = document.createElement("h3");
  titulo.textContent = peli.titulo;
  cab.appendChild(titulo);

  const meta = document.createElement("div");
  meta.className = "ficha-meta";
  if(entrada.hoy){
    const hoy = document.createElement("span");
    hoy.className = "ficha-hoy";
    hoy.textContent = t("hoy");
    meta.appendChild(hoy);
  }
  const datos = document.createElement("div");
  datos.className = "peli-datos";
  const salas = entrada.cines.size;
  datos.textContent = [datosPeli(peli),
    `${salas} ${salas === 1 ? tr("salaCorta") : tr("salasCortas")}`].filter(Boolean).join(" · ");
  meta.appendChild(datos);
  cab.appendChild(meta);

  // El crédito, cuando el cine lo publica. Es del circuito de repertorio: el
  // Normandie escribe dirección, país y año de cada película y las cadenas no
  // escriben ninguno de los tres.
  if(peli.credito){
    const credito = document.createElement("div");
    credito.className = "ficha-credito";
    credito.textContent = peli.credito;
    cab.appendChild(credito);
  }

  // Los géneros primero que la sinopsis: es lo que decide "¿me interesa?" en
  // un segundo, antes de leer nada. Tres como máximo, o la ficha se vuelve una
  // nube de etiquetas.
  if(peli.generos && peli.generos.length){
    const gens = document.createElement("div");
    gens.className = "ficha-gens";
    peli.generos.slice(0, 3).forEach(g => {
      const pastilla = document.createElement("span");
      pastilla.className = "gen";
      pastilla.textContent = g[0].toUpperCase() + g.slice(1).toLowerCase();
      gens.appendChild(pastilla);
    });
    cab.appendChild(gens);
  }
  caja.appendChild(cab);

  const pie = document.createElement("div");
  pie.className = "ficha-pie";
  // Sin sinopsis la ficha queda con carátula, datos y botones, y así se
  // publica: quince de las treinta y tres son del circuito de barrio, que no
  // escribe una en ninguna parte. Inventarle un resumen sería peor que el
  // hueco, y decir "sin sinopsis" en cada tarjeta sería repetir quince veces
  // lo mismo — eso se dice UNA vez, arriba, en la línea de la deuda.
  if(peli.sinopsis){
    const sinopsis = document.createElement("p");
    sinopsis.className = "film-sinopsis";
    sinopsis.id = "sinopsis-" + peli.clave;
    sinopsis.textContent = peli.sinopsis;
    pie.appendChild(sinopsis);
    // Cuatro líneas y el resto a un botón. Cortar sin ofrecerlo escondería un
    // tercio de lo que el cine sí publicó: la sinopsis mediana son cinco
    // líneas y la más larga, doce. El botón se esconde solo cuando no hay nada
    // cortado, y eso lo mide `ajustarLeerMas()` con la tarjeta ya puesta.
    const mas = document.createElement("button");
    mas.type = "button";
    mas.className = "mas-sinopsis";
    mas.textContent = tr("leerMas");
    mas.setAttribute("aria-expanded", "false");
    mas.setAttribute("aria-controls", sinopsis.id);
    mas.onclick = () => {
      const abierta = sinopsis.classList.toggle("abierta");
      mas.textContent = abierta ? tr("leerMenos") : tr("leerMas");
      mas.setAttribute("aria-expanded", abierta);
    };
    pie.appendChild(mas);
  }

  const acciones = document.createElement("div");
  acciones.className = "ficha-acciones";
  if(urlSegura(peli.trailer)){
    const trailer = document.createElement("a");
    trailer.className = "film-trailer";
    trailer.href = urlSegura(peli.trailer);
    trailer.target = "_blank"; trailer.rel = "noopener noreferrer";
    trailer.innerHTML = `<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M8 5v14l11-7z" fill="currentColor"/></svg>${escapar(tr("verTrailer"))}`;
    acciones.appendChild(trailer);
  }
  const donde = document.createElement("button");
  donde.type = "button";
  donde.className = "ficha-donde";
  donde.textContent = tr("verHorarios") + " →";
  donde.setAttribute("aria-label", `${tr("verHorarios")} — ${peli.titulo}`);
  donde.onclick = () => verFunciones(peli);
  acciones.appendChild(donde);
  pie.appendChild(acciones);
  caja.appendChild(pie);
  return caja;
}

/* El puente entre las dos preguntas: elegida la película, "¿dónde y a qué
   hora?" la contesta la vista de películas filtrada por ella.

   El título se escribe en el buscador de verdad y no en una variable
   escondida, para que el estado se VEA: quien llega ahí puede borrar el texto
   y volver a la cartelera entera sin adivinar qué lo dejó ahí. */
function verFunciones(peli){
  const campo = document.getElementById("buscar");
  campo.value = peli.titulo;
  busqueda = peli.titulo;
  document.getElementById("limpiar-buscar").hidden = false;
  vista = "peliculas"; cineElegido = ""; mostrando = 24;

  // Si el día que estaba puesto no tiene funciones de ESTA película, se salta
  // al primero que sí: la ficha prometió sus horarios y caer en un panel vacío
  // rompe la promesa. El salto no es silencioso — el riel de días vuelve a
  // aparecer al salir del catálogo, con el día nuevo apretado.
  const ahora = new Date();
  const tiene = i => peli.funciones.some(f =>
    f.inicio.slice(0,10) === claveFecha(fechaEn(i)) && new Date(f.inicio) >= ahora);
  if(!tiene(dia)){
    for(let i = 0; i < diasCartelera; i++){ if(tiene(i)){ dia = i; break; } }
  }
  pintarTodo();
  document.getElementById("lista").scrollTop = 0;
}

function tarjetaPelicula(peli, funciones){
  const caja = document.createElement("article");
  caja.className = "film";
  caja.appendChild(afiche(peli, 66, 98));

  const bloque = document.createElement("div");
  bloque.style.minWidth = "0";
  const titulo = document.createElement("h3");
  titulo.textContent = peli.titulo;
  const datos = document.createElement("div");
  datos.className = "peli-datos";
  // Los géneros van en la línea de datos: es lo primero que decide "¿me
  // interesa?" antes de leer la sinopsis. Vienen del catálogo del cine.
  const gen = (peli.generos && peli.generos.length)
    ? " · " + peli.generos.map(g => g[0].toUpperCase() + g.slice(1).toLowerCase()).join(", ") : "";
  datos.textContent = datosPeli(peli) + gen;
  bloque.append(titulo, datos);

  // La sinopsis y el tráiler son la razón de esta vista: ayudan a elegir qué
  // ver antes de mirar horarios. Solo salen si el cine los publicó —el
  // circuito de barrio no—, y eso es una respuesta, no un hueco.
  if(peli.sinopsis){
    const sin = document.createElement("p");
    sin.className = "film-sinopsis";
    sin.textContent = peli.sinopsis;
    bloque.appendChild(sin);
  }
  if(urlSegura(peli.trailer)){
    const tr2 = document.createElement("a");
    tr2.className = "film-trailer";
    tr2.href = urlSegura(peli.trailer);
    tr2.target = "_blank"; tr2.rel = "noopener noreferrer";
    tr2.innerHTML = `<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M8 5v14l11-7z" fill="currentColor"/></svg>${escapar(tr("verTrailer"))}`;
    bloque.appendChild(tr2);
  }

  const porCine = new Map();
  funciones.forEach(f => {
    if(!porCine.has(f.cine.id)) porCine.set(f.cine.id, []);
    porCine.get(f.cine.id).push(f);
  });
  [...porCine.entries()]
    .sort((a, b) => ordenCines(cinePorId(a[0]), cinePorId(b[0])))
    .forEach(([id, lista]) => {
      const sala = document.createElement("div");
      sala.className = "film-sala";
      const nombre = document.createElement("b");
      const cine = cinePorId(id);
      nombre.textContent = miPosicion && cine.lat != null
        ? `${cine.nombre} · ${distanciaKm(miPosicion, [cine.lat, cine.lon]).toFixed(1)} km`
        : `${cine.nombre} · ${cine.comuna}`;
      sala.appendChild(nombre);
      const horas = document.createElement("div");
      horas.className = "horas";
      lista.sort((a, b) => a.inicio.localeCompare(b.inicio))
           .forEach(f => horas.appendChild(botonHora(f)));
      sala.appendChild(horas);
      bloque.appendChild(sala);
    });

  caja.appendChild(bloque);
  return caja;
}

/* El orden de las salas: si el navegador dio la posición, la más cerca
   primero — que es la pregunta con la que la gente llega. Si no, la que más
   funciones tiene, y el circuito de barrio antes que el mall a igualdad de
   cartelera, porque es lo que no está en ninguna otra app. */
function ordenCines(a, b){
  if(!a || !b) return 0;
  if(miPosicion && a.lat != null && b.lat != null){
    return distanciaKm(miPosicion, [a.lat, a.lon]) - distanciaKm(miPosicion, [b.lat, b.lon]);
  }
  const fa = funcionesDe(a.id).length, fb = funcionesDe(b.id).length;
  if(fa !== fb) return fb - fa;
  if((a.circuito === "arte") !== (b.circuito === "arte")) return a.circuito === "arte" ? -1 : 1;
  return a.nombre.localeCompare(b.nombre);
}

function pintarVista(){
  const cont = document.getElementById("vista");
  cont.innerHTML = [["cines", tr("cines")], ["peliculas", tr("peliculas")], ["catalogo", tr("catalogo")]]
    .map(([clave, txt]) =>
      `<button type="button" data-vista="${clave}" aria-pressed="${vista === clave}">${escapar(txt)}</button>`).join("");
  cont.querySelectorAll("button").forEach(b => b.onclick = () => {
    // Las otras dos vistas son del catálogo entero: si se venía mirando una
    // sala, se suelta. Si no, el título diría "11 en cartelera" mostrando las
    // de una sola sala.
    vista = b.dataset.vista; cineElegido = ""; mostrando = 24;
    recienPresenta = (vista === "catalogo");
    pintarTodo();
    document.getElementById("lista").scrollTop = 0;
    // El catálogo no usa el mapa: en celular sube el panel para que la
    // carátula entre entera en vez de asomarse por el borde de abajo.
    if(vista === "catalogo" && innerWidth < 880) subirPanel(2);
  });
}

/* Por qué la lista quedó vacía. UNA sola función que decide, y no cuatro `if`
   escritos por acumulación, que es donde se cuela el mensaje que miente.

   Los cuatro casos son distintos entre sí y ofrecerle a alguien "saca un
   filtro" cuando no hay nada para nadie es el peor de todos: le echa la culpa
   de algo que no hizo y lo manda a probar cosas que no van a servir. Con
   cuatro días eso casi no pasaba; con siete pasa todos los días, porque las
   cadenas publican con dos o tres de anticipación.

   El orden importa: se descarta de lo más específico a lo más general. */
function textoDelVacio(){
  // 0. El catálogo no tiene día, así que los casos 2 y 3 —"el cine no publicó
  //    este día" y "las de hoy ya empezaron"— ahí no existen, y mandar a
  //    "mirar otro día" sería mandar a mover un riel que en esa vista ni
  //    siquiera está en pantalla.
  if(vista === "catalogo"){
    if(busqueda && !PELICULAS.some(p => calzaBusqueda(p)))
      return [tr("sinPeli"), tr("sinPeliPista")];
    return [tr("vacioPelis"), tr("vacioPelisPista")];
  }

  // 1. Buscó una película. La pregunta es por ESA película, no por el día.
  if(busqueda){
    const otros = [];
    for(let i = 0; i < diasCartelera; i++){
      if(i === dia) continue;
      const f = new Date(); f.setHours(0,0,0,0); f.setDate(f.getDate() + i);
      const clave = claveFecha(f);
      const hay = PELICULAS.some(p => calzaBusqueda(p)
        && p.funciones.some(fn => fn.inicio.slice(0,10) === clave));
      if(hay) otros.push([i, f]);
    }
    if(otros.length){
      // Está en cartelera pero no este día: decir CUÁL día es la respuesta que
      // la persona vino a buscar.
      const nombres = otros.map(([i, f]) => i === 0 ? t("hoy") : i === 1 ? t("manana")
        : `${t("dias")[(f.getDay() + 6) % 7]} ${f.getDate()}`);
      return [`${tr("sinPeliHoy")} ${nombres.join(", ")}`, ""];
    }
    // Ya se recorrieron todos los días: mandar a "probar otro día" sería
    // mandarla a mirar donde acabamos de mirar nosotros.
    return [tr("sinPeli"), tr("sinPeliPista")];
  }

  const publicado = loPublicado(dia);

  // 2. El cine no ha publicado este día. No sobra ningún filtro: no hay nada.
  if(!publicado.total) return [tr("sinPublicar"), tr("sinPublicarPista")];

  // 3. Hoy, con cartelera publicada y nada por delante: ya empezaron todas.
  //    A las once de la noche "no hay funciones con esos filtros" es falso.
  //    Se pregunta por `porDelante` y NO por `dia === 0` a secas: si quedan
  //    funciones por empezar y aun así la lista está vacía, es que los filtros
  //    las dejaron fuera, y decir "ya empezaron" sería la misma clase de
  //    mentira que este bloque vino a arreglar, solo que al revés.
  if(!publicado.porDelante) return [tr("yaEmpezaron"), tr("yaEmpezaronPista")];

  // 4. Hay funciones ese día y los filtros las dejaron fuera. Recién ACÁ
  //    ofrecer sacar un filtro es un consejo útil y no una acusación.
  return [tr("vacio"), tr("vaciopista")];
}

function pintarLista(){
  pintarVista();
  // El catálogo mira la semana entera; las otras dos, el día que dice el riel.
  const esCatalogo = vista === "catalogo";
  const funciones = funcionesVisibles(esCatalogo);
  const fichas = esCatalogo ? catalogoSemana(funciones) : null;
  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  const salasConFuncion = new Set(funciones.map(f => f.cine.id));
  const elegidaAhora = vista === "cines" ? cinePorId(cineElegido) : null;
  if(elegidaAhora){
    // Con una sala elegida el número deja de ser "cuántas salas" y pasa a ser
    // lo único que importa ahí: cuántas funciones quedan hoy en ESA sala.
    const suyas = funciones.filter(f => f.cine.id === elegidaAhora.id).length;
    document.getElementById("conteo").textContent = suyas;
    document.getElementById("conteo-txt").textContent = suyas === 1
      ? {es:"función", en:"showing", pt:"sessão"}[IDIOMA]
      : {es:"funciones", en:"showings", pt:"sessões"}[IDIOMA];
  } else {
    const pelis = new Set(funciones.map(f => f.peli.clave)).size;
    document.getElementById("conteo").textContent =
      vista === "cines" ? salasConFuncion.size : pelis;
    document.getElementById("conteo-txt").textContent = vista === "cines"
      ? (salasConFuncion.size === 1 ? tr("sala1") : tr("salas"))
      : esCatalogo ? (pelis === 1 ? tr("enCatalogo1") : tr("enCatalogo"))
      : tr("enCartelera");
  }

  // La deuda se dice, no se esconde: cuántas salas están en el mapa sin
  // horarios y por qué, y qué pasó con el permiso de ubicación.
  const partes = [];
  if(esCatalogo){
    // La deuda de ESTA vista es otra: la ficha sin sinopsis. Se dice una vez
    // acá arriba y no quince veces, una por tarjeta — repetir "sin sinopsis"
    // en cada hueco convierte la falta en textura y deja de leerse.
    const sinFicha = fichas.filter(e => !e.peli.sinopsis).length;
    if(sinFicha) partes.push(`${sinFicha} ${tr("sinSinopsis")}`);
  } else {
  // El día a medio publicar: hay funciones —una del Normandie, una de la
  // Cineteca— y CERO de las cadenas. No dispara el estado vacío porque la
  // lista trae algo, y sin esta línea parece que Santiago tiene un solo cine.
  // Es el caso más engañoso de los tres, justamente porque no se ve como error.
  const publicadoHoy = loPublicado(dia);
  if(publicadoHoy.total && !publicadoHoy.cadenas) partes.push(tr("soloBarrio"));
  // "Sin horarios publicados" es una propiedad de la SALA —su cartelera no se
  // puede leer—, no del filtro puesto. Se contaba sobre las salas que quedaban
  // sin función DESPUÉS de filtrar y buscar, así que escribir "zzzz" hacía
  // saltar el número a 44 y la frase pasaba a ser falsa: esas salas sí
  // publican, es la búsqueda la que no calzó. `c.funciones` viene del catastro
  // y cuenta la cartelera entera, así que no se mueve con lo que alguien
  // escriba. Sí respeta comuna y circuito, porque ésos sí cambian el mapa.
  const mudas = cinesVisibles().filter(c => !c.funciones).length;
  if(mudas) partes.push(`${mudas} ${tr("sinHorarios")}`);
  }
  if(estadoGeo === "no") partes.push({es:"No pude leer tu ubicación; el orden es por cartelera.",
    en:"Could not read your location; sorted by listings.",
    pt:"Não consegui ler sua localização; a ordem é por programação."}[IDIOMA]);
  document.getElementById("nota-geo").textContent = partes.join(" · ");

  if(!funciones.length){
    const [titulo, pista] = textoDelVacio();
    // El estado vacío es donde la Cabra se gana el puesto: es donde alguien
    // está frustrado, donde sobra espacio y donde una página sin nadie se
    // siente rota. Va ENTERA (de 38px para arriba `mascota()` dibuja el cuerpo
    // y aparece la caja de cabritas), viva —`{anima:true}`, sin eso la clase
    // no se agrega y el gesto escrito en loica.css no engancha nunca— y
    // despierta: está esperando con sus cabritas, no durmiendo. La pose
    // dormida queda para cuando algo falla de verdad, que no es este caso.
    // `entra` en el contenedor le da su llegada: entra desde abajo y se
    // sienta, como quien llega con la sala ya a oscuras.
    // `entra` solo la PRIMERA vez que el vacío aparece. El buscador repinta la
    // lista entera en cada evento `input`, así que sin esta bandera escribir
    // "zzzz" son cuatro llegadas seguidas de la Cabra: la mascota rebotando
    // mientras alguien escribe es exactamente el tipo de animación que cansa.
    const recienLlega = !vacioEnPantalla;
    vacioEnPantalla = true;
    cont.innerHTML = `<div class="vacio${recienLlega ? " entra" : ""}">
      ${cuerpo("cabra","var(--c-cine)",118,{anima:true})}
      <p><b>${escapar(titulo)}</b>${pista ? "<br>" + escapar(pista) : ""}</p></div>`;
    return;
  }
  vacioEnPantalla = false;

  if(vista === "cines"){
    // Primero las salas que hoy tienen función; las mudas van al final, que
    // es donde sirven: cuando ya se miró lo que sí hay.
    const conFuncion = cinesVisibles().filter(c => salasConFuncion.has(c.id)).sort(ordenCines);
    const sinFuncion = cinesVisibles().filter(c => !salasConFuncion.has(c.id)).sort(ordenCines);
    const todas = [...conFuncion, ...sinFuncion];
    const elegida = cinePorId(cineElegido);
    if(elegida){
      cont.appendChild(tarjetaCine(elegida, funciones.filter(f => f.cine.id === elegida.id)));
      cont.appendChild(botonVolver(todas.length - 1));
    } else {
      todas.slice(0, mostrando).forEach(cine =>
        cont.appendChild(tarjetaCine(cine, funciones.filter(f => f.cine.id === cine.id))));
      if(todas.length > mostrando) cont.appendChild(botonVerMas(todas.length));
    }
  } else if(esCatalogo){
    // La Cabra presenta la cartelera: ésta es la vista de "¿qué veo?", y la
    // mascota que la conduce le da la bienvenida jugando con su gesto. Sale
    // UNA vez, arriba de todo, viva; no se repite por tarjeta. `entra` solo si
    // recién se cambió a esta vista, no en cada repintado del buscador.
    const presenta = document.createElement("div");
    presenta.className = "cabra-presenta" + (recienPresenta ? " entra" : "");
    presenta.innerHTML =
      `<div class="cabra-presenta-masc">${cuerpo("cabra","var(--c-cine)",76,{anima:true})}</div>
       <p>${escapar(tr("cabraPresenta"))}</p>`;
    cont.appendChild(presenta);
    recienPresenta = false;

    fichas.slice(0, mostrando).forEach(e => cont.appendChild(tarjetaFicha(e)));
    if(fichas.length > mostrando) cont.appendChild(botonVerMas(fichas.length));

    ajustarLeerMas();
  } else {
    const porPeli = new Map();
    funciones.forEach(f => {
      if(!porPeli.has(f.peli.clave)) porPeli.set(f.peli.clave, []);
      porPeli.get(f.peli.clave).push(f);
    });
    [...porPeli.values()]
      .sort((a, b) => b.length - a.length || a[0].peli.titulo.localeCompare(b[0].peli.titulo))
      .slice(0, mostrando)
      .forEach(lista => cont.appendChild(tarjetaPelicula(lista[0].peli, lista)));
    if(porPeli.size > mostrando) cont.appendChild(botonVerMas(porPeli.size));
  }

  // La Cabra del pie solo si no está ya la que presenta: una a la vez, y en
  // el catálogo con una sola película las dos caben en la misma pantalla.
  if(cont.querySelector(".fin-lista") === null)
    cont.appendChild(selloHonesto(!cont.querySelector(".cabra-presenta")));
}

/* "Leer más" solo donde hay algo cortado. Se pregunta con las tarjetas ya
   puestas en la página porque la respuesta depende del ancho real: la misma
   sinopsis se corta en el panel de 430px y entra entera en una pantalla
   ancha. Un botón que abre y no cambia nada es un botón que miente.

   Se vuelve a preguntar al cambiar el tamaño de la ventana —ahí es donde el
   ancho cambia y la respuesta con él—, con las abiertas intactas: a quien
   estaba leyendo no se le cierra el texto por girar el teléfono. */
function ajustarLeerMas(){
  document.querySelectorAll(".mas-sinopsis").forEach(boton => {
    const texto = boton.previousElementSibling;
    if(!texto) return;
    if(texto.classList.contains("abierta")){ boton.hidden = false; return; }
    boton.hidden = texto.scrollHeight <= texto.clientHeight + 2;
  });
}
addEventListener("resize", ajustarLeerMas);

/* Volver a todas. Va al FINAL de la tarjeta y no arriba a propósito: cuando
   alguien aprieta una sala quiere ver los horarios, no un botón de salida
   encima de ellos. */
function botonVolver(cuantas){
  const caja = document.createElement("div");
  caja.className = "fin-lista";
  caja.style.cssText = "padding:var(--e-4) 0 0;text-align:center";
  const b = document.createElement("button");
  b.type = "button";
  b.className = "boton secundario";
  b.textContent = "← " + {es:`Ver los otros ${cuantas} cines`,
                          en:`See the other ${cuantas} cinemas`,
                          pt:`Ver os outros ${cuantas} cinemas`}[IDIOMA];
  b.onclick = () => elegirCine(cineElegido);
  caja.appendChild(b);
  return caja;
}

function botonVerMas(total){
  const mas = document.createElement("div");
  mas.className = "fin-lista";
  mas.style.cssText = "padding:var(--e-5) 0;text-align:center";
  const b = document.createElement("button");
  b.type = "button";
  b.className = "boton secundario";
  b.textContent = `${t("verMas")} (${total - mostrando})`;
  b.onclick = () => { mostrando += 24; pintarLista(); };
  mas.appendChild(b);
  return mas;
}

/* El pie honesto: lo que esta página NO hace.
   La Cabra también sale acá, y no contradice la regla de "una sola vez": es
   una a la VEZ. Nunca conviven, porque `pintarLista` retorna antes del sello
   cuando la lista está vacía —o está la grande del vacío, o está ésta— y
   porque cuando arriba está la Cabra que presenta el catálogo, este pie viene
   sin la suya: con una sola película en la lista las dos caben en la misma
   pantalla, y ahí la mascota deja de ser una presencia y pasa a ser un eco.
   Se gana el puesto por lo mismo que el guarén se ganó el pie de descuentos:
   el gesto ES la frase. Una cabra masticando cabritas al lado de "Loica no
   vende entradas" dice lo mismo que el texto, y este pie es el único hueco
   permanente y ancho de la página. Va entera —54px, sobre los 38 que necesita
   el cuerpo— y viva. */
function selloHonesto(conCabra){
  const sello = document.createElement("div");
  sello.style.cssText = "padding:var(--e-5) 0 0;text-align:center;font-size:var(--t-xs);color:var(--tinta-tenue);line-height:1.5";
  if(conCabra){
    const cara = document.createElement("div");
    cara.innerHTML = cuerpo("cabra","var(--c-cine-tinta)",54,{anima:true});
    sello.appendChild(cara);
  }
  const texto = document.createElement("p");
  texto.style.margin = conCabra ? "6px 0 0" : "0";
  texto.textContent = tr("ojo");
  sello.appendChild(texto);
  return sello;
}

/* --- La hoja de la lista: cuatro topes, agarre ancho y botón de vuelta ---
   El arrastre ya no vive acá. Era el mismo bloque copiado y pegado en las
   cuatro páginas con mapa, y por lo tanto con el mismo defecto en las cuatro:
   solo enganchaba desde el tirador, que en ESTA página medía 386 × 20 px. Un
   pulgar mide 44 y cae en el contador, donde no pasaba nada — medido con
   toques de verdad, arrastrar desde la cabecera dejaba el panel en 200 px y lo
   soltaba en 200. Ahora lo hace `montarHoja()` en loica.js: agarre desde el
   contador además del tirador, el tope OCULTA para ver el mapa de salas
   entero, y el botón flotante que la trae de vuelta diciendo cuántas la
   esperan. El contrato está en notas/hoja-movil-contrato.md.

   El rótulo lo pone ESTA página, porque la hoja no sabe qué está contando. Acá
   el contador dice cuatro cosas distintas según la vista —salas con función,
   funciones de la sala elegida, películas esta semana, y "en cartelera"— y la
   última es la única sin sustantivo: "9 en cartelera" deja al número sin
   sujeto. Se le antepone el que la página ya tiene traducido, así el botón
   habla de cine en los tres idiomas y no de "eventos". */
const hoja = montarHoja({
  rotulo: () => {
    const cuantas = document.getElementById("conteo").textContent;
    const que = document.getElementById("conteo-txt").textContent;
    return que === tr("enCartelera")
      ? `${cuantas} ${tr("peliculas").toLowerCase()} ${que}`
      : `${cuantas} ${que}`;
  },
});

/* Elegir una sala en el mapa —o irse al catálogo— tiene que poder levantar la
   hoja: en reposo queda tapando la cartelera que se acaba de pedir. Solo sube,
   nunca baja, de ahí el `Math.max`. Y si venía escondida la trae de vuelta, al
   revés que en mapa.html: allá la que la subía era `refrescar()` sola y pisarle
   al usuario su decisión de esconderla habría sido de mala educación; acá las
   tres llamadas salen de un toque suyo pidiendo ver justamente esa lista. */
const subirPanel = i => { if(hoja) hoja.fijar(Math.max(hoja.indice, i)); };
</script>
