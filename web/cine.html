<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Mismas notas que el resto de las
     paginas: img-src abierto por los afiches de las peliculas, que viven en el
     CDN de cada cadena; 'unsafe-inline' mientras la logica viva en un <script>
     inline; y frame-ancestors no va porque en un <meta> el navegador lo ignora,
     igual que upgrade-insecure-requests (el detalle esta en mapa.html). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; worker-src blob:; connect-src 'self' https://*.basemaps.cartocdn.com https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Cine en Santiago — Loica</title>
<meta name="description" content="Qué dan hoy en los cines de Santiago y cuál te queda cerca: las salas de mall y el circuito de cine arte, con sus horarios y el link para comprar en el cine.">
<link rel="canonical" href="https://loicasantiago.cl/cine.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<link rel="stylesheet" href="loica.css?v=26">
<style>
  html,body{height:100%;overflow:hidden}
  /* Los dos altos van en este orden a propósito: `dvh` no existe en Safari de
     iOS anterior a 15.4 y ahí la declaración se descarta entera (la nota larga
     está en descuentos.html, que es de donde esta página copia el esqueleto). */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:none;z-index:6}
  main{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}

  /* --- Cabecera: dos rieles, igual que talleres y descuentos --- */
  .riel-fecha{
    display:flex;gap:5px;padding:var(--e-2) var(--e-4);background:var(--fondo-elevado);
    overflow-x:auto;scrollbar-width:none;align-items:center;
  }
  .riel-fecha::-webkit-scrollbar{display:none}
  .segmentado{
    display:inline-flex;gap:3px;padding:3px;flex:none;
    background:var(--fondo-hundido);border:2.5px solid var(--contorno);
    border-radius:var(--r-pill);box-shadow:var(--repisa-1);
  }
  /* `hidden` tiene que poder esconderlo: la regla `[hidden]` vive en la hoja
     del navegador y este `display:inline-flex` de la página le gana, así que
     `#dias.hidden = true` dejaba el riel de días dibujado igual —con el rótulo
     del catálogo al lado, los dos a la vez— y el día seguía pareciendo algo
     que se elige en una vista que no lo usa. */
  .segmentado[hidden]{display:none}
  .segmentado button{
    flex:none;border:0;background:transparent;color:var(--tinta-suave);cursor:pointer;
    padding:0 var(--e-3);min-height:36px;min-width:38px;border-radius:var(--r-pill);
    font:800 var(--t-sm)/1 var(--fuente-marca);white-space:nowrap;transition:var(--rapido);
  }
  .segmentado button:hover{color:var(--tinta)}
  /* El fucsia del cine con tinta crema: a diferencia del naranjo de clases,
     este relleno es oscuro (5,9:1 sobre crema) y el texto claro encima se lee. */
  .segmentado button[aria-pressed="true"]{background:var(--c-cine);color:var(--arena-50)}
  .segmentado .destacado{padding:0 var(--e-4);border-right:2px solid var(--borde-fuerte);
    border-radius:var(--r-pill) 0 0 var(--r-pill);margin-right:2px}
  /* El día que el cine todavía no publica. Atenuado y con un punto, no
     deshabilitado: atenuado dice "todavía no" y deshabilitado diría "nunca".
     El jueves amanece en cero y se llena el miércoles en la noche, así que
     tiene que poder apretarse — y lo que se lee ahí adentro explica por qué
     está vacío. Se mantiene el contraste de texto: lo que baja es el peso
     visual, no la legibilidad. */
  .segmentado button.sin-cartelera-dia{color:var(--tinta-tenue);font-weight:600}
  .segmentado button.sin-cartelera-dia::after{
    content:"";width:4px;height:4px;border-radius:50%;background:currentColor;
    display:inline-block;vertical-align:middle;margin-left:5px;opacity:.7;
  }
  .segmentado button.sin-cartelera-dia[aria-pressed="true"]{color:var(--arena-50);font-weight:800}
  /* El día que solo tiene circuito de barrio: un punto hueco. No está vacío,
     pero tampoco está publicado. */
  .segmentado button.dia-flaco::after{
    content:"";width:4px;height:4px;border-radius:50%;border:1.5px solid currentColor;
    display:inline-block;vertical-align:middle;margin-left:5px;opacity:.65;
  }
  .cuenta-rango{
    display:flex;align-items:center;gap:5px;flex:none;margin-left:auto;padding-left:var(--e-3);
    font-size:var(--t-xs);font-weight:700;color:var(--tinta-tenue);white-space:nowrap;
  }

  header .filtros{padding:var(--e-2) var(--e-4) var(--e-3);border-bottom:2.5px solid var(--contorno);
    align-items:center}
  header .filtros .chip{padding:6px 13px 6px 8px;gap:5px;font-size:var(--t-xs);
    border-width:2px;box-shadow:0 2px 0 var(--contorno);min-height:38px}
  header .filtros .chip svg{width:22px;height:22px}
  header .filtros .chip:active,
  header .filtros .chip[aria-pressed="true"]{transform:translateY(2px);box-shadow:none}
  header .filtros .chip:focus-visible{
    box-shadow:0 2px 0 var(--contorno),0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  header .filtros .chip[aria-pressed="true"]:focus-visible{
    box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  header .filtros .chip[aria-pressed="true"]{background:var(--tono,var(--tinta));color:var(--arena-50)}
  .separa-chips{flex:none;width:2px;background:var(--borde-fuerte);margin:4px 3px;border-radius:2px}

  /* El desplegable vestido de chip, calcado de descuentos. */
  .chip-select{
    flex:none;position:relative;display:inline-flex;align-items:center;
    border:2px solid var(--contorno);background:var(--fondo-elevado);
    border-radius:var(--r-pill);box-shadow:0 2px 0 var(--contorno);min-height:38px;
  }
  .chip-select b{
    font:700 var(--t-xs)/1 var(--fuente-marca);padding:0 26px 0 13px;
    max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip-select select{
    position:absolute;left:0;right:0;top:50%;width:100%;height:44px;
    transform:translateY(-50%);
    appearance:none;border:0;background:transparent;color:transparent;
    opacity:0;cursor:pointer;font-size:16px;
  }
  .chip-select::after{
    content:"▾";position:absolute;right:10px;pointer-events:none;
    font-size:11px;color:var(--tinta-suave);
  }
  .chip-select:has(select:not([data-vacio="1"])){background:var(--tinta);box-shadow:none;transform:translateY(2px)}
  .chip-select:has(select:not([data-vacio="1"])) b{color:var(--fondo-elevado)}
  .chip-select:has(select:not([data-vacio="1"]))::after{color:var(--fondo-elevado)}
  .chip-select:has(select:focus-visible){box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}

  /* --- El mapa de fondo y la lista encima, igual que en talleres --- */
  #mapa-cines{position:absolute;inset:0}
  /* La cinta de "el mapa está pero sin pines": angosta y arriba, para no tapar
     un mapa que sí sirve para ubicarse. */
  .aviso-mapa{
    position:absolute;left:var(--e-3);right:var(--e-3);top:var(--e-3);z-index:3;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    background:var(--c-cine-suave);color:var(--azul-900);
    border:2.5px solid var(--contorno);border-radius:var(--r-pill);
    box-shadow:var(--repisa-1);padding:8px var(--e-3);
    font-size:var(--t-xs);line-height:1.35;
  }
  .aviso-mapa b{font-family:var(--fuente-marca)}

  /* `loica.css` fija `.vacio svg{width:78px;height:78px}` para las mascotas
     chicas y quietas que tenían todas las páginas. Acá la Cabra es el
     personaje del estado vacío, no un adorno: pedía 118 y se dibujaba a 78.
     Se libera SOLO a ella y solo en este contexto — la regla global sigue
     valiendo para el resto. Bajo 38px `mascota()` dibuja solo la cabeza y la
     caja de cabritas no existe, así que el tamaño acá es contenido. */
  .lista .vacio .masc-cabra{width:118px;height:118px}
  @media(max-width:879px){ .lista .vacio .masc-cabra{width:96px;height:96px} }
  @media(min-width:880px){ .aviso-mapa{right:470px} }
  .panel-lista{
    position:absolute;left:0;right:0;bottom:0;background:var(--fondo-elevado);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    border:2.5px solid var(--contorno);border-bottom:0;
    display:flex;flex-direction:column;z-index:4;
    height:var(--alto-panel,268px);max-height:88%;
    transition:height var(--medio);
  }
  /* El resto del tirador —los 44 px de blanco táctil, el cursor, el
     touch-action, la transición apagada mientras se arrastra, el anillo de
     foco— vive en loica.css §4b junto al mecanismo de la hoja, porque es
     igual en las cuatro páginas con mapa. Acá queda solo lo de esta página:
     el aire de los lados. */
  .tirador{padding:0 var(--e-4);flex:none}
  .barra-tirador{width:44px;height:4.5px;background:var(--borde-fuerte);border-radius:3px;margin:0 auto}
  .conteo{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:var(--t-sm);
    color:var(--tinta-suave);padding:var(--e-1) var(--e-4) var(--e-2)}
  .conteo b{font-family:var(--fuente-marca);font-size:var(--t-lg);color:var(--tinta)}
  .vista{margin-left:auto}
  .nota-geo{flex:1 1 100%;font-size:var(--t-xs);color:var(--tinta-tenue);line-height:1.35}
  .nota-geo:empty{display:none}
  .lista{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    flex:1;min-height:0;padding:0 var(--e-4) var(--e-5)}

  .maplibregl-popup-content{
    font:600 var(--t-sm)/1.4 var(--fuente-ui);color:var(--azul-900);
    border:2px solid var(--azul-900);border-radius:var(--r-md);
    box-shadow:0 3px 0 var(--azul-900);padding:10px 12px;max-width:230px;
  }
  .maplibregl-popup-content a{color:var(--c-cine-tinta);font-weight:800;text-decoration:none}
  .maplibregl-popup-content a:hover{text-decoration:underline}

  /* --- La tarjeta del cine ---
     Fondo pastel de la familia, contorno de tinta y repisa dura: las reglas de
     la casa. La sala es el mueble y las funciones son lo que hay adentro. */
  .cine{
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-lg);box-shadow:var(--repisa-2);
    margin-top:var(--e-3);overflow:hidden;
  }
  .cine.arte{background:var(--c-cine-suave)}
  /* La cabecera es un <button> que ocupa la tarjeta entera: hay que devolverle
     todo lo que el navegador le pone de fábrica (fondo, borde, fuente,
     centrado) o se ve como un botón de formulario adentro de la tarjeta. */
  .cine-cab{
    display:flex;gap:var(--e-2);align-items:flex-start;padding:var(--e-3);
    width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;
    cursor:pointer;border-radius:var(--r-lg) var(--r-lg) 0 0;
  }
  .cine-cab:hover h3{text-decoration:underline;text-decoration-thickness:2px;
    text-underline-offset:3px}
  .cine-cab:focus-visible{outline:3px solid var(--foco);outline-offset:-3px}
  /* La sala elegida se sube al frente: contorno más grueso y una repisa más
     alta. Es el mismo acuse de recibo que da el pin al crecer en el mapa. */
  .cine.elegido{border-width:3.5px;box-shadow:var(--repisa-4)}
  .cine-cab h3{margin:0;font:800 var(--t-md)/1.2 var(--fuente-marca);color:var(--tinta)}
  .cine.arte h3, .cine.arte .cine-donde, .cine.arte .peli-nombre{color:var(--azul-900)}
  .cine-donde{font-size:var(--t-xs);color:var(--tinta-suave);margin-top:2px;line-height:1.35}
  .cine-circuito{
    display:inline-block;margin-top:3px;padding:2px 8px;border-radius:var(--r-pill);
    border:2px solid var(--contorno);background:var(--fondo-hundido);
    font:800 10.5px/1.5 var(--fuente-marca);color:var(--tinta-suave);
    text-transform:uppercase;letter-spacing:.03em;
  }
  .cine.arte .cine-circuito{background:var(--arena-50);color:var(--azul-900)}
  .cine-lejos{
    flex:none;margin-left:auto;align-self:flex-start;
    font:800 var(--t-xs)/1 var(--fuente-marca);color:var(--c-cine-tinta);
    background:var(--fondo-hundido);border:2px solid var(--contorno);
    border-radius:var(--r-pill);padding:5px 8px;white-space:nowrap;
  }
  .cine.arte .cine-lejos{background:var(--arena-50)}

  .peli{padding:var(--e-2) var(--e-3);border-top:2px dashed var(--borde-fuerte)}
  .peli-cab{display:flex;gap:var(--e-2);align-items:center}
  .peli-cab img{
    width:34px;height:50px;object-fit:cover;flex:none;
    border:2px solid var(--contorno);border-radius:var(--r-sm);background:var(--fondo-hundido);
  }
  .peli-nombre{font:800 var(--t-sm)/1.25 var(--fuente-marca);color:var(--tinta)}
  .peli-datos{font-size:var(--t-xs);color:var(--tinta-tenue);margin-top:2px}
  .horas{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--e-2)}
  /* Cada hora es el botón de comprar. Se ve como pastilla y no como texto
     porque es la única acción de la página: apretarla te deja en la boletería
     del cine, no en otra pantalla de Loica. */
  .hora{
    display:inline-flex;align-items:baseline;gap:4px;text-decoration:none;
    border:2px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--fondo-elevado);color:var(--tinta);
    font:800 var(--t-xs)/1 var(--fuente-marca);padding:8px 10px;
    box-shadow:0 2px 0 var(--contorno);transition:var(--rapido);min-height:44px;
  }
  .hora:hover{background:var(--c-cine);color:var(--arena-50)}
  .hora:active{transform:translateY(2px);box-shadow:none}
  .hora:focus-visible{box-shadow:0 2px 0 var(--contorno),0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}
  /* Acá va "2D · Subtitulada": formato e idioma, o sea información de COMPRA,
     no un adorno. Estaba a 9.5px con opacidad .75, que no pasa AA ni por
     tamaño ni por contraste. Sube a 11px y sin opacidad: el color ya es más
     claro que la hora por el `--tinta-suave`, que sí pasa. */
  .hora small{font:700 11px/1 var(--fuente-ui);color:var(--tinta-suave);letter-spacing:.02em}
  .hora:hover small{color:inherit;opacity:.85}

  .sin-cartelera{
    padding:var(--e-2) var(--e-3) var(--e-3);border-top:2px dashed var(--borde-fuerte);
    font-size:var(--t-xs);color:var(--tinta-suave);line-height:1.45;
  }
  .sin-cartelera a{color:var(--c-cine-tinta);font-weight:800}

  /* --- La tarjeta de la película, para la otra vista --- */
  .film{
    display:flex;gap:var(--e-3);background:var(--fondo-elevado);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:var(--repisa-2);margin-top:var(--e-3);padding:var(--e-3);
  }
  .film{align-items:flex-start}
  .film img{
    width:66px;height:98px;object-fit:cover;flex:none;
    border:2px solid var(--contorno);border-radius:var(--r-sm);background:var(--fondo-hundido);
  }
  /* La fila del buscador y el botón "¿qué veo?" comparten el riel: el botón
     va en el espacio que quedaba en blanco a la derecha del campo. En celular
     se apilan. */
  .fila-buscar{display:flex;gap:var(--e-2);align-items:stretch;
    padding:var(--e-2) var(--e-4) var(--e-3)}
  .fila-buscar .caja-buscar{flex:1;min-width:0;margin:0}
  .que-ver{
    flex:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    border:2.5px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--c-cine);color:var(--arena-50);
    font:800 var(--t-sm)/1 var(--fuente-marca);padding:0 var(--e-3);min-height:42px;
    box-shadow:var(--repisa-1);transition:var(--rapido);white-space:nowrap;
  }
  .que-ver:hover{background:var(--c-cine-tinta)}
  .que-ver:active{transform:translateY(3px);box-shadow:none}
  .que-ver:focus-visible{box-shadow:var(--repisa-1),0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}
  .que-ver-masc{display:inline-flex}
  @media(max-width:520px){
    .que-ver-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .que-ver{padding:0 12px}
  }

  /* La Cabra presenta la cartelera: una banda arriba de la lista de películas,
     con la mascota viva a un lado y su invitación. Es el gesto de "yo te
     muestro qué hay", que es literalmente lo que hace la Cabra. */
  .cabra-presenta{
    display:flex;gap:var(--e-3);align-items:center;margin-top:var(--e-3);
    padding:var(--e-3);background:var(--c-cine-suave);color:var(--azul-900);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);box-shadow:var(--repisa-1);
  }
  .cabra-presenta-masc{flex:none}
  .cabra-presenta p{margin:0;font-size:var(--t-sm);line-height:1.4;font-weight:600}

  .film h3{margin:0;font:800 var(--t-md)/1.2 var(--fuente-marca);color:var(--tinta)}
  /* La sinopsis: dos o tres líneas, cortada con elipsis. La vista de películas
     es para decidir, no para leer una ficha entera; quien quiere más va al
     tráiler o al cine. */
  .film-sinopsis{
    margin:var(--e-2) 0 0;font-size:var(--t-xs);line-height:1.45;color:var(--tinta-suave);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .film-trailer{
    display:inline-flex;align-items:center;gap:5px;margin-top:var(--e-2);
    color:var(--c-cine-tinta);font:800 var(--t-xs)/1 var(--fuente-marca);text-decoration:none;
  }
  .film-trailer:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
  .film .peli-datos{margin-bottom:var(--e-2)}
  .film-sala{margin-top:var(--e-2)}
  .film-sala b{display:block;font:700 var(--t-xs)/1.3 var(--fuente-ui);color:var(--tinta-suave)}

  /* --- La tercera vista: el catálogo de la semana ---
     Solo las películas: carátula, de qué se trata y el tráiler. Ni un horario,
     y eso es exactamente el punto. En la vista de películas cada ficha lleva
     debajo las ocho salas donde la dan con sus cuarenta botones de compra, y
     ELEGIR ahí se vuelve tosco: para llegar a la película siguiente hay que
     pasar por encima de la compra de la anterior. Son dos preguntas distintas
     —"qué veo" y "dónde y a qué hora"— y cada una tiene su pantalla; el botón
     de la ficha es el puente.

     La carátula va grande a propósito: en una lista para decidir, el afiche
     hace más trabajo que el título. */
  .ficha{
    display:grid;grid-template-columns:auto minmax(0,1fr);
    gap:var(--e-2) var(--e-3);align-items:start;
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-lg);box-shadow:var(--repisa-2);
    margin-top:var(--e-3);padding:var(--e-3);
  }
  .ficha img{
    width:104px;height:154px;object-fit:cover;
    border:2px solid var(--contorno);border-radius:var(--r-sm);background:var(--fondo-hundido);
  }
  .ficha h3{margin:0;font:800 var(--t-md)/1.2 var(--fuente-marca);color:var(--tinta)}
  /* "Hoy" es el único dato de calendario que sobrevive acá, y se lo gana: dice
     que la película no es una promesa del jueves sino algo que todavía se
     alcanza esta noche. */
  .ficha-hoy{
    flex:none;padding:2px 9px;border-radius:var(--r-pill);
    background:var(--c-cine);color:var(--arena-50);border:2px solid var(--contorno);
    font:800 10.5px/1.5 var(--fuente-marca);text-transform:uppercase;letter-spacing:.03em;
  }
  /* La pastilla comparte línea con la clasificación y la duración: sola se
     comía veintiséis píxeles por tarjeta, y en una lista de treinta y tres
     eso es una pantalla entera de aire. */
  .ficha-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
  .ficha-meta .peli-datos{margin-top:0}
  /* Quién la dirigió, de dónde y de qué año: el dato con que se elige en una
     sala de repertorio, y el único que las cadenas no publican. Va más fuerte
     que la línea de datos porque acá el nombre del director ES el titular. */
  .ficha-credito{
    margin-top:5px;font:700 var(--t-xs)/1.35 var(--fuente-ui);color:var(--tinta-suave);
  }
  .ficha-gens{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

  }
  /* La sinopsis y los botones cruzan las dos columnas: contra la carátula
     quedarían en 200px —treinta caracteres por línea— y una sinopsis no se lee
     en una columna de diario. */
  .ficha-pie{grid-column:1/-1}
  .ficha .film-sinopsis{margin-top:0;-webkit-line-clamp:4}
  .ficha .film-sinopsis.abierta{-webkit-line-clamp:unset;display:block}
  .mas-sinopsis{
    border:0;background:none;padding:4px 0 0;cursor:pointer;
    color:var(--c-cine-tinta);font:800 var(--t-xs)/1 var(--fuente-marca);
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;
  }
  .ficha-acciones{display:flex;flex-wrap:wrap;gap:var(--e-2);align-items:center;margin-top:var(--e-3)}
  .ficha-acciones .film-trailer{margin-top:0}
  /* El puente a los horarios. Va como botón sólido porque es la acción de la
     ficha: el tráiler es para mirar, esto es para seguir. */
  .ficha-donde{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;cursor:pointer;
    border:2px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--fondo-hundido);color:var(--tinta);
    font:800 var(--t-xs)/1 var(--fuente-marca);padding:0 var(--e-3);min-height:40px;
    box-shadow:0 2px 0 var(--contorno);transition:var(--rapido);
  }
  .ficha-donde:hover{background:var(--c-cine);color:var(--arena-50)}
  .ficha-donde:active{transform:translateY(2px);box-shadow:none}
  .ficha-donde:focus-visible{box-shadow:0 2px 0 var(--contorno),0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}
  /* El riel de días se esconde en el catálogo —no hay día que elegir— y en su
     lugar queda escrito qué se está mirando. Un rótulo, no un control. */
  .rango-semana{
    display:inline-flex;align-items:center;flex:none;
    font:800 var(--t-sm)/1 var(--fuente-marca);color:var(--tinta-suave);
  }
  .rango-semana:empty{display:none}
  @media(max-width:400px){

    .ficha-donde{margin-left:0}
  }

  .caja-buscar{display:flex;align-items:center;gap:var(--e-2);
    margin:0 var(--e-3) var(--e-2);padding:0 var(--e-3);
    border:2px solid var(--contorno);border-radius:var(--r-lg);

  .caja-buscar input{flex:1;min-width:0;border:0;background:none;outline:none;
    padding:9px 0;font:inherit;font-size:1rem;color:var(--tinta)}
  /* Safari dibuja su propia crucecita en type=search y quedan dos */
  .caja-buscar input::-webkit-search-cancel-button{display:none}
  .caja-buscar button{border:0;background:none;cursor:pointer;font-size:1.3rem;

  @media(max-width:879px){

      height:auto!important;border-radius:var(--r-lg);max-height:none;transition:none;
      border-bottom:2.5px solid var(--contorno)}

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"

<script>
/* ------------------------------------------------------------------
   Cine: qué dan hoy y en qué sala.

   La página contesta dos preguntas y por eso tiene dos vistas de la MISMA
   lista: "¿qué cine tengo cerca?" (por sala, ordenada por distancia si el
   navegador la da) y "¿dónde dan esta película?" (por película). El mapa es
   la mitad de la respuesta a la primera y por eso está siempre, no detrás de
   un botón.

   Lo que la página promete y cumple: el horario que se aprieta lleva a la
   boletería del cine, no a otra pantalla de Loica. Loica no vende entradas ni
   sabe si quedan.

   Treinta y dos de las cuarenta y cuatro salas salen en el mapa SIN horarios
   —Cineplanet y Cinépolis cierran su cartelera a todo lo que no sea su propia
   app— y eso se dice con todas sus letras en la tarjeta en vez de esconderlo:
   la dirección y el link a su cartelera oficial siguen sirviendo.
   ------------------------------------------------------------------ */
let CINES = [], PELICULAS = [], generado = "", diasCartelera = 4;
let dia = 0;                       // 0 = hoy, 1 = mañana…
let vista = "cines";               // cines | peliculas | catalogo
let cineElegido = "";              // la sala que se apretó en el mapa
let vacioEnPantalla = false;       // para que la Cabra entre una vez y no por tecla
let recienPresenta = false;        // la Cabra presenta con animación solo al abrir la vista
let circuitoFiltro = "", comunaFiltro = "", idiomaFiltro = "";
let busqueda = "";                 // lo que se escribió en el buscador
let miPosicion = null, estadoGeo = "";
let mostrando = 24;

pintarBarra("cine.html");

const T = {
  cines:      {es:"Cines",     en:"Cinemas",  pt:"Cinemas"},
  peliculas:  {es:"Películas", en:"Films",    pt:"Filmes"},
  catalogo:   {es:"Qué ver",   en:"What to watch", pt:"O que ver"},
