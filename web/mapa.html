<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras.
     - `upgrade-insecure-requests` tampoco va, y no es olvido. En GitHub Pages
       no hace nada: el sitio ya se sirve por https y github.io está en la
       lista de precarga HSTS, así que no queda ninguna petición http que
       subir. Y en el servidor de desarrollo (`python3 -m http.server 8777`)
       abierto desde el celular por la IP de la red —http://192.168.x.x:8777—
       la directiva subía loica.js, loica.css y eventos.json a un https:// que
       no existe: el script moría en la primera línea (`pintarBarra is not
       defined`) y la página quedaba sin estilos, sin lista y sin mapa. Ese
       era "en celular el mapa no funciona". En el Mac no se notaba porque
       Chrome exime a localhost de la subida; Safari ni eso. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; worker-src blob:; connect-src 'self' https://*.basemaps.cartocdn.com https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mapa — ¿Qué hay hoy en Santiago?</title>
<meta name="description" content="Todos los panoramas de Santiago en un mapa. Filtra por gratis, hoy, mañana o este fin de semana.">
<link rel="canonical" href="https://loicasantiago.cl/mapa.html">
<meta property="og:title" content="Loica — ¿Qué hay hoy en Santiago?">
<meta property="og:description" content="Panoramas gratis y de los otros, en un mapa. Fiestas, teatro, ferias, clases y conciertos de Santiago de Chile.">
<meta property="og:image" content="https://loicasantiago.cl/og-default.png">
<meta property="og:url" content="https://loicasantiago.cl/mapa.html">
<meta property="og:site_name" content="Loica">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- `integrity` no es adorno: unpkg sirve lo que el paquete tenga publicado, y
     una versión republicada o un unpkg comprometido inyectaría JavaScript en
     la página con todo el dominio a su disposición. Con el hash, el navegador
     compara antes de ejecutar y si no calza no carga nada. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V"
      crossorigin="anonymous">
<link rel="stylesheet" href="loica.css?v=23">
<style>
  html,body{height:100%;overflow:hidden}
  /* Los dos altos van en este orden a proposito: `dvh` no existe en
     Safari de iOS anterior a 15.4 ni en Chrome anterior a 108, y ahi la
     declaracion se descarta entera. Sin el 100vh de respaldo el alto
     quedaba en `auto` y la pagina —que es una app de alto fijo con
     scroll interno— se desarmaba: la lista crecia sin fin y la barra de
     abajo se iba de la pantalla. */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:none;z-index:6}
  main{flex:1;position:relative;min-height:0}
  #mapa{position:absolute;inset:0;background:var(--fondo-hundido)}

  /* Los botones de zoom de MapLibre vienen en 29px. Con el dedo eso es la
     mitad de lo que pide el pulgar, y acercar el mapa es de las tres cosas
     que más se hacen en esta página. El `no-repeat` no es adorno: el ícono
     es una imagen de fondo y sin él `background-size` la MOSAICA — quedaban
     cuatro lupas apiladas en cada botón. */
  @media (pointer:coarse){
    .maplibregl-ctrl-group button{width:44px;height:44px}
    .maplibregl-ctrl-group button .maplibregl-ctrl-icon{
      background-size:22px 22px;background-repeat:no-repeat;background-position:center;
    }
  }

  /* Los botones de zoom en el lenguaje del sitio: contorno y repisa. El fondo
     va en crema FIJO también de noche: los íconos de MapLibre son negros y
     sobre el panel oscuro desaparecían. En celular no van: se pellizca, y cada
     píxel de mapa cuenta. */
  .maplibregl-ctrl-group{background:var(--arena-50)!important;border:2px solid var(--contorno);
    border-radius:var(--r-md);box-shadow:var(--repisa-1)!important}
  .maplibregl-ctrl-group button+button{border-top:2px solid var(--arena-300)!important}
  @media(max-width:879px){.maplibregl-ctrl-top-left{display:none}}

  /* La atribución de OSM y CARTO sube al borde superior en celular.
     MapLibre la deja abajo a la derecha, que es justo donde viven el panel
     de la lista y la barra de destinos: el crédito quedaba dibujado a 778px
     de una pantalla de 812, con las dos capas encima. No se mostraba nunca,
     y las dos licencias lo piden a la vista.
     Se mueve el RINCÓN y no se crea otro control: el control interno es el
     único que recibe el `styledata` de arranque y por lo tanto el único que
     llega a saber qué dicen las fuentes del estilo. */
  @media(max-width:879px){
    .maplibregl-ctrl-bottom-right{top:0;bottom:auto}
    .maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:8px 8px 0 0}
  }

  /* --- Cabecera: dos rieles y no tres ---
     La fecha es una pregunta de una sola respuesta, así que va en un control
     segmentado (compacto, se ve entero, no se puede elegir dos). Todo lo
     demás son chips que sí se combinan. Antes las dos filas de chips se
     comían 100px de mapa en un celular de 812px. */
  .riel-fecha{
    display:flex;gap:5px;padding:var(--e-2) var(--e-4);background:var(--fondo-elevado);
    overflow-x:auto;scrollbar-width:none;
  }
  .riel-fecha::-webkit-scrollbar{display:none}
  .segmentado{
    display:inline-flex;gap:3px;padding:3px;flex:none;
    background:var(--fondo-hundido);border:2.5px solid var(--contorno);
    border-radius:var(--r-pill);box-shadow:var(--repisa-1);
  }
  .segmentado button{
    flex:none;border:0;background:transparent;color:var(--tinta-suave);cursor:pointer;
    padding:0 var(--e-4);min-height:36px;border-radius:var(--r-pill);
    font:800 var(--t-sm)/1 var(--fuente-marca);white-space:nowrap;transition:var(--rapido);
  }
  .segmentado button:hover{color:var(--tinta)}
  .segmentado button[aria-pressed="true"]{
    background:var(--acento-solido);color:var(--acento-contraste);
  }
  .cuenta-rango{
    display:flex;align-items:center;gap:5px;flex:none;margin-left:auto;padding-left:var(--e-3);
    font-size:var(--t-xs);font-weight:700;color:var(--tinta-tenue);white-space:nowrap;
  }

  /* --- El buscador, dentro del riel de fechas ---
     Va acá y no en una tercera banda: es donde lo pidió el dueño y además una
     banda más convierte la cabecera en un formulario.

     El problema real es el ancho. A 360px el riel deja 336px útiles y el
     segmentado de fechas ya mide 288: el campo entero no cabe al lado. Se
     resuelve con una lupa de 44px y el campo plegado; al tocarla, la fila
     completa pasa a ser el campo y las fechas se esconden mientras escribes.

     La lupa va PEGADA al borde derecho con `sticky` y no simplemente al final
     del riel: el riel se desplaza de lado, así que sin eso la lupa se iba con
     el desplazamiento y quedaba fuera de la pantalla justo cuando el riel está
     lleno, que es exactamente cuando hace falta. */
  .buscador{
    position:sticky;right:0;flex:none;display:flex;align-items:center;
    margin-left:auto;background:var(--fondo-elevado);padding-left:7px;
  }
  /* El filo de tinta que separa la lupa de las fechas que le pasan por debajo.
     Mismo recurso que `.separa-chips`: línea dura, cero desenfoque. */
  .buscador::before{
    content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;
    background:var(--borde-fuerte);border-radius:2px;
  }
  .lupa{
    flex:none;width:44px;height:38px;display:grid;place-items:center;
    border:2px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--fondo-elevado);color:var(--tinta);cursor:pointer;
    box-shadow:0 2px 0 var(--contorno);transition:var(--rapido);
  }
  .lupa svg{width:20px;height:20px}
  .lupa:active{transform:translateY(2px);box-shadow:none}
  /* Con el campo plegado y una palabra escrita, la lupa queda RELLENA. Si no,
     la búsqueda seguiría filtrando la pantalla sin nada en la cabecera que lo
     delate, que es el mismo problema que esta auditoría vino a arreglar. */
  .lupa.activo{
    background:var(--tinta);color:var(--fondo-elevado);
    transform:translateY(2px);box-shadow:none;
  }
  .campo-buscar{
    display:none;align-items:center;gap:4px;flex:1;min-width:0;height:38px;
    padding:0 5px 0 10px;border:2px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--fondo-elevado);box-shadow:0 2px 0 var(--contorno);
  }
  .campo-buscar > svg{width:18px;height:18px;flex:none;color:var(--tinta-tenue)}
  /* 16px y no --t-base: bajo 16px Safari de iOS hace zoom solo al enfocar el
     campo y deja la página corrida (la misma razón está escrita en loica.css
     para los formularios). */
  .campo-buscar input{
    flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--tinta);
    font:600 16px/1 var(--fuente-ui);padding:0;
  }
  .campo-buscar input::placeholder{color:var(--tinta-tenue);font-weight:500}
  .campo-buscar input:focus{outline:none}
  /* WebKit dibuja su propia ✕ dentro de los input[type=search] y quedaban dos,
     una al lado de la otra, haciendo cosas parecidas pero no iguales. */
  .campo-buscar input::-webkit-search-cancel-button{display:none}
  /* El anillo de foco se pinta en la CÁPSULA: el <input> no tiene borde propio
     y el anillo quedaba dibujado por dentro, escondido bajo el contorno. */
  .campo-buscar:focus-within{box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}
  .borra-buscar{
    flex:none;width:34px;height:34px;border-radius:var(--r-pill);border:0;
    background:transparent;color:var(--tinta-suave);font-size:17px;line-height:1;
    cursor:pointer;display:grid;place-items:center;
  }
  .borra-buscar[hidden]{display:none}
  .borra-buscar:hover{background:var(--fondo-hundido);color:var(--tinta)}
  @media (pointer:coarse){
    .lupa,.borra-buscar{position:relative}
    .lupa::before,.borra-buscar::before{
      content:"";position:absolute;left:-5px;right:-5px;top:50%;
      height:44px;transform:translateY(-50%);
    }
  }

  /* Modo búsqueda en celular: la fila entera se la lleva el campo. Las fechas
     vuelven al cerrar y la palabra NO se borra al cerrar — por eso la lupa
     queda rellena: el filtro sigue puesto y tiene que verse. */
  .riel-fecha.buscando .segmentado{display:none}
  .riel-fecha.buscando .lupa{display:none}
  .riel-fecha.buscando .campo-buscar{display:flex}
  .riel-fecha.buscando .buscador{position:static;flex:1;margin-left:0;padding-left:0}
  .riel-fecha.buscando .buscador::before{display:none}

  /* Desde 560px el campo cabe siempre junto a las fechas: no hay nada que
     plegar, así que la lupa sobra y el campo se queda abierto. */
  @media(min-width:560px){
    .riel-fecha .segmentado{display:inline-flex}
    .buscador{position:static;flex:1 1 auto;max-width:330px;
      margin-left:var(--e-3);padding-left:0}
    .buscador::before{display:none}
    .lupa{display:none}
    .campo-buscar{display:flex}
  }

  header .filtros{padding:var(--e-2) var(--e-4) var(--e-3);border-bottom:2.5px solid var(--contorno)}
  /* UN chip para las dos filas (cabecera y afinar): 40 px de alto, repisa de 3
     como el resto del sitio. Antes había cuatro alturas en la misma pantalla
     (34, 36, 38 y 42) y dos repisas, que se leían como cuatro componentes. */
  header .filtros .chip,.afinar .chip{padding:6px 13px 6px 8px;gap:5px;font-size:var(--t-xs);
    border-width:2px;box-shadow:var(--repisa-1);min-height:40px}
  header .filtros .chip svg{width:22px;height:22px}
  header .filtros .chip:active,.afinar .chip:active,
  header .filtros .chip[aria-pressed="true"],
  .afinar .chip[aria-pressed="true"]{transform:translateY(3px);box-shadow:none}
  /* El anillo de foco de loica.css se apila sobre la repisa; el selector de
     acá es más específico y la pisaba. Se repone; el chip prendido está
     hundido y no tiene repisa, solo anillo. */
  header .filtros .chip:focus-visible,.afinar .chip:focus-visible{
    box-shadow:var(--repisa-1),0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  header .filtros .chip[aria-pressed="true"]:focus-visible,
  .afinar .chip[aria-pressed="true"]:focus-visible{
    box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  /* El separador entre "precio y público" y "tipo de panorama": son dos
     preguntas distintas metidas en un solo riel para ahorrar alto. */
  .separa-chips{flex:none;width:2px;background:var(--borde-fuerte);margin:4px 3px;border-radius:2px}

  /* La Loica que vuela: guía, no adorno. Nunca tapa un dato. */
  #loica-vuelo{
    position:absolute;top:0;left:0;width:56px;height:56px;z-index:5;
    pointer-events:none;opacity:0;offset-rotate:auto;offset-distance:0%;
    will-change:offset-distance,opacity;
  }
  #loica-vuelo.vuela{animation:loica-vuela var(--dur-vuelo,700ms) cubic-bezier(.3,0,.25,1) forwards}
  @keyframes loica-vuela{
    0%{opacity:0;offset-distance:0%} 12%{opacity:1}
    88%{opacity:1} 100%{opacity:0;offset-distance:100%}
  }
  @media(prefers-reduced-motion:reduce){#loica-vuelo{display:none}}

  .conteo b{display:inline-block}
  .conteo b.pop{animation:pop var(--rebote)}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* --- Panel inferior: tres alturas y arrastre real --- */
  .panel-lista{
    position:absolute;left:0;right:0;bottom:0;background:var(--fondo-elevado);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    border:2.5px solid var(--contorno);border-bottom:0;
    display:flex;flex-direction:column;z-index:4;
    height:var(--alto-panel,268px);max-height:88%;
    transition:height var(--medio);
  }
  .panel-lista.arrastrando{transition:none}
  .panel-lista.oculto{transform:translateY(104%);pointer-events:none}
  /* touch-action:none va SOLO en el tirador. Cuando estaba en el panel
     entero, el navegador cancelaba el gesto de scroll de la lista: 37.000px
     de eventos en una caja de 200px que no se podía mover con el dedo. Ese
     era el "no funciona en celular". */
  .tirador{padding:12px var(--e-4) 10px;cursor:grab;flex:none;touch-action:none}
  .tirador:active{cursor:grabbing}
  /* Pastilla de tinta de 52×7 (§7.5): la rayita gris de 44×4,5 no se veía
     como algo que se agarra. */
  .barra-tirador{width:52px;height:7px;background:var(--tinta);border-radius:4px;margin:0 auto}
  /* Quién atiende: la carita de la categoría puesta (o la Loica, sin filtro)
     al lado del número. Es la misma señalética de los chips a 30 px dentro
     de un disco, y contesta "¿qué estoy mirando?" sin leer la línea de
     estado. Uno a la vez: el del filtro puesto. */
  .conteo{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;
    font-size:var(--t-sm);color:var(--tinta-suave);padding:var(--e-1) var(--e-4) var(--e-2)}
  .conteo .atiende{grid-row:1/3;display:grid;place-items:center;width:40px;height:40px;
    border-radius:50%;background:var(--fondo-hundido);border:2px solid var(--contorno)}
  .conteo .atiende svg{width:30px;height:30px}
  .conteo .conteo-num{display:flex;align-items:baseline;gap:6px}
  .conteo b{font-family:var(--fuente-marca);font-size:var(--t-lg);color:var(--tinta)}
  /* La línea de estado: POR QUÉ ves 12 eventos.
     Con seis filtros combinables, quien vuelve a la pestaña al otro día no
     tiene cómo saber que quedaron puestos "Hoy + Gratis + Deporte". Va pegada
     al número y no en la cabecera —que era donde la pedía el encargo— porque
     la pregunta la hace el número y la respuesta tiene que estar donde está la
     pregunta; y porque en un teléfono de 760px la cabecera ya se lleva 140 y
     una tercera banda es justo lo que este archivo viene evitando desde
     arriba. Se ve en los dos modos: el contador es lo primero del panel tanto
     en la hoja de celular como en la columna de escritorio.
     Dos líneas de tope: con todo puesto son siete etiquetas y no puede empujar
     la lista fuera de la pantalla. */
  .conteo-estado{
    flex:1 1 100%;font-size:var(--t-xs);line-height:1.35;color:var(--tinta-tenue);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .conteo-estado:empty{display:none}

  /* --- Afinar: subcategorías y tamaño, dentro del panel ---
     Bajo el contador, que es donde los pidió el dueño y donde corresponde: la
     cabecera ya tiene dos rieles. Cada fila se desplaza de lado en vez de
     envolver: música tiene nueve géneros y apilados le comían al panel las dos
     tarjetas que alcanza a mostrar en reposo. */
  .afinar{flex:none;border-bottom:1px solid var(--borde)}
  .afinar-fila{display:flex;align-items:center;gap:6px;
    padding:4px var(--e-4) 6px;overflow-x:auto;scrollbar-width:none}
  .afinar-fila::-webkit-scrollbar{display:none}
  .afinar-et{flex:none;font-size:var(--t-xs);font-weight:800;color:var(--tinta-tenue);
    text-transform:uppercase;letter-spacing:.05em}
  /* Los chips de afinar comparten la regla de la cabecera (ver arriba). */
  /* El número va más apagado que el nombre, pero no tanto como para perderse:
     a .72 da 5,3:1 sobre el chip apagado y 7,4:1 sobre el relleno del activo,
     en claro y en oscuro. */
  .afinar .cuenta{opacity:.72;font-variant-numeric:tabular-nums}
  .afinar-nota{margin:0;padding:0 var(--e-4) 7px;font-size:var(--t-xs);
    color:var(--tinta-tenue);font-style:italic;line-height:1.3}

  .lista{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
  .fin-lista{padding:var(--e-4);text-align:center;color:var(--tinta-tenue);font-size:var(--t-xs)}

  .ficha{
    position:absolute;inset:auto 0 0 0;background:var(--fondo-elevado);z-index:8;
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    border:2.5px solid var(--contorno);border-bottom:0;
    transform:translateY(103%);transition:transform var(--medio);
    max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;
  }
  .ficha.visible{transform:translateY(0)}
  .ficha.cambiando .ficha-scroll{animation:entra-ficha var(--medio)}
  @keyframes entra-ficha{from{opacity:.3;transform:translateX(var(--desde,14px))}to{opacity:1;transform:none}}
  .ficha-scroll{overflow-y:auto;flex:1;min-height:0}

  /* --- La barra de avanzar: el arreglo del pedido ---
     Antes, para ver el evento de al lado había que cerrar con la X, buscar
     dónde había quedado la lista y tocar el siguiente. Ahora los dos
     vecinos están siempre en pantalla y también responden a swipe y a las
     flechas del teclado. */
  .ficha-nav{
    flex:none;display:flex;align-items:center;gap:var(--e-2);
    padding:var(--e-2) var(--e-3);background:var(--fondo-elevado);
    border-bottom:2px solid var(--borde);border-radius:var(--r-xl) var(--r-xl) 0 0;
  }
  /* 44 y no 40: anterior, siguiente y cerrar son los tres botones que más se
     aprietan seguidos en la ficha, y acá el alto no le quita nada al mapa
     —la ficha es una capa encima. */
  .nav-ev{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    min-height:44px;padding:0 var(--e-3);border-radius:var(--r-pill);
    border:2px solid var(--contorno);background:var(--fondo-elevado);color:var(--tinta);
    font:800 var(--t-sm)/1 var(--fuente-marca);cursor:pointer;box-shadow:0 2px 0 var(--contorno);
    transition:var(--rapido);
  }
  .nav-ev:hover:not(:disabled){background:var(--fondo-hundido)}
  .nav-ev:active:not(:disabled){transform:translateY(2px);box-shadow:none}
  .nav-ev:disabled{opacity:.34;cursor:default;box-shadow:none}
  .nav-ev svg{width:16px;height:16px}
  .ficha-pos{
    flex:1;text-align:center;font-size:var(--t-xs);font-weight:700;
    color:var(--tinta-tenue);font-variant-numeric:tabular-nums;
  }
  .cerrar-ficha{
    flex:none;width:44px;height:44px;border-radius:var(--r-pill);
    border:2px solid var(--contorno);background:var(--fondo-elevado);color:var(--tinta);
    font-size:19px;line-height:1;cursor:pointer;box-shadow:0 2px 0 var(--contorno);
  }
  .cerrar-ficha:active{transform:translateY(2px);box-shadow:none}

  .ficha-foto{height:158px;background:var(--fondo-hundido);position:relative;overflow:hidden}
  .ficha-foto img{width:100%;height:100%;object-fit:cover}
  .ficha-cuerpo{padding:var(--e-4) var(--e-5) var(--e-6)}
  .ficha h2{margin:var(--e-1) 0 var(--e-3)}
  .dato{display:flex;gap:var(--e-3);padding:9px 0;border-top:1px solid var(--borde);font-size:var(--t-base)}
  .dato .et{color:var(--tinta-tenue);width:82px;flex:none;font-size:var(--t-sm);font-weight:600}
  .aprox{font-size:var(--t-xs);color:var(--tinta-tenue);font-style:italic}
  .fuente-pie{margin-top:var(--e-3);font-size:var(--t-xs);color:var(--tinta-tenue);text-align:center}

  /* display:flex le gana a [hidden] del navegador, así que la pastilla vacía
     quedaba flotando sobre el mapa siempre. Se veía como un bug y lo era. */
  .aviso[hidden]{display:none}
  .aviso{
    position:absolute;top:var(--e-3);left:50%;transform:translateX(-50%);z-index:7;
    background:var(--fondo-elevado);border:2px solid var(--contorno);border-radius:var(--r-full);
    padding:8px var(--e-4);font-size:var(--t-sm);font-weight:600;box-shadow:var(--repisa-2);
    display:flex;align-items:center;gap:7px;max-width:calc(100% - var(--e-8));
  }

  /* En celular la cabecera compite con el mapa por cada píxel: tres bandas
     de controles se comían el 21% de la pantalla. Acá se aprieta todo lo que
     se puede sin bajar de 44px de área táctil en los chips. */
  @media(max-width:879px){
    .panel-lista{bottom:var(--hueco-nav)}
    .ficha{bottom:var(--hueco-nav)}
    .barra{padding:7px var(--e-3)}
    .logo svg{width:30px;height:30px}
    .logo b{font-size:19px}
    .riel-fecha{padding:5px var(--e-3)}
    .segmentado{padding:2px}
    .segmentado button{min-height:36px;padding:0 var(--e-3)}
    header .filtros{padding:5px var(--e-3) 8px}
    .cuenta-rango{display:none}
  }
  /* Teléfono acostado. Los 150px de cabecera que en vertical son el 18% de la
     pantalla acá son el 40%, y entre eso, el panel y la barra de abajo no
     quedaba un solo píxel de mapa. Se aprieta todo lo que se puede sin bajar
     de 32px de área táctil, que con el pulgar de lado alcanza. */
  @media(max-width:879px) and (max-height:460px){
    .barra{padding:3px var(--e-3)}
    .logo svg{width:24px;height:24px}
    .logo b{font-size:16px}
    .riel-fecha{padding:3px var(--e-3)}
    .segmentado{padding:2px}
    .segmentado button{min-height:30px;font-size:var(--t-xs)}
    header .filtros{padding:3px var(--e-3) 4px}
    header .filtros .chip{min-height:32px}
    header .filtros .chip svg{width:18px;height:18px}

    /* Acostado el panel se va AL COSTADO, que es lo que ya hace el escritorio.
       Apretar la cabecera no alcanzaba: entre ella, el panel y la barra de
       abajo el mapa quedaba en 55px de alto. De lado sobra ancho (667) y
       falta alto (375), así que la lista se lleva una columna y el mapa se
       queda con los otros dos tercios, enteros y de arriba abajo. */
    .panel-lista{
      left:auto;right:0;top:0;bottom:var(--hueco-nav);width:44%;max-width:320px;
      height:auto;max-height:none;border-radius:var(--r-xl) 0 0 0;
      border-right:0;transition:none;
    }
    .tirador{display:none}
    .conteo{padding-top:var(--e-3)}
    .ficha{
      left:auto;right:0;top:0;bottom:var(--hueco-nav);width:44%;max-width:320px;
      max-height:none;border-radius:var(--r-xl) 0 0 0;border-right:0;
    }
    .ficha-nav{border-radius:var(--r-xl) 0 0 0}
    /* En columna la lista y la ficha entran y salen POR EL COSTADO. Con el
       translateY de vertical se iban hacia abajo, que en esta disposición se
       lee como que la lista se cae de la pantalla. */
    .panel-lista.oculto{transform:translateX(104%)}
    .ficha{transform:translateX(103%)}
    .ficha.visible{transform:translateX(0)}
  }
  @media(min-width:880px){
    .panel-lista{left:auto;right:var(--e-4);top:var(--e-4);bottom:var(--e-4);width:410px;
      height:auto!important;border-radius:var(--r-lg);max-height:none;transition:none}
    .tirador{display:none}
    .conteo{padding-top:var(--e-3)}
    .ficha{left:auto;right:var(--e-4);bottom:var(--e-4);width:410px;
      border-radius:var(--r-lg);max-height:82%}
    .ficha-nav{border-radius:var(--r-lg) var(--r-lg) 0 0}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="barra" id="barra"></div>
    <div class="riel-fecha" id="riel-fecha">
      <div class="segmentado" id="fechas" role="group"></div>
      <span class="cuenta-rango" id="cuenta-rango"></span>
      <!-- El buscador va acá, a la altura de Hoy/Mañana/7 días/Finde. En
           celular arranca plegado en la lupa; desde 560px el campo está
           siempre abierto (ver el bloque .buscador en el <style>). -->
      <div class="buscador">
        <button type="button" class="lupa" id="lupa"></button>
        <div class="campo-buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>
          <input type="search" id="buscar" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false">
          <button type="button" class="borra-buscar" id="borra-buscar" hidden>✕</button>
        </div>
      </div>
    </div>
    <div class="filtros" id="filtros" role="group"></div>
  </header>

  <main>
    <div id="mapa"></div>
    <div id="loica-vuelo" aria-hidden="true"></div>
    <div class="aviso" id="aviso" hidden></div>

    <section class="panel-lista" id="panel" aria-label="Lista de eventos">
      <div class="tirador" id="tirador" role="button" tabindex="0"
           aria-label="Arrastra para ver más eventos"><div class="barra-tirador"></div></div>
      <div class="conteo">
        <span class="atiende" id="atiende" aria-hidden="true"></span>
        <div class="conteo-num"><b id="conteo">…</b> <span id="conteo-txt">eventos</span></div>
        <span class="conteo-estado" id="conteo-estado"></span></div>
      <div class="afinar" id="afinar"></div>
      <div class="lista" id="lista"></div>
    </section>

    <article class="ficha" id="ficha" aria-live="polite"></article>
  </main>
</div>
<nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj"
        crossorigin="anonymous"></script>
<script src="loica.js?v=23"></script>
<script>
let EVENTOS = [], filtroCat = null, soloGratis = false, cuando = "todo", publicoFiltro = null;
let busqueda = "", filtroSub = null;
let listaActual = [], seleccionado = null, mapa = null, hayMapa = false;

pintarBarra("mapa.html");

/* Teselas CARTO en vez de OpenStreetMap crudo: el estilo por defecto de OSM
   mete más de 25 íconos propios en pantalla y el producto pierde contra su
   propio fondo. Además hay versión oscura, y la marca dice que el modo oscuro
   es de primera clase porque la app se usa de noche. */
const TESELAS = {
  claro:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",
  claroEtiquetas:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
  oscuro:"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
  oscuroEtiquetas:"https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",
};
// Las teselas siguen al tema elegido y NADA más. Antes miraban también el
// `prefers-color-scheme` del aparato, y desde que el sitio arranca claro por
// defecto eso dejaba el mapa negro dentro de una página crema.
const esOscuro = () => document.documentElement.dataset.tema === "oscuro";

const urlesTeselas = clave => ["a","b","c"].map(s =>
  TESELAS[clave].replace("{s}", s).replace("{r}", devicePixelRatio > 1.5 ? "@2x" : ""));

function estiloMapa(){
  const t = esOscuro() ? ["oscuro","oscuroEtiquetas"] : ["claro","claroEtiquetas"];
  return {version:8,
    sources:{
      base:{type:"raster", tiles:urlesTeselas(t[0]), tileSize:256,
            attribution:'© OpenStreetMap © CARTO'},
      etiquetas:{type:"raster", tiles:urlesTeselas(t[1]), tileSize:256},
    },
    layers:[{id:"base",type:"raster",source:"base"},
            {id:"etiquetas",type:"raster",source:"etiquetas"}]};
}

/* El mapa se crea desde el ARRANQUE, después de pintar la cabecera, y no al
   cargar el script. MapLibre mide el contenedor al nacer: si nace con la
   cabecera a medio pintar (58 px) y después la cabecera crece a 150, el
   primer cuadro de teselas queda calculado para el tamaño viejo y en celular
   quedaba una banda crema de ~60 px bajo los filtros, que un resize() no
   borraba. Con la cabecera lista antes, nace del tamaño definitivo.

   Si el aparato no tiene WebGL, MapLibre tira una excepción y antes se caía
   la página entera: quedaba una pantalla en blanco sin lista y sin
   explicación. Pasa en iPhone viejos y con la aceleración por hardware
   apagada. Ahora la lista sigue siendo un producto completo. */
function crearMapa(){
try{
  mapa = new maplibregl.Map({
    container:"mapa", style:estiloMapa(),
    center:[-70.645,-33.437], zoom:12.2, attributionControl:{compact:true}
  });
  hayMapa = true;
}catch(e){
  document.getElementById("mapa").innerHTML =
    `<div class="vacio" style="padding-top:var(--e-12)">${cuerpo("loica","var(--acento)",96,{pose:"durmiendo"})}
     <p><b>Este navegador no puede dibujar el mapa</b><br>
     La lista de abajo funciona igual.</p></div>`;
  return;
}
{
  mapa.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-left");

  // El mapa nace antes de que su caja tenga tamaño final. Se compara el
  // tamaño anterior porque redimensionar vuelve a disparar al observador.
  (() => {
    const caja = document.getElementById("mapa");
    let ancho = 0, alto = 0;
    new ResizeObserver(() => {
      if(caja.clientWidth === ancho && caja.clientHeight === alto) return;
      ancho = caja.clientWidth; alto = caja.clientHeight;
      mapa.resize();
    }).observe(caja);
  })();

  mapa.on("error", e => {
    if(String(e.error?.message || "").match(/tile|fetch|network/i))
      avisar(IDIOMA === "en" ? "Map is loading slowly — the list still works"
           : IDIOMA === "pt" ? "O mapa está lento — a lista continua funcionando"
           : "El mapa va lento — la lista igual funciona");
  });
  montarEventosDelMapa();
}
}

function avisar(texto, quien = "loica"){
  const caja = document.getElementById("aviso");
  caja.innerHTML = `${carita(quien,"var(--acento)",22)} <span>${escapar(texto)}</span>`;
  caja.hidden = false;
}

/* ============================================================
   PINES: capa de símbolos, un pin-animal por evento, no 288 divs
   ------------------------------------------------------------
   Antes cada evento era un <div> con un SVG adentro. 288 marcadores DOM
   sobre un canvas WebGL significan 288 elementos reposicionados en cada
   cuadro mientras arrastras: en celular el mapa se movía a tirones. Ahora
   los pines viven dentro del motor del mapa.

   Sin agrupación, a propósito: cada evento es SIEMPRE su propio pin,
   aunque en el centro se encimen (icon-allow-overlap). Al filtrar,
   refrescar() manda la lista nueva con setData() y los pines filtrados
   desaparecen. Para que el traslape de lejos moleste menos, el pin crece
   con el zoom, y los gratis se dibujan encima del resto.

   Los íconos se dibujan a canvas la primera vez que el mapa los pide
   (`styleimagemissing`), así que solo se generan los que de verdad se ven.
   ============================================================ */
const ESCALA_PIN = 2;

function svgAImagen(svg, ancho, alto){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const lienzo = document.createElement("canvas");
      lienzo.width = ancho * ESCALA_PIN; lienzo.height = alto * ESCALA_PIN;
      const ctx = lienzo.getContext("2d");
      ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
      resolve(ctx.getImageData(0, 0, lienzo.width, lienzo.height));
    };
    img.onerror = () => resolve(null);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

/* El disco interior del pin es crema SIEMPRE (también de noche), así que acá
   la tinta va fija en azul: si usara var(--contorno), en modo oscuro sería
   crema sobre crema y la carita perdería el contorno. */
const TINTA_PIN = "#1E2A4A";

function svgPin(clave, gratis){
  const info = CATEGORIAS[clave] || CATEGORIAS.otros;
  const tono = gratis ? "#0E8757" : info.hex;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 42" width="34" height="42">
    <path d="M17 1C8.7 1 2 7.7 2 16c0 10.5 12.6 23 14.1 24.4.5.5 1.3.5 1.8 0C19.4 39 32 26.5 32 16 32 7.7 25.3 1 17 1z"
          fill="${tono}" stroke="${TINTA_PIN}" stroke-width="2.5"/>
    <circle cx="17" cy="15.6" r="11" fill="#FAF3E7"/>
    <g transform="translate(4.4 3)scale(1.05)">${CARITAS[info.mascota](tono, TINTA_PIN, "posada", true)}</g>
  </svg>`;
}

function datosGeo(lista){
  return {type:"FeatureCollection", features: lista
    .filter(ev => ev.lat != null)
    .map(ev => ({type:"Feature",
      geometry:{type:"Point", coordinates:[ev.lon, ev.lat]},
      properties:{id:ev.id, cat:CATEGORIAS[ev.categoria] ? ev.categoria : "otros",
                  gratis:!!ev.gratis}}))};
}

function montarCapas(){
  if(!hayMapa || mapa.getSource("eventos")) return;
  mapa.addSource("eventos", {type:"geojson", data:datosGeo(listaActual)});
  mapa.addLayer({
    id:"pines", type:"symbol", source:"eventos",
    layout:{
      "icon-image":["concat","pin-",["get","cat"],["case",["get","gratis"],"-g",""]],
      // De lejos chico, de cerca pleno. Antes iba de .4 a .55 sobre un
      // dibujo de 34×42: un pin de 15 px con una carita de 11 que no se leía
      // (la dirección visual pide 28 px de carita). Ahora al zoom inicial el
      // pin mide ~25 px y la carita ~19, y desde el zoom 15 la carita llega a
      // los 28 del contrato. El traslape del centro a zoom bajo se ordena
      // con symbol-sort-key: gratis encima.
      "icon-size":["interpolate",["linear"],["zoom"],11,.62,13,.85,15,1.05,17,1.2],
      "icon-anchor":"bottom",
      "icon-allow-overlap":true, "icon-ignore-placement":true,
      // Con allow-overlap, la clave más alta se dibuja encima: gratis gana
      "symbol-sort-key":["case",["get","gratis"],1,0],
    },
  });
  // El toque sobre un pin se resuelve en el manejador general del mapa (al
  // final del archivo), con una caja de tolerancia alrededor del dedo.
  mapa.on("mouseenter", "pines", () => mapa.getCanvas().style.cursor = "pointer");
  mapa.on("mouseleave", "pines", () => mapa.getCanvas().style.cursor = "");
}

function montarEventosDelMapa(){
  mapa.on("styleimagemissing", async e => {
    const m = e.id.match(/^pin-([a-z_]+)(-g)?$/);
    if(!m || mapa.hasImage(e.id)) return;
    const datos = await svgAImagen(svgPin(m[1], !!m[2]), 34, 42);
    if(datos && !mapa.hasImage(e.id)) mapa.addImage(e.id, datos, {pixelRatio:ESCALA_PIN});
  });
  mapa.on("load", montarCapas);
  // Cambiar de tema reconstruye el estilo y con él se van fuentes y capas
  mapa.on("styledata", () => { if(!mapa.getSource("eventos")) montarCapas(); });
  new MutationObserver(() => mapa.setStyle(estiloMapa()))
    .observe(document.documentElement, {attributes:true, attributeFilter:["data-tema"]});
}

/* ---------- FILTROS ----------

   El orden de la lista NO es el del archivo. `eventos.json` viene ordenado por
   fecha de inicio, que es lo correcto para "Todos" y lo peor posible para
   "Hoy": una muestra que abrió en abril de 2025 tiene una fecha de inicio muy
   anterior a la del concierto de esta noche, así que encabezaba la lista y lo
   que de verdad pasa hoy quedaba enterrado treinta tarjetas más abajo. Con
   Arte apretado, las 36 temporadas iban antes que los 4 eventos del día.

   Así que lo que ya está corriendo va al final: primero lo que EMPIEZA dentro
   del rango, en orden de hora, y después lo que se puede ir a ver igual. */
const ordenarParaLeer = lista => lista.slice().sort((a, b) =>
  (enCartelera(a) ? 1 : 0) - (enCartelera(b) ? 1 : 0)
  || new Date(a.inicio) - new Date(b.inicio));

const visibles = () => ordenarParaLeer(EVENTOS.filter(ev =>
  (!soloGratis || ev.gratis) &&
  (!filtroCat || ev.categoria === filtroCat) &&
  (!filtroSub || ev.subcategoria === filtroSub) &&
  (!publicoFiltro || ev.publico === publicoFiltro) &&
  coincideBusqueda(ev, busqueda) &&
  sesionEnRango(ev, cuando)));

/* Los mismos eventos pero ignorando UN filtro, para poder contar cuántos
   quedarían si lo tocaras. Sin esto los números de los chips se cuentan sobre
   la base entera y mienten: un "Reggaetón 40" que al tocarlo muestra 3 es peor
   que no poner número. */
const visiblesSalvo = salvo => EVENTOS.filter(ev =>
  (!soloGratis || ev.gratis) &&
  (salvo === "cat" || !filtroCat || ev.categoria === filtroCat) &&
  (salvo === "sub" || !filtroSub || ev.subcategoria === filtroSub) &&
  (!publicoFiltro || ev.publico === publicoFiltro) &&
  coincideBusqueda(ev, busqueda) &&
  sesionEnRango(ev, cuando));

const hayFiltros = () => busqueda || filtroCat || filtroSub
  || soloGratis || publicoFiltro || cuando !== "todo";

function limpiarFiltros(){
  busqueda = ""; filtroCat = null; filtroSub = null;
  soloGratis = false; publicoFiltro = null; cuando = "todo";
  const campo = document.getElementById("buscar");
  campo.value = "";
  document.getElementById("riel-fecha").classList.remove("buscando");
  sincronizarBuscador();
}

function pintarFiltros(){
  /* --- Riel 1: cuándo. Una sola respuesta, por eso es segmentado ---
     "Hoy" y "este finde" dejaban un hoyo: un martes, el finde son cuatro
     días más y no había forma de preguntar por mañana. */
  const fechas = document.getElementById("fechas");
  fechas.innerHTML = "";
  fechas.setAttribute("aria-label", t("filtrosCuando"));
  [["todo", t("cuandoLargo").todo], ["hoy", t("hoy")], ["manana", t("manana")],
   ["semana", t("semana")], ["finde", t("finde")]].forEach(([clave, etiqueta]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = etiqueta;
    b.setAttribute("aria-pressed", cuando === clave);
    b.onclick = e => {
      cuando = clave;
      pintarFiltros(); refrescar();
      volarDesde(e.currentTarget);
    };
    fechas.appendChild(b);
  });
  document.getElementById("cuenta-rango").innerHTML =
    `${carita("loica","var(--acento)",22)} ${escapar(t("cuandoLargo")[cuando])}`;

  /* --- Riel 2: precio, público y tipo. Se combinan entre sí --- */
  const cont = document.getElementById("filtros");
  cont.innerHTML = "";
  cont.setAttribute("aria-label", t("filtrosRapidos") + " · " + t("filtrosTipo"));

  const agregar = (contenido, activo, alPulsar, clase="") => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip " + clase;
    b.innerHTML = contenido;
    b.setAttribute("aria-pressed", activo);
    b.onclick = e => { alPulsar(); pintarFiltros(); refrescar(); volarDesde(e.currentTarget); };
    cont.appendChild(b);
    return b;
  };

  // El Degú es la mascota de lo gratis: el filtro estrella tiene cara propia.
  // Era el Pudú, que se quedó con el aire libre cuando entró el Guarén.
  agregar(`${carita("degu", soloGratis ? "#fff" : "#2E7D5B", 22)} ${t("gratis")}`,
          soloGratis, () => soloGratis = !soloGratis, "es-gratis");
  // Público: responde "¿puedo llevar a mi hijo?" y "¿es de mayores?"
  agregar(`${carita("pudu", publicoFiltro === "ninos" ? "#fff" : "#0E8757", 22)} ${t("ninos")}`,
          publicoFiltro === "ninos",
          () => publicoFiltro = publicoFiltro === "ninos" ? null : "ninos");
  agregar(`${carita("culpeo", publicoFiltro === "adultos" ? "#fff" : "#7A3FE0", 22)} ${t("mas18")}`,
          publicoFiltro === "adultos",
          () => publicoFiltro = publicoFiltro === "adultos" ? null : "adultos");

  const sep = document.createElement("div");
  sep.className = "separa-chips";
  sep.setAttribute("aria-hidden","true");
  cont.appendChild(sep);

  /* Las categorías van ordenadas por CUÁNTAS HAY, de mayor a menor, y ya no
     alfabéticamente. El orden alfabético dejaba "Aire libre" (9 eventos) de
     primero y "Deporte" (1.071) en el sexto lugar, detrás del borde de la
     pantalla: el riel se desplaza de lado y en un teléfono se ven cuatro chips.
     Ordenar por volumen pone al alcance del pulgar lo que de verdad hay esta
     semana. El desempate sigue siendo alfabético para que el orden no baile
     entre dos categorías empatadas. */
  const cuantosPorCat = {};
  visiblesSalvo("cat").forEach(e => cuantosPorCat[e.categoria] = (cuantosPorCat[e.categoria] || 0) + 1);
  [...new Set(EVENTOS.map(e => e.categoria))]
    .sort((a,b) => (cuantosPorCat[b] || 0) - (cuantosPorCat[a] || 0)
                || cat(a)[IDIOMA].localeCompare(cat(b)[IDIOMA]))
    .forEach(c => {
      const info = cat(c);
      agregar(`${carita(info.mascota, filtroCat === c ? "#fff" : info.hex, 22)} ${info[IDIOMA]}`,
              filtroCat === c, () => {
                // Soltar o cambiar de categoría BORRA la subcategoría. Sin esto,
                // filtrar Fiestas → Reggaetón y después tocar Teatro deja un
                // `filtroSub` colgado que no existe en teatro: la pantalla queda
                // en cero y parece que la app se rompió.
                filtroCat = filtroCat === c ? null : c;
                filtroSub = null;
              });
    });

  pintarAfinar();
  pintarEstado();
}

/* ---------- AFINAR: subcategorías y tamaño, dentro del panel ----------
   Van bajo el contador y no en la cabecera: es donde los pidió el dueño, y la
   cabecera ya tiene dos rieles. Las opciones salen de los DATOS y no de una
   lista escrita a mano, así que si el clasificador estrena un género mañana
   aparece solo. */

/* Un chip por subcategoría es una elección solo si hay algo que elegir. Bajo
   este piso el chip ocupa lugar y no lleva a ninguna parte: música tiene nueve
   géneros y cuatro de ellos son de un evento. Se muestran los que tengan 3 o
   más, y si eso deja menos de dos opciones no se dibuja la fila entera.
   Tres y no dos: con dos, "Pop 2" ocupa el mismo ancho que "Rock 106" y sugiere
   que son dos escenas comparables. */
const MIN_SUB = 3;

function pintarAfinar(){
  const caja = document.getElementById("afinar");
  caja.innerHTML = "";

  const fila = (etiqueta, ariaEtiqueta) => {
    const f = document.createElement("div");
    f.className = "afinar-fila";
    f.setAttribute("role", "group");
    f.setAttribute("aria-label", ariaEtiqueta);
    if(etiqueta){
      const et = document.createElement("span");
      et.className = "afinar-et";
      et.textContent = etiqueta;
      et.setAttribute("aria-hidden", "true");
      f.appendChild(et);
    }
    caja.appendChild(f);
    return f;
  };
  const chip = (fila, texto, cuenta, activo, alPulsar, titulo="") => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.innerHTML = escapar(texto)
      + (cuenta === null ? "" : ` <span class="cuenta">${cuenta}</span>`);
    b.setAttribute("aria-pressed", activo);
    if(titulo) b.title = titulo;
    b.onclick = e => { alPulsar(); pintarFiltros(); refrescar(); volarDesde(e.currentTarget); };
    fila.appendChild(b);
  };

  // --- Subcategorías: solo con una categoría elegida ---
  if(filtroCat){
    const base = visiblesSalvo("sub").filter(ev => ev.categoria === filtroCat);
    const cuantos = {};
    base.forEach(ev => { if(ev.subcategoria) cuantos[ev.subcategoria] = (cuantos[ev.subcategoria] || 0) + 1; });
    // El que está puesto se dibuja siempre, aunque su cuenta caiga bajo el
    // piso al combinarse con otros filtros: si no, el chip que acabas de tocar
    // desaparece y no hay forma de soltarlo.
    const opciones = Object.keys(cuantos)
      .filter(s => cuantos[s] >= MIN_SUB || s === filtroSub)
      .sort((a,b) => cuantos[b] - cuantos[a] || subcat(a).localeCompare(subcat(b)));

    if(opciones.length >= 2){
      const f = fila(t("filtrosAfinar"), t("filtrosAfinar"));
      chip(f, t("afinarTodo"), base.length, !filtroSub, () => filtroSub = null);
      opciones.forEach(s =>
        chip(f, subcat(s), cuantos[s], filtroSub === s,
             () => filtroSub = filtroSub === s ? null : s));
    }
  }

  // --- Limpiar: la salida de emergencia con seis filtros combinables ---
  if(hayFiltros()){
    const f = fila("", t("filtrosLimpiar"));
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = "✕ " + t("filtrosLimpiar");
    b.onclick = e => { limpiarFiltros(); pintarFiltros(); refrescar(); volarDesde(e.currentTarget); };
    f.appendChild(b);
  }
}

/* La línea que contesta "¿por qué veo 12 eventos?". Se arma con lo que está
   puesto, en el orden en que se toca. */
function pintarEstado(){
  const partes = [];
  if(cuando !== "todo") partes.push(t("cuandoLargo")[cuando]);
  if(busqueda) partes.push(`“${busqueda}”`);
  if(soloGratis) partes.push(t("gratis"));
  if(publicoFiltro === "ninos") partes.push(t("ninos"));
  if(publicoFiltro === "adultos") partes.push(t("mas18"));
  if(filtroCat) partes.push(cat(filtroCat)[IDIOMA]);
  if(filtroSub) partes.push(subcat(filtroSub));
  document.getElementById("conteo-estado").textContent = partes.join(" · ");
  const quien = filtroCat ? cat(filtroCat) : null;
  document.getElementById("atiende").innerHTML = quien
    ? carita(quien.mascota, quien.hex, 30)
    : carita("loica", "var(--acento)", 30);
}

/* ---------- EL BUSCADOR ----------
   Los filtros por animal contestan "¿qué tipo de cosa quiero hacer?". No
   contestan "¿qué hay en el Blondie?", que es como busca quien ya sabe lo que
   anda trucando. */
function sincronizarBuscador(){
  const campo = document.getElementById("buscar");
  campo.placeholder = t("buscar");
  campo.setAttribute("aria-label", t("buscarEtiqueta"));
  const lupa = document.getElementById("lupa");
  lupa.setAttribute("aria-label", t("buscarEtiqueta"));
  lupa.classList.toggle("activo", !!busqueda);
  lupa.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>`;
  const borrar = document.getElementById("borra-buscar");
  borrar.hidden = !campo.value;
  borrar.setAttribute("aria-label", t("buscarBorrar"));
}

function montarBuscador(){
  const campo = document.getElementById("buscar");
  const riel = document.getElementById("riel-fecha");

  /* 180 ms de espera antes de filtrar. Sin esto cada tecla vuelve a pintar la
     lista y a mandarle 2.283 puntos al mapa: escribir "blondie" son siete
     redibujados completos y el campo se traba en un teléfono. */
  let temporizador = null;
  campo.oninput = () => {
    document.getElementById("borra-buscar").hidden = !campo.value;
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      busqueda = campo.value.trim();
      pintarFiltros(); refrescar();
    }, 180);
  };
  campo.onkeydown = e => {
    if(e.key !== "Escape") return;
    // Escape borra; si ya estaba vacío, cierra el campo en celular.
    if(campo.value){ campo.value = ""; campo.dispatchEvent(new Event("input")); }
    else riel.classList.remove("buscando");
  };
  document.getElementById("borra-buscar").onclick = () => {
    campo.value = "";
    campo.dispatchEvent(new Event("input"));
    campo.focus();
  };
  document.getElementById("lupa").onclick = () => {
    riel.classList.add("buscando");
    campo.focus();
  };
  // El <input> medía 22 px dentro de una cápsula de 38: tocar el borde no
  // enfocaba. Ahora la cápsula entera es el campo.
  document.querySelector(".campo-buscar").onclick = () => campo.focus();
  sincronizarBuscador();
}

/* ---------- LA LOICA QUE VUELA ---------- */
function volarLoica(desde, hasta, ms = 700){
  if(!hayMapa || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const el = document.getElementById("loica-vuelo");
  if(!el.innerHTML) el.innerHTML = cuerpo("loica", "var(--acento)", 56, {pose:"volando"});
  const cx = (desde.x + hasta.x) / 2;
  const cy = Math.min(desde.y, hasta.y) - 90;   // el arco sube: esquiva pines
  el.style.offsetPath = `path("M ${desde.x} ${desde.y} Q ${cx} ${cy} ${hasta.x} ${hasta.y}")`;
  el.style.setProperty("--dur-vuelo", ms + "ms");
  el.classList.remove("vuela");
  void el.offsetWidth;
  el.classList.add("vuela");
}
const centroDe = el => {
  const r = el.getBoundingClientRect(), m = document.getElementById("mapa").getBoundingClientRect();
  return {x: r.left + r.width/2 - m.left, y: r.top + r.height/2 - m.top};
};
// Al filtrar la Loica vuela del chip que tocaste al contador y suelta el número
const volarDesde = chip =>
  volarLoica(centroDe(chip), centroDe(document.getElementById("conteo")), 480);

/* ---------- LISTA POR TANDAS ----------
   345 tarjetas con 298 imágenes remotas de una sola vez es lo que hacía que
   el panel llegara trabado a la primera pasada de dedo. Se pintan de a 24 y
   el resto entra cuando el centinela asoma. */
const TANDA = 24;
let pintados = 0, observador = null;

function refrescar(){
  listaActual = visibles();
  const conteoEl = document.getElementById("conteo");
  if(conteoEl.textContent !== String(listaActual.length)){
    conteoEl.classList.remove("pop"); void conteoEl.offsetWidth; conteoEl.classList.add("pop");
  }
  conteoEl.textContent = listaActual.length;
  document.getElementById("conteo-txt").textContent =
    listaActual.length === 1 ? t("evento") : t("eventos");

  if(hayMapa && mapa.getSource("eventos")) mapa.getSource("eventos").setData(datosGeo(listaActual));

  const cont = document.getElementById("lista");
  cont.innerHTML = "";
  pintados = 0;
  observador?.disconnect();

  if(!listaActual.length){
    /* Buscar una palabra que no existe y filtrar hasta quedar en cero son dos
       callejones distintos, y la salida también: de uno se sale cambiando la
       palabra, del otro soltando un chip. Decir "prueba sacando algún filtro"
       a quien escribió "asdfgh" no ayuda a nadie. */
    const porPalabra = !!busqueda;
    cont.innerHTML = `<div class="vacio">${cuerpo("loica","var(--acento)",76,{pose:"durmiendo"})}
      <p><b>${porPalabra ? t("buscarSin") : t("vacio")}</b><br>${
        porPalabra ? t("buscarSinPista") : t("vaciopista")}</p></div>`;
    // En reposo el panel muestra 130 px de lista: la cabeza de la Loica y
    // ningún texto. Sube a la altura media para que se lea la salida.
    if(window.fijarPanel) fijarPanel(1);
    return;
  }
  cont.scrollTop = 0;
  // La clase se pone solo para la primera tanda: si quedara puesta, cada
  // vez que entran 24 más se reanimarían las de arriba al hacer scroll
  cont.classList.add("lista-anima");
  masTarjetas();
  setTimeout(() => cont.classList.remove("lista-anima"), 500);

  const centinela = document.createElement("div");
  centinela.className = "fin-lista";
  centinela.id = "centinela";
  cont.appendChild(centinela);
  observador = new IntersectionObserver(e => { if(e[0].isIntersecting) masTarjetas(); },
                                        {root:cont, rootMargin:"420px"});
  observador.observe(centinela);
}

function masTarjetas(){
  const cont = document.getElementById("lista");
  const centinela = document.getElementById("centinela");
  const trozo = listaActual.slice(pintados, pintados + TANDA);
  const caja = document.createDocumentFragment();
  trozo.forEach(ev => caja.appendChild(tarjetaEvento(ev, abrirFicha)));
  cont.insertBefore(caja, centinela);
  pintados += trozo.length;
  if(centinela && pintados >= listaActual.length){
    centinela.textContent = "·";
    observador?.disconnect();
  }
}

/* ---------- FICHA ---------- */
function abrirFicha(ev, direccion = 0){
  const idx = listaActual.findIndex(x => x.id === ev.id);
  seleccionado = ev;
  const info = cat(ev.categoria);
  const fecha = ev.fecha.toLocaleDateString(localeDe(),
                  {weekday:"long", day:"numeric", month:"long"});
  const hora = (ev.fecha.getHours() || ev.fecha.getMinutes())
    ? ev.fecha.toLocaleTimeString(localeDe(),{hour:"2-digit",minute:"2-digit",hour12:false}) : "";
  const flecha = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"
      fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  const ficha = document.getElementById("ficha");
  ficha.innerHTML = `
    <div class="ficha-nav">
      <button class="nav-ev" id="ev-prev" ${idx <= 0 ? "disabled" : ""}>
        ${flecha("M14 5l-7 7 7 7")}<span>${t("anteriorEv")}</span></button>
      <span class="ficha-pos">${idx + 1} ${t("deN")} ${listaActual.length}</span>
      <button class="nav-ev" id="ev-sig" ${idx >= listaActual.length - 1 ? "disabled" : ""}>
        <span>${t("siguienteEv")}</span>${flecha("M10 5l7 7-7 7")}</button>
      <button class="cerrar-ficha" id="ev-cerrar" aria-label="${t("cerrar")}">×</button>
    </div>
    <div class="ficha-scroll">
      ${urlSegura(ev.imagen) ? `<div class="ficha-foto">
          <img src="${escapar(urlSegura(ev.imagen))}" alt="" onerror="this.parentElement.remove()">
        </div>` : ""}
      <div class="ficha-cuerpo">
        <span class="mascota-nombre" style="color:${info.tintaVar}">
          ${carita(info.mascota, info.hex, 22)} ${info[IDIOMA]}</span>
        <h2>${escapar(ev.titulo)}</h2>
        ${urlSegura(ev.url) ? `<a class="boton bloque" href="${escapar(urlSegura(ev.url))}"
           target="_blank" rel="noopener nofollow">${t("ir")} ↗</a>` : ""}
        <div class="dato" style="margin-top:var(--e-4)"><span class="et">${t("cuando")}</span>
          <span>${fecha}${hora ? " · " + hora : ""}</span></div>
        <div class="dato"><span class="et">${t("donde")}</span>
          <span>${escapar(ev.lugar)}${ev.comuna ? ", " + escapar(ev.comuna) : ""}
          ${ev.precision === "comuna" ? `<br><span class="aprox">${t("aprox")}</span>` : ""}
          ${ev.precision === "sin_ubicar" ? `<br><span class="aprox">${t("sinUbicar")}</span>` : ""}</span></div>
        <div class="dato"><span class="et">${t("precio")}</span>
          <span class="precio${ev.gratis ? " libre" : ""}">${ev.gratis ? t("libre") : textoPrecio(ev)}</span></div>
        ${ev.descripcion ? `<div class="dato"><span class="et"></span>
          <span>${escapar(ev.descripcion)}</span></div>` : ""}
        <div id="compartir-ficha" style="margin-top:var(--e-4)"></div>
        <div class="fuente-pie">${t("fuente")} <b>${escapar(ev.fuente)}</b></div>
      </div>
    </div>`;

  ficha.style.setProperty("--desde", (direccion ? direccion * 18 : 0) + "px");
  ficha.classList.remove("cambiando"); void ficha.offsetWidth;
  if(direccion) ficha.classList.add("cambiando");
  ficha.classList.add("visible");
  document.getElementById("panel").classList.add("oculto");
  history.replaceState(null, "", "#/e/" + ev.id);
  document.getElementById("compartir-ficha").appendChild(botonesCompartir(ev));

  document.getElementById("ev-prev").onclick = () => moverFicha(-1);
  document.getElementById("ev-sig").onclick  = () => moverFicha(1);
  document.getElementById("ev-cerrar").onclick = cerrarFicha;

  if(hayMapa && ev.lat != null){
    /* Vuela a donde el pin VA A QUEDAR, no a donde está: el flyTo lo lleva al
       centro menos los 90 px de offset. Antes se proyectaba la posición vieja
       y la Loica aterrizaba a 130 px del pin, a veces fuera de la pantalla. */
    const caja = document.getElementById("mapa").getBoundingClientRect();
    volarLoica({x: caja.width/2, y: caja.height + 20},
               {x: caja.width/2, y: caja.height/2 - 90}, 650);
    mapa.flyTo({center:[ev.lon, ev.lat], zoom:Math.max(mapa.getZoom(), 15),
                offset:[0,-90], speed:1.5});
  }
}

// paso = -1 anterior, +1 siguiente. Es lo mismo que usan el botón, el swipe
// y las flechas del teclado, así los tres se comportan igual.
function moverFicha(paso){
  if(!seleccionado) return;
  const i = listaActual.findIndex(x => x.id === seleccionado.id);
  const siguiente = listaActual[i + paso];
  if(siguiente) abrirFicha(siguiente, paso);
}

function cerrarFicha(){
  document.getElementById("ficha").classList.remove("visible");
  document.getElementById("panel").classList.remove("oculto");
  if(location.hash.startsWith("#/e/")) history.replaceState(null, "", location.pathname);
  seleccionado = null;
}

/* Deslizar de lado para cambiar de evento. Solo cuenta si el gesto es
   claramente horizontal: si no, robaría el scroll vertical de la ficha. */
(() => {
  const ficha = document.getElementById("ficha");
  let x0 = 0, y0 = 0, activo = false;
  ficha.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse") return;
    activo = true; x0 = e.clientX; y0 = e.clientY;
  });
  ficha.addEventListener("pointerup", e => {
    if(!activo) return;
    activo = false;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if(Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.8) moverFicha(dx < 0 ? 1 : -1);
  });
  ficha.addEventListener("pointercancel", () => activo = false);
})();

/* --- Arrastre del panel: tres alturas, con gesto de verdad --- */
(() => {
  const panel = document.getElementById("panel");
  const tirador = document.getElementById("tirador");
  /* El reposo era 268px fijos, y 268 significa cosas muy distintas según el
     teléfono: en uno de 812 dejaba medio mapa a la vista, en uno de 667 lo
     dejaba en 249px, y acostado —donde el alto útil baja a ~225— el panel
     era MÁS ALTO que el espacio disponible y el mapa desaparecía entero.
     Ahora el reposo es una fracción del espacio real, con tope arriba (no
     crece más que 250 px en pantallas grandes) y piso abajo (nunca baja de un
     asomo de dos tarjetas). Era el 40 % y bajó al 34 %: con la cabecera y la
     barra de abajo, el mapa se quedaba con el 44 % de un iPhone. La regla que
     sostiene todo esto: en reposo el mapa se queda con la mayoría de la
     pantalla, siempre. */
  const alturas = () => {
    const disponible = panel.parentElement.clientHeight;
    const reposo = Math.round(Math.min(250, Math.max(132, disponible * .34)));
    return [reposo, Math.round(disponible * .62), Math.round(disponible * .88)];
  };
  let indice = 0, arrastrando = false, inicioY = 0, inicioAlto = 0;

  const fijar = i => {
    indice = Math.max(0, Math.min(2, i));
    panel.style.setProperty("--alto-panel", alturas()[indice] + "px");
  };
  fijar(0);
  // refrescar() la usa para subir el panel cuando la lista queda en cero: en
  // reposo solo se veía la cabeza de la Loica dormida y nada del texto.
  window.fijarPanel = fijar;

  tirador.addEventListener("pointerdown", e => {
    arrastrando = true; inicioY = e.clientY; inicioAlto = panel.clientHeight;
    panel.classList.add("arrastrando");
    tirador.setPointerCapture(e.pointerId);
  });
  tirador.addEventListener("pointermove", e => {
    if(!arrastrando) return;
    const alto = Math.min(panel.parentElement.clientHeight * .88,
                          Math.max(120, inicioAlto - (e.clientY - inicioY)));
    panel.style.setProperty("--alto-panel", alto + "px");
  });
  const soltar = () => {
    if(!arrastrando) return;
    arrastrando = false;
    panel.classList.remove("arrastrando");
    const actual = panel.clientHeight;
    const opciones = alturas();
    fijar(opciones.indexOf(opciones.reduce((a,b) =>
      Math.abs(b - actual) < Math.abs(a - actual) ? b : a)));
  };
  tirador.addEventListener("pointerup", soltar);
  tirador.addEventListener("pointercancel", soltar);
  tirador.addEventListener("click", () => { if(!arrastrando) fijar(indice === 2 ? 0 : indice + 1); });
  tirador.addEventListener("keydown", e => {
    if(e.key === "ArrowUp"){ e.preventDefault(); fijar(indice + 1); }
    if(e.key === "ArrowDown"){ e.preventDefault(); fijar(indice - 1); }
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fijar(indice === 2 ? 0 : indice + 1); }
  });
  addEventListener("resize", () => fijar(indice));
})();

/* ---------- ARRANQUE ----------
   La cabecera se pinta ANTES de pedir el JSON. El riel de fechas y los tres
   chips fijos no dependen de los datos, y pintarlos al tiro deja el header en
   su alto definitivo desde el primer cuadro: antes crecía de 78 a 150 px
   cuando llegaba eventos.json, el mapa ya había dibujado sus teselas para el
   alto viejo y quedaba una banda crema de ~60 px bajo los filtros en cuatro
   de cada cinco cargas en celular. La lista mientras tanto late con tres
   filas vacías en vez de decir "0 eventos". */
montarBuscador();
pintarFiltros();
document.getElementById("lista").innerHTML = esqueleto(3);
// El panel midió su reposo con la cabecera a medio pintar; ahora que tiene
// el alto definitivo, se vuelve a medir. Y recién ahora nace el mapa.
if(window.fijarPanel) fijarPanel(0);
crearMapa();
cargarEventos()
  .then(evs => {
    EVENTOS = evs;
    pintarFiltros(); refrescar();
    if(hayMapa) requestAnimationFrame(() => { mapa.resize(); mapa.triggerRepaint(); });
    const enlace = location.hash.match(/^#\/e\/(.+)$/);
    if(enlace){
      const ev = EVENTOS.find(e => e.id === enlace[1]);
      if(ev) abrirFicha(ev);
    }
  })
  .catch(() => {
    document.getElementById("lista").innerHTML =
      `<div class="vacio">${cuerpo("loica","var(--acento)",88,{pose:"durmiendo"})}
       <p><b>${IDIOMA === "en" ? "Couldn't load events" :
               IDIOMA === "pt" ? "Não consegui carregar os eventos" :
               "No pude cargar los eventos"}</b><br>
       <button class="boton secundario" style="margin-top:12px"
         onclick="location.reload()">${IDIOMA === "en" ? "Try again" :
           IDIOMA === "pt" ? "Tentar de novo" : "Reintentar"}</button></p></div>`;
  });

window.addEventListener("loica:idioma", () => {
  sincronizarBuscador();
  pintarFiltros(); refrescar(); if(seleccionado) abrirFicha(seleccionado);
});

/* Un solo manejador para el toque en el mapa, con una caja de ±14 px alrededor
   del dedo. El pin se dibuja con la punta en la coordenada y el dedo toca el
   cuerpo, no la punta: antes MapLibre consultaba el píxel exacto y a 12 px del
   centro ya no abría nada. Si caen varios en la caja gana el último dibujado,
   que por symbol-sort-key es el gratis. Tocar mapa pelado cierra la ficha. */
if(hayMapa) mapa.on("click", e => {
  if(!mapa.getLayer("pines")) return cerrarFicha();
  const r = 14, p = e.point;
  const tocados = mapa.queryRenderedFeatures([[p.x - r, p.y - r], [p.x + r, p.y + r]],
                                             {layers:["pines"]});
  if(!tocados.length) return cerrarFicha();
  const ev = EVENTOS.find(x => x.id === tocados[tocados.length - 1].properties.id);
  if(ev) abrirFicha(ev);
});
addEventListener("keydown", e => {
  if(e.key === "Escape") cerrarFicha();
  if(!seleccionado) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); moverFicha(1); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); moverFicha(-1); }
});
</script>
