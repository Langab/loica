<style>
  /* ============================================================
     HABLA CON LA LOICA
     La Loica recibe, pregunta lo básico y PASA EL TURNO al animal que
     sabe de eso. El relevo no es adorno: es la misma regla del mapa
     (`estrategia_marca.md`) llevada a una conversación — la mascota es la
     señalética, así que quien te habla te dice de qué se trata antes de
     que leas una palabra.

     Todo lo visual sale de loica.css. Acá va solo lo que no existía:
     la burbuja, el relevo y la grilla de opciones.
     ============================================================ */

  .conversa{max-width:720px;margin:0 auto;padding:var(--e-6) var(--e-5) var(--e-10)}
  .intro{margin-bottom:var(--e-6)}
  .intro h1{font-size:clamp(30px,7vw,46px);line-height:1.06;margin-bottom:var(--e-3)}
  .intro p{color:var(--tinta-suave);font-size:var(--t-md);line-height:1.6;margin:0;max-width:56ch}

  /* --- Turnos ---
     Quien habla va a la izquierda con su cara; tú a la derecha sin avatar.
     La esquina cuadrada de la burbuja apunta a quien habla. */
  .turno{display:flex;gap:var(--e-3);margin-bottom:var(--e-3);align-items:flex-end}
  .turno.mia{flex-direction:row-reverse}
  .turno + .relevo{margin-top:var(--e-5)}

  .avatar{
    flex:none;width:46px;height:46px;border-radius:var(--r-pill);
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    display:grid;place-items:center;box-shadow:var(--repisa-1);
  }
  .avatar svg{width:32px;height:32px}

  .burbuja{
    max-width:min(84%,52ch);padding:var(--e-3) var(--e-4);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    background:var(--fondo-elevado);box-shadow:var(--repisa-2);
    border-bottom-left-radius:var(--e-1);
    font-size:var(--t-base);line-height:1.5;
  }
  /* El nombre de quien habla, en su color. Solo aparece en el primer turno
     de cada animal: repetirlo en cada burbuja es ruido. */
  .quien{
    display:block;font:800 var(--t-xs)/1 var(--fuente-marca);
    letter-spacing:.04em;text-transform:uppercase;
    color:var(--voz,var(--acento));margin-bottom:5px;
  }
  .turno.mia .burbuja{
    background:var(--tinta);color:var(--fondo-elevado);
    border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--e-1);
    font-family:var(--fuente-marca);font-weight:700;
  }
  /* En oscuro la tinta ES el crema: el contorno se perdería contra su propio
     relleno, así que la burbuja mía se contornea con el azul del sistema. */
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]) .turno.mia .burbuja{border-color:var(--azul-800)}
  }
  :root[data-tema="oscuro"] .turno.mia .burbuja{border-color:var(--azul-800)}

  .entra{animation:burbuja-entra var(--rebote) backwards}
  @keyframes burbuja-entra{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

  /* --- El relevo: "ahora te atiende el Culpeo" --- */
  .relevo{
    display:flex;align-items:center;gap:var(--e-3);
    margin:var(--e-5) 0 var(--e-4);
  }
  .relevo::before,.relevo::after{content:"";flex:1;height:2px;background:var(--borde)}
  .relevo span{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    padding:5px 14px 5px 7px;border:2px solid var(--contorno);
    border-radius:var(--r-pill);background:var(--tono);color:var(--tono-tinta,#fff);
    font:800 var(--t-xs)/1 var(--fuente-marca);box-shadow:var(--repisa-1);
  }
  .relevo svg{width:22px;height:22px}

  /* --- "Está escribiendo" --- */
  .puntos{display:flex;gap:5px;padding:var(--e-1) var(--e-2)}
  .puntos i{width:8px;height:8px;border-radius:50%;background:var(--tinta-tenue);
    animation:latir 1.1s infinite ease-in-out}
  .puntos i:nth-child(2){animation-delay:.16s}
  .puntos i:nth-child(3){animation-delay:.32s}
  @keyframes latir{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* --- Opciones ---
     Grilla, no scroll horizontal: acá hay que VER las ocho para elegir, no
     descubrirlas deslizando (que es justo el problema anotado en
     `_critica_diseno.md` para la barra de filtros). */
  .opciones{
    display:grid;gap:var(--e-2);margin:0 0 var(--e-5) calc(46px + var(--e-3));
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  .opciones.corta{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
  @media(max-width:540px){
    .opciones{margin-left:0;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  }
  .opcion{
    display:flex;align-items:center;gap:var(--e-2);text-align:left;
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    background:var(--fondo-elevado);color:var(--tinta);
    padding:11px var(--e-3);cursor:pointer;
    font:700 var(--t-sm)/1.25 var(--fuente-marca);
    box-shadow:var(--repisa-2);transition:var(--rapido);
  }
  .opcion:hover{transform:translateY(-2px);box-shadow:var(--repisa-3);background:var(--fondo-hundido)}
  .opcion:active{transform:translateY(4px);box-shadow:none}
  .opcion svg{flex:none;width:30px;height:30px}
  .opcion small{display:block;font-family:var(--fuente-ui);font-weight:500;
    font-size:var(--t-xs);color:var(--tinta-tenue);margin-top:2px}

  /* --- Resultados: la misma caja de la portada --- */
  .resultados{
    margin:0 0 var(--e-4) calc(46px + var(--e-3));
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--repisa-2);
  }
  @media(max-width:540px){.resultados{margin-left:0}}
  .resultados .tarjeta:last-child{border-bottom:0}

  .acciones{display:flex;flex-wrap:wrap;gap:var(--e-2);
    margin:0 0 var(--e-6) calc(46px + var(--e-3))}
  @media(max-width:540px){.acciones{margin-left:0}}
  .acciones .boton{font-size:var(--t-base);padding:11px var(--e-5)}

  /* Aviso de maqueta. Se borra cuando esto deje de ser prueba. */
  .aviso{display:flex;gap:var(--e-3);align-items:flex-start;max-width:720px;
    margin:0 auto;padding:var(--e-3) var(--e-5) 0;
    font-size:var(--t-xs);color:var(--tinta-tenue);line-height:1.5}
  .aviso b{color:var(--tinta-suave)}
</style>
</head>

/* ============================================================
   1. EL ELENCO COMO GUÍAS
   Los nombres salen de ELENCO (loica.js) para no tener dos listas que se
   desincronicen. Acá solo se agrega el color de voz de cada uno.
   `claro` marca a los que llevan tinta azul encima en vez de crema: el
   amarillo y el naranjo fuertes con texto blanco no pasan contraste.
   ============================================================ */
const GUIAS = {
  loica:     {tono:"var(--acento)",      claro:false, art:{es:"la ", pt:"a "}},
  pudu:      {tono:"var(--c-libre)",     claro:false, art:{es:"el ", pt:"o "}},
  culpeo:    {tono:"var(--c-fiesta)",    claro:false, art:{es:"el ", pt:"o "}},
  condor:    {tono:"var(--c-musica)",    claro:false, art:{es:"el ", pt:"o "}},
  chinchilla:{tono:"var(--c-cultura)",   claro:false, art:{es:"la ", pt:"a "}},
  chincol:   {tono:"var(--c-clases)",    claro:true,  art:{es:"el ", pt:"o "}},
  chungungo: {tono:"var(--c-deporte)",   claro:false, art:{es:"el ", pt:"o "}},
  pinguino:  {tono:"var(--c-charla)",    claro:false, art:{es:"el ", pt:"o "}},
};
const nombreGuia = clave => (ELENCO.find(e => e.clave === clave) || ELENCO[0])[IDIOMA][0];
/* "Te atiende el Culpeo", no "Te atiende Culpeo". El inglés no lleva artículo
   y el género cambia por animal, así que cada uno se trae el suyo. */
const nombreConArt = clave =>
  ((GUIAS[clave] || GUIAS.loica).art?.[IDIOMA] || "") + nombreGuia(clave);

/* ============================================================
   2. COPY
   Registro del hero: primera persona, cálida, corta. Cada animal tiene
   una voz distinta y la mantiene — el Cóndor habla poco, el Chincol habla
   mucho, el Pingüino habla formal.
   ============================================================ */

    pensando:"Buscando…",
    listo:"Para {cuando}, esto es lo que tengo:",
    listoUno:"Para {cuando} tengo uno solo que valga la pena. Es este:",
    poco:"Para {cuando} no hay nada de eso. No te voy a inventar un panorama, así que abrí la búsqueda a los próximos días:",
    nada:"No tengo nada que calce, ni ampliando las fechas. Prefiero decírtelo antes que recomendarte cualquier cosa.",

const b = clave => BOT[IDIOMA][clave];

/* ============================================================
   3. LAS SITUACIONES
   El usuario no elige una categoría: elige una situación de su vida, y cada
   situación reparte puntaje entre varias categorías. Es a propósito. "Ando
   con niños" no es `categoria == familia` — hay 4 eventos de familia en toda
   la base — es familia + aire libre + feria + teatro + cine ordenados por
   qué tan bien calzan. Un filtro duro devuelve pantalla vacía; el puntaje
   devuelve siempre lo mejor que hay, y si es poco lo dice.

   Cada situación se lleva UNA mascota, y esa mascota toma el mando: se
   presenta, hace su propia repregunta y entrega el resultado. Las ocho del
   elenco están acá y ninguna se repite.
   ============================================================ */

         tener foto y buena hora. */

       efecto:{pesos:{familia:6, teatro:2, clases:-6, charla:-9, arte:-3}, horaIdeal:[10,17]}},

       efecto:{pesos:{cine:5, musica:4, arte:3}, horaIdeal:[12,21]}},

       efecto:{pesos:{charla:7, clases:-3}}},

       efecto:{pesos:{clases:7, idiomas:4, charla:-3}}},
    ],
    pesos:{charla:12, clases:11, idiomas:10, arte:4, cine:3}, horaIdeal:[9,21], bonoGratis:2,
  },

    dicho:{es:"de barrio", en:"local", pt:"de bairro"},
    saludo:{

    opciones:[

    ],
    /* Sin preferencia de categoría: gana lo mejor presentado y lo gratis, y
       se fuerza que las tres sean de familias distintas. */
    pesos:{}, base:6, bonoGratis:5, variedad:true,
  },
];
const situacionPorId = id => SITUACIONES.find(s => s.id === id);

/* ============================================================
   4. EL PUNTAJE
   Deliberadamente legible: si mañana hay que explicar por qué salió tal
   evento, se lee esta función y se entiende.
   ============================================================ */
function puntuar(ev, sit, soloGratis, ajuste){
  if(soloGratis && !ev.gratis) return -1;
  if(sit.evitar && sit.evitar.includes(ev.categoria)) return -1;

  const pesos = {...sit.pesos, ...(ajuste.pesos || {})};
  // La repregunta suma o resta sobre el peso base, no lo reemplaza.
  for(const k in (ajuste.pesos || {})) pesos[k] = (sit.pesos[k] ?? (sit.base ?? 0)) + ajuste.pesos[k];

  /* Piso de pertinencia. Los bonos de abajo (foto, horario, cercanía) suman
     hasta 9 puntos, así que sin este corte un evento que NO calza con la
     situación se cuela igual por estar bien presentado — así apareció un
     taller de audiciones de $40.000 recomendado para niños de 5 años. Si la
     categoría no está en la tabla de la situación, o la repregunta la dejó
     en cero, no es una recomendación: es relleno. */
  const peso = pesos[ev.categoria] ?? sit.base;
  if(peso === undefined || peso <= 0) return -1;
  let p = peso;

  // Lo gratis va primero: es la promesa del proyecto, no un detalle.
  if(ev.gratis) p += (sit.bonoGratis ?? 2);
  if(sit.techoPrecio && ev.precio > sit.techoPrecio) p -= 6;

  if(sit.publicoBueno && sit.publicoBueno.includes(ev.publico)) p += 4;
  if(sit.publicoMalo  && sit.publicoMalo.includes(ev.publico))  p -= 6;

  // Horario. Muchos eventos vienen a las 00:00 porque la fuente no publicó
  // hora: a esos no se les premia ni castiga, quedan neutros.
  const h = ev.fecha.getHours();
  const tieneHora = h !== 0 || ev.fecha.getMinutes() !== 0;
  const franja = ajuste.horaIdeal || sit.horaIdeal;
  if(tieneHora && franja){
    const [d, a] = franja;
    const dentro = d <= a ? (h >= d && h <= a) : (h >= d || h <= a);
    p += dentro ? 3 : -2;
  }

  // Presentable: con foto y con descripción se recomienda mucho mejor.
  if(ev.imagen) p += 2;
  if((ev.descripcion || "").length > 60) p += 1;
  // Un evento sin dirección confirmada es peor recomendación.
  if(ev.precision === "sin_ubicar") p -= 2;

  // A igualdad de puntaje, primero lo que ocurre antes.
  p += Math.max(0, 3 - ((ev.fecha - Date.now()) / 86400000) * 0.12);
  return p;
}

/* Ordena y evita que las tres recomendaciones salgan del mismo lugar: tres
   funciones del mismo teatro no son tres panoramas, son uno. */
function rankear(eventos, sit, soloGratis, ajuste){
  const puntuados = eventos
    .map(ev => ({ev, p: puntuar(ev, sit, soloGratis, ajuste)}))
    .filter(x => x.p > 0)
    .sort((a, z) => z.p - a.p);

  const fuentes = new Set(), familias = new Set(), primera = [], resto = [];
  for(const {ev} of puntuados){
    const fuente = ev.fuente || ev.lugar || ev.id;
    const fam = cat(ev.categoria).mascota;
    if(fuentes.has(fuente) || (sit.variedad && familias.has(fam))){ resto.push(ev); continue; }
    fuentes.add(fuente); familias.add(fam);
    primera.push(ev);
  }
  // Los descartados por repetición no se botan: van al final, para "ver más".
  return primera.concat(resto);
}

/* ============================================================
   5. LA CONVERSACIÓN
   El historial se guarda como lista de turnos repintables para poder
   redibujar todo al cambiar de idioma. Sin esto, apretar "EN" dejaba media
   conversación en español — justo el detalle que delata una maqueta.
   ============================================================ */
let EVENTOS = [];
let turnos = [];
let respuestas = {};
let ajuste = {};
let ranking = [], mostrados = 0, ultimaVoz = null;

const hilo = () => document.getElementById("hilo");
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* "Movimiento reducido" significa no animar, no responder al instante. Si las
   opciones aparecen en 0 ms caen bajo el dedo que acaba de tocar la opción
   anterior y el usuario contesta sin querer la pregunta siguiente. Se deja un
   piso de pausa para que eso no ocurra. */
const esperar = ms => new Promise(r => setTimeout(r, reduce() ? Math.min(ms, 260) : ms));

/* --- Nodos --- */
function nodoDice(guia, html, conNombre, animar){
  const g = GUIAS[guia] || GUIAS.loica;
  const d = document.createElement("div");
  d.className = "turno";
  d.style.setProperty("--voz", g.tono);
  d.innerHTML = `<div class="avatar">${carita(guia, g.tono, 32)}</div>
    <div class="burbuja${animar ? " entra" : ""}">
      ${conNombre ? `<b class="quien">${escapar(nombreGuia(guia))}</b>` : ""}${html}</div>`;
  return d;
}
function nodoMio(texto, animar){
  const d = document.createElement("div");
  d.className = "turno mia";
  d.innerHTML = `<div class="burbuja${animar ? " entra" : ""}">${escapar(texto)}</div>`;
  return d;
}
function nodoRelevo(guia){
  const g = GUIAS[guia];
  const d = document.createElement("div");
  d.className = "relevo";
  d.style.setProperty("--tono", g.tono);
  if(g.claro) d.style.setProperty("--tono-tinta", "var(--azul-900)");
  /* La pastilla siempre es color saturado, así que el contorno del animal se
     fija a tinta azul en vez de heredar `var(--contorno)`: en modo oscuro ese
     contorno es crema y el bicho quedaba sin borde sobre su propio color. */
  d.innerHTML = `<span>${carita(guia, "var(--arena-50)", 22, {tinta:"#1E2A4A"})}
    ${escapar(b("relevo"))} ${escapar(nombreConArt(guia))}</span>`;
  return d;
}
function nodoEscribiendo(guia){
  const g = GUIAS[guia] || GUIAS.loica;
  const d = document.createElement("div");
  d.className = "turno";
  d.innerHTML = `<div class="avatar">${carita(guia, g.tono, 32)}</div>
    <div class="burbuja"><span class="puntos" role="status"
      aria-label="${escapar(b("pensando"))}"><i></i><i></i><i></i></span></div>`;
  return d;
}

/* --- Emisores. Cada uno deja su receta en `turnos` para el repintado. --- */
function agregar(turno){
  turnos.push(turno);
  hilo().appendChild(turno.render(true));
  bajar();
}

async function dice(guia, fabricar, pausa = 480){
  // El nombre solo en el primer turno de cada animal: repetirlo es ruido.
  const conNombre = guia !== ultimaVoz;
  ultimaVoz = guia;
  agregar({render: animar => nodoDice(guia, fabricar(), conNombre, animar)});
  await esperar(pausa);
}
const diceClave = (guia, clave, pausa) => dice(guia, () => escapar(b(clave)), pausa);

function responde(fabricar){
  ultimaVoz = null;   // después de que hablas tú, el animal se vuelve a presentar
  agregar({render: animar => nodoMio(fabricar(), animar)});
}

async function relevo(guia){
  agregar({render: () => nodoRelevo(guia)});
  ultimaVoz = null;
  await esperar(420);
}

async function escribiendo(guia, ms = 700){
  const nodo = nodoEscribiendo(guia);
  hilo().appendChild(nodo);
  bajar();
  await esperar(ms);
  nodo.remove();
}

/* Las opciones son el único turno que se BORRA al usarse: una vez que
   respondiste, la pregunta contestada no debe volver a ofrecerse — ni
   siquiera al cambiar de idioma y repintar. */
function preguntar(guia, opciones, corta, alElegir){
  const construir = () => {
    const c = document.createElement("div");
    c.className = "opciones" + (corta ? " corta" : "");
    opciones().forEach(o => {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.className = "opcion";
      bt.innerHTML = (o.mascota
          ? carita(o.mascota, GUIAS[o.mascota] ? GUIAS[o.mascota].tono : "var(--acento)", 30)
          : "")
        + `<span>${escapar(o.titulo)}${o.sub ? `<small>${escapar(o.sub)}</small>` : ""}</span>`;
      bt.onclick = () => {
        turnos = turnos.filter(x => x !== turno);
        document.querySelectorAll(".opciones").forEach(n => n.remove());
        alElegir(o);
      };
      c.appendChild(bt);
    });
    return c;
  };
  const turno = {render: construir};
  agregar(turno);
}

function bajar(){
  const ult = hilo().lastElementChild;
  if(ult) ult.scrollIntoView({behavior: reduce() ? "auto" : "smooth", block:"nearest"});
}

function repintar(){
  ultimaVoz = null;
  const h = hilo();
  h.innerHTML = "";
  turnos.forEach(tn => h.appendChild(tn.render(false)));
  document.querySelectorAll("[data-bot]").forEach(el => el.textContent = b(el.dataset.bot));
  document.title = b("titulo") + " — Loica";
}

/* ============================================================
   6. EL GUIÓN
   ============================================================ */
async function arrancar(){
  await diceClave("loica", "hola", 520);
  await preguntarCuando();
}

async function preguntarCuando(){
  await diceClave("loica", "q1");
  preguntar("loica",
    () => ["hoy","manana","finde","semana"].map(id => ({id, titulo: b("cuando")[id]})),
    true,
    async o => {
      respuestas.cuando = o.id;
      responde(() => b("cuando")[respuestas.cuando]);
      await esperar(320);
      preguntarSituacion();
    });
}

async function preguntarSituacion(){
  await escribiendo("loica", 600);
  await diceClave("loica", "q2");
  preguntar("loica",
    () => SITUACIONES.map(s => ({
      id:s.id, mascota:s.guia, titulo:s[IDIOMA][0], sub:s[IDIOMA][1],
    })),
    false,
    async o => {
      respuestas.situacion = o.id;
      responde(() => situacionPorId(respuestas.situacion)[IDIOMA][0]);
      await esperar(340);
      tomaElMando();
    });
}

/* El relevo: el animal de la situación se presenta y hace su repregunta. */
async function tomaElMando(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.guia !== "loica") await relevo(sit.guia);
  await escribiendo(sit.guia, 620);
  await dice(sit.guia, () => escapar(sit.saludo[IDIOMA]), 520);
  await dice(sit.guia, () => escapar(sit.pregunta[IDIOMA]), 320);
  preguntar(sit.guia,
    () => sit.opciones.map(o => ({id:o.id, titulo:o[IDIOMA]})),
    false,
    async o => {
      respuestas.detalle = o.id;
      ajuste = sit.opciones.find(x => x.id === o.id).efecto || {};
      responde(() => sit.opciones.find(x => x.id === respuestas.detalle)[IDIOMA]);
      await esperar(340);
      preguntarPlata();
    });
}

/* El Pudú siempre entra para la plata: lo gratis es su trabajo y por eso es
   el único que aparece en todas las conversaciones, sea cual sea el tema. */
async function preguntarPlata(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.guia !== "pudu") await relevo("pudu");
  await escribiendo("pudu", 560);
  if(sit.guia !== "pudu") await diceClave("pudu", "puduSePresenta", 460);
  await diceClave("pudu", "qPlata", 300);
  preguntar("pudu",
    () => [
      {id:"gratis", mascota:"pudu",  titulo:b("plata").gratis, sub:b("plataSub").gratis},
      {id:"igual",  mascota:"loica", titulo:b("plata").igual,  sub:b("plataSub").igual},
    ],
    false,
    async o => {
      respuestas.plata = o.id;
      responde(() => b("plata")[respuestas.plata]);
      await esperar(340);
      recomendar();
    });
}

/* --- El resultado, en boca del animal que lleva el tema --- */
async function recomendar(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.guia !== "pudu") await relevo(sit.guia);
  await escribiendo(sit.guia, 900);

  const soloGratis = respuestas.plata === "gratis";
  const vigentes = EVENTOS.filter(ev => ev.fecha >= empiezaDia(new Date()));

  ranking = rankear(vigentes.filter(ev => enRango(ev.fecha, respuestas.cuando)), sit, soloGratis, ajuste);
  let amplio = false;

  // Si la ventana elegida no da para tres, se abre a la semana ANTES de decir
  // que no hay nada. Y se avisa: la Loica no finge que encontró.
  if(ranking.length < 3 && respuestas.cuando !== "semana"){
    const otro = rankear(vigentes.filter(ev => enRango(ev.fecha, "semana")), sit, soloGratis, ajuste);
    if(otro.length > ranking.length){ ranking = otro; amplio = true; }
  }

  if(!ranking.length){
    await diceClave(sit.guia, "nada");
    pintarAcciones({sinMas:true});
    return;
  }

  if(amplio) await dice(sit.guia, () => escapar(b("poco").replace("{cuando}", frase())), 420);
  else       await dice(sit.guia, () => escapar(b(ranking.length === 1 ? "listoUno" : "listo").replace("{cuando}", frase())), 420);

  mostrados = 0;
  pintarLote();
}

/* "este finde, de noche y sin gastar un peso" */
function frase(){
  const sit = situacionPorId(respuestas.situacion);
  const partes = [b("cuandoDicho")[respuestas.cuando], sit.dicho[IDIOMA]].filter(Boolean);
  const plata = b("plataDicho")[respuestas.plata];
  const y = IDIOMA === "es" ? " y " : IDIOMA === "pt" ? " e " : " and ";
  return partes.join(", ") + (plata ? y + plata : "");
}

function pintarLote(){
  const lote = ranking.slice(mostrados, mostrados + 3);
  mostrados += lote.length;

  const construir = () => {
    const c = document.createElement("div");
    c.className = "resultados";
    lote.forEach(ev => c.appendChild(
      tarjetaEvento(ev, e => location.href = `e/${e.id}.html`)));
    return c;
  };
  agregar({render: construir});
  pintarAcciones({sinMas: mostrados >= ranking.length});
}

function pintarAcciones({sinMas}){
  turnos = turnos.filter(tn => !tn.esAccion);
  document.querySelectorAll(".acciones").forEach(n => n.remove());

  const construir = () => {
    const c = document.createElement("div");
    c.className = "acciones";
    if(!sinMas){
      const mas = document.createElement("button");
      mas.className = "boton"; mas.type = "button";
      mas.textContent = b("bMas");
      mas.onclick = async () => {
        turnos = turnos.filter(tn => !tn.esAccion);
        c.remove();
        responde(() => b("bMas"));
        const sit = situacionPorId(respuestas.situacion);
        await escribiendo(sit.guia, 600);
        await diceClave(sit.guia, "masTitulo");
        pintarLote();
      };
      c.appendChild(mas);
    }
    const otra = document.createElement("button");
    otra.className = "boton secundario"; otra.type = "button";
    otra.textContent = b("bOtra");
    otra.onclick = reiniciar;
    c.appendChild(otra);

    const mapa = document.createElement("a");
    mapa.className = "boton secundario";
    mapa.href = "mapa.html";
    mapa.textContent = b("bMapa");
    c.appendChild(mapa);
    return c;
  };
  agregar({render: construir, esAccion: true});
}

async function reiniciar(){
  turnos = []; respuestas = {}; ajuste = {}; ranking = []; mostrados = 0; ultimaVoz = null;
  hilo().innerHTML = "";
  await arrancar();
}

/* ============================================================
   7. ARRANQUE
   ============================================================ */
pintarBarra("habla.html", "");
document.querySelectorAll("[data-bot]").forEach(el => el.textContent = b(el.dataset.bot));

/* El .catch importa: sin él, si eventos.json falla el usuario se queda con
   una Loica muda para siempre. Es el mismo hoyo anotado en _critica_diseno.md. */
cargarEventos()
  .then(evs => { EVENTOS = evs; arrancar(); })
  .catch(() => agregar({render: a => nodoDice("loica", escapar(b("error")), true, a)}));

window.addEventListener("loica:idioma", repintar);
</script>
