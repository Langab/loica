<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Loica — Habla con la Loica</title>
<meta name="description" content="Cuéntale a la Loica qué andas buscando y el elenco te recomienda un panorama en Santiago. Cada animal sabe de lo suyo.">
<meta property="og:title" content="Habla con la Loica">
<meta property="og:description" content="Cuéntale qué andas buscando y cada animal del elenco te asesora en lo suyo.">
<meta property="og:image" content="https://langab.github.io/loica/og-default.png">
<meta property="og:url" content="https://langab.github.io/loica/habla.html">
<meta property="og:site_name" content="Loica">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loica.css?v=16">
<style>
  /* ============================================================
     HABLA CON LA LOICA
     La Loica recibe, pregunta lo básico y PASA EL TURNO al animal que sabe
     de eso. El relevo no es adorno: es la regla del mapa
     (`estrategia_marca.md`) llevada a una conversación — quien te habla te
     dice de qué se trata antes de que leas una palabra.

     El hero es el mismo de la portada (cordillera + desfile), con dos
     diferencias: los nueve animales SON BOTONES —tocar al Cóndor arranca la
     conversación en música, el atajo para el que ya sabe— y el hero no
     termina donde empieza el chat.

     LA IDEA QUE UNE LAS DOS MITADES
     Esto no es una portada con un chat abajo: es una sola superficie que
     cambia de color según quién te esté atendiendo. `--guia` es el color del
     animal que tiene la palabra, y de él cuelgan la cordillera, el ambiente y
     el hilo que recorre la conversación. Cuando el Culpeo toma el turno, la
     página entera se pone morada. No es decoración: es la regla de la marca
     —la mascota es la señalética— aplicada a la superficie completa, así que
     el color te dice quién habla antes de que leas el nombre.

     Y el hero no desaparece cuando arranca la conversación: se COMPACTA
     (`body.conversando`). Pasa de invitación a encabezado sin cortar nunca,
     que es lo que hace que se lea como un producto y no como dos pantallas
     pegadas.
     ============================================================ */
  body{overflow-x:hidden}

  /* El color del que tiene la palabra. Arranca en el rojo de la Loica porque
     es ella la que recibe, y lo cambia el JS en cada relevo. */
  :root{--guia:var(--acento); --guia-suave:var(--rojo-200)}
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]){--guia-suave:var(--azul-800)}
  }
  :root[data-tema="oscuro"]{--guia-suave:var(--azul-800)}

  /* ---------- HERO ----------
     Sin borde inferior: la cordillera ES la transición hacia la conversación,
     y una línea de tinta ahí lo partía en dos productos. */
  .hero{position:relative;overflow:hidden;background:var(--fondo-elevado)}
  .hero .mancha{position:absolute;border-radius:50%;opacity:.16;pointer-events:none;
    transition:background var(--lento),opacity var(--lento)}
  /* En oscuro las manchas se mezclan con `screen`, y ahí el tono suave deja de
     leerse como color y pasa a leerse como suciedad — es la misma trampa que
     `_direccion_visual.md` documenta para el amarillo sobre azul-950. Sobre
     fondo oscuro las dos manchas usan el color saturado del guía. */
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]) .hero .mancha{mix-blend-mode:screen;opacity:.26}
    :root:not([data-tema="claro"]) .hero .m2{background:var(--guia)}
  }
  :root[data-tema="oscuro"] .hero .mancha{mix-blend-mode:screen;opacity:.26}
  :root[data-tema="oscuro"] .hero .m2{background:var(--guia)}
  /* Las dos primeras siguen al guía; la tercera queda fija en el amarillo de
     la casa para que el ambiente no se vuelva monocromo. */
  .hero .m1{width:320px;height:320px;background:var(--guia);top:-120px;left:-80px}
  /* Bien corrida hacia la esquina: centrada quedaba justo detrás de la Loica y
     el círculo se leía como un halo mal recortado en vez de ambiente. */
  .hero .m2{width:260px;height:260px;background:var(--guia-suave);top:-140px;right:-120px}
  .hero .m3{width:200px;height:200px;background:var(--c-otros);bottom:110px;right:14%}

  .hero-interior{position:relative;max-width:960px;margin:0 auto;
    padding:var(--e-8) var(--e-5) 0;z-index:2;text-align:left;
    display:grid;grid-template-columns:1fr auto;gap:var(--e-2) var(--e-8);align-items:center}
  .hero h1{font-size:clamp(30px,7.4vw,52px);line-height:1.05;margin-bottom:var(--e-3)}
  .hero .bajada{color:var(--tinta-suave);font-size:var(--t-md);line-height:1.6;
    margin:0 0 var(--e-5);max-width:48ch}

  /* La anfitriona llega volando, se posa y recién ahí habla. Una sola Loica
     en escena: es la guía, no un enjambre. */
  .hero-guia{display:flex;flex-direction:column;align-items:center;gap:var(--e-3);
    padding-bottom:var(--e-2)}
  #loica-guia{animation:loica-llega 1.15s cubic-bezier(.25,0,.35,1) .25s both}
  #loica-guia svg{width:clamp(132px,17vw,196px);height:auto;display:block}
  #loica-guia.posada{animation:loica-flota 4.4s ease-in-out .2s infinite}
  @keyframes loica-llega{from{transform:translate(-52vw,70px) rotate(-10deg)}to{transform:none}}
  @keyframes loica-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .globo{
    position:relative;background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-lg);padding:9px 14px;box-shadow:var(--repisa-2);
    font:700 var(--t-sm)/1.35 var(--fuente-marca);max-width:230px;text-align:center;
    opacity:0;transform:translateY(8px) scale(.92);
    transition:opacity var(--medio),transform var(--rebote);
  }
  .globo.visible{opacity:1;transform:none}

  /* ---------- EL PASEO: los nueve, y son botones ---------- */
  .paseo{position:relative;height:136px;margin-top:var(--e-5)}
    .desfile{position:absolute;inset:auto 0 18px 0;display:flex;align-items:flex-end;
    justify-content:center;gap:clamp(2px,2.2vw,20px);padding:0 var(--e-3)}
  .bicho-hero{
    display:block;background:none;border:0;padding:0;cursor:pointer;position:relative;
    animation:pasear 3.2s ease-in-out infinite;transform-origin:bottom center;
    transition:transform var(--rebote);
  }
  .bicho-hero:hover,.bicho-hero:focus-visible{transform:translateY(-12px) scale(1.1)}
  .bicho-hero svg{width:clamp(33px,9vw,74px);height:auto}
  @keyframes pasear{0%,100%{transform:translateY(0) rotate(-1.5deg)}
                    50%{transform:translateY(-7px) rotate(1.5deg)}}
  /* El nombre asoma al pasar el mouse: sin esto el desfile se lee como
     decoración y nadie descubre que cada bicho es un atajo. */
  .bicho-hero .rotulo{
    position:absolute;inset:auto 50% calc(100% + 6px) auto;transform:translateX(50%);
    background:var(--tono);color:var(--rotulo-tinta,var(--arena-50));
    border:2px solid var(--contorno);border-radius:var(--r-pill);
    padding:3px 10px;font:800 11px/1 var(--fuente-marca);white-space:nowrap;
    opacity:0;transition:opacity var(--rapido);pointer-events:none;box-shadow:var(--repisa-1);
  }
  .bicho-hero:hover .rotulo,.bicho-hero:focus-visible .rotulo{opacity:1}

  .atajo-pista{
    position:relative;z-index:2;max-width:960px;margin:0 auto;
    padding:0 var(--e-5) var(--e-4);font-size:var(--t-xs);color:var(--tinta-tenue);
  }

  /* ---------- EL HERO COMPACTADO ----------
     Apenas contestas la primera pregunta el hero deja de ser una invitación y
     pasa a ser el encabezado de la herramienta: la Loica se achica, la bajada
     y la pista de atajos se van, y la cordillera baja a una franja. Nada se
     desmonta ni salta — todo son transiciones sobre las mismas piezas, que es
     lo que hace que se lea como un solo producto y no como dos pantallas.

     El desfile SE QUEDA: es el cambiador de guía, y ahí sigue sirviendo. */
  .hero-texto,.hero-guia,.paseo,.cerros,#loica-guia svg,.hero h1,
  .bicho-hero svg,.atajo-pista{
    transition:all var(--lento);
  }
  body.conversando .hero h1{font-size:clamp(21px,3.6vw,27px);margin-bottom:0}
  body.conversando .hero .bajada,
  body.conversando .atajo-pista{
    opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0;overflow:hidden;
  }
  body.conversando .hero-interior{padding-top:var(--e-4);padding-bottom:0}
  body.conversando #loica-guia svg{width:clamp(64px,8vw,84px)}
  body.conversando .globo{opacity:0;max-height:0;padding:0;border-width:0;margin:0}
  body.conversando .paseo,body.conversando .cerros{height:78px}
  body.conversando .desfile{bottom:10px}
  body.conversando .bicho-hero svg{width:clamp(26px,5.2vw,42px)}
  body.conversando .hero .mancha{opacity:.1}
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]) body.conversando .hero .mancha{opacity:.18}
  }
  :root[data-tema="oscuro"] body.conversando .hero .mancha{opacity:.18}

  @media(max-width:760px){
    .hero-interior{padding:var(--e-6) var(--e-4) 0;grid-template-columns:1fr;
      justify-items:center;text-align:center}
    .hero .bajada{margin-left:auto;margin-right:auto}
    .hero-guia{order:-1;padding-bottom:0}
    #loica-guia svg{width:118px}
    .paseo,.cerros{height:104px}
    .atajo-pista{text-align:center}
    /* En una columna las manchas caen justo detrás del título y del globo, y
       a ese tamaño dejan de leerse como color de fondo y empiezan a competir
       con el texto. Se achican y se apagan: el hero ya tiene los cerros. */
    .hero .mancha{opacity:.09}
    .hero .m1{width:190px;height:190px;top:-70px;left:-60px}
    /* La segunda mancha se va en pantalla chica. En una columna quedaba justo
       detrás del título, y en oscuro —mezclada con `screen`— se leía como una
       mancha gris y no como color. Con una basta para dar ambiente. */
    .hero .m2{display:none}
    .hero .m3{width:130px;height:130px;bottom:132px;right:4%}
    /* Nueve animales a 375px van pegados al filo: el respiro evita que el
       primero y el último se lean cortados. */
    .desfile{padding:0 var(--e-4)}
  }
  /* Los nueve animales son los atajos principales de esta página y con el
     dedo medían 34x37. A 375px no caben nueve celdas de 44 (serían 396 más
     los huecos), así que se reparte el ancho completo entre los nueve y se
     borran los huecos: cada botón queda en ~41px pegado al siguiente, que es
     lo más cerca de 44 que permite la pantalla, y hacia arriba sí llega a 48
     porque el cerro tiene sitio de sobra. El dibujo no cambia de tamaño: lo
     que crece es la caja que lo rodea. */
  @media(max-width:760px) and (pointer:coarse){
    .desfile{gap:0;padding:0 var(--e-2)}
    .bicho-hero{
      flex:1;min-width:0;min-height:48px;
      display:flex;align-items:flex-end;justify-content:center;
    }
  }
  @media(max-width:760px) and (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]) .hero .mancha{opacity:.15}
  }
  @media(max-width:760px){
    :root[data-tema="oscuro"] .hero .mancha{opacity:.15}
  }
  @media (prefers-reduced-motion: reduce){
    .bicho-hero{animation:none}
    #loica-guia,#loica-guia.posada{animation:none}
  }

  /* ---------- CONVERSACIÓN ---------- */
  .conversa{max-width:720px;margin:0 auto;padding:var(--e-6) var(--e-5) var(--e-10)}

  /* --- EL HILO ---
     La firma de la página. Una línea baja por la columna de los avatares y se
     tiñe del color de quien tenía la palabra en cada tramo, así que al llegar
     abajo la conversación deja un registro visible de por cuántas manos
     pasaste: rojo de la Loica, morado del Culpeo, verde del Pudú, café del
     Guarén. Es lo que convierte una pila de burbujas en UNA conversación.

     El hilo se dibuja turno por turno y no como una línea de fondo continua:
     así existe donde hay conversación y no cuelga en el vacío ni antes de la
     primera burbuja ni al costado de las opciones. Cada tramo sube hasta el
     avatar anterior, de modo que dos turnos seguidos quedan cosidos. */
  #hilo{position:relative}
  .turno{display:flex;gap:var(--e-3);margin-bottom:var(--e-3);
    align-items:flex-end;position:relative}
  .turno.mia{flex-direction:row-reverse}
  .turno + .relevo{margin-top:var(--e-5)}
  /* El tramo va desde el avatar del turno anterior hasta el de este, por eso
     empieza un `gap` más arriba de su propia caja. */
  .turno::before{
    content:"";position:absolute;left:21.5px;top:calc(-1 * var(--e-3));
    height:calc(100% - 23px + var(--e-3));width:3px;border-radius:2px;
    background:var(--voz,var(--guia));opacity:.45;
  }
  /* En mis turnos no hay avatar, pero el hilo tiene que seguir: toma el color
     del guía actual para no dejar el tramo mudo. */
  /* Sin el gap de más: si el tramo se estira bajo el último turno queda un
     cabo suelto colgando justo antes del relevo. El turno siguiente ya cose
     el hueco con su propio tramo hacia arriba. */
  .turno.mia::before{height:100%;background:var(--guia);opacity:.22}
  /* El primero no tiene a quién coserse hacia arriba, y el que sigue a un
     relevo tampoco: ahí la línea saltaría por encima de la pastilla. */
  #hilo > .turno:first-child::before,
  .relevo + .turno::before{top:auto;bottom:23px;height:calc(100% - 46px)}

  .avatar{flex:none;width:46px;height:46px;border-radius:var(--r-pill);
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    display:grid;place-items:center;box-shadow:var(--repisa-1);
    position:relative;z-index:1}
  .avatar svg{width:32px;height:32px}

  .burbuja{
    max-width:min(84%,52ch);padding:var(--e-3) var(--e-4);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    background:var(--fondo-elevado);box-shadow:var(--repisa-2);
    border-bottom-left-radius:var(--e-1);font-size:var(--t-base);line-height:1.5;
  }
  /* El nombre solo en el primer turno de cada animal: repetirlo es ruido. */
  .quien{display:block;font:800 var(--t-xs)/1 var(--fuente-marca);
    letter-spacing:.04em;text-transform:uppercase;
    color:var(--voz,var(--acento));margin-bottom:5px}
  .turno.mia .burbuja{
    background:var(--tinta);color:var(--fondo-elevado);
    border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--e-1);
    font-family:var(--fuente-marca);font-weight:700;
  }
  /* En oscuro la tinta ES el crema: el contorno se perdería contra su propio
     relleno, así que la burbuja mía se contornea con el azul del sistema. */
  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]) .turno.mia .burbuja{border-color:var(--azul-800)}
  }
  :root[data-tema="oscuro"] .turno.mia .burbuja{border-color:var(--azul-800)}

  .entra{animation:burbuja-entra var(--rebote) backwards}
  @keyframes burbuja-entra{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

  .relevo{display:flex;align-items:center;gap:var(--e-3);margin:var(--e-5) 0 var(--e-4)}
  .relevo::before,.relevo::after{content:"";flex:1;height:2px;background:var(--borde)}
  .relevo span{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    padding:5px 14px 5px 7px;border:2px solid var(--contorno);
    border-radius:var(--r-pill);background:var(--tono);color:var(--tono-tinta,#fff);
    font:800 var(--t-xs)/1 var(--fuente-marca);box-shadow:var(--repisa-1);
  }
  .relevo svg{width:22px;height:22px}

  .puntos{display:flex;gap:5px;padding:var(--e-1) var(--e-2)}
  .puntos i{width:8px;height:8px;border-radius:50%;background:var(--tinta-tenue);
    animation:latir 1.1s infinite ease-in-out}
  .puntos i:nth-child(2){animation-delay:.16s}
  .puntos i:nth-child(3){animation-delay:.32s}
  @keyframes latir{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* Grilla, no scroll horizontal: acá hay que VER las nueve opciones para
     elegir, no descubrirlas deslizando (el problema anotado en
     `_critica_diseno.md` para la barra de filtros). */
  .opciones{
    display:grid;gap:var(--e-2);margin:0 0 var(--e-5) calc(46px + var(--e-3));
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  .opciones.corta{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
  @media(max-width:540px){
    .opciones{margin-left:0;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  }
  .opcion{
    display:flex;align-items:center;gap:var(--e-2);text-align:left;
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    background:var(--fondo-elevado);color:var(--tinta);
    padding:11px var(--e-3);cursor:pointer;
    font:700 var(--t-sm)/1.25 var(--fuente-marca);
    box-shadow:var(--repisa-2);transition:var(--rapido);
  }
  .opcion:hover{transform:translateY(-2px);box-shadow:var(--repisa-3);background:var(--fondo-hundido)}
  .opcion:active{transform:translateY(4px);box-shadow:none}
  .opcion svg{flex:none;width:30px;height:30px}
  .opcion small{display:block;font-family:var(--fuente-ui);font-weight:500;
    font-size:var(--t-xs);color:var(--tinta-tenue);margin-top:2px}
  /* Cuántos panoramas hay detrás de cada opción. Es el dato que convierte una
     elección a ciegas en una decisión: nadie quiere tocar el camino vacío. */
  .opcion .cuantos{
    margin-left:auto;flex:none;font:800 11px/1 var(--fuente-ui);
    color:var(--tinta-tenue);font-variant-numeric:tabular-nums;
  }
  .opcion[data-vacio="1"]{opacity:.5}

  .resultados{
    margin:0 0 var(--e-4) calc(46px + var(--e-3));
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--repisa-2);
  }
  @media(max-width:540px){.resultados{margin-left:0}}
  .resultados .tarjeta:last-child{border-bottom:0}

  .acciones{display:flex;flex-wrap:wrap;gap:var(--e-2);
    margin:0 0 var(--e-6) calc(46px + var(--e-3))}
  @media(max-width:540px){.acciones{margin-left:0}}
  .acciones .boton{font-size:var(--t-base);padding:11px var(--e-5)}

  /* En celular las opciones y los resultados usan todo el ancho y pasan por
     encima de la columna de avatares, así que el hilo se retira: ahí ya no
     ordena nada, estorba. */
  @media(max-width:540px){
    #hilo::before,.turno::before{display:none}
  }

</style>
</head>
<body class="con-nav-inferior">

<header class="barra" id="barra"></header>

<header class="hero">
  <span class="mancha m1" aria-hidden="true"></span>
  <span class="mancha m2" aria-hidden="true"></span>
  <span class="mancha m3" aria-hidden="true"></span>
  <div class="hero-interior">
    <div class="hero-texto">
      <h1 data-bot="titulo"></h1>
      <p class="bajada" data-bot="bajada"></p>
    </div>
    <div class="hero-guia">
      <div class="globo" id="loica-globo" role="note"></div>
      <div id="loica-guia" aria-hidden="true"></div>
    </div>
  </div>

  <div class="paseo">
    <div id="cordillera"></div>
    <div class="desfile" id="desfile"></div>
  </div>
  <p class="atajo-pista" data-bot="atajo"></p>
</header>


<main class="conversa">
  <div id="hilo" aria-live="polite"></div>
</main>

<nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>

<script src="loica.js?v=16"></script>
<script src="recomendador.js?v=16"></script>
<script>
/* ============================================================
   1. EL ELENCO COMO GUÍAS
   Los nombres salen de ELENCO (loica.js) para no tener dos listas que se

/* Pasarle el color a la página entera. Con esto la cordillera, el ambiente y
   el hilo quedan del color del que tiene la palabra, y el relevo se ve en
   toda la superficie y no sólo en la pastilla. */
function mandaLaVoz(guia){
  const g = GUIAS[guia] || GUIAS.loica;
  document.documentElement.style.setProperty("--guia", g.tono);
  document.documentElement.style.setProperty("--guia-suave", g.suave);

/* ============================================================
   3. RANGOS DE FECHA
   Las situaciones, las compañías y el puntaje viven en recomendador.js, que
   corre igual acá y en Node — así `scripts/probar_roles.js` prueba los
   perfiles de verdad contra el catálogo completo en vez de a punta de clics.
   Lo único que se queda acá es lo que depende del reloj del usuario.

   Los rangos de loica.js llegan hasta "7 días". Se agregan los dos extremos
   que faltaban: "esta noche", que es la pregunta real de un jueves a las
   seis, y "cuando sea", que abre el catálogo completo en vez de dejar el 80%
   inalcanzable.
   ============================================================ */
const RANGOS_BOT = {
  hoy:    f => mismaFecha(f, new Date()),
  /* "Esta noche" es hoy con preferencia horaria, no un filtro por hora: la
     mayoría de las fuentes no publica hora y quedaría fuera medio catálogo.
     La franja nocturna se aplica después, en el puntaje. */
  noche:  f => mismaFecha(f, new Date()),
  manana: f => RANGOS.manana(f),
  finde:  f => RANGOS.finde(f),
  semana: f => RANGOS.semana(f),
  todo:   f => f >= empiezaDia(new Date()),
};
const ORDEN_CUANDO = ["hoy","noche","manana","finde","semana","todo"];
const ORDEN_COMPANIA = ["solo","pareja","amigos","ninos"];
/* La mascota que acompaña cada opción de "¿con quién vas?". El Pudú se hace
   cargo de los niños porque ya se hace cargo de lo gratis, que es la otra
   pregunta que se hace quien sale con la familia. */
const GUIA_COMPANIA = {solo:"loica", pareja:"chinchilla", amigos:"culpeo", ninos:"pudu"};


function rankearDescuentos(lista, cats, sector, soloHoy){
  const vistos = new Set();
  return lista
    .filter(d => cats.includes(d.categoria))
    .filter(d => !soloHoy || correHoy(d))
    .filter(d => sector === "todo" || !d.comuna || enSector({comuna:d.comuna}, sector))
    .sort((a, z) => (z.porcentaje || 0) - (a.porcentaje || 0))
    .filter(d => {              // un comercio, una vez
      const k = d.comercio + "|" + d.banco_id;
      if(vistos.has(k)) return false;
      vistos.add(k); return true;
    });
}

/* ============================================================
   6. ESTADO Y NODOS
   El historial se guarda como lista de turnos repintables para poder
   redibujar todo al cambiar de idioma. Sin esto, apretar "EN" dejaba media
   conversación en español — justo el detalle que delata una maqueta.
   ============================================================ */
let EVENTOS = [], DESCUENTOS = [];
let turnos = [], respuestas = {}, ajuste = {};
let ranking = [], mostrados = 0, ultimaVoz = null, codaPuesta = false;

const hilo = () => document.getElementById("hilo");
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
/* "Movimiento reducido" es no animar, no responder al instante: si las
   opciones aparecen en 0 ms caen bajo el dedo que acaba de tocar la anterior
   y el usuario contesta sin querer la pregunta siguiente. */
const esperar = ms => new Promise(r => setTimeout(r, reduce() ? Math.min(ms, 260) : ms));

function nodoDice(guia, html, conNombre, animar){
  const g = GUIAS[guia] || GUIAS.loica;
  const d = document.createElement("div");
  d.className = "turno";
  d.style.setProperty("--voz", g.tono);
  d.innerHTML = `<div class="avatar">${carita(guia, g.tono, 32)}</div>
    <div class="burbuja${animar ? " entra" : ""}">
      ${conNombre ? `<b class="quien">${escapar(nombreGuia(guia))}</b>` : ""}${html}</div>`;
  return d;
}
function nodoMio(texto, animar){
  const d = document.createElement("div");
  d.className = "turno mia";
  d.innerHTML = `<div class="burbuja${animar ? " entra" : ""}">${escapar(texto)}</div>`;
  return d;
}
function nodoRelevo(guia){
  const g = GUIAS[guia];
  const d = document.createElement("div");
  d.className = "relevo";
  d.style.setProperty("--tono", g.tono);
  if(g.claro) d.style.setProperty("--tono-tinta", "var(--azul-900)");
  /* La pastilla siempre es color saturado, así que el contorno del animal se
     fija a tinta azul en vez de heredar `var(--contorno)`: en oscuro ese
     contorno es crema y el bicho quedaba sin borde sobre su propio color. */
  d.innerHTML = `<span>${carita(guia, "var(--arena-50)", 22, {tinta:"#1E2A4A"})}
    ${escapar(b("relevo"))} ${escapar(nombreConArt(guia))}</span>`;
  return d;
}
function nodoEscribiendo(guia){
  const g = GUIAS[guia] || GUIAS.loica;
  const d = document.createElement("div");
  d.className = "turno";
  d.innerHTML = `<div class="avatar">${carita(guia, g.tono, 32)}</div>
    <div class="burbuja"><span class="puntos" role="status"
      aria-label="${escapar(b("pensando"))}"><i></i><i></i><i></i></span></div>`;
  return d;
}

function agregar(turno){
  turnos.push(turno);
  hilo().appendChild(turno.render(true));
  bajar();
}
async function dice(guia, fabricar, pausa = 480){
  const conNombre = guia !== ultimaVoz;   // el nombre solo al tomar la palabra
  ultimaVoz = guia;
  mandaLaVoz(guia);
  agregar({render: a => nodoDice(guia, fabricar(), conNombre, a)});
  await esperar(pausa);
}
const diceClave = (guia, clave, pausa) => dice(guia, () => escapar(b(clave)), pausa);

function responde(fabricar){
  ultimaVoz = null;   // después de que hablas tú, el animal se vuelve a presentar
  /* La primera respuesta es la que convierte la portada en herramienta: el
     hero se compacta y no vuelve a expandirse hasta que se empieza de nuevo. */
  document.body.classList.add("conversando");
  agregar({render: a => nodoMio(fabricar(), a)});
}
async function relevo(guia){
  mandaLaVoz(guia);
  agregar({render: () => nodoRelevo(guia)});
  ultimaVoz = null;
  await esperar(420);
}
async function escribiendo(guia, ms = 700){
  const nodo = nodoEscribiendo(guia);
  hilo().appendChild(nodo);
  bajar();
  await esperar(ms);
  nodo.remove();
}

/* Las opciones son el único turno que se BORRA al usarse: una pregunta
   contestada no debe volver a ofrecerse, ni siquiera al repintar por idioma. */
function preguntar(opciones, corta, alElegir){
  const construir = () => {
    const c = document.createElement("div");
    c.className = "opciones" + (corta ? " corta" : "");
    opciones().forEach(o => {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.className = "opcion";
      if(o.cuantos === 0) bt.dataset.vacio = "1";
      bt.innerHTML =
        (o.mascota ? carita(o.mascota, (GUIAS[o.mascota] || GUIAS.loica).tono, 30) : "")
        + `<span>${escapar(o.titulo)}${o.sub ? `<small>${escapar(o.sub)}</small>` : ""}</span>`
        + (o.cuantos !== undefined ? `<b class="cuantos">${o.cuantos}</b>` : "");
      bt.onclick = () => {
        turnos = turnos.filter(x => x !== turno);
        document.querySelectorAll(".opciones").forEach(n => n.remove());
        alElegir(o);
      };
      c.appendChild(bt);
    });
    return c;
  };
  const turno = {render: construir};
  agregar(turno);
}

function bajar(){
  const u = hilo().lastElementChild;
  if(u) u.scrollIntoView({behavior: reduce() ? "auto" : "smooth", block:"nearest"});
}
function repintar(){
  ultimaVoz = null;
  hilo().innerHTML = "";
  turnos.forEach(tn => hilo().appendChild(tn.render(false)));
  pintarHero();
  document.title = b("titulo") + " — Loica";
}

/* ============================================================
   7. EL GUIÓN
   ============================================================ */
async function arrancar(atajo){
  await diceClave("loica", "hola", 520);
  /* El atajo del hero puede ser una situación (el Cóndor lleva a música) o
     una compañía (el Pudú lleva a "ando con niños"), porque el Pudú no guía
     ninguna situación: se hace cargo de con quién vas y de la plata. */
  if(atajo && COMPANIAS[atajo]){
    respuestas.compania = atajo;
    responde(() => COMPANIAS[atajo][IDIOMA][0]);
    await esperar(320);
    await diceClave("loica", "atajoTomado");
  } else if(atajo){
    respuestas.situacion = atajo;
    responde(() => situacionPorId(atajo)[IDIOMA][0]);
    await esperar(320);
    await diceClave("loica", "atajoTomado");
  } else {
    await diceClave("loica", "q1");
  }
  preguntarCuando();
}

/* Cuántos eventos hay realmente detrás de cada rango. Se calcula antes de
   preguntar para poder mostrarlo: elegir "Hoy" a ciegas y caer en cero es la
   peor primera impresión posible. */
function conteoPorRango(){
  const vig = EVENTOS.filter(ev => ev.fecha >= empiezaDia(new Date()));
  const n = {};
  ORDEN_CUANDO.forEach(k => n[k] = vig.filter(ev => RANGOS_BOT[k](ev.fecha)).length);
  /* "Esta noche" comparte el filtro de fecha con "Hoy" — la hora se aplica
     después, en el puntaje — así que el conteo saldría idéntico y dos
     opciones con el mismo número se leen como un error. Acá sí se cuenta por
     hora: los de las 18 en adelante, más los que no publicaron hora, que
     bien pueden ser de noche y no hay cómo descartarlos. */
  n.noche = vig.filter(ev => RANGOS_BOT.hoy(ev.fecha)
    && (ev.fecha.getHours() >= 18 || (!ev.fecha.getHours() && !ev.fecha.getMinutes()))).length;
  return n;
}

function preguntarCuando(atajo){
  const n = conteoPorRango();
  preguntar(
    () => ORDEN_CUANDO.map(id => ({
      id, titulo:b("cuando")[id], sub:b("cuandoSub")[id], cuantos:n[id],
    })),
    false,
    async o => {
      respuestas.cuando = o.id;
      responde(() => b("cuando")[respuestas.cuando]);
      await esperar(320);
      if(respuestas.compania) preguntarSituacion();
      else preguntarCompania();
    });
}

/* ¿CON QUIÉN VAS?
   La pregunta que faltaba, y la que más cambia una recomendación. "Teatro" no
   significa lo mismo en una cita un viernes que para una mamá con un niño de
   cinco: es la misma categoría y son dos panoramas distintos. Sin esto, una
   función de terror sin marcar podía salir como plan infantil. */
async function preguntarCompania(){
  await escribiendo("loica", 560);
  await diceClave("loica", "q1b");
  const vig = EVENTOS.filter(ev => ev.fecha >= empiezaDia(new Date())
    && (RANGOS_BOT[respuestas.cuando] || RANGOS_BOT.todo)(ev.fecha));
  preguntar(
    () => ORDEN_COMPANIA.map(id => ({
      id, mascota:GUIA_COMPANIA[id],
      titulo:COMPANIAS[id][IDIOMA][0], sub:COMPANIAS[id][IDIOMA][1],
      /* Para niños el conteo es el de la allowlist, que es mucho más chico y
         conviene que se vea antes de elegir: es la única forma honesta de
         adelantar que el catálogo tiene poco para ellos. */
      cuantos: id === "ninos" ? vig.filter(ev => ev.paraNinos).length : vig.length,
    })),
    false,
    async o => {
      respuestas.compania = o.id;
      responde(() => COMPANIAS[respuestas.compania][IDIOMA][0]);
      await esperar(340);
      if(respuestas.situacion) tomaElMando();
      else preguntarSituacion();
    });
}

async function preguntarSituacion(){
  await escribiendo("loica", 600);
  await diceClave("loica", "q2");
  preguntar(
    /* Vetadas las que no se pueden cumplir con esa compañía: ofrecerle
       "salir de noche" a alguien que anda con un niño de cinco es prometer
       algo que el catálogo no tiene. */
    () => situacionesDe(respuestas.compania).map(s => ({
      id:s.id, mascota:s.guia, titulo:s[IDIOMA][0], sub:s[IDIOMA][1],
    })),
    false,
    async o => {
      respuestas.situacion = o.id;
      responde(() => situacionPorId(respuestas.situacion)[IDIOMA][0]);
      await esperar(340);
      tomaElMando();
    });
}

/* El relevo: el animal de la situación se presenta y hace su repregunta. */
async function tomaElMando(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.guia !== "loica") await relevo(sit.guia);
  await escribiendo(sit.guia, 620);
  await dice(sit.guia, () => escapar(sit.saludo[IDIOMA]), 520);
  await dice(sit.guia, () => escapar(sit.pregunta[IDIOMA]), 320);
  preguntar(
    () => sit.opciones.map(o => ({id:o.id, titulo:o[IDIOMA]})),
    false,
    async o => {
      respuestas.detalle = o.id;
      const elegida = sit.opciones.find(x => x.id === o.id);
      ajuste = elegida.efecto || {};
      respuestas.cats = elegida.cats;
      responde(() => sit.opciones.find(x => x.id === respuestas.detalle)[IDIOMA]);
      await esperar(340);
      if(sit.dominio === "descuentos") preguntarSectorDcto();
      else preguntarSectorSiSobra();
    });
}

/* La pregunta de sector aparece SOLO cuando sobran candidatos. Preguntar por
   comuna cuando hay seis resultados es burocracia; preguntarlo cuando hay
   ciento veinte es lo que hace la recomendación buena. */
const UMBRAL_SECTOR = 25;

async function preguntarSectorSiSobra(){
  const sit = situacionPorId(respuestas.situacion);
  const base = candidatos(sit, {soloGratis:false, sector:"todo"});
  if(base.length < UMBRAL_SECTOR){ preguntarPlata(); return; }

  await escribiendo(sit.guia, 520);
  await dice(sit.guia, () => escapar(b("qSector").replace("{n}", base.length)), 320);
  const n = {};
  ["centro","oriente","norte","sur"].forEach(s =>
    n[s] = base.filter(ev => enSector(ev, s)).length);
  n.todo = base.length;
  preguntar(
    () => ["centro","oriente","norte","sur","todo"].map(id => ({
      id, titulo:b("sector")[id], sub:b("sectorSub")[id], cuantos:n[id],
    })),
    false,
    async o => {
      respuestas.sector = o.id;
      responde(() => b("sector")[respuestas.sector]);
      await esperar(340);
      preguntarPlata();
    });
}

async function preguntarSectorDcto(){
  const sit = situacionPorId(respuestas.situacion);
  await escribiendo("guaren", 520);
  await dice("guaren", () => escapar(b("qSector").replace("{n}",
    rankearDescuentos(DESCUENTOS, respuestas.cats, "todo", false).length)), 320);
  const n = {};
  ["centro","oriente","norte","sur"].forEach(s =>
    n[s] = rankearDescuentos(DESCUENTOS, respuestas.cats, s, false).length);
  n.todo = rankearDescuentos(DESCUENTOS, respuestas.cats, "todo", false).length;
  preguntar(
    () => ["centro","oriente","norte","sur","todo"].map(id => ({
      id, titulo:b("sector")[id], sub:b("sectorSub")[id], cuantos:n[id],
    })),
    false,
    async o => {
      respuestas.sector = o.id;
      responde(() => b("sector")[respuestas.sector]);
      await esperar(340);
      recomendarDescuentos();
    });
}

/* El Degú siempre entra para la plata: lo gratis es su trabajo, y por eso es
   el único que aparece en todas las conversaciones de eventos. Antes esto lo
   conducía el Pudú, que ahora se hace cargo del aire libre; si se cambia el
   animal hay que cambiar los cuatro llamados juntos, porque si no uno toma el
   micrófono y otro se presenta. */
async function preguntarPlata(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.guia !== "degu") await relevo("degu");
  await escribiendo("degu", 560);
  if(sit.guia !== "degu") await diceClave("degu", "deguSePresenta", 460);
  await diceClave("degu", "qPlata", 300);
  const base = candidatos(sit, {soloGratis:false, sector:respuestas.sector || "todo"});
  const n = {
    gratis: base.filter(ev => ev.gratis).length,
    barato: base.filter(ev => ev.gratis || (ev.precio && ev.precio <= 10000)).length,
    igual:  base.length,
  };
  preguntar(
    () => ["gratis","barato","igual"].map(id => ({
      id, mascota: id === "gratis" ? "degu" : id === "barato" ? "guaren" : "loica",
      titulo:b("plata")[id], sub:b("plataSub")[id], cuantos:n[id],
    })),
    false,
    async o => {
      respuestas.plata = o.id;
      responde(() => b("plata")[respuestas.plata]);
      await esperar(340);
      recomendar();
    });
}

/* ---- Candidatos: el mismo cálculo que usan los conteos y el resultado ---- */
function filtrosDe(extra = {}){
  return {
    soloGratis: extra.soloGratis !== undefined ? extra.soloGratis : respuestas.plata === "gratis",
    techoPlata: (extra.plata || respuestas.plata) === "barato" ? 10000 : null,
    sector: extra.sector || respuestas.sector || "todo",
    compania: extra.compania || respuestas.compania || "solo",
    ajuste,
  };
}
function candidatos(sit, extra){
  const rango = RANGOS_BOT[respuestas.cuando] || RANGOS_BOT.todo;
  const vig = EVENTOS.filter(ev => ev.fecha >= empiezaDia(new Date()) && rango(ev.fecha));
  return rankear(vig, sit, filtrosDe(extra));
}

/* ---- El resultado, en boca del animal que lleva el tema ---- */
async function recomendar(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.guia !== "degu") await relevo(sit.guia);
  await escribiendo(sit.guia, 900);

  /* "Esta noche" no filtra por hora — medio catálogo no publica hora — sino
     que empuja la franja nocturna en el puntaje. */
  if(respuestas.cuando === "noche" && !ajuste.horaIdeal)
    ajuste = {...ajuste, horaIdeal:[18,4]};

  ranking = candidatos(sit, {});
  let amplio = false;

  // Si la ventana elegida no da para tres, se abre ANTES de decir que no hay
  // nada. Y se avisa: la Loica no finge que encontró.
  if(ranking.length < 3 && respuestas.cuando !== "todo"){
    const guardado = respuestas.cuando;
    respuestas.cuando = "semana";
    const otro = candidatos(sit, {});
    if(otro.length > ranking.length){ ranking = otro; amplio = true; }
    else respuestas.cuando = guardado;
  }

  if(!ranking.length){
    await diceClave(sit.guia, "nada");
    pintarAcciones({sinMas:true});
    return;
  }

  if(amplio)
    await dice(sit.guia, () => escapar(b("poco").replace("{cuando}", frase())), 420);
  else if(ranking.length > 6)
    await dice(sit.guia, () => escapar(b("cuantos").replace("{n}", ranking.length)), 420);
  else
    await dice(sit.guia, () => escapar(
      b(ranking.length === 1 ? "listoUno" : "listo").replace("{cuando}", frase())), 420);

  mostrados = 0; codaPuesta = false;
  pintarLote();
}

/* "este finde, de noche, en el oriente y sin gastar un peso" */
function frase(){
  const sit = situacionPorId(respuestas.situacion);
  const comp = COMPANIAS[respuestas.compania];
  const partes = [
    b("cuandoDicho")[respuestas.cuando],
    comp ? comp.dicho[IDIOMA] : "",
    sit.dicho[IDIOMA],
    b("sectorDicho")[respuestas.sector || "todo"],
  ].filter(Boolean);
  const plata = b("plataDicho")[respuestas.plata];
  const y = IDIOMA === "es" ? " y " : IDIOMA === "pt" ? " e " : " and ";
  return partes.join(", ") + (plata ? y + plata : "");
}

function pintarLote(){
  const lote = ranking.slice(mostrados, mostrados + 3);
  mostrados += lote.length;
  const construir = () => {
    const c = document.createElement("div");
    c.className = "resultados";
    lote.forEach(ev => c.appendChild(
      tarjetaEvento(ev, e => location.href = `e/${e.id}.html`)));
    return c;
  };
  agregar({render: construir});
  pintarAcciones({sinMas: mostrados >= ranking.length});
  codaDelGuaren();
}

/* ---- La yapa del Guarén ----
   Solo si el plan se paga y solo una vez por conversación. Es el cruce que
   justifica tener las dos bases en la misma página: te recomendé un panorama
   pagado, y de paso te digo dónde comer barato cerca ese mismo día. */
async function codaDelGuaren(){
  if(codaPuesta || respuestas.plata === "gratis") return;
  if(situacionPorId(respuestas.situacion).dominio === "descuentos") return;
  const comida = ["restaurantes","restaurantes-y-bares","cafeterias","comida-rapida"];
  const cerca = rankearDescuentos(DESCUENTOS, comida, respuestas.sector || "todo", true);
  if(!cerca.length) return;
  codaPuesta = true;

  await esperar(700);
  await relevo("guaren");
  await diceClave("guaren", "guarenSePresenta", 420);
  await diceClave("guaren", "guarenCoda", 360);
  const uno = cerca[0];
  agregar({render: () => {
    const c = document.createElement("div");
    c.className = "resultados";
    c.appendChild(tarjetaDescuento(uno, () => location.href = "descuentos.html"));
    return c;
  }});
  await diceClave("guaren", "guarenTarjeta", 200);
}

/* ---- El camino propio del Guarén ---- */
async function recomendarDescuentos(){
  await escribiendo("guaren", 900);
  const lista = rankearDescuentos(DESCUENTOS, respuestas.cats, respuestas.sector, false);
  if(!lista.length){
    await diceClave("guaren", "guarenNada");
    pintarAcciones({sinMas:true, dctos:true});
    return;
  }
  ranking = lista;
  await dice("guaren", () => escapar(
    b("cuantos").replace("{n}", lista.length)), 420);
  mostrados = 0; codaPuesta = true;
  pintarLoteDctos();
}

function pintarLoteDctos(){
  const lote = ranking.slice(mostrados, mostrados + 3);
  mostrados += lote.length;
  const construir = () => {
    const c = document.createElement("div");
    c.className = "resultados";
    lote.forEach(d => c.appendChild(
      tarjetaDescuento(d, () => location.href = "descuentos.html")));
    return c;
  };
  agregar({render: construir});
  pintarAcciones({sinMas: mostrados >= ranking.length, dctos:true});
}

function pintarAcciones({sinMas, dctos}){
  turnos = turnos.filter(tn => !tn.esAccion);
  document.querySelectorAll(".acciones").forEach(n => n.remove());
  const construir = () => {
    const c = document.createElement("div");
    c.className = "acciones";
    if(!sinMas){
      const mas = document.createElement("button");
      mas.className = "boton"; mas.type = "button";
      mas.textContent = b("bMas");
      mas.onclick = async () => {
        turnos = turnos.filter(tn => !tn.esAccion);
        c.remove();
        responde(() => b("bMas"));
        const guia = dctos ? "guaren" : situacionPorId(respuestas.situacion).guia;
        await escribiendo(guia, 600);
        await diceClave(guia, "masTitulo");
        dctos ? pintarLoteDctos() : pintarLote();
      };
      c.appendChild(mas);
    }
    const otra = document.createElement("button");
    otra.className = "boton secundario"; otra.type = "button";
    otra.textContent = b("bOtra");
    otra.onclick = () => reiniciar();
    c.appendChild(otra);

    const ir = document.createElement("a");
    ir.className = "boton secundario";
    ir.href = dctos ? "descuentos.html" : "mapa.html";
    ir.textContent = dctos ? b("bDctos") : b("bMapa");
    c.appendChild(ir);
    return c;
  };
  agregar({render: construir, esAccion: true});
}

async function reiniciar(atajo){
  turnos = []; respuestas = {}; ajuste = {}; ranking = [];
  mostrados = 0; ultimaVoz = null; codaPuesta = false;
  hilo().innerHTML = "";
  /* Volver a empezar devuelve el hero a su tamaño y la página al rojo de la
     anfitriona — salvo que vengas por un atajo, donde la conversación ya
     arrancó y expandir el hero sería un salto para atrás. */
  mandaLaVoz("loica");
  if(!atajo) document.body.classList.remove("conversando");
  await arrancar(atajo);
}

/* ============================================================
   8. EL HERO
   Los nueve animales del desfile son atajos: tocar al Cóndor arranca la
   conversación en música sin pasar por la pregunta de "¿qué se te antoja?".
   ============================================================ */
function pintarHero(){
  document.querySelectorAll("[data-bot]").forEach(el => el.textContent = b(el.dataset.bot));
  // El filo del medio sigue el color del guía de turno: el relevo se ve en el paisaje
  document.getElementById("cordillera").innerHTML = cordillera({tono:"var(--guia)"});
  const globo = document.getElementById("loica-globo");
  globo.textContent = b("saludoGlobo");

  const guia = document.getElementById("loica-guia");
  const posarse = () => {
    guia.innerHTML = cuerpo("loica", "var(--acento)", 196);
    guia.classList.add("posada");
    globo.classList.add("visible");
  };
  if(!guia.dataset.lista){
    guia.dataset.lista = "1";
    if(reduce()) posarse();
    else{
      guia.innerHTML = cuerpo("loica", "var(--acento)", 196, {pose:"volando"});
      guia.addEventListener("animationend", posarse, {once:true});
    }
  }

  /* Cada bicho con su fase, para que no marchen todos igual. Solo entran los
     que tienen una situación asignada: un animal que no lleva a ninguna parte
     no debería invitar a tocarlo. */
  /* Cada bicho lleva a lo suyo: ocho a una situación y el Pudú a una
     compañía, porque él no guía una situación — se hace cargo de con quién
     vas y de la plata, que son las dos preguntas de quien sale con la casa. */
  const destinoDe = clave => {
    const porComp = Object.keys(GUIA_COMPANIA).find(k => GUIA_COMPANIA[k] === clave
      && !situacionPorGuia(clave));
    if(porComp) return {tipo:"compania", id:porComp, rotulo:COMPANIAS[porComp][IDIOMA][0]};
    const sit = situacionPorGuia(clave);
    return sit ? {tipo:"situacion", id:sit.id, rotulo:sit[IDIOMA][0]} : null;
  };
  document.getElementById("desfile").innerHTML = ELENCO
    .map(a => ({a, d: destinoDe(a.clave)}))
    .filter(x => x.d)
    .map(({a, d}, i) => {
      const g = GUIAS[a.clave];
      return `<button class="bicho-hero" data-sit="${d.id}"
          style="animation-delay:${(i * .27).toFixed(2)}s;--tono:${g.tono}${
            g.claro ? ";--rotulo-tinta:var(--azul-900)" : ""}"
          aria-label="${escapar(a[IDIOMA][0])} — ${escapar(d.rotulo)}">
          ${cuerpo(a.clave, a.hex, 74)}
          <span class="rotulo">${escapar(d.rotulo)}</span></button>`;
    }).join("");

  document.querySelectorAll(".bicho-hero").forEach(bt => bt.onclick = () => {
    document.querySelector(".conversa").scrollIntoView({
      behavior: reduce() ? "auto" : "smooth", block:"start"});
    reiniciar(bt.dataset.sit);
  });
}

/* ============================================================
   9. ARRANQUE
   ============================================================ */
pintarBarra("habla.html", "");
pintarHero();

/* El .catch importa: sin él, si eventos.json falla el usuario se queda con
   una Loica muda para siempre. Es el hoyo anotado en _critica_diseno.md.
   Los descuentos son opcionales: si fallan, el Guarén simplemente no aparece. */
Promise.all([
  cargarEventos(),
  cargarDescuentos().then(d => d.descuentos).catch(() => []),
])
  .then(([evs, dctos]) => {
    marcar(evs);
    EVENTOS = evs; DESCUENTOS = dctos;
    arrancar();
  })
  .catch(() => agregar({render: a => nodoDice("loica", escapar(b("error")), true, a)}));

window.addEventListener("loica:idioma", repintar);
</script>
