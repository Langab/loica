<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras.
     - `upgrade-insecure-requests` tampoco va: en Pages no hace nada (https +
       HSTS) y en el servidor local abierto desde el celular por la IP de la
       red subía loica.js y loica.css a un https:// inexistente, y la página
       quedaba en blanco. El detalle está en mapa.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">

<meta name="description" content="Escríbele a la Loica qué andas buscando —«jazz el sábado», «gratis con niños»— y el animal guía que sabe de eso te recomienda un panorama en Santiago.">

<meta property="og:image" content="https://loicasantiago.cl/og-default.png">

<style>
  /* ============================================================
     HABLA CON LA LOICA — v2
     Tres capas, y cada una tiene un trabajo:

       EL CIELO   (fijo, detrás de todo). Santiago de fondo: las manchas de
                  color del que tiene la palabra derivando despacio, y la
                  cordillera con la ciudad abajo, a media tinta. En escritorio
                  se ve a los costados de la hoja todo el tiempo; en celular
                  asoma al final, cuando la conversación se acaba. De noche
                  se le prenden las ventanas.
       EL ESCENARIO (arriba, se va con el scroll). La cordillera a todo color
                  y el elenco paseando encima. Cada animal es un atajo: tocar
                  al Cóndor parte la conversación en música. Mide lo justo
                  para que la conversación empiece a la vista.
       LA HOJA    (lo principal). La conversación. Su cabecera es PEGAJOSA y
                  dice quién te está atendiendo, con el animal en grande y
                  con sus tics: cuando el Culpeo toma el turno, el Cóndor se
                  baja y el Culpeo entra a escena con su propia entrada (las
                  de loica.css). Eso es el relevo, y es la firma de la página.

     Lo que no cambió: `--guia` es el color del que tiene la palabra y de él
     cuelgan la precordillera, las manchas, el filo de la hoja, la repisa de
     las opciones y el hilo. La mascota es la señalética, aplicada a toda la
     superficie. Y la regla de los tres tokens por animal:
       --guia        relleno fuerte. Filos, repisas, bordes. NUNCA texto.
       --guia-suave  pastel. Fondo de pastilla, con tinta azul encima.
       --guia-tinta  la única versión que puede SER texto (ya viene invertida
                     para oscuro desde loica.css).
     ============================================================ */
  body{overflow-x:hidden}
  :root{--guia:var(--acento); --guia-suave:var(--rojo-200); --guia-tinta:var(--acento-solido);
        --alto-escribe:72px; --hoja-pad:var(--e-3)}
  @media(min-width:732px){:root{--hoja-pad:var(--e-5)}}

  /* ---------- EL CIELO ----------
     `z-index:-1` sobre un fijo: se pinta encima del lienzo (el fondo del
     body) y debajo de todo lo que fluye. Ninguna otra capa tiene que
     declarar nada para quedar por delante. */
  .cielo{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--fondo)}
  .cielo .mancha{position:absolute;border-radius:50%;opacity:.15;
    transition:background-color var(--lento);
    animation:deriva 54s ease-in-out infinite alternate}
  .cielo .m1{width:min(58vw,560px);height:min(58vw,560px);background:var(--guia);top:-16vh;left:-14vw}
  .cielo .m2{width:min(42vw,420px);height:min(42vw,420px);background:var(--guia-suave);top:6vh;right:-12vw;
    animation-delay:-21s;animation-duration:66s}
  .cielo .m3{width:min(34vw,300px);height:min(34vw,300px);background:var(--c-otros);bottom:16vh;left:8vw;
    animation-delay:-38s;animation-duration:60s}
  @keyframes deriva{from{transform:translate(0,0) scale(1)}to{transform:translate(4vw,3vh) scale(1.08)}}
  /* En oscuro las manchas se mezclan con `screen` y el pastel se lee como
     suciedad: las dos que siguen al guía usan su color fuerte. */
  :root[data-tema="oscuro"] .cielo .mancha{mix-blend-mode:screen;opacity:.2}
  :root[data-tema="oscuro"] .cielo .m2{background:var(--guia)}

  /* Santiago, lejos. La misma cordillera del sistema, a media tinta, pegada
     al borde de abajo. En celular vive justo sobre el cuadro de escribir,
     para que asome cuando la hoja se acaba. */
  .cielo .lejos{position:absolute;left:0;right:0;
    bottom:calc(var(--hueco-nav) + var(--alto-escribe));height:150px;opacity:.3;
    transition:opacity var(--lento)}
  .cielo .lejos .cerros{height:100%}
  @media(min-width:880px){.cielo .lejos{bottom:0;height:min(28vh,240px);opacity:.38}}
  /* De noche, ventanas. Son rectángulos sobre los edificios de la silueta,
     en la misma caja 1200×150 que dibuja `cordillera()`, y parpadean de a
     uno. Solo existen en oscuro: de día una ventana prendida no se ve. */
  .cielo .luces{display:none;position:absolute;inset:0;width:100%;height:100%}
  :root[data-tema="oscuro"] .cielo .lejos{opacity:.55}
  :root[data-tema="oscuro"] .cielo .luces{display:block}
  .luces rect{fill:var(--amarillo-300);animation:ventana 7s ease-in-out infinite;
    animation-delay:calc(var(--d,0) * 1s)}
  @keyframes ventana{0%,100%{opacity:.12}50%{opacity:.95}}

  /* ---------- EL ESCENARIO ---------- */
  .escenario{position:relative;height:118px;overflow:hidden;z-index:1}
  .escenario .cerros{height:100%}
  .escenario h1{position:absolute;left:var(--e-4);top:10px;z-index:2;margin:0;
    font-size:19px;line-height:1;letter-spacing:-.02em;color:var(--tinta);pointer-events:none}
  .escenario h1 small{display:none;font:600 12px/1.3 var(--fuente-ui);color:var(--tinta-suave);
    letter-spacing:.01em;margin-top:5px}
  /* En escritorio el título gana su bajada y el escenario crece para que los
     dos quepan sin pisarse: el desfile va centrado y a 1280px ocupa desde
     x≈290, justo encima de donde termina la bajada. Con 152px de alto un
     animal caía sobre el texto; con 184 el título respira arriba y el
     desfile camina abajo. */
  @media(min-width:760px){
    .escenario{height:184px}
    .escenario h1{font-size:25px;top:var(--e-4);
      left:max(var(--e-5),calc((100vw - 960px) / 2 + var(--e-5)))}
    .escenario h1 small{display:block;max-width:34ch}
    .desfile{bottom:26px}
    .bicho-hero svg{width:clamp(48px,5.4vw,66px)}
  }

  /* El elenco paseando, y son botones. */
  /* A 22px del suelo del escenario y no a 12: la hoja se mete 14px bajo la
     cordillera, y ahí abajo las patas del desfile y la repisa del que habla
     (que va a -6) quedaban cortadas por el filo de la hoja. */
  .desfile{position:absolute;inset:auto 0 22px 0;display:flex;align-items:flex-end;
    justify-content:center;gap:clamp(0px,1.4vw,16px);padding:0 var(--e-2)}
  .bicho-hero{display:flex;align-items:flex-end;justify-content:center;
    background:none;border:0;padding:0 1px;cursor:pointer;position:relative;
    min-height:48px;min-width:34px;transform-origin:bottom center}
  .bicho-hero svg{width:clamp(34px,8.4vw,58px);height:auto;transition:transform var(--rebote)}
  .bicho-hero:hover svg,.bicho-hero:focus-visible svg{transform:translateY(-8px) scale(1.1)}
  .bicho-hero.habla svg{transform:translateY(-5px) scale(1.14)}
  /* La repisa bajo las patas del que habla. Es una BARRA y no un disco detrás
     porque el dibujo lleva contorno `var(--contorno)`, que en oscuro es
     crema: sobre un disco pastel el animal desaparecería. */
  .bicho-hero::after{content:"";position:absolute;left:50%;bottom:-6px;width:0;height:6px;
    border-radius:var(--r-pill);background:var(--tono);box-shadow:0 0 0 2px var(--contorno);
    opacity:0;pointer-events:none;transition:width var(--medio),left var(--medio),opacity var(--medio)}
  .bicho-hero.habla::after{left:10%;width:80%;opacity:1}
  /* El nombre, al pasar por encima. NO se deja fijo sobre el que habla:
     encima del desfile está el título de la página y abajo la cabecera dice
     su nombre a 27px, así que un tercer rótulo en el medio solo chocaba con
     el título. Quién habla ya lo dice la repisa de color bajo las patas. */
  .bicho-hero .rotulo{position:absolute;inset:auto 50% calc(100% + 5px) auto;transform:translateX(50%);
    background:var(--tono-suave,var(--fondo-elevado));color:var(--azul-900);
    border:2px solid var(--contorno);border-radius:var(--r-pill);padding:3px 9px;
    font:800 12px/1 var(--fuente-marca);white-space:nowrap;opacity:0;
    transition:opacity var(--rapido);pointer-events:none;box-shadow:var(--repisa-1);z-index:3}
  .bicho-hero:hover .rotulo,.bicho-hero:focus-visible .rotulo{opacity:1}
  /* Con el dedo, los diez se reparten el ancho entero y la celda mide ≥48 de
     alto: es la única forma de acercarse a 44 con diez animales a 375px. */
  @media(max-width:560px) and (pointer:coarse){
    .desfile{gap:0;padding:0 4px}
    .bicho-hero{flex:1;min-width:0}
  }

  /* ---------- LA HOJA ----------
     Se mete 14px bajo la cordillera: el paisaje cae dentro de la
     conversación, no queda pegado arriba como una portada. Lleva margen a
     los costados en celular para que el cielo asome, y termina con borde y
     aire abajo: al final de la conversación aparece Santiago. */
  .hoja{position:relative;z-index:2;max-width:720px;margin:-14px 6px calc(var(--alto-escribe) + 140px);
    background:var(--fondo-hundido);border:2.5px solid var(--contorno);border-top:0;
    border-radius:var(--r-xl);padding:0 var(--hoja-pad) var(--e-6);min-height:42vh;
    animation:hoja-sube .6s cubic-bezier(.2,0,0,1) backwards;animation-delay:.1s}
  @media(min-width:732px){.hoja{margin-left:auto;margin-right:auto}}
  @media(min-width:880px){.hoja{margin-bottom:calc(var(--alto-escribe) + 220px)}}
  @keyframes hoja-sube{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- QUIÉN ATIENDE ----------
     La cabecera de la hoja, y es pegajosa: mientras lees la conversación
     sabes quién te está hablando sin buscar la última pastilla de relevo. El
     filo de 7px en `--guia` es la señal grande del turno, y al pegarse
     arriba queda como franja de color sobre la pantalla entera.
     Cubre los bordes de la hoja con márgenes negativos para que, pegada o en
     su sitio, se lea como la misma caja. `overflow:hidden` es para que las
     entradas de los animales (que vienen de 160-220px fuera) se recorten en
     el marco y parezca que entran por el costado. */
  .atiende{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:auto 1fr auto;
    align-items:end;gap:var(--e-3);
    margin:0 calc(-1 * var(--hoja-pad) - 2.5px) var(--e-4);
    padding:2px var(--e-3) 0;min-height:88px;background:var(--fondo-elevado);
    border:2.5px solid var(--contorno);border-top:7px solid var(--guia);
    border-radius:var(--r-xl) var(--r-xl) 0 0;overflow:hidden;
    transition:border-color var(--lento)}
  .atiende-bicho{width:90px;height:84px;display:flex;align-items:flex-end;justify-content:center;position:relative}
  .atiende-bicho svg{width:84px;height:84px;display:block}
  .atiende-bicho.sale .masc{animation:bicho-sale .26s ease-in forwards}
  @keyframes bicho-sale{to{transform:translateY(20px) scale(.8);opacity:0}}
  /* Cada burbuja del que atiende le da un brinquito. Pisa el tic de reposo
     medio segundo y el tic vuelve solo. */
  .atiende-bicho.habla .masc{animation:habla-bob .5s ease-in-out}
  @keyframes habla-bob{0%,100%{transform:none}30%{transform:translateY(-7px)}60%{transform:translateY(0)}80%{transform:translateY(-3px)}}
  .atiende-texto{padding-bottom:12px;min-width:0}
  .atiende-eyebrow{display:block;font:800 11px/1 var(--fuente-marca);letter-spacing:.08em;
    text-transform:uppercase;color:var(--tinta-tenue);margin-bottom:5px}
  .atiende-nombre{display:block;font:800 var(--t-lg)/1.05 var(--fuente-marca);color:var(--guia-tinta);
    letter-spacing:-.02em;transition:color var(--lento)}
  .atiende-rol{display:block;font:600 var(--t-sm)/1.3 var(--fuente-ui);color:var(--tinta-suave);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .atiende-texto.pop .atiende-nombre,.atiende-texto.pop .atiende-rol{animation:nombre-pop .5s var(--rebote) backwards}
  .atiende-texto.pop .atiende-rol{animation-delay:.08s}
  @keyframes nombre-pop{from{transform:translateY(8px) scale(.92);opacity:0}to{transform:none;opacity:1}}
  .atiende-reiniciar{align-self:center;width:42px;height:42px;border-radius:50%;flex:none;
    border:2.5px solid var(--contorno);background:var(--fondo-hundido);color:var(--tinta);
    display:grid;place-items:center;cursor:pointer;box-shadow:var(--repisa-1);
    transition:transform var(--rapido),box-shadow var(--rapido)}
  .atiende-reiniciar svg{width:20px;height:20px}
  .atiende-reiniciar:hover{transform:translateY(-1px)}
  .atiende-reiniciar:active{transform:translateY(3px);box-shadow:none}
  .atiende-reiniciar:focus-visible{box-shadow:var(--repisa-1),0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}
  @media(min-width:760px){
    .atiende{min-height:100px;padding-left:var(--e-4);padding-right:var(--e-4)}
    .atiende-bicho{width:104px;height:96px}
    .atiende-bicho svg{width:96px;height:96px}
    .atiende-nombre{font-size:var(--t-xl)}
  }

  /* ---------- CONVERSACIÓN ----------
     EL HILO. Una línea baja por la columna de los avatares y se tiñe del
     color de quien tenía la palabra en cada tramo: al llegar abajo queda un
     registro de por cuántas manos pasaste. Se dibuja turno por turno, cada
     tramo sube hasta el avatar anterior. */
  #hilo{position:relative}
  .turno{display:flex;gap:var(--e-3);margin-bottom:var(--e-3);align-items:flex-end;
    position:relative;--sube:var(--e-3);scroll-margin-bottom:calc(var(--alto-escribe) + 20px)}
  .turno.mia{flex-direction:row-reverse}
  .turno + .relevo{margin-top:var(--e-5)}
  .turno::before{content:"";position:absolute;left:21.5px;top:calc(-1 * var(--sube));
    height:calc(100% - 23px + var(--sube));width:3px;border-radius:2px;
    background:var(--voz,var(--guia));opacity:.45}
  /* Turnos agrupados: el mismo animal dos veces seguidas. El medallón se
     esconde en el de ARRIBA (la cara queda al pie del grupo), la burbuja de
     arriba pierde el pico, y el hueco baja a 4px. */
  .turno.mismo{--sube:var(--e-1)}
  .turno:has(+ .turno.mismo){margin-bottom:var(--e-1)}
  .turno:has(+ .turno.mismo) .avatar{visibility:hidden}
  .turno:has(+ .turno.mismo) .burbuja{border-bottom-left-radius:var(--r-lg)}
  .turno:has(+ .turno.mismo)::before{bottom:0;height:auto}
  #hilo > .turno:first-child:has(+ .turno.mismo)::before,
  .relevo + .turno:has(+ .turno.mismo)::before{top:0;bottom:0;height:auto}
  .turno.mia::before{height:100%;background:var(--guia);opacity:.22}
  #hilo > .turno:first-child::before,
  .relevo + .turno::before{top:auto;bottom:23px;height:calc(100% - 46px)}

  .avatar{flex:none;width:46px;height:46px;border-radius:var(--r-pill);
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    display:grid;place-items:center;box-shadow:var(--repisa-1);position:relative;z-index:1}
  .avatar svg{width:32px;height:32px}
  .burbuja{max-width:min(86%,54ch);padding:var(--e-3) var(--e-4);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    background:var(--fondo-elevado);box-shadow:var(--repisa-2);
    border-bottom-left-radius:var(--e-1);font-size:var(--t-base);line-height:1.5}
  .burbuja em{font-style:normal;font-weight:700;color:var(--guia-tinta)}
  .quien{display:block;font:800 var(--t-xs)/1 var(--fuente-marca);letter-spacing:.04em;
    text-transform:uppercase;color:var(--voz-tinta,var(--acento-solido));margin-bottom:5px}
  .turno.mia .burbuja{background:var(--tinta);color:var(--fondo-elevado);
    border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--e-1);
    font-family:var(--fuente-marca);font-weight:700}
  :root[data-tema="oscuro"] .turno.mia .burbuja{border-color:var(--azul-800)}
  .aparece{animation:burbuja-entra var(--rebote) backwards}
  @keyframes burbuja-entra{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

  /* EL RELEVO. El momento más importante de la conversación: de acá en
     adelante te habla otro. Pastel del animal con tinta azul encima (9-11:1
     en los dos modos). */
  .relevo{display:flex;align-items:center;gap:var(--e-3);margin:var(--e-6) 0 var(--e-5);
    scroll-margin-bottom:calc(var(--alto-escribe) + 20px)}
  .relevo::before,.relevo::after{content:"";flex:1;height:2px;background:var(--contorno);opacity:.28;border-radius:2px}
  .relevo span{display:inline-flex;align-items:center;gap:8px;flex:none;
    padding:7px 16px 7px 8px;border:2.5px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--tono-suave);color:var(--azul-900);
    font:800 var(--t-sm)/1 var(--fuente-marca);box-shadow:var(--repisa-2);
    animation:burbuja-entra var(--rebote) backwards}
  .relevo svg{width:24px;height:24px}

  .puntos{display:flex;gap:5px;padding:var(--e-1) var(--e-2)}
  .puntos i{width:8px;height:8px;border-radius:50%;background:var(--tinta-tenue);animation:latir-punto 1.1s infinite ease-in-out}
  .puntos i:nth-child(2){animation-delay:.16s}
  .puntos i:nth-child(3){animation-delay:.32s}
  @keyframes latir-punto{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* ---------- LAS OPCIONES ----------
     Grilla, no riel: acá hay que VER todas para elegir. Entran de a una, con
     45ms entre cada una, para que la grilla se arme delante tuyo. */
  .opciones{display:grid;gap:var(--e-2);margin:var(--e-2) 0 var(--e-5) calc(46px + var(--e-3));
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    scroll-margin-bottom:calc(var(--alto-escribe) + 20px)}
  .opciones.elenco{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(min-width:640px){.opciones.elenco{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:540px){.opciones{margin-left:0}}
  /* --- El escalonado de entrada, en un solo lugar ---
     Regla 8.4 de _direccion_visual.md: se escalonan los primeros DOCE, 20ms
     entre uno y otro, 240ms de tope. Los tres escalonados de esta página lo
     incumplían con tres constantes distintas —45ms las opciones, 45ms los
     chips de afinar, 90ms los resultados— y ninguno tenía corte: la lista de
     opciones ya son once, así que la última entraba a los 450ms, y bastaba un
     cuarto resultado por lote para que el de los descuentos se pasara.
     `min()` hace de tope sin necesidad de once `nth-child`. */
  .opciones .opcion,.afina .chip,.reco{--paso:20ms}
  .opcion{display:flex;align-items:center;gap:var(--e-3);text-align:left;min-height:60px;
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    background:var(--fondo-elevado);color:var(--tinta);padding:var(--e-2) var(--e-3);cursor:pointer;
    font:700 var(--t-md)/1.2 var(--fuente-marca);
    box-shadow:0 4px 0 var(--marca,var(--guia));
    transition:transform var(--rapido),box-shadow var(--rapido),background-color var(--rapido);
    animation:opcion-entra .38s var(--rebote) backwards;

  },

const b = c => BOT[IDIOMA][c];
const rellena = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");

/* ============================================================
   3. LAS FECHAS
   Lo único que depende del reloj del usuario. Cada "cuándo" es una VENTANA
   [desde, hasta] y cada evento se pregunta si la toca, que no es lo mismo
   que mirar su fecha de inicio: una temporada que abrió en julio toca "hoy",
   y un taller de martes toca "este finde" si tiene sesión el sábado.
   `fechaEn` devuelve la fecha en que IRÍAS dentro de la ventana —la sesión
   del sábado, el día de hoy para la muestra en curso— y esa es la que usa
   el puntaje (hora) y la tarjeta.
   ============================================================ */
const ORDEN_CUANDO = ["hoy","noche","manana","finde","semana","todo"];
const hoy0 = () => empiezaDia(new Date());
function ventanaDe(cuando, dia){
  switch(cuando){
    case "hoy": case "noche": return VENTANAS.hoy();
    case "manana": return VENTANAS.manana();
    case "finde":  return VENTANAS.finde();
    case "semana": return VENTANAS.semana();
    case "dia": { const d = hoy0(); d.setDate(d.getDate() + ((dia - d.getDay()) + 7) % 7);
                  return [d, terminaDia(d)]; }
    default: return null;
  }
}
function fechaEn(ev, v){
  const ini = new Date(ev.inicio);
  if(isNaN(ini)) return null;
  const fin = ev.fin ? new Date(ev.fin) : null;
  const hoy = hoy0();
  if(ev.dias_semana && ev.dias_semana.length){
    const tope = fin && !isNaN(fin) ? fin : ini;
    const d = new Date(v ? Math.max(v[0], hoy) : hoy); d.setHours(0,0,0,0);
    for(let i = 0; i < 60; i++){
      if(d > tope || (v && d > v[1])) break;
      if(d >= empiezaDia(ini) && ev.dias_semana.includes((d.getDay() + 6) % 7)){
        const f = new Date(d); f.setHours(ini.getHours(), ini.getMinutes(), 0, 0);
        return f;
      }
      d.setDate(d.getDate() + 1);
    }
    return null;
  }
  // Temporada en curso: abrió antes de hoy y sigue. Sin hora: es de día entero.
  if(fin && !isNaN(fin) && fin > ini && ini < hoy){
    if(!v) return hoy;
    return (ini <= v[1] && fin >= v[0]) ? new Date(Math.max(v[0], hoy)) : null;
  }
  if(!v) return ini >= hoy ? ini : null;
  return (ini >= v[0] && ini <= v[1]) ? ini : null;
}
/* El pool de candidatos para una ventana. Copia liviana con `fecha` puesta
   en la sesión que toca; los flags de `marcar` (recurrente, paraNinos,
   esTaller) viajan con el spread. Se memoriza por ventana porque los conteos
   de las opciones lo piden seis veces seguidas. */
const poolCache = new Map();
function poolEn(cuando, dia){
  const clave = cuando + ":" + (dia ?? "") + ":" + IDIOMA;
  if(poolCache.has(clave)) return poolCache.get(clave);
  const v = ventanaDe(cuando, dia);
  let out = [];
  for(const ev of CATALOGO){
    const f = fechaEn(ev, v);
    if(f) out.push(f.getTime() === ev.fecha.getTime() ? ev : {...ev, fecha:f});
  }
  /* "Esta noche" comparte la ventana con "Hoy" y se separa por la hora. Los
     que no publicaron hora NO se botan —son un sexto del catálogo y bien
     pueden ser de noche—, así que la regla es "de las 6 en adelante, o sin
     hora". Filtrar y no solo puntuar es lo que hace que el conteo de la
     opción diga algo distinto al de "Hoy": con el mismo número las dos
     opciones se leían como un error. */
  if(cuando === "noche") out = out.filter(ev =>
    ev.fecha.getHours() >= 18 || (!ev.fecha.getHours() && !ev.fecha.getMinutes()));
  poolCache.set(clave, out);
  return out;
}

/* ============================================================
   4. ESTADO
   El historial se guarda como lista de turnos repintables para poder
   redibujar todo al cambiar de idioma.
   ============================================================ */
let CATALOGO = [], DESCUENTOS = null, cargaDescuentos = null;
let turnos = [], respuestas = {};
let ranking = [], mostrados = 0, ultimaVoz = null, guiaActual = "loica", empezo = false;

const hilo = () => el("hilo");
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
/* "Movimiento reducido" es no animar, no responder al instante: si las
   opciones aparecen en 0 ms caen bajo el dedo que acaba de tocar la anterior
   y el usuario contesta sin querer la pregunta siguiente. */
const esperar = ms => new Promise(r => setTimeout(r, reduce() ? Math.min(ms, 220) : ms));

/* ============================================================
   5. QUIÉN TIENE LA PALABRA
   `mandaLaVoz` pinta el color en toda la superficie; `atender` hace el
   relevo en la cabecera: el que estaba se baja y el nuevo entra con su
   propia entrada (las de loica.css: la Loica vuela, el Cóndor planea, el
   Chungungo trota, el Guarén sale de la muralla).
   ============================================================ */
function mandaLaVoz(guia){
  const g = GUIAS[guia] || GUIAS.loica;
  guiaActual = GUIAS[guia] ? guia : "loica";
  document.documentElement.style.setProperty("--guia", g.tono);
  document.documentElement.style.setProperty("--guia-suave", g.suave);
  document.documentElement.style.setProperty("--guia-tinta", g.tinta);
  document.querySelectorAll(".bicho-hero").forEach(bt => {
    const habla = bt.dataset.guia === guiaActual;
    bt.classList.toggle("habla", habla);
    if(habla) bt.setAttribute("aria-current", "true"); else bt.removeAttribute("aria-current");
  });
}
function rolDe(guia){
  if(guia === "loica" && !(respuestas.situacion === "panorama")) return b("anfitriona");
  const sit = SITUACIONES.find(s => s.guia === guia && (guia !== "loica" || respuestas.situacion === "panorama"));
  return sit ? sit[IDIOMA][0] : elenco(guia)[IDIOMA][1];
}
let atendiendo = null;
async function atender(guia, {entrada = true} = {}){
  const caja = el("atiende-bicho"), texto = el("atiende-texto");
  const tamano = matchMedia("(min-width:760px)").matches ? 96 : 84;
  if(atendiendo === guia){ pintarAtiendeTexto(guia); return; }
  if(atendiendo && entrada && !reduce()){
    caja.classList.add("sale");
    await esperar(240);
    caja.classList.remove("sale");
  }
  atendiendo = guia;
  caja.innerHTML = cuerpo(guia, hexDe(guia), tamano, {anima:true});
  caja.style.setProperty("--d", "0s");
  if(entrada && !reduce()){
    caja.classList.add("entra");
    const svg = caja.querySelector("svg");
    const fin = () => caja.classList.remove("entra");
    svg.addEventListener("animationend", fin, {once:true});
    setTimeout(fin, 1600);
  }
  pintarAtiendeTexto(guia);
  texto.classList.remove("pop"); void texto.offsetWidth; texto.classList.add("pop");
}
function pintarAtiendeTexto(guia){
  el("atiende-eyebrow").textContent = b("atiende");
  el("atiende-nombre").textContent = nombreGuia(guia);
  el("atiende-rol").textContent = rolDe(guia);
}
function brinca(){
  const caja = el("atiende-bicho");
  if(reduce()) return;
  caja.classList.remove("habla"); void caja.offsetWidth; caja.classList.add("habla");
  setTimeout(() => caja.classList.remove("habla"), 520);
}

/* ============================================================
   6. NODOS DE LA CONVERSACIÓN
   ============================================================ */
function nodoDice(guia, html, conNombre, animar){
  const g = GUIAS[guia] || GUIAS.loica;
  const d = document.createElement("div");
  d.className = "turno" + (conNombre ? "" : " mismo");
  d.style.setProperty("--voz", g.tono);
  d.style.setProperty("--voz-tinta", g.tinta);
  d.innerHTML = `<div class="avatar">${carita(guia, g.tono, 32)}</div>
    <div class="burbuja${animar ? " aparece" : ""}">
      ${conNombre ? `<b class="quien">${escapar(nombreGuia(guia))}</b>` : ""}${html}</div>`;
  return d;
}
function nodoMio(texto, animar){
  const d = document.createElement("div");
  d.className = "turno mia";
  d.innerHTML = `<div class="burbuja${animar ? " aparece" : ""}">${escapar(texto)}</div>`;
  return d;
}
function nodoRelevo(guia){
  const g = GUIAS[guia];
  const d = document.createElement("div");
  d.className = "relevo";
  d.style.setProperty("--tono", g.tono);
  d.style.setProperty("--tono-suave", g.suave);
  /* Pastel del animal con el dibujo en tinta azul fija: en oscuro
     `var(--contorno)` es crema y el bicho quedaba sin borde sobre el pastel. */
  d.innerHTML = `<span>${carita(guia, g.tono, 22, {tinta:"#1E2A4A"})}
    ${escapar(b("relevo"))} ${escapar(nombreConArt(guia))}</span>`;
  return d;
}
function nodoEscribiendo(guia){
  const g = GUIAS[guia] || GUIAS.loica;
  const d = document.createElement("div");
  d.className = "turno";
  d.style.setProperty("--voz", g.tono);
  d.innerHTML = `<div class="avatar">${carita(guia, g.tono, 32)}</div>
    <div class="burbuja"><span class="puntos" role="status"
      aria-label="${escapar(b("pensando"))}"><i></i><i></i><i></i></span></div>`;
  return d;
}

function agregar(turno){
  turnos.push(turno);
  const nodo = turno.render(true);
  hilo().appendChild(nodo);
  bajar(nodo);
}
async function dice(guia, fabricar, pausa = 420){
  const conNombre = guia !== ultimaVoz;   // el nombre solo al tomar la palabra
  ultimaVoz = guia;
  mandaLaVoz(guia);
  agregar({render: a => nodoDice(guia, fabricar(), conNombre, a)});
  if(guia === atendiendo) brinca();
  await esperar(pausa);
}
const diceClave = (guia, clave, vars, pausa) =>
  dice(guia, () => escapar(rellena(b(clave), vars || {})), pausa);

function responde(fabricar){
  empezo = true;
  agregar({render: a => nodoMio(fabricar(), a)});
}
async function relevo(guia){
  mandaLaVoz(guia);
  agregar({render: () => nodoRelevo(guia)});
  ultimaVoz = null;
  await atender(guia);
  await esperar(360);
}
async function escribiendo(guia, ms = 420){
  mandaLaVoz(guia);
  const nodo = nodoEscribiendo(guia);
  hilo().appendChild(nodo);
  bajar(nodo);
  await esperar(ms);
  nodo.remove();
}

/* Las opciones son el único turno que se BORRA al usarse: una pregunta
   contestada no debe volver a ofrecerse, ni siquiera al repintar por idioma. */
function preguntar(opciones, clase, alElegir){
  const construir = () => {
    const c = document.createElement("div");
    c.className = "opciones" + (clase ? " " + clase : "");
    opciones().forEach((o, i) => {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.className = "opcion";
      bt.style.setProperty("--i", i);
      bt.style.setProperty("--marca", o.mascota ? (GUIAS[o.mascota] || GUIAS.loica).tono : "var(--guia)");
      if(o.cuantos === 0) bt.dataset.vacio = "1";
      bt.innerHTML =
        (o.mascota ? carita(o.mascota, (GUIAS[o.mascota] || GUIAS.loica).tono, 30) : "")
        + `<span>${escapar(o.titulo)}${o.sub ? `<small>${escapar(o.sub)}</small>` : ""}</span>`
        + (o.cuantos !== undefined ? `<b class="cuantos">${o.cuantos}</b>` : "");
      bt.onclick = () => {
        turnos = turnos.filter(x => x !== turno);
        document.querySelectorAll(".opciones").forEach(n => n.remove());
        alElegir(o);
      };
      c.appendChild(bt);
    });
    return c;
  };
  const turno = {render: construir, esPregunta: true};
  agregar(turno);
}
function quitarPreguntas(){
  turnos = turnos.filter(tn => !tn.esPregunta && !tn.esAccion);
  document.querySelectorAll(".opciones, .afina").forEach(n => n.remove());
}

/* No se baja la página antes de que el usuario haya hecho algo: la primera
   pantalla tiene que quedar quieta con la Loica a la vista. Después, cada
   turno nuevo se trae a la vista por su borde de abajo, y si es más alto que
   media pantalla, por el de arriba. */
function bajar(nodo){
  if(!empezo) return;
  const alto = nodo.getBoundingClientRect().height;
  nodo.scrollIntoView({behavior: reduce() ? "auto" : "smooth",
    block: alto > innerHeight * .55 ? "start" : "end"});
}
function repintar(){
  ultimaVoz = null;
  poolCache.clear();
  hilo().innerHTML = "";
  turnos.forEach(tn => hilo().appendChild(tn.render(false)));
  pintarEscenario();
  pintarEscribe();
  atender(atendiendo || "loica", {entrada:false});
  document.title = b("titulo") + " — Loica";
}

/* ============================================================
   7. EL GUIÓN
   situación → la repregunta del animal → cuándo → resultado → afinar.
   Tres toques hasta el resultado; desde el cuadro de texto pueden ser cero.
   ============================================================ */
async function arrancar(){
  await atender("loica", {entrada:false});
  await diceClave("loica", "hola", {}, 380);
  await diceClave("loica", "qQue", {}, 0);
  preguntarQue();
}
function filtros(extra = {}){
  const sit = situacionPorId(respuestas.situacion) || situacionPorId("panorama");
  const opcion = (sit.opciones || []).find(o => o.id === respuestas.opcion);
  const ajuste = Object.assign({}, opcion ? opcion.efecto : {});
  if(respuestas.cuando === "noche" || respuestas.deNoche){ if(!ajuste.horaIdeal) ajuste.horaIdeal = [18,4]; }
  return Object.assign({
    compania: respuestas.compania || "cualquiera",
    soloGratis: respuestas.plata === "gratis",
    techoPlata: respuestas.plata === "barato" ? 10000 : null,
    sector: respuestas.sector || "todo",
    comuna: respuestas.comuna || null,
    ajuste,
  }, extra);
}
function candidatos(extra = {}){
  const sit = situacionPorId(respuestas.situacion);
  const cuando = extra.cuando || respuestas.cuando || "todo";
  const dia = extra.cuando ? extra.dia : respuestas.dia;
  let lista = rankear(poolEn(cuando, dia), sit, filtros(extra.filtros || {}));
  if(respuestas.palabras && respuestas.palabras.length){
    const conPalabra = lista.filter(ev => coincidePalabras(ev, respuestas.palabras));
    if(conPalabra.length) lista = conPalabra;
  }
  return lista;
}

function preguntarQue(){
  preguntar(() => SITUACIONES.map(s => ({
    id:s.id, mascota:s.guia, titulo:s[IDIOMA][0], sub:s[IDIOMA][1], cuantos: conteoSituacion(s),
  })), "elenco", o => elegirSituacion(o.id));
}
function conteoSituacion(s){
  if(s.dominio === "descuentos") return DESCUENTOS ? DESCUENTOS.length : undefined;
  return rankear(poolEn("todo"), s, {compania:"cualquiera", sector:"todo", ajuste:{}}).length;
}
async function elegirSituacion(id, dicho){
  const sit = situacionPorId(id);
  respuestas.situacion = id;
  responde(() => dicho || situacionPorId(id)[IDIOMA][0]);
  await esperar(280);
  await tomaElMando();
}

/* El relevo: el animal de la situación se presenta y hace su repregunta —
   salvo que ya venga contestada desde el texto libre. */
async function tomaElMando(){
  const sit = situacionPorId(respuestas.situacion);
  if(sit.dominio === "descuentos") return caminoDelGuaren();
  if(sit.guia !== guiaActual || atendiendo !== sit.guia) await relevo(sit.guia);
  await escribiendo(sit.guia, 380);
  await dice(sit.guia, () => escapar(sit.saludo[IDIOMA]), 300);
  if(respuestas.opcion && sit.opciones.some(o => o.id === respuestas.opcion)) return despuesDeOpcion();
  await dice(sit.guia, () => escapar(sit.pregunta[IDIOMA]), 0);
  preguntar(() => sit.opciones.map(o => ({
    id:o.id, titulo:o[IDIOMA], cuantos: conteoOpcion(sit, o),
  })), "", async o => {
    respuestas.opcion = o.id;
    responde(() => (sit.opciones.find(x => x.id === respuestas.opcion) || {})[IDIOMA]);
    await esperar(280);
    despuesDeOpcion();
  });
}
/* Cuántos hay detrás de cada opción. Si la opción define un calce fuerte
   (rock, comedia, natación) se cuentan SOLO los fuertes: es el número que
   convierte una elección a ciegas en una decisión, y no miente. */
function conteoOpcion(sit, o){
  const cuando = respuestas.cuando || "todo";
  const lista = rankear(poolEn(cuando, respuestas.dia), sit, filtros({ajuste:o.efecto || {}}));
  return defineFuerte(o.efecto) ? lista.filter(ev => esFuerte(ev, o.efecto)).length : lista.length;
}
async function despuesDeOpcion(){
  const sit = situacionPorId(respuestas.situacion);
  if(respuestas.cuando) return recomendar();
  await escribiendo(sit.guia, 320);
  await dice(sit.guia, () => escapar(b("qCuando")), 0);
  preguntarCuando();
}
function preguntarCuando(){
  const sit = situacionPorId(respuestas.situacion);
  const opcion = (sit.opciones || []).find(o => o.id === respuestas.opcion);
  /* El número cuenta lo mismo que promete la opción ya elegida. Contando
     todos los candidatos, "Clásica y jazz" ofrecía 23 para este finde y
     acto seguido el Cóndor decía "de clásica y jazz no tengo nada": las dos
     cifras eran ciertas y juntas se leían como una contradicción. */
  const fuerte = opcion && defineFuerte(opcion.efecto);
  const n = {};
  ORDEN_CUANDO.forEach(k => {
    const lista = candidatos({cuando:k});
    n[k] = fuerte ? lista.filter(ev => esFuerte(ev, opcion.efecto)).length : lista.length;
  });
  preguntar(() => ORDEN_CUANDO.map(id => ({
    id, titulo:b("cuando")[id], sub:b("cuandoSub")[id], cuantos:n[id],
  })), "", async o => {
    respuestas.cuando = o.id; delete respuestas.dia;
    responde(() => b("cuando")[respuestas.cuando]);
    await esperar(280);
    recomendar();
  });
}

/* ---- El resultado, en boca del animal que lleva el tema ---- */
function cuandoDicho(){
  if(respuestas.cuando === "dia") return b("elDia")[respuestas.dia];
  return b("cuandoDicho")[respuestas.cuando || "todo"];
}
/* "este finde, en pareja, de noche, en el oriente y sin gastar un peso" */
function frase(){
  const sit = situacionPorId(respuestas.situacion);
  const comp = COMPANIAS[respuestas.compania];
  const partes = [
    cuandoDicho(),
    /* La compañía no se repite cuando ES la situación: el camino del Pudú
       decía "este finde, con niños, con niños y sin gastar un peso". */
    comp && respuestas.compania !== respuestas.situacion ? comp.dicho[IDIOMA] : "",
    sit ? sit.dicho[IDIOMA] : "",
    respuestas.comuna ? (IDIOMA === "en" ? "in " : IDIOMA === "pt" ? "em " : "en ") + respuestas.comuna
                      : b("sectorDicho")[respuestas.sector || "todo"],
  ].filter(Boolean);
  const plata = respuestas.plata ? b("plataDicho")[respuestas.plata] : "";
  const y = IDIOMA === "es" ? " y " : IDIOMA === "pt" ? " e " : " and ";
  return partes.join(", ") + (plata ? y + plata : "");
}
async function recomendar({afinado = false} = {}){
  const sit = situacionPorId(respuestas.situacion);
  const opcion = (sit.opciones || []).find(o => o.id === respuestas.opcion);
  quitarPreguntas();
  if(atendiendo !== sit.guia) await relevo(sit.guia);
  await escribiendo(sit.guia, afinado ? 420 : 640);

  ranking = candidatos();
  let amplio = null;
  /* Si la ventana elegida no da para tres, se abre ANTES de decir que no hay
     nada. Y se avisa: la Loica no finge que encontró. */
  if(ranking.length < 3 && respuestas.cuando !== "todo" && !afinado){
    for(const otro of (respuestas.cuando === "semana" ? ["todo"] : ["semana","todo"])){
      const lista = candidatos({cuando:otro});
      if(lista.length > ranking.length){ ranking = lista; amplio = otro; break; }
    }
  }

  if(!ranking.length){
    if(afinado) await diceClave(sit.guia, respuestas.compania === "ninos" && sit.id !== "ninos" ? "ninosNada" : "afinadoNada", {}, 200);
    else await diceClave(sit.guia, "nada", {}, 200);
    if(afinado && respuestas.compania === "ninos" && sit.id !== "ninos"){
      pintarAfinar({extra:[{texto:b("aPudu"), mascota:"pudu", alPulsar:() => { respuestas = {compania:"ninos"}; elegirSituacion("ninos"); }}], sinMas:true});
      return;
    }
    if(afinado){ ranking = []; }
    pintarAfinar({sinMas:true, sinFiltros:true});
    return;
  }

  const vars = {cuando: amplio ? b("cuandoDicho")[amplio] : cuandoDicho(), n: ranking.length};
  if(afinado){
    await diceClave(sit.guia, ranking.length === 1 ? "afinadoUno" : "afinado", vars, 320);
  } else if(amplio){
    await diceClave(sit.guia, "poco", {cuando: frase(), nuevo: b("cuandoDicho")[amplio]}, 320);
  } else if(opcion && defineFuerte(opcion.efecto)){
    const nF = ranking.filter(ev => esFuerte(ev, opcion.efecto)).length;
    vars.que = opcion[IDIOMA].toLowerCase(); vars.n = nF;
    await diceClave(sit.guia, nF >= 3 ? "fuertes" : nF > 0 ? "fuertesPocos" : "fuertesNada", vars, 320);
  } else if(ranking.length > 6){
    await diceClave(sit.guia, "cuantos", vars, 320);
  } else {
    vars.cuando = frase();
    await diceClave(sit.guia, ranking.length === 1 ? "listoUno" : "listo", vars, 320);
  }
  mostrados = 0;
  pintarLote();
}

/* Por qué salió cada uno. Tres pastillas como máximo: el calce fuerte con la
   repregunta, la plata y la fecha. */
function razonesDe(ev){
  const sit = situacionPorId(respuestas.situacion);
  const opcion = sit && (sit.opciones || []).find(o => o.id === respuestas.opcion);
  const r = [];
  if(opcion && defineFuerte(opcion.efecto) && esFuerte(ev, opcion.efecto)) r.push({t: opcion[IDIOMA], c:""});
  if(ev.gratis) r.push({t: t("gratis"), c:"libre"});
  else if(ev.precio && ev.precio <= 10000) r.push({t: b("rBarato"), c:"neutro"});
  if(ev.esTaller && ev.dias_semana && ev.dias_semana.length)
    r.push({t: ev.dias_semana.map(i => t("dias")[i]).join(" · "), c:"neutro"});
  else if(enCartelera(ev)) r.push({t: b("rCartelera"), c:"neutro"});
  else if(mismaFecha(ev.fecha, new Date())) r.push({t: b("rHoy"), c:"neutro"});
  if(ev.paraNinos && (sit?.id === "ninos" || respuestas.compania === "ninos")) r.push({t: b("rNinos"), c:"neutro"});
  return r.slice(0, 3);
}
function firmar(nodo, guia){
  nodo.style.setProperty("--guia", (GUIAS[guia] || GUIAS.loica).tono);
  nodo.style.setProperty("--guia-suave", (GUIAS[guia] || GUIAS.loica).suave);
  return nodo;
}
function pintarLote(){
  const lote = ranking.slice(mostrados, mostrados + 3);
  mostrados += lote.length;
  const guia = situacionPorId(respuestas.situacion)?.guia || "loica";
  const construir = () => {
    const c = document.createElement("div");
    c.className = "resultados";
    firmar(c, guia);
    lote.forEach((ev, i) => {
      const w = document.createElement("div");
      w.className = "reco"; w.style.setProperty("--i", i);
      w.appendChild(tarjetaEvento(ev, e => location.href = "e/" + encodeURIComponent(e.id) + ".html"));
      const razones = razonesDe(ev);
      if(razones.length){
        const p = document.createElement("div");
        p.className = "porque";
        p.innerHTML = razones.map(r => `<span class="${r.c}">${escapar(r.t)}</span>`).join("");
        w.appendChild(p);
      }
      c.appendChild(w);
    });
    return c;
  };
  agregar({render: construir});
  pintarAfinar({sinMas: mostrados >= ranking.length});
}

/* ---- Afinar: chips después del resultado ---- */
function pintarAfinar({sinMas, sinFiltros, dctos, extra = []} = {}){
  turnos = turnos.filter(tn => !tn.esAccion);
  document.querySelectorAll(".afina").forEach(n => n.remove());
  const sit = situacionPorId(respuestas.situacion);
  const esTaller = sit && (sit.opciones || []).find(o => o.id === respuestas.opcion)?.efecto?.soloTalleres;
  const construir = () => {
    const c = document.createElement("div");
    c.className = "afina";
    const chips = [];
    const chip = (texto, alPulsar, {principal, mascota, href} = {}) => {
      const n = document.createElement(href ? "a" : "button");
      n.className = "chip" + (principal ? " principal" : "");
      if(href) n.href = href; else { n.type = "button"; n.onclick = alPulsar; }
      n.innerHTML = (mascota ? carita(mascota, (GUIAS[mascota] || GUIAS.loica).tono, 22) : "") + escapar(texto);
      chips.push(n);
    };
    extra.forEach(x => chip(x.texto, x.alPulsar, {mascota:x.mascota, principal:true}));
    if(!sinMas) chip(b("aMas"), mas, {principal: !extra.length});
    if(!sinFiltros && !dctos){
      if(respuestas.plata !== "gratis" && ranking.some(ev => ev.gratis)) chip(b("aGratis"), () => afinar({plata:"gratis"}, b("aGratis")), {mascota:"degu"});
      if(!respuestas.sector && !respuestas.comuna && ranking.length > 4) chip(b("aSector"), preguntarSector);
      if(!respuestas.compania && sit?.id !== "ninos") chip(b("aQuien"), preguntarQuien);
    }
    if(dctos && !respuestas.sector && !respuestas.comuna && ranking.length > 4) chip(b("aSector"), preguntarSector);
    chip(b("aOtra"), () => reiniciar());
    if(dctos) chip(b("aDctos"), null, {href:"descuentos.html"});
    else chip(esTaller ? b("aTalleres") : b("aMapa"), null, {href: esTaller ? "talleres.html" : "mapa.html"});
    chips.forEach((n, i) => { n.style.setProperty("--i", i); c.appendChild(n); });
    return c;
  };
  agregar({render: construir, esAccion: true});
}
async function mas(){
  quitarPreguntas();
  responde(() => b("aMas"));
  const dctos = situacionPorId(respuestas.situacion)?.dominio === "descuentos";
  const guia = dctos ? "guaren" : situacionPorId(respuestas.situacion)?.guia || "loica";
  await escribiendo(guia, 380);
  if(mostrados >= ranking.length){ await diceClave(guia, "seAcabaron", {}, 0); pintarAfinar({sinMas:true, dctos}); return; }
  await diceClave(guia, "masTitulo", {}, 0);
  dctos ? pintarLoteDctos() : pintarLote();
}
async function afinar(cambio, dicho){
  quitarPreguntas();
  const antes = Object.assign({}, respuestas);
  Object.assign(respuestas, cambio);
  responde(() => dicho);
  await esperar(240);
  if(situacionPorId(respuestas.situacion)?.dominio === "descuentos") return recomendarDescuentos({afinado:true});
  const antesRanking = ranking;
  await recomendar({afinado:true});
  /* Si el filtro dejó cero, se devuelve: el usuario se queda con los de antes
     y el chip de ese filtro desaparece porque ya se probó. */
  if(!ranking.length){ respuestas = antes; ranking = antesRanking; mostrados = Math.min(mostrados, ranking.length); }
}
async function preguntarSector(){
  quitarPreguntas();
  const sit = situacionPorId(respuestas.situacion);
  const guia = sit.dominio === "descuentos" ? "guaren" : sit.guia;
  responde(() => b("aSector"));
  await escribiendo(guia, 320);
  await dice(guia, () => escapar(b("qSector")), 0);
  const n = {};
  ["centro","oriente","norte","sur","todo"].forEach(s =>
    n[s] = sit.dominio === "descuentos"
      ? rankearDescuentos(descuentosDe(), s, null, respuestas.cuando === "hoy").length
      : candidatos({filtros:{sector:s}}).length);
  preguntar(() => ["centro","oriente","norte","sur","todo"].map(id => ({
    id, titulo:b("sector")[id], sub:b("sectorSub")[id], cuantos:n[id],
  })), "", o => afinar({sector:o.id, comuna:null}, b("sector")[o.id]));
}
async function preguntarQuien(){
  quitarPreguntas();
  const sit = situacionPorId(respuestas.situacion);
  responde(() => b("aQuien"));
  await escribiendo(sit.guia, 320);

  })), "", o => afinar({compania:o.id}, COMPANIAS[o.id][IDIOMA][0]));
}
const GUIA_COMPANIA = {solo:"loica", pareja:"chinchilla", amigos:"culpeo", ninos:"pudu"};

/* ============================================================
   8. EL CAMINO DEL GUARÉN (descuentos de banco)
   Solo si lo pides. Los descuentos se cargan recién acá: la página de
   panoramas no tiene por qué bajar 745 convenios que nadie pidió.
   ============================================================ */
function descuentosDe(){
  const sit = situacionPorId("comer");
  const op = sit.opciones.find(o => o.id === respuestas.opcion);
  const cats = op ? op.cats : [].concat(...sit.opciones.map(o => o.cats));
  return (DESCUENTOS || []).filter(d => cats.includes(d.categoria));
}
/* El lugar se pregunta a los locales del convenio, no al convenio: el 40% de
   Burger King de Cencosud vale en diecisiete comunas y tiene que salir tanto
   en "el centro" como en "el oriente", porque en ambos hay uno. Basta con que
   UN local caiga en el sector o la comuna.
   El convenio que no declaró ningún local igual pasa el filtro de sector
   —el banco dijo que existe, no dónde queda— pero no el de comuna, que es una
   pregunta que no se le puede contestar sin inventar.
   Acá había además un deduplicador por comercio+banco, porque el JSON traía
   una fila por sucursal y la lista mostraba veintiún Dunkin' seguidos. Desde
   el 25-08-2026 cada fila ya es un convenio: lo que cuentan los chips y lo que
   se pinta después son la misma cosa sin ayuda. */
function rankearDescuentos(lista, sector, comuna, soloHoy){
  return lista
    .filter(d => !soloHoy || correHoy(d))
    .filter(d => !comuna || (d.comunas || []).includes(comuna))
    .filter(d => !sector || sector === "todo" || !(d.comunas || []).length
                 || (d.comunas || []).some(c => enSector({comuna:c}, sector)))
    .sort((a, z) => (z.porcentaje || 0) - (a.porcentaje || 0));
}
async function caminoDelGuaren(){
  const sit = situacionPorId("comer");
  if(!DESCUENTOS) await (cargaDescuentos || pedirDescuentos());
  if(atendiendo !== "guaren") await relevo("guaren");
  await escribiendo("guaren", 380);
  await dice("guaren", () => escapar(sit.saludo[IDIOMA]), 300);
  if(respuestas.opcion && sit.opciones.some(o => o.id === respuestas.opcion)) return despuesDeComida();
  await dice("guaren", () => escapar(sit.pregunta[IDIOMA]), 0);
  preguntar(() => sit.opciones.map(o => ({
    id:o.id, titulo:o[IDIOMA],
    cuantos: rankearDescuentos((DESCUENTOS || []).filter(d => o.cats.includes(d.categoria)), respuestas.sector, respuestas.comuna, false).length,
  })), "", async o => {
    respuestas.opcion = o.id;
    responde(() => (sit.opciones.find(x => x.id === respuestas.opcion) || {})[IDIOMA]);
    await esperar(280);
    despuesDeComida();
  });
}
async function despuesDeComida(){
  if(respuestas.cuando){ respuestas.cuando = ["hoy","noche"].includes(respuestas.cuando) ? "hoy" : "todo"; return recomendarDescuentos(); }
  await escribiendo("guaren", 320);
  await dice("guaren", () => escapar(b("qDia")), 0);
  preguntar(() => ["hoy","todo"].map(id => ({
    id, titulo:b("dia")[id], sub:b("diaSub")[id],
    cuantos: rankearDescuentos(descuentosDe(), respuestas.sector, respuestas.comuna, id === "hoy").length,
  })), "", async o => {
    respuestas.cuando = o.id;
    responde(() => b("dia")[o.id]);
    await esperar(280);
    recomendarDescuentos();
  });
}
async function recomendarDescuentos({afinado = false} = {}){
  quitarPreguntas();
  if(atendiendo !== "guaren") await relevo("guaren");
  await escribiendo("guaren", afinado ? 400 : 640);
  ranking = rankearDescuentos(descuentosDe(), respuestas.sector, respuestas.comuna, respuestas.cuando === "hoy");
  if(!ranking.length){
    await diceClave("guaren", afinado ? "afinadoNada" : "guarenNada", {}, 0);
    pintarAfinar({sinMas:true, dctos:true});
    return;
  }
  if(afinado) await diceClave("guaren", ranking.length === 1 ? "afinadoUno" : "afinado", {n:ranking.length}, 300);
  else await diceClave("guaren", "guarenListo", {cuando: respuestas.cuando === "hoy" ? b("cuandoDicho").hoy : b("cuandoDicho").todo}, 300);
  mostrados = 0;
  pintarLoteDctos();
  if(!afinado) await diceClave("guaren", "guarenTarjeta", {}, 0);
}
function pintarLoteDctos(){
  const lote = ranking.slice(mostrados, mostrados + 3);
  mostrados += lote.length;
  const construir = () => {
    const c = document.createElement("div");
    c.className = "resultados";
    firmar(c, "guaren");
    lote.forEach((d, i) => {
      const w = document.createElement("div");
      w.className = "reco"; w.style.setProperty("--i", i);
      w.appendChild(tarjetaDescuento(d, () => location.href = "descuentos.html"));
      c.appendChild(w);
    });
    return c;
  };
  agregar({render: construir});
  pintarAfinar({sinMas: mostrados >= ranking.length, dctos:true});
}
function pedirDescuentos(){
  cargaDescuentos = cargarDescuentos().then(d => { DESCUENTOS = d.descuentos || []; })
    .catch(() => { DESCUENTOS = []; });
  return cargaDescuentos;
}

/* ============================================================
   9. EL TEXTO LIBRE
   Lo que escribes pasa por `interpretar` (recomendador.js). Lo que entiende
   lo contesta el animal que corresponde; lo que no, lo busca por palabra en
   los títulos; y si tampoco, lo dice.
   ============================================================ */
async function escuchar(textoCrudo){
  const texto = textoCrudo.trim();
  if(!texto) return;
  quitarPreguntas();
  responde(() => texto);
  await esperar(200);
  const r = interpretar(texto);

  if(r.comando === "mas"){
    if(ranking.length && mostrados < ranking.length) return mas();
    await escribiendo("loica", 300);
    await diceClave("loica", ranking.length ? "seAcabaron" : "noEntendi", {}, 0);
    if(!ranking.length) preguntarQue();
    return;
  }
  if(r.comando === "otra") return reiniciar({sinSaludo:true});
  if(r.comando === "mapa"){ location.href = "mapa.html"; return; }
  if(r.vacio){
    await escribiendo("loica", 300);
    await diceClave("loica", "noEntendi", {}, 0);
    preguntarQue();
    return;
  }

  /* Los modificadores se acumulan sobre lo ya conversado; una situación
     nueva parte de cero con lo que se dijo en esta frase. */
  const cambia = {};
  if(r.cuando){ cambia.cuando = r.cuando; cambia.dia = r.dia; }
  if(r.deNoche) cambia.deNoche = true;
  if(r.plata) cambia.plata = r.plata;
  if(r.comuna){ cambia.comuna = r.comuna; cambia.sector = r.sector; }
  else if(r.sector){ cambia.sector = r.sector; cambia.comuna = null; }
  if(r.compania) cambia.compania = r.compania;

  if(r.situacion){
    respuestas = Object.assign({}, cambia, {situacion:r.situacion, opcion:r.opcion, palabras:r.palabras});
    if(r.situacion === "gratis") respuestas.plata = "gratis";
    if(r.situacion === "ninos") respuestas.compania = "ninos";
    const sit = situacionPorId(r.situacion);
    if(!respuestas.opcion && sit.porDefecto) respuestas.opcion = sit.porDefecto;
    if(r.palabras.length && sit.dominio !== "descuentos"){
      const hay = candidatos({cuando: respuestas.cuando || "todo"}).some(ev => coincidePalabras(ev, r.palabras));
      if(!hay){ respuestas.palabras = []; await escribiendo("loica", 260); await diceClave("loica", "busqueSinPalabra", {q:r.palabras.join(" ")}, 0); }
    }
    await dice("loica", () => escapar(rellena(b("entendi"), {que: resumenDe(r)})), 240);
    return tomaElMando();
  }

  if(r.palabras.length){
    const cuando = cambia.cuando || respuestas.cuando || "todo";
    const dia = cambia.cuando ? cambia.dia : respuestas.dia;
    const pool = poolEn(cuando, dia).filter(ev => coincidePalabras(ev, r.palabras))
      .filter(ev => !cambia.comuna || ev.comuna === cambia.comuna)
      .filter(ev => !cambia.plata || cambia.plata !== "gratis" || ev.gratis)
      .sort((a, z) => a.fecha - z.fecha);
    if(pool.length){
      respuestas = Object.assign({situacion:"panorama", opcion:"seguro"}, cambia, {palabras:r.palabras});
      ranking = pool; mostrados = 0;
      if(atendiendo !== "loica") await relevo("loica");
      await escribiendo("loica", 420);
      await diceClave("loica", pool.length === 1 ? "busqueUno" : "busque", {q:r.palabras.join(" "), n:pool.length}, 320);
      pintarLote();
      return;
    }
    await escribiendo("loica", 300);
    await diceClave("loica", "busqueNada", {q:r.palabras.join(" ")}, 0);
    Object.assign(respuestas, cambia);
    preguntarQue();
    return;
  }

  /* Solo modificadores. Con una conversación andando, afinan; sin ella,
     la Loica parte con lo mejor que haya y eso. */
  if(respuestas.situacion && ranking.length){
    Object.assign(respuestas, cambia);
    await dice("loica", () => escapar(rellena(b("entendi"), {que: resumenDe(r)})), 200);
    if(situacionPorId(respuestas.situacion).dominio === "descuentos"){
      if(cambia.cuando) respuestas.cuando = ["hoy","noche"].includes(cambia.cuando) ? "hoy" : "todo";
      return recomendarDescuentos({afinado:true});
    }
    return recomendar({afinado:true});
  }
  respuestas = Object.assign({}, cambia, {situacion: cambia.compania === "ninos" ? "ninos" : cambia.plata === "gratis" ? "gratis" : "panorama"});
  if(respuestas.situacion === "panorama") respuestas.opcion = "seguro";
  await dice("loica", () => escapar(rellena(b("entendi"), {que: resumenDe(r)})), 240);
  return tomaElMando();
}
function resumenDe(r){
  const partes = [];
  const sit = r.situacion && situacionPorId(r.situacion);
  const op = sit && (sit.opciones || []).find(o => o.id === r.opcion);
  if(op) partes.push(op[IDIOMA]); else if(sit) partes.push(sit[IDIOMA][0]);
  if(r.cuando === "dia") partes.push(b("elDia")[r.dia]); else if(r.cuando) partes.push(b("cuandoDicho")[r.cuando]);
  /* Sin repetir: "con niños" es a la vez la situación del Pudú y la compañía,
     y el resumen salía diciendo "Con niños, este finde, con niños". */
  if(r.compania && r.compania !== r.situacion) partes.push(COMPANIAS[r.compania].dicho[IDIOMA]);
  if(r.comuna) partes.push((IDIOMA === "en" ? "in " : IDIOMA === "pt" ? "em " : "en ") + r.comuna);
  else if(r.sector) partes.push(b("sectorDicho")[r.sector]);
  if(r.plata && r.situacion !== "gratis") partes.push(b("plataDicho")[r.plata]);
  return partes.filter(Boolean).join(", ");
}

async function reiniciar({situacion, sinSaludo} = {}){
  turnos = []; respuestas = {}; ranking = []; mostrados = 0; ultimaVoz = null;
  hilo().innerHTML = "";
  if(situacion){
    empezo = true;
    respuestas.situacion = situacion;
    responde(() => situacionPorId(situacion)[IDIOMA][0]);
    await esperar(200);
    return tomaElMando();
  }
  if(atendiendo !== "loica") await relevo("loica");
  else mandaLaVoz("loica");
  if(sinSaludo){
    await escribiendo("loica", 300);
    await diceClave("loica", "qQueDeNuevo", {}, 0);
    preguntarQue();
    return;
  }
  await arrancar();
}

/* ============================================================
   10. EL ESCENARIO Y EL CUADRO DE ESCRIBIR
   ============================================================ */
function pintarEscenario(){
  el("titulo").innerHTML = `${escapar(b("titulo"))}<small>${escapar(b("bajada"))}</small>`;
  el("cordillera").innerHTML = cordillera({tono:"var(--guia)"});
  /* Santiago lejos: la misma cordillera, más las ventanas de noche. Los
     edificios de la silueta viven en x 110-150, 520-560, 598-622 (la torre),
     700-740 y 1010-1055 de la caja 1200×150. */
  const ventanas = [[118,131],[130,131],[140,131],[528,125],[540,125],[551,125],[604,58],[612,58],[604,76],[612,76],
                    [604,94],[612,94],[604,112],[612,112],[708,130],[720,130],[731,130],[1018,127],[1030,127],[1044,127]];
  el("lejos").innerHTML = cordillera({tono:"var(--guia)"}) +
    `<svg class="luces" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">${
      ventanas.map(([x,y], i) => `<rect x="${x}" y="${y}" width="5" height="4" rx="1" style="--d:${(i * 1.7) % 7}"/>`).join("")}</svg>`;

  const desfile = el("desfile");
  const guias = ELENCO.filter(a => SITUACIONES.some(s => s.guia === a.clave));
  desfile.innerHTML = guias.map((a, i) => {
    const sit = SITUACIONES.find(s => s.guia === a.clave);
    const g = GUIAS[a.clave];
    /* El escalonado sigue la regla 8.4 de _direccion_visual.md: solo los
       primeros doce, 20ms entre uno y otro, 240ms de tope. Estaba en 200ms
       por animal, o sea 2,0 s para que entraran los once: a los dos segundos
       y medio de cargar la página el último todavía se estaba dibujando, y
       quien tocara antes tocaba un botón en movimiento. A 20ms el desfile
       sigue llegando de a uno —se lee como una ola— pero termina en 220ms. */
    return `<button class="bicho-hero" type="button" data-sit="${sit.id}" data-guia="${a.clave}"
        style="--d:${Math.min(i, 11) * 20}ms;--tono:${g.tono};--tono-suave:${g.suave}"
        aria-label="${escapar(a[IDIOMA][0])} — ${escapar(sit[IDIOMA][0])}">
        ${cuerpo(a.clave, a.hex, 58, {anima:true})}
        <span class="rotulo">${escapar(a[IDIOMA][0])}</span></button>`;
  }).join("");
  if(!desfile.dataset.entro){
    desfile.dataset.entro = "1";
    if(!reduce()){
      desfile.classList.add("entra");
      /* 1600 y no 4300: `entra` se quita cuando la última entrada terminó,
         para que los tics de reposo tomen el relevo (las dos animaciones se
         pelean el mismo `animation` del SVG). Con el escalonado en 220ms la
         última acaba antes del segundo; 4,3 s eran de cuando el desfile
         tardaba dos segundos en armarse, y dejaban a los once quietos casi
         tres segundos de más. */
      setTimeout(() => desfile.classList.remove("entra"), 1600);
    }
  }
  document.querySelectorAll(".bicho-hero").forEach(bt => bt.onclick = () => {
    el("hoja").scrollIntoView({behavior: reduce() ? "auto" : "smooth", block:"start"});
    reiniciar({situacion: bt.dataset.sit});
  });
  mandaLaVoz(guiaActual);

  el("btn-reiniciar").setAttribute("aria-label", b("reiniciar"));
  el("btn-reiniciar").title = b("reiniciar");
}
el("btn-reiniciar").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`;
el("btn-reiniciar").onclick = () => reiniciar();

let ejemploI = 0, ejemploTimer = null;
function pintarEscribe(){
  el("escribe-etiqueta").textContent = b("escribe");
  el("escribe-enviar").setAttribute("aria-label", b("enviar"));
  el("escribe-enviar").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="M12 5l7 7-7 7"/></svg>`;
  const input = el("escribe-texto");
  const ejemplos = b("ejemplos");
  input.placeholder = ejemplos[ejemploI % ejemplos.length];
  clearInterval(ejemploTimer);
  /* Los ejemplos rotan para enseñar qué se puede escribir. Se quedan quietos
     cuando el cuadro tiene el foco o texto: ahí ya no enseñan, distraen. */
  ejemploTimer = setInterval(() => {
    if(document.activeElement === input || input.value || reduce()) return;
    input.classList.add("cambia");
    setTimeout(() => { ejemploI++; input.placeholder = ejemplos[ejemploI % ejemplos.length]; input.classList.remove("cambia"); }, 360);
  }, 3800);
}
el("escribe").addEventListener("submit", e => {
  e.preventDefault();
  const input = el("escribe-texto");
  const texto = input.value;
  input.value = ""; el("escribe-caja").classList.remove("con-texto");
  if(matchMedia("(pointer:coarse)").matches) input.blur();
  escuchar(texto);
});
el("escribe-texto").addEventListener("input", e =>
  el("escribe-caja").classList.toggle("con-texto", !!e.target.value.trim()));

/* ============================================================
   11. ARRANQUE
   ============================================================ */
pintarBarra("habla.html", "");
pintarEscenario();
pintarEscribe();

/* Los dos archivos del catálogo. Si fallan los talleres, la página sigue
   con los panoramas; si fallan los panoramas, la Loica lo dice. Los
   descuentos se piden en segundo plano solo para el conteo de "Salir a
   comer"; el camino del Guarén los espera si todavía no llegaron. */
Promise.all([
  cargarEventos(),
  cargarTalleres().then(l => l.map(ev => Object.assign(ev, {esTaller:true}))).catch(() => []),
])
  .then(([evs, talleres]) => {
    CATALOGO = marcar(evs.concat(talleres));
    arrancar();
    pedirDescuentos();
  })
  .catch(() => {
    atender("loica", {entrada:false});
    agregar({render: a => nodoDice("loica", escapar(b("error")), true, a)});
  });

window.addEventListener("loica:idioma", repintar);
</script>
