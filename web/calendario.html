<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Calendario — Loica</title>
<meta name="description" content="Los panoramas de Santiago mes a mes, para planificar con tiempo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loica.css?v=18">
<style>
  html,body{height:100%;overflow:hidden}
  /* Los dos altos van en este orden a proposito: `dvh` no existe en
     Safari de iOS anterior a 15.4 ni en Chrome anterior a 108, y ahi la
     declaracion se descarta entera. Sin el 100vh de respaldo el alto
     quedaba en `auto` y la pagina —que es una app de alto fijo con
     scroll interno— se desarmaba: la lista crecia sin fin y la barra de
     abajo se iba de la pantalla. */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:none;z-index:6}
  main{flex:1;display:flex;min-height:0}

  /* min-height:0 es obligatorio: sin él la rejilla empuja el panel de la
     agenda fuera de la pantalla y su fondo queda inalcanzable en celular. */
  .calendario{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
    padding:var(--e-4);gap:var(--e-3)}
  .mes-barra{display:flex;align-items:center;gap:var(--e-3)}
  /* Solo la primera letra: `capitalize` daría "9 De Agosto" */
  .mes-titulo{font-family:var(--fuente-marca);font-size:var(--t-xl);font-weight:800;
    letter-spacing:-.02em;min-width:0}
  .mes-titulo::first-letter,.agenda-cabecera h2::first-letter{text-transform:uppercase}
  .mes-nav{display:flex;gap:var(--e-1);margin-left:auto}
  .mes-nav button{
    width:38px;height:38px;border-radius:var(--r-sm);border:1.5px solid var(--borde);
    background:var(--fondo-elevado);color:var(--tinta);cursor:pointer;font-size:15px;
    transition:var(--rapido);
  }
  .mes-nav button:hover{background:var(--fondo-hundido);border-color:var(--borde-fuerte)}
  .mes-nav .hoy{width:auto;padding:0 var(--e-4);font:700 var(--t-sm)/1 var(--fuente-ui)}

  .rejilla{
    flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;
    gap:5px;min-height:0;
  }
  .encabezado-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:none}
  .encabezado-dias span{
    text-align:center;font-size:var(--t-xs);font-weight:700;color:var(--tinta-tenue);
    text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px;
  }

  .dia{
    background:var(--fondo-elevado);border:1.5px solid var(--borde);border-radius:var(--r-md);
    padding:5px 6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;
    cursor:pointer;transition:var(--rapido);text-align:left;font-family:inherit;color:inherit;
  }
  .dia:hover{border-color:var(--borde-fuerte);box-shadow:var(--sombra-1)}
  .dia.fuera{opacity:.4}
  .dia.hoy{border-color:var(--acento);border-width:2px}
  .dia.elegido{background:var(--fondo-hundido);border-color:var(--tinta)}
  .dia-num{font-size:var(--t-sm);font-weight:700;font-variant-numeric:tabular-nums}
  .dia.hoy .dia-num{color:var(--acento)}
  .marca-ev{
    display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
    background:var(--tono-suave);color:var(--tono);border-radius:5px;padding:2px 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;
  }
  .marca-ev.libre{background:var(--gratis-fondo);color:var(--gratis)}
  .marca-ev i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .mas{font-size:10px;color:var(--tinta-tenue);font-weight:600;padding-left:3px}

  .agenda{
    width:370px;flex:none;border-left:1px solid var(--borde);background:var(--fondo-elevado);
    display:flex;flex-direction:column;
  }
  .agenda-cabecera{padding:var(--e-4);border-bottom:1px solid var(--borde)}
  .agenda-cabecera h2{font-size:var(--t-lg)}
  .agenda-cabecera p{margin:3px 0 0;color:var(--tinta-suave);font-size:var(--t-sm)}
  .agenda-lista{overflow-y:auto;flex:1}

  /* --- El buscador, en la barra del mes ---
     Esta página no tiene riel de fechas: su eje temporal es el mes, y la fila
     que hace de riel es la del título con las flechas. El campo va ahí, que es
     "a la misma altura" de lo que pidió el dueño en el mapa.
     Bajo 620px la barra ya lleva el mes y tres botones, así que el campo se va
     a su propia línea en vez de espachurrar las flechas: cambiar de mes es LA
     acción de esta página y no puede perder área táctil. */
  .mes-barra{flex-wrap:wrap}
  .campo-buscar{
    display:flex;align-items:center;gap:4px;flex:1 1 200px;min-width:0;
    max-width:320px;height:38px;padding:0 5px 0 10px;
    border:2px solid var(--contorno);border-radius:var(--r-pill);
    background:var(--fondo-elevado);box-shadow:0 2px 0 var(--contorno);
  }
  .campo-buscar > svg{width:18px;height:18px;flex:none;color:var(--tinta-tenue)}
  /* 16px y no --t-base: bajo 16px, Safari de iOS hace zoom solo al enfocar el
     campo y deja la página corrida. */
  .campo-buscar input{
    flex:1;min-width:0;border:0;background:transparent;color:var(--tinta);
    font:600 16px/1 var(--fuente-ui);padding:0;
  }
  .campo-buscar input::placeholder{color:var(--tinta-tenue);font-weight:500}
  .campo-buscar input:focus{outline:none}
  .campo-buscar input::-webkit-search-cancel-button{display:none}
  /* El anillo de foco va en la CÁPSULA: el <input> no tiene borde propio y el
     anillo quedaba dibujado por dentro, escondido bajo el contorno. */
  .campo-buscar:focus-within{box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}
  .borra-buscar{
    flex:none;width:34px;height:34px;border-radius:var(--r-pill);border:0;
    background:transparent;color:var(--tinta-suave);font-size:17px;line-height:1;
    cursor:pointer;display:grid;place-items:center;
  }
  .borra-buscar[hidden]{display:none}
  .borra-buscar:hover{background:var(--fondo-hundido);color:var(--tinta)}
  @media (pointer:coarse){
    .borra-buscar{position:relative}
    .borra-buscar::before{
      content:"";position:absolute;left:-5px;right:-5px;top:50%;
      height:44px;transform:translateY(-50%);
    }
  }
  @media(max-width:620px){ .campo-buscar{flex-basis:100%;max-width:none;order:3} }

  /* --- Afinar: subcategorías y tamaño, dentro del panel de la agenda ---
     Bajo la cabecera del día, que es el equivalente al "bajo el número de
     eventos" del mapa. El panel mide 370px, así que cada fila se desplaza de
     lado en vez de envolver: música tiene nueve géneros y apilados no queda
     agenda. */
  .afinar{flex:none;border-bottom:1px solid var(--borde)}
  .afinar-fila{display:flex;align-items:center;gap:6px;
    padding:4px var(--e-4) 6px;overflow-x:auto;scrollbar-width:none}
  .afinar-fila::-webkit-scrollbar{display:none}
  .afinar-et{flex:none;font-size:var(--t-xs);font-weight:800;color:var(--tinta-tenue);
    text-transform:uppercase;letter-spacing:.05em}
  .afinar .chip{padding:6px 12px;gap:5px;font-size:var(--t-xs);min-height:36px;
    border-width:2px;box-shadow:0 2px 0 var(--contorno)}
  .afinar .chip:active,
  .afinar .chip[aria-pressed="true"]{transform:translateY(2px);box-shadow:none}
  .afinar .cuenta{opacity:.72;font-variant-numeric:tabular-nums}
  .afinar-nota{margin:0;padding:0 var(--e-4) 7px;font-size:var(--t-xs);
    color:var(--tinta-tenue);font-style:italic;line-height:1.3}

  @media(max-width:879px){
    main{flex-direction:column;padding-bottom:var(--hueco-nav)}
    .agenda{width:auto;border-left:0;border-top:1px solid var(--borde);
      max-height:46%;min-height:150px}
    .calendario{padding:var(--e-3)}
    .marca-ev{display:none}
    .rejilla{grid-auto-rows:minmax(44px,1fr)}
    .dia{align-items:center;justify-content:center;gap:4px}
    /* Cambiar de mes es LA acción de esta página y las flechas median 38x38.
       Acá sí se agranda la caja y no solo el área: la barra del mes tiene
       espacio de sobra y son botones que se aprietan varias veces seguidas. */
    .mes-nav button{width:44px;height:44px}
    .mes-nav .hoy{width:auto}
    .puntos{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
    .puntos i{width:5px;height:5px;border-radius:50%;background:var(--tono)}
    .marca-ev i{background:var(--punto,var(--tono))}
  }
  @media(min-width:901px){.puntos{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="barra" id="barra"></div>
    <div class="filtros" id="filtros"></div>
  </header>

  <main>
    <section class="calendario">
      <div class="mes-barra">
        <div class="mes-titulo" id="mes-titulo"></div>
        <div class="mes-nav">
          <button id="ant" aria-label="Mes anterior">‹</button>
          <button class="hoy" id="btn-hoy">Hoy</button>
          <button id="sig" aria-label="Mes siguiente">›</button>
        </div>
        <!-- El buscador va en la fila que hace de riel en esta página. -->
        <div class="campo-buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>
          <input type="search" id="buscar" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false">
          <button type="button" class="borra-buscar" id="borra-buscar" hidden>✕</button>
        </div>
      </div>
      <div class="encabezado-dias" id="encabezado-dias"></div>
      <div class="rejilla" id="rejilla"></div>
    </section>

    <aside class="agenda">
      <div class="agenda-cabecera">
        <h2 id="agenda-titulo"></h2>
        <p id="agenda-sub"></p>
      </div>
      <div class="afinar" id="afinar"></div>
      <div class="agenda-lista" id="agenda-lista"></div>
    </aside>
  </main>
</div>

<nav class="nav-inferior" id="nav-inferior" aria-label="Navegacion principal"></nav>

<script src="loica.js?v=18"></script>
<script>
let EVENTOS = [], filtroCat = null, soloGratis = false;
let busqueda = "", filtroSub = null;
let mesVisible = new Date(), diaElegido = new Date();

pintarBarra("calendario.html");

cargarEventos().then(evs => {
  EVENTOS = evs;
  // Arranca en el mes del primer evento disponible, no en uno vacío
  if(evs.length && evs[0].fecha > new Date()) mesVisible = new Date(evs[0].fecha);
  montarBuscador();
  repintar();
});
window.addEventListener("loica:idioma", () => {
  sincronizarBuscador();
  repintar();
});

const visibles = () => EVENTOS.filter(ev =>
  (!soloGratis || ev.gratis) &&
  (!filtroCat || ev.categoria === filtroCat) &&
  (!filtroSub || ev.subcategoria === filtroSub) &&
  coincideBusqueda(ev, busqueda));

/* Los mismos eventos ignorando UN filtro, para contar cuántos quedarían si lo
   tocaras. Sin esto los números de los chips se cuentan sobre la base entera y
   mienten: un "Reggaetón 40" que al tocarlo muestra 3 es peor que no ponerlo. */
const visiblesSalvo = salvo => EVENTOS.filter(ev =>
  (!soloGratis || ev.gratis) &&
  (salvo === "cat" || !filtroCat || ev.categoria === filtroCat) &&
  (salvo === "sub" || !filtroSub || ev.subcategoria === filtroSub) &&
  coincideBusqueda(ev, busqueda));

const hayFiltros = () => busqueda || filtroCat || filtroSub || soloGratis;

// Todo lo que repinta la página, junto: son tres cosas y olvidar una deja la
// rejilla del mes mostrando puntos de un filtro que ya no está puesto.
const repintar = () => { pintarFiltros(); pintarMes(); mostrarDia(diaElegido); };

function pintarFiltros(){
  const cont = document.getElementById("filtros");
  cont.innerHTML = "";
  cont.setAttribute("role", "group");
  cont.setAttribute("aria-label", t("filtrosTipo"));
  const agregar = (contenido, activo, alPulsar, clase="") => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip " + clase; b.innerHTML = contenido;
    b.setAttribute("aria-pressed", activo);
    b.onclick = () => { alPulsar(); repintar(); };
    cont.appendChild(b);
  };
  // El Degú es la mascota de lo gratis desde que el Guarén entró a los
  // descuentos y el Pudú se quedó con el aire libre.
  agregar(`${carita("degu", soloGratis ? "#fff" : "#2E7D5B", 22)} ${t("gratis")}`,
          soloGratis, () => soloGratis = !soloGratis, "es-gratis");
  /* Ordenadas por cuántas hay y no alfabéticamente: el riel se desplaza de
     lado y en un teléfono se ven cuatro chips, así que el orden decide qué
     queda al alcance del pulgar. Alfabético dejaba "Aire libre" (9 eventos)
     primero y "Deporte" (1.071) fuera de pantalla. */
  const cuantosPorCat = {};
  visiblesSalvo("cat").forEach(e => cuantosPorCat[e.categoria] = (cuantosPorCat[e.categoria] || 0) + 1);
  [...new Set(EVENTOS.map(e => e.categoria))]
    .sort((a,b) => (cuantosPorCat[b] || 0) - (cuantosPorCat[a] || 0)
                || cat(a)[IDIOMA].localeCompare(cat(b)[IDIOMA]))
    .forEach(c => {
      const info = cat(c);
      agregar(`${carita(info.mascota, filtroCat === c ? "#fff" : info.hex, 22)} ${info[IDIOMA]}`,
              filtroCat === c, () => {
                // Cambiar o soltar la categoría BORRA la subcategoría: un
                // `filtroSub` de fiestas colgado en teatro deja el mes entero
                // sin puntos y parece que la página se rompió.
                filtroCat = filtroCat === c ? null : c;
                filtroSub = null;
              });
    });
  pintarAfinar();
}

/* ---------- AFINAR: subcategorías y tamaño, en el panel de la agenda ----------
   Mismo criterio y mismo piso que el mapa: las opciones salen de los datos, y
   un chip bajo tres eventos ocupa lugar sin llevar a ninguna parte. */
const MIN_SUB = 3;

function pintarAfinar(){
  const caja = document.getElementById("afinar");
  caja.innerHTML = "";

  const fila = (etiqueta, ariaEtiqueta) => {
    const f = document.createElement("div");
    f.className = "afinar-fila";
    f.setAttribute("role", "group");
    f.setAttribute("aria-label", ariaEtiqueta);
    if(etiqueta){
      const et = document.createElement("span");
      et.className = "afinar-et";
      et.textContent = etiqueta;
      et.setAttribute("aria-hidden", "true");
      f.appendChild(et);
    }
    caja.appendChild(f);
    return f;
  };
  const chip = (f, texto, cuenta, activo, alPulsar, titulo="") => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.innerHTML = escapar(texto)
      + (cuenta === null ? "" : ` <span class="cuenta">${cuenta}</span>`);
    b.setAttribute("aria-pressed", activo);
    if(titulo) b.title = titulo;
    b.onclick = () => { alPulsar(); repintar(); };
    f.appendChild(b);
  };

  if(filtroCat){
    const base = visiblesSalvo("sub").filter(ev => ev.categoria === filtroCat);
    const cuantos = {};
    base.forEach(ev => { if(ev.subcategoria) cuantos[ev.subcategoria] = (cuantos[ev.subcategoria] || 0) + 1; });
    // El que está puesto se dibuja siempre: si su cuenta cae bajo el piso al
    // combinarse con otro filtro y desaparece, no hay forma de soltarlo.
    const opciones = Object.keys(cuantos)
      .filter(s => cuantos[s] >= MIN_SUB || s === filtroSub)
      .sort((a,b) => cuantos[b] - cuantos[a] || subcat(a).localeCompare(subcat(b)));
    if(opciones.length >= 2){
      const f = fila(t("filtrosAfinar"), t("filtrosAfinar"));
      chip(f, t("afinarTodo"), base.length, !filtroSub, () => filtroSub = null);
      opciones.forEach(s =>
        chip(f, subcat(s), cuantos[s], filtroSub === s,
             () => filtroSub = filtroSub === s ? null : s));
    }
  }

  if(hayFiltros()){
    const f = fila("", t("filtrosLimpiar"));
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = "✕ " + t("filtrosLimpiar");
    b.onclick = () => {
      busqueda = ""; filtroCat = null; filtroSub = null; soloGratis = false;
      const campo = document.getElementById("buscar");
      campo.value = "";
      document.getElementById("borra-buscar").hidden = true;
      repintar();
    };
    f.appendChild(b);
  }
}

/* ---------- EL BUSCADOR ---------- */
function sincronizarBuscador(){
  const campo = document.getElementById("buscar");
  campo.placeholder = t("buscar");
  campo.setAttribute("aria-label", t("buscarEtiqueta"));
  const borrar = document.getElementById("borra-buscar");
  borrar.hidden = !campo.value;
  borrar.setAttribute("aria-label", t("buscarBorrar"));
}

function montarBuscador(){
  const campo = document.getElementById("buscar");
  /* 180 ms antes de filtrar: sin esto cada tecla vuelve a armar la rejilla de
     42 celdas y a recorrer el catastro entero. */
  let temporizador = null;
  campo.oninput = () => {
    document.getElementById("borra-buscar").hidden = !campo.value;
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { busqueda = campo.value.trim(); repintar(); }, 180);
  };
  campo.onkeydown = e => {
    if(e.key === "Escape" && campo.value){
      campo.value = "";
      campo.dispatchEvent(new Event("input"));
    }
  };
  document.getElementById("borra-buscar").onclick = () => {
    campo.value = "";
    campo.dispatchEvent(new Event("input"));
    campo.focus();
  };
  sincronizarBuscador();
}

function porDia(){
  const mapa = {};
  visibles().forEach(ev => (mapa[claveDia(ev.fecha)] ||= []).push(ev));
  return mapa;
}

function pintarMes(){
  document.getElementById("mes-titulo").textContent =
    `${t("meses")[mesVisible.getMonth()]} ${mesVisible.getFullYear()}`;
  document.getElementById("encabezado-dias").innerHTML =
    t("dias").map(d => `<span>${d}</span>`).join("");
  document.getElementById("btn-hoy").textContent = t("hoyBoton");

  const agenda = porDia();
  const primero = new Date(mesVisible.getFullYear(), mesVisible.getMonth(), 1);
  // La semana parte el lunes (getDay: 0=domingo)
  const desplazamiento = (primero.getDay() + 6) % 7;
  const inicio = new Date(primero);
  inicio.setDate(1 - desplazamiento);

  const rejilla = document.getElementById("rejilla");
  rejilla.innerHTML = "";
  const hoy = new Date();

  for(let i = 0; i < 42; i++){
    const dia = new Date(inicio);
    dia.setDate(inicio.getDate() + i);
    if(i >= 35 && dia.getMonth() !== mesVisible.getMonth()) break;

    const delDia = agenda[claveDia(dia)] || [];
    const celda = document.createElement("button");
    celda.type = "button";
    celda.className = "dia"
      + (dia.getMonth() !== mesVisible.getMonth() ? " fuera" : "")
      + (mismaFecha(dia, hoy) ? " hoy" : "")
      + (mismaFecha(dia, diaElegido) ? " elegido" : "");
    celda.setAttribute("aria-label",
      `${dia.getDate()} ${t("meses")[dia.getMonth()]}, ${delDia.length} ${t("eventos")}`);

    const marcas = delDia.slice(0,3).map(ev => {
      const info = cat(ev.categoria);
      return `<span class="marca-ev${ev.gratis ? " libre" : ""}"
        style="--tono:${info.tintaVar};--punto:${info.hex};--tono-suave:${info.hex}1f">
        <i></i>${escapar(ev.titulo)}</span>`;
    }).join("");
    const puntos = delDia.slice(0,4).map(ev =>
      `<i style="--tono:${ev.gratis ? "var(--gratis)" : cat(ev.categoria).hex}"></i>`).join("");

    celda.innerHTML = `<span class="dia-num">${dia.getDate()}</span>
      ${marcas}
      ${delDia.length > 3 ? `<span class="mas">+${delDia.length - 3}</span>` : ""}
      <span class="puntos">${puntos}</span>`;
    celda.onclick = () => { diaElegido = dia; pintarMes(); mostrarDia(dia); };
    rejilla.appendChild(celda);
  }
}

function mostrarDia(dia){
  const delDia = (porDia()[claveDia(dia)] || []).sort((a,b) => a.fecha - b.fecha);
  document.getElementById("agenda-titulo").textContent =
    dia.toLocaleDateString(localeDe(), {weekday:"long", day:"numeric", month:"long"});
  document.getElementById("agenda-sub").textContent =
    `${delDia.length} ${delDia.length === 1 ? t("evento") : t("eventos")}`;

  const cont = document.getElementById("agenda-lista");
  cont.innerHTML = "";
  if(!delDia.length){
    /* Un día sin nada y un día que se vació por los filtros se ven igual, y no
       lo son: del segundo se sale soltando un chip, no cambiando de día. Con
       una palabra escrita se dice eso, que es lo que más despista. */
    const texto = busqueda ? t("buscarSin") : hayFiltros() ? t("vacio") : t("vacio");
    const pista = busqueda ? t("buscarSinPista") : hayFiltros() ? t("vaciopista") : "";
    cont.innerHTML = `<div class="vacio">${cuerpo("chincol","var(--tinta-tenue)",88,{pose:"durmiendo"})}
      <p><b>${escapar(texto)}</b>${pista ? `<br>${escapar(pista)}` : ""}</p></div>`;
    return;
  }
  delDia.forEach(ev => cont.appendChild(
    tarjetaEvento(ev, e => window.open(e.url, "_blank", "noopener"))));
}

document.getElementById("ant").onclick = () => {
  mesVisible = new Date(mesVisible.getFullYear(), mesVisible.getMonth() - 1, 1); pintarMes();
};
document.getElementById("sig").onclick = () => {
  mesVisible = new Date(mesVisible.getFullYear(), mesVisible.getMonth() + 1, 1); pintarMes();
};
document.getElementById("btn-hoy").onclick = () => {
  mesVisible = new Date(); diaElegido = new Date(); pintarMes(); mostrarDia(diaElegido);
};
addEventListener("keydown", e => {
  if(e.key === "ArrowLeft") document.getElementById("ant").click();
  if(e.key === "ArrowRight") document.getElementById("sig").click();
});
</script>
