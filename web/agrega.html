<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras.
     - `upgrade-insecure-requests` tampoco va: en Pages no hace nada (https +
       HSTS) y en el servidor local abierto desde el celular por la IP de la
       red subía loica.js y loica.css a un https:// inexistente, y la página
       quedaba en blanco. El detalle está en mapa.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Agrega tu evento — Loica</title>
<meta name="description" content="Publica gratis tu evento, taller o clase en el mapa de Santiago.">
<link rel="canonical" href="https://loicasantiago.cl/agrega.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loica.css?v=26">
<style>
  .hero{text-align:center;padding:var(--e-8) var(--e-5) var(--e-6);max-width:660px;margin:0 auto}
  .hero svg{margin:0 auto var(--e-4)}
  .hero p{color:var(--tinta-suave);font-size:var(--t-md);margin:var(--e-3) 0 0}
  .promesas{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:var(--e-3);max-width:760px;margin:0 auto var(--e-6);padding:0 var(--e-5);
  }
  /* Las tres promesas son la misma pieza que los "DÓNDE / PRECIO / COCINA" de
     la ficha de comer (`comer.html:322`): caja de dato chica, fondo elevado,
     contorno de tinta y repisa de 1. Estaban en 1px de --borde y sin repisa,
     o sea flotando; con el contorno del sistema quedan sobre el papel, que es
     lo que dice la marca. */
  .promesa{background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-md);box-shadow:var(--repisa-1);padding:var(--e-4)}
  .promesa b{display:block;font-size:var(--t-sm);margin-bottom:3px}
  .promesa span{font-size:var(--t-sm);color:var(--tinta-suave)}
  .doble{display:grid;grid-template-columns:1fr 1fr;gap:var(--e-3)}
  @media(max-width:520px){.doble{grid-template-columns:1fr}}
  /* ---------- Las once categorías ----------
     Es el mismo control que en el mapa, en cine, en talleres, en descuentos y
     ahora en comer: elegir una categoría de una fila de pastillas con la carita
     del animal. En las otras cinco páginas eso es `.chip` de loica.css. Acá era
     una pastilla propia que se apartaba en las cuatro cosas que definen el
     chip de la casa:

       borde 1.5px de --borde (arena)   →  2px de --contorno (tinta)
       sin repisa                        →  --repisa-1
       el elegido no se movía            →  se hunde 3px, como todos
       radio --r-full                    →  --r-pill

     Y 1.5px es, además, el único grosor que la dirección visual prohíbe: sobre
     crema no llega a leerse como contorno de serigrafía, se lee como una línea
     de formulario de banco.

     Se conserva la mecánica, que estaba bien y es mejor que la de las otras
     páginas: son <label> envolviendo un <input type="radio"> de verdad, así
     que el grupo se recorre con las flechas y es un solo alto en la
     tabulación. El chip del sistema es un <button aria-pressed>, que para
     "elige UNA" es peor. Por eso acá se toma el ASPECTO del chip y no su
     etiqueta. */
  .opciones-cat{display:flex;flex-wrap:wrap;gap:var(--e-2)}
  .opcion-cat{
    display:inline-flex;align-items:center;gap:7px;min-height:40px;
    border:2px solid var(--contorno);background:var(--fondo-elevado);color:var(--tinta);
    border-radius:var(--r-pill);padding:7px 15px 7px 10px;box-shadow:var(--repisa-1);
    cursor:pointer;font-size:var(--t-sm);font-weight:700;
    transition:transform var(--rapido),box-shadow var(--rapido),background-color var(--rapido);
  }
  .opcion-cat:hover{background:var(--fondo-hundido)}
  .opcion-cat input{position:absolute;opacity:0;width:0;height:0}
  .opcion-cat:has(input:checked){
    background:var(--tinta);color:var(--fondo-elevado);
    transform:translateY(3px);box-shadow:none;
  }
  /* El anillo va con la repisa dentro del mismo box-shadow: en una pastilla que
     ya usa box-shadow para la repisa, un `outline` aparte quedaba a distinto
     radio y se cortaba contra la sombra. Es el foco del proyecto, el mismo de
     loica.css. */
  .opcion-cat:has(input:focus-visible){
    box-shadow:var(--repisa-1),0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  .opcion-cat:has(input:checked):has(input:focus-visible){
    box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  /* El animal a 22px, que es el tamaño del ícono del chip en loica.css (y en
     el mapa, en cine y en talleres). A 18 era el único de seis páginas. */
  .opcion-cat svg{flex:none;width:22px;height:22px}
  /* La fila entera es el área que se toca —casilla y etiqueta— y llega a los
     44px. Antes la casilla medía 19px y era el blanco más chico del
     formulario. */
  .gratis-fila{display:flex;align-items:center;gap:var(--e-2);margin-bottom:var(--e-3);
    min-height:44px}
  .gratis-fila input{accent-color:var(--verde-cerro)}
  .gratis-fila label{display:flex;align-items:center;min-height:44px;cursor:pointer}
  /* ---------- El texto de error ----------
     `loica.css:612` lo pinta con `var(--acento)`, que en tema claro es
     --rojo-500 (#E8442E) y sobre el crema del formulario da **3,85:1** a 12px.
     El piso del proyecto para texto normal es 4,5:1, así que el único mensaje
     que la página da cuando algo salió mal era el texto peor contrastado de
     todo el formulario. En oscuro no pasa: ahí --acento es --rojo-400 y da
     5,36:1.
     La familia roja ya tiene resuelto el par: --rojo-700 sobre crema da
     6,55:1 y --rojo-300 sobre el azul de noche está de sobra. Se corrige acá
     porque agrega.html es la ÚNICA página con `.mensaje-error` en todo el
     sitio; el arreglo de fondo va en loica.css y queda anotado en el informe.
     El BORDE rojo del campo se deja como está: 3,85:1 pasa el piso de 3:1 que
     rige para bordes de control, y bajarlo de tono lo haría menos visible. */
  .campo .mensaje-error{color:var(--rojo-700)}
  :root[data-tema="oscuro"] .campo .mensaje-error{color:var(--rojo-300)}

  .exito{
    background:var(--gratis-fondo);border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:var(--repisa-2);padding:var(--e-6);text-align:center;
  }
  .exito h2{color:var(--gratis);margin-bottom:var(--e-2)}
</style>
</head>
<body class="con-nav-inferior">
<div class="barra" id="barra"></div>

<div class="hero">
  <div id="mascota-hero"></div>
  <h1 id="tit"></h1>
  <p id="baj"></p>
</div>

<div class="promesas" id="promesas"></div>

<div class="contenido" style="padding-top:0">
  <form class="panel" id="form" novalidate>
    <div class="campo">
      <label for="titulo" data-l="lTitulo"></label>
      <input id="titulo" name="titulo" required maxlength="120">
      <div class="mensaje-error" id="err-titulo" hidden data-l="eTitulo"></div>
    </div>

    <!-- El rótulo va atado al grupo con aria-labelledby y no suelto: son once
         radios, y sin nombre de grupo un lector de pantalla los canta uno por
         uno sin decir nunca de qué se está eligiendo. El <label> sin `for` no
         ata nada; es texto. -->
    <div class="campo">
      <label id="rot-categoria" data-l="lCategoria"></label>
      <div class="opciones-cat" id="opciones-cat"
           role="radiogroup" aria-labelledby="rot-categoria"></div>
    </div>

    <div class="doble">
      <div class="campo">
        <label for="fecha" data-l="lFecha"></label>
        <input type="date" id="fecha" name="fecha" required>
        <div class="mensaje-error" id="err-fecha" hidden data-l="eFecha"></div>
      </div>
      <div class="campo">
        <label for="hora" data-l="lHora"></label>
        <input type="time" id="hora" name="hora">
      </div>
    </div>

    <div class="doble">
      <div class="campo">
        <label for="lugar" data-l="lLugar"></label>
        <input id="lugar" name="lugar" required maxlength="120">
        <div class="mensaje-error" id="err-lugar" hidden data-l="eLugar"></div>
      </div>
      <div class="campo">
        <label for="comuna" data-l="lComuna"></label>
        <select id="comuna" name="comuna"></select>
      </div>
    </div>

    <!-- "Precio" rotula el BLOQUE (la casilla de gratis más el monto), así que
         el campo del monto se quedaba sin nombre accesible: un cuadro de texto
         que se anuncia como "cuadro de edición" y nada más. Ahora el <label>
         apunta al campo con `for`, y la ayuda de abajo va colgada con
         aria-describedby en vez de quedar a la deriva. -->
    <div class="campo">
      <label for="precio" data-l="lPrecio"></label>
      <div class="gratis-fila">
        <input type="checkbox" id="es-gratis" name="es-gratis">
        <label for="es-gratis" style="margin:0;font-weight:600" data-l="lEsGratis"></label>
      </div>
      <input id="precio" name="precio" inputmode="numeric" placeholder="5000"
             aria-describedby="ayuda-precio">
      <div class="ayuda" id="ayuda-precio" data-l="aPrecio"></div>
    </div>

    <div class="campo">
      <label for="enlace" data-l="lEnlace"></label>
      <!-- inputmode=url le pide al teléfono el teclado con "/" y ".cl" a mano;
           el autocorrector le mete mayúscula al dominio si no se apaga. -->
      <input type="url" id="enlace" name="enlace" placeholder="https://instagram.com/tu_evento"
             inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             aria-describedby="ayuda-enlace">
      <div class="ayuda" id="ayuda-enlace" data-l="aEnlace"></div>
    </div>

    <div class="campo">
      <label for="descripcion" data-l="lDescripcion"></label>
      <textarea id="descripcion" name="descripcion" maxlength="600"></textarea>
    </div>

    <div class="doble">
      <div class="campo">
        <label for="contacto-nombre" data-l="lTuNombre"></label>
        <input id="contacto-nombre" name="contacto-nombre" required
               autocomplete="name" autocapitalize="words">
        <div class="mensaje-error" id="err-contacto-nombre" hidden data-l="eNombre"></div>
      </div>
      <div class="campo">
        <label for="contacto" data-l="lTuContacto"></label>
        <!-- Acepta correo o @instagram, así que el teclado no puede ser el de
             email (mete un @ pero esconde las letras del arroba en algunos
             Android). Se deja el de texto sin autocorrector ni mayúscula
             inicial, que en un correo estorban. -->
        <input id="contacto" name="contacto" required placeholder="hola@correo.cl / @instagram"
               autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="mensaje-error" id="err-contacto" hidden data-l="eContacto"></div>
      </div>
    </div>

    <button class="boton bloque" type="submit" data-l="enviar"></button>
    <p class="ayuda" style="text-align:center;margin-top:var(--e-3)" data-l="aviso"></p>
  </form>

  <div id="listo" hidden class="exito">
    <div id="mascota-listo"></div>
    <h2 data-l="okTitulo"></h2>
    <p data-l="okTexto"></p>
    <a class="boton secundario" href="mapa.html" data-l="okVolver"></a>
  </div>
</div>

<div class="remate" id="cordillera" aria-hidden="true"></div>

<nav class="nav-inferior" id="nav-inferior" aria-label="Navegacion principal"></nav>

<script src="loica.js?v=26"></script>
<script>
const CORREO = "hola@loica.cl";   // cambiar por el correo real del proyecto

const TX = {
  es:{
    tit:"Publica tu evento, gratis",
    baj:"Si haces una clase en la plaza, una tocata, una obra o un taller de barrio, esta app es para que la gente te encuentre. No cobramos por publicar.",
    p1t:"Gratis siempre", p1d:"Publicar no cuesta. Y los eventos gratuitos son gratis para siempre.",
    p2t:"Lo revisa una persona", p2d:"Nada se publica automáticamente. Revisamos cada evento a mano.",
    p3t:"Te mandamos gente", p3d:"Tu ficha lleva un link directo a tu sitio o Instagram. El tráfico es tuyo.",
    lTitulo:"Nombre del evento", eTitulo:"Ponle un nombre a tu evento",
    lCategoria:"¿Qué tipo de panorama es?",
    lFecha:"Fecha", eFecha:"Falta la fecha", lHora:"Hora (opcional)",
    lLugar:"Lugar", eLugar:"¿Dónde es?", lComuna:"Comuna",
    lPrecio:"Precio", lEsGratis:"Es gratis / entrada liberada",
    aPrecio:"En pesos, sin puntos. Déjalo vacío si aún no lo defines.",
    lEnlace:"Link del evento", aEnlace:"Instagram, sitio web o venta de entradas. Es a donde mandamos a la gente.",
    lDescripcion:"Cuéntanos de qué se trata (opcional)",
    lTuNombre:"Tu nombre", eNombre:"¿Cómo te llamas?",
    lTuContacto:"Tu contacto", eContacto:"Déjanos cómo contactarte",
    enviar:"Enviar evento",
    aviso:"Al enviar se abre tu correo con los datos listos. Todavía no tenemos formulario automático: lo recibimos y lo subimos a mano.",
    okTitulo:"¡Gracias!", okTexto:"Revisa que tu correo se haya enviado. Te respondemos dentro de 48 horas.",
    okVolver:"Volver al mapa",
  },
  en:{
    tit:"Post your event, free",
    baj:"If you run a class in the park, a gig, a play or a neighbourhood workshop, this app exists so people can find you. Posting is free.",
    p1t:"Always free", p1d:"Posting costs nothing. And free events stay free forever.",
    p2t:"A human reviews it", p2d:"Nothing is published automatically. We check every event by hand.",
    p3t:"We send you people", p3d:"Your listing links straight to your site or Instagram. The traffic is yours.",
    lTitulo:"Event name", eTitulo:"Give your event a name",
    lCategoria:"What kind of event is it?",
    lFecha:"Date", eFecha:"Date is missing", lHora:"Time (optional)",
    lLugar:"Venue", eLugar:"Where is it?", lComuna:"District",
    lPrecio:"Price", lEsGratis:"Free entry",
    aPrecio:"In Chilean pesos, no dots. Leave empty if undecided.",
    lEnlace:"Event link", aEnlace:"Instagram, website or ticket page. This is where we send people.",
    lDescripcion:"Tell us what it's about (optional)",
    lTuNombre:"Your name", eNombre:"What's your name?",
    lTuContacto:"Your contact", eContacto:"Let us know how to reach you",
    enviar:"Send event",
    aviso:"Submitting opens your email client with everything filled in. We don't have an automatic form yet: we receive it and upload it by hand.",
    okTitulo:"Thank you!", okTexto:"Check that your email was sent. We reply within 48 hours.",
    okVolver:"Back to the map",
  },
  pt:{
    tit:"Publique seu evento, grátis",
    baj:"Se você dá uma aula na praça, toca, faz uma peça ou uma oficina de bairro, este app existe para que as pessoas te encontrem. Publicar é grátis.",
    p1t:"Sempre grátis", p1d:"Publicar não custa nada. E eventos gratuitos são grátis para sempre.",
    p2t:"Uma pessoa revisa", p2d:"Nada é publicado automaticamente. Revisamos cada evento à mão.",
    p3t:"Mandamos gente", p3d:"Sua ficha leva direto ao seu site ou Instagram. O tráfego é seu.",
    lTitulo:"Nome do evento", eTitulo:"Dê um nome ao seu evento",
    lCategoria:"Que tipo de evento é?",
    lFecha:"Data", eFecha:"Falta a data", lHora:"Hora (opcional)",
    lLugar:"Local", eLugar:"Onde é?", lComuna:"Comuna",
    lPrecio:"Preço", lEsGratis:"Entrada gratuita",
    aPrecio:"Em pesos chilenos, sem pontos. Deixe vazio se ainda não definiu.",
    lEnlace:"Link do evento", aEnlace:"Instagram, site ou venda de ingressos. É para lá que mandamos as pessoas.",
    lDescripcion:"Conte do que se trata (opcional)",
    lTuNombre:"Seu nome", eNombre:"Como você se chama?",
    lTuContacto:"Seu contato", eContacto:"Diga como falar com você",
    enviar:"Enviar evento",
    aviso:"Ao enviar abre seu e-mail com os dados prontos. Ainda não temos formulário automático: recebemos e subimos à mão.",
    okTitulo:"Obrigado!", okTexto:"Confirme que seu e-mail foi enviado. Respondemos em até 48 horas.",
    okVolver:"Voltar ao mapa",
  },
};
const x = k => TX[IDIOMA][k];

const COMUNAS = ["Santiago","Providencia","Ñuñoa","Las Condes","Vitacura","Lo Barnechea",
  "La Reina","Macul","Peñalolén","La Florida","Recoleta","Independencia","Estación Central",
  "Quinta Normal","Maipú","San Miguel","Huechuraba","Renca","Conchalí","Otra"];

pintarBarra("agrega.html");

function pintarTextos(){
  /* El Chincol vivo. Era una de las tres páginas del sitio que dibujaban su
     animal congelado, y su gesto —dos saltitos y el lápiz— ya está escrito en
     loica.css; solo faltaba pedirlo. `cuerpo()` y no `mascota()`: a 84px son
     lo mismo, pero `mascota()` cambia sola a solo-cabeza bajo 38 y entonces no
     hay lápiz que mover. */
  document.getElementById("mascota-hero").innerHTML = cuerpo("chincol","var(--amarillo-micro)",84,{anima:true});
  document.getElementById("mascota-listo").innerHTML = mascota("loica","var(--gratis)",70);
  document.getElementById("tit").textContent = x("tit");
  document.getElementById("baj").textContent = x("baj");
  document.getElementById("promesas").innerHTML = [1,2,3].map(n =>
    `<div class="promesa"><b>${x("p"+n+"t")}</b><span>${x("p"+n+"d")}</span></div>`).join("");
  document.querySelectorAll("[data-l]").forEach(el => el.textContent = x(el.dataset.l));

  document.getElementById("opciones-cat").innerHTML =
    ["fiesta","musica","teatro","arte","cine","clases","idiomas","familia","aire_libre","charla","otros"]
    .map((c,i) => {
      const info = cat(c);
      return `<label class="opcion-cat">
        <input type="radio" name="categoria" value="${c}" ${i===0?"":""}>
        ${carita(info.mascota, info.hex, 22)} ${info[IDIOMA]}</label>`;
    }).join("");

  document.getElementById("comuna").innerHTML =
    COMUNAS.map(c => `<option value="${c}">${c}</option>`).join("");
}
pintarTextos();
window.addEventListener("loica:idioma", pintarTextos);

// El precio no aplica si el evento es gratis
document.getElementById("es-gratis").onchange = e => {
  const precio = document.getElementById("precio");
  precio.disabled = e.target.checked;
  if(e.target.checked) precio.value = "";
};

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const datos = new FormData(e.target);
  const obligatorios = {titulo:"eTitulo", fecha:"eFecha", lugar:"eLugar",
                        "contacto-nombre":"eNombre", contacto:"eContacto"};
  let valido = true;

  /* El error se decía SOLO de tres maneras que un lector de pantalla no ve:
     el borde rojo del campo, el texto de abajo (suelto, sin colgar de nadie) y
     el foco que salta al primer campo vacío. O sea que alguien navegando a
     ciegas apretaba "Enviar", el foco se movía a un cuadro de texto y nada le
     decía por qué. Ahora el campo se marca `aria-invalid` y el mensaje se le
     cuelga con `aria-describedby`, que es lo que hace que al recibir el foco se
     lea "Nombre del evento, no válido, ponle un nombre a tu evento". */
  for(const [campo, claveError] of Object.entries(obligatorios)){
    const entrada = document.getElementById(campo === "contacto-nombre" ? "contacto-nombre" : campo);
    const caja = entrada.closest(".campo");
    const error = caja.querySelector(".mensaje-error");
    const vacio = !String(datos.get(campo) || "").trim();
    caja.classList.toggle("error", vacio);
    if(error) error.hidden = !vacio;
    entrada.setAttribute("aria-invalid", vacio ? "true" : "false");
    if(error && error.id){
      const otros = (entrada.getAttribute("aria-describedby") || "")
        .split(/\s+/).filter(id => id && id !== error.id);
      const cuelga = vacio ? otros.concat(error.id) : otros;
      if(cuelga.length) entrada.setAttribute("aria-describedby", cuelga.join(" "));
      else entrada.removeAttribute("aria-describedby");
    }
    if(vacio && valido){ entrada.focus(); valido = false; }
  }
  if(!valido) return;

  const categoria = datos.get("categoria") || "otros";
  const gratis = datos.get("es-gratis") ? "SÍ (entrada liberada)" : (datos.get("precio") || "sin definir");
  const cuerpo = [
    `Evento: ${datos.get("titulo")}`,
    `Categoría: ${cat(categoria).es}`,
    `Fecha: ${datos.get("fecha")} ${datos.get("hora") || ""}`.trim(),
    `Lugar: ${datos.get("lugar")}, ${datos.get("comuna")}`,
    `Precio: ${gratis}`,
    `Link: ${datos.get("enlace") || "—"}`,
    "",
    `Descripción: ${datos.get("descripcion") || "—"}`,
    "",
    `Contacto: ${datos.get("contacto-nombre")} — ${datos.get("contacto")}`,
  ].join("\n");

  location.href = `mailto:${CORREO}?subject=${encodeURIComponent("Nuevo evento: " + datos.get("titulo"))}`
                + `&body=${encodeURIComponent(cuerpo)}`;

  document.getElementById("form").hidden = true;
