<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
       Los logos de los comercios entran por la misma puerta y tampoco se
       pueden listar: hoy son cuatro CDN (assets.bancochile.cl,
       bci-cdn.azureedge.net, images.ctfassets.net y
       firebasestorage.googleapis.com) porque son los cuatro bancos que
       publican logo, y cambian cuando cambia el banco. No hizo falta tocar
       esta linea para ponerlos.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras.
     - `upgrade-insecure-requests` tampoco va: en Pages no hace nada (https +
       HSTS) y en el servidor local abierto desde el celular por la IP de la
       red subía loica.js y loica.css a un https:// inexistente, y la página
       quedaba en blanco. El detalle está en mapa.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; worker-src blob:; connect-src 'self' https://*.basemaps.cartocdn.com https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Descuentos — ¿Dónde como hoy en Santiago?</title>
<meta name="description" content="Descuentos de restaurantes con tarjetas de bancos chilenos, filtrados por día, banco y comuna. Banco de Chile, Bci, Falabella, Santander, Ripley, Cencosud y Entel.">
<link rel="canonical" href="https://loicasantiago.cl/descuentos.html">
<meta property="og:title" content="Loica — ¿Dónde como hoy?">
<meta property="og:description" content="Descuentos de restaurantes con tarjetas de banco, por día y por comuna. Los revisa un robot todas las mañanas.">
<meta property="og:image" content="https://loicasantiago.cl/og-default.png">
<meta property="og:url" content="https://loicasantiago.cl/descuentos.html">
<meta property="og:site_name" content="Loica">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Ver la nota de mapa.html: el hash impide que un unpkg comprometido o una
     versión republicada metan JavaScript ajeno en el dominio. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V"
      crossorigin="anonymous">
<!-- v=26 y no v=25: esta página ya llama a `montarHoja()`, que nació en la v=26
     de loica.js. A quien tuviera la v=25 en caché le llegaría un loica.js sin
     esa función y el script de la página se caería en la primera línea. -->
<link rel="stylesheet" href="loica.css?v=26">
<style>
  html,body{height:100%;overflow:hidden}
  /* Los dos altos van en este orden a proposito: `dvh` no existe en
     Safari de iOS anterior a 15.4 ni en Chrome anterior a 108, y ahi la
     declaracion se descarta entera. Sin el 100vh de respaldo el alto
     quedaba en `auto` y la pagina —que es una app de alto fijo con
     scroll interno— se desarmaba: la lista crecia sin fin y la barra de
     abajo se iba de la pantalla. */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:none;z-index:6}
  main{flex:1;position:relative;min-height:0}

  /* --- Cabecera: dos rieles, igual que el mapa ---
     El día es una pregunta de una sola respuesta (no se come el martes y el
     jueves a la vez), así que va en un control segmentado. El banco y la
     comuna sí se combinan y van abajo. */
  .riel-fecha{
    display:flex;gap:5px;padding:var(--e-2) var(--e-4);background:var(--fondo-elevado);
    overflow-x:auto;scrollbar-width:none;align-items:center;
  }
  .riel-fecha::-webkit-scrollbar{display:none}
  .segmentado{
    display:inline-flex;gap:3px;padding:3px;flex:none;
    background:var(--fondo-hundido);border:2.5px solid var(--contorno);
    border-radius:var(--r-pill);box-shadow:var(--repisa-1);
  }
  .segmentado button{
    flex:none;border:0;background:transparent;color:var(--tinta-suave);cursor:pointer;
    padding:0 var(--e-3);min-height:36px;min-width:38px;border-radius:var(--r-pill);
    font:800 var(--t-sm)/1 var(--fuente-marca);white-space:nowrap;transition:var(--rapido);
  }
  .segmentado button:hover{color:var(--tinta)}
  .segmentado button[aria-pressed="true"]{
    background:var(--c-descuento);color:var(--arena-50);
  }
  /* "Hoy" es la razón de ser de la página: va primero, más ancho y separado
     del resto por una línea. */
  .segmentado .destacado{padding:0 var(--e-4);border-right:2px solid var(--borde-fuerte);
    border-radius:var(--r-pill) 0 0 var(--r-pill);margin-right:2px}
  /* El contador se fue al panel, donde está la lista que cuenta. Acá queda la
     fecha de revisión, igual que en talleres. */
  .cuenta-rango{
    display:flex;align-items:center;gap:5px;flex:none;margin-left:auto;padding-left:var(--e-3);
    font-size:var(--t-xs);font-weight:700;color:var(--tinta-tenue);white-space:nowrap;
  }

  header .filtros{padding:var(--e-2) var(--e-4) var(--e-3);border-bottom:2.5px solid var(--contorno);
    align-items:center}
  header .filtros .chip{padding:6px 13px 6px 11px;gap:7px;font-size:var(--t-xs);
    border-width:2px;box-shadow:0 2px 0 var(--contorno);min-height:38px}
  header .filtros .chip:active,
  header .filtros .chip[aria-pressed="true"]{transform:translateY(2px);box-shadow:none}
  /* El anillo de foco de loica.css se apila sobre la repisa, pero acá la
     repisa se achicó a 2px con un selector más específico y volvía a tapar el
     anillo. Se repone con la repisa de ESTA página; el chip prendido está
     hundido y no tiene ninguna, solo anillo. */
  header .filtros .chip:focus-visible{
    box-shadow:0 2px 0 var(--contorno),
               0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  header .filtros .chip[aria-pressed="true"]:focus-visible{
    box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno);
  }
  /* El banco se dice con un punto de tinta y con su nombre escrito, no con
     una carita. Antes cada chip llevaba el mismo guarén recoloreado siete
     veces: en el resto del sitio el animal del chip nombra la CATEGORÍA, y
     acá las siete categorías eran la misma, así que el dibujo no decía nada
     y se comía 22px por chip en el único riel que ya se desbordaba.
     El punto conserva el color —que es lo que sirve para barrer— y el
     nombre sigue escrito, así que nada depende solo del color. */
  .punto-banco{
    width:14px;height:14px;flex:none;border-radius:50%;
    background:var(--banco,var(--tinta));border:2px solid var(--contorno);
  }
  /* Prendido, el chip usa la tinta de la casa y NO el color del banco: con
     crema encima, el teal de Cencosud daba 3,6:1 y el verde de Falabella
     4,3:1 — los dos por debajo del 4,5 que pide un texto de 13px. El color
     del banco sigue dicho por el punto, que ahora se recorta contra la
     tinta. */
  header .filtros .chip[aria-pressed="true"] .punto-banco{border-color:var(--fondo-elevado)}
  .separa-chips{flex:none;width:2px;background:var(--borde-fuerte);margin:4px 3px;border-radius:2px}

  /* Las comunas son noventa y los rubros cinco: como chips no caben y como
     lista desplegable se leen enteros. Van vestidos de chip para que el riel
     siga siendo una sola cosa. */
  .chip-select{
    flex:none;position:relative;display:inline-flex;align-items:center;
    border:2px solid var(--contorno);background:var(--fondo-elevado);
    border-radius:var(--r-pill);box-shadow:0 2px 0 var(--contorno);min-height:38px;
  }
  /* El texto lo dibuja el <b> y el <select> va invisible ENCIMA de todo el
     chip. Suena rebuscado y no lo es: un select con letra de menos de 16px
     hace que Safari de iOS le aplique zoom a la página entera al tocarlo, y
     estos tres iban a 12px. Así el chip conserva su tamaño de chip, la letra
     su tamaño de chip, el área que se toca es el chip completo, y el select
     —que nadie ve— cumple los 16px que pide iOS. De paso sigue abriendo el
     selector nativo del teléfono, que es lo mejor que hay para elegir comuna. */
  .chip-select b{
    font:700 var(--t-xs)/1 var(--fuente-marca);padding:0 26px 0 13px;
    max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* El select invisible es lo que se toca, así que se estira a 44px de alto
     —el chip visible mide 38 y el borde de 2px ni siquiera entraba— centrado
     sobre el chip. A lo ancho no se pasa: los tres desplegables van seguidos
     en el riel y solaparlos haría que uno abriera el de al lado. */
  .chip-select select{
    position:absolute;left:0;right:0;top:50%;width:100%;height:44px;
    transform:translateY(-50%);
    appearance:none;border:0;background:transparent;color:transparent;
    opacity:0;cursor:pointer;font-size:16px;
  }
  .chip-select::after{
    content:"▾";position:absolute;right:10px;pointer-events:none;
    font-size:11px;color:var(--tinta-suave);
  }
  .chip-select:has(select:not([data-vacio="1"])){background:var(--tinta);box-shadow:none;transform:translateY(2px)}
  .chip-select:has(select:not([data-vacio="1"])) b{color:var(--fondo-elevado)}
  .chip-select:has(select:not([data-vacio="1"]))::after{color:var(--fondo-elevado)}
  /* El foco del teclado lo tiene el select invisible, así que el anillo hay
     que dibujarlo en el chip o no se ve dónde está uno al tabular. */
  .chip-select:has(select:focus-visible){box-shadow:0 0 0 3px var(--foco),0 0 0 6px var(--contorno)}

  /* --- El mapa de fondo y la lista encima ---
     Antes el mapa vivía detrás de un botón que TURNABA lista y mapa: obligaba
     a elegir entre saber QUÉ y saber DÓNDE, y mientras tanto media pantalla de
     escritorio era margen vacío a los lados de una columna de 820px. Ahora es
     el mismo mueble del mapa de actividades y de talleres: el mapa ocupa todo
     y la lista va en un panel que en escritorio vive desplegado a la derecha y
     en celular es una hoja que se arrastra desde abajo. */
  #mapa-descuentos{position:absolute;inset:0}
  .panel-lista{
    position:absolute;left:0;right:0;bottom:0;background:var(--fondo-elevado);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    border:2.5px solid var(--contorno);border-bottom:0;
    display:flex;flex-direction:column;z-index:4;
    height:var(--alto-panel,360px);max-height:88%;
    transition:height var(--medio);
  }
  /* El resto del tirador —los 44 px de blanco táctil, el cursor, el
     touch-action y el anillo de foco— vive en loica.css §4b, junto al
     mecanismo de la hoja, porque es igual en las cuatro páginas con mapa. Acá
     queda solo lo de esta página. Y sigue en pie la advertencia que estaba
     escrita en este mismo lugar: el `touch-action:none` va SOLO en las zonas
     de agarre y nunca en el panel entero, porque ahí el navegador le cancela
     el gesto de scroll a la lista. */
  .tirador{padding:0 var(--e-4);flex:none}
  .barra-tirador{width:52px;height:7px;background:var(--tinta);border-radius:4px;margin:0 auto}
  .conteo{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:var(--t-sm);
    color:var(--tinta-suave);padding:2px var(--e-4) 7px}
  .conteo b{font-family:var(--fuente-marca);font-size:var(--t-lg);color:var(--tinta)}
  /* La deuda se dice, no se esconde: cuántos no tienen dirección y por eso no
     están en el mapa, y cuántos tienen el punto al centro de su comuna. */
  .nota-geo{flex:1 1 100%;font-size:var(--t-xs);color:var(--tinta-tenue);line-height:1.35}
  .nota-geo:empty{display:none}
  .lista{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
  /* 78px es el defecto de loica.css y ahí el guarén no alcanza a mostrar la
     tarjeta que le muerde al banco, que es el chiste entero de esta página.
     El tamaño se pide por variable, que es como loica.css lo dejó: la regla
     de allá sigue mandando, esta solo le cambia el número. */
  .vacio{--vacio-masc:112px}
  .fin-lista{padding:var(--e-5) var(--e-4);text-align:center}
  .fin-lista .boton{box-shadow:var(--repisa-2)}
  .sello{padding:var(--e-4);text-align:center;color:var(--tinta-tenue);font-size:var(--t-xs)}

  /* --- LA REPISA DEL GUARÉN ---
     El aviso legal deja de ser una franja beige a sangre —pesaba más que los
     descuentos que venía a acompañar— y pasa a ser el pie fijo del panel, con
     el guarén entero al lado. El animal no ilustra el aviso: lo sostiene. Y
     el gesto que ya trae dibujado desde loica.js dice exactamente lo que dice
     la letra chica — le está dando un mordisco a la tarjeta del banco.
     Es la única mascota de la página y aparece UNA vez: antes había una
     carita recoloreada en cada una de las 437 filas y siete más en los chips,
     que es mucho guarén diciendo poco. Acá está entero, vivo, y en el lugar
     donde el sitio se hace cargo de lo que no es suyo.
     Los tics son los de reposo de loica.css (mordisco 1,7s, cola 3,2s) y no
     hay ninguno adentro de la lista: la regla 8.3 de la dirección visual dice
     que nada se anima mientras la lista scrollea, y esta repisa vive fuera
     del contenedor que scrollea. */
  .aviso-banco{
    flex:none;margin:0;display:flex;gap:var(--e-3);align-items:center;
    padding:6px var(--e-4);border-top:2px solid var(--borde);
    font-size:var(--t-xs);line-height:1.42;color:var(--tinta-tenue);
  }
  .aviso-banco svg{flex:none}
  /* Cuando ya hay un guarén grande en pantalla —lista vacía, mapa caído— el
     siguiente se retira. El texto se queda: la letra chica del banco es lo
     que no puede faltar. */
  .sin-animal svg{display:none}

  /* La burbuja del pin: tarjeta mínima con el borde de tinta de la casa,
     calcada de talleres. Es papel claro en los dos temas. */
  .maplibregl-popup-content{
    font:600 var(--t-sm)/1.4 var(--fuente-ui);color:var(--azul-900);
    border:2px solid var(--azul-900);border-radius:var(--r-md);
    box-shadow:0 3px 0 var(--azul-900);padding:10px 12px;max-width:236px;
  }
  .popup-monto{font-family:var(--fuente-marca);font-size:var(--t-lg);color:var(--c-descuento-tinta)}
  :root[data-tema="oscuro"] .popup-monto{color:#8A4A18}
  .popup-banco{font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .popup-ver{
    display:inline-block;margin-top:7px;background:none;border:0;padding:0;cursor:pointer;
    font:800 var(--t-sm)/1.3 var(--fuente-ui);color:var(--c-descuento-tinta);
    font-family:var(--fuente-ui);text-decoration:underline;
  }
  :root[data-tema="oscuro"] .popup-ver{color:#8A4A18}

  /* --- LA FILA DE UN DESCUENTO ---
     Rejilla de dos columnas y no de tres: la placa del comercio y el cuerpo.
     El porcentaje viajó ADENTRO del cuerpo, en la misma línea que el nombre,
     porque en la columna de la derecha flotaba a media pantalla del dato que
     modifica. Ahora se leen juntos: "QB Restaurant Bar — 50%". */
  .dcto{
    display:grid;grid-template-columns:58px 1fr;gap:var(--e-3);
    padding:var(--e-3) var(--e-4);align-items:start;width:100%;text-align:left;
    background:var(--fondo-elevado);color:inherit;font-family:inherit;
    border:0;border-bottom:1px solid var(--borde);cursor:pointer;
    box-shadow:inset 4px 0 0 var(--banco);transition:var(--rapido);
  }
  .dcto:hover{background:var(--fondo-hundido)}
  .dcto:focus-visible{box-shadow:inset 4px 0 0 var(--banco),
    0 0 0 3px var(--foco),0 0 0 6px var(--contorno);border-radius:6px}

  /* Entrada escalonada, con el mismo presupuesto que loica.css: solo las 12
     primeras, 20ms entre una y otra. */
  .lista-anima .dcto{animation:dcto-entra var(--medio) backwards}
  .lista-anima .dcto:nth-child(1){animation-delay:0ms}
  .lista-anima .dcto:nth-child(2){animation-delay:20ms}
  .lista-anima .dcto:nth-child(3){animation-delay:40ms}
  .lista-anima .dcto:nth-child(4){animation-delay:60ms}
  .lista-anima .dcto:nth-child(5){animation-delay:80ms}
  .lista-anima .dcto:nth-child(6){animation-delay:100ms}
  .lista-anima .dcto:nth-child(7){animation-delay:120ms}
  .lista-anima .dcto:nth-child(8){animation-delay:140ms}
  .lista-anima .dcto:nth-child(9){animation-delay:160ms}
  .lista-anima .dcto:nth-child(10){animation-delay:180ms}
  .lista-anima .dcto:nth-child(11){animation-delay:200ms}
  .lista-anima .dcto:nth-child(12){animation-delay:220ms}
  @keyframes dcto-entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* --- LA PLACA DEL COMERCIO ---
     Es una calcomanía de papel y lo es en los DOS temas. Casi todos los logos
     que publican los bancos son JPG con fondo blanco: puestos sobre el azul de
     la noche se leían como un parche recortado. Así el parche pasa a ser el
     soporte, y el logo —venga cuadrado, apaisado o con transparencia— cae
     siempre dentro del mismo rectángulo.
     El contorno va en --azul-900 fijo y no en --contorno porque de noche
     --contorno es crema y desaparecería contra el papel. Es el mismo criterio
     de la burbuja del mapa, que también es clara en los dos temas. */
  .placa{
    position:relative;width:58px;height:58px;flex:none;overflow:hidden;
    border-radius:var(--r-md);border:2.5px solid var(--azul-900);
    background:var(--papel,var(--c-descuento-suave));display:grid;place-items:center;
  }
  /* El respaldo del comercio sin logo, y de todo logo que no cargue: la
     inicial impresa sobre un papel de color. Cinco papeles y no uno solo
     porque la lista va ordenada por descuento y después por nombre, así que
     las iniciales iguales caen juntas: tres "B" seguidas sobre el mismo
     fondo se leían como un error de repetición y no como un mosaico. El
     papel sale del nombre del local, así que un mismo comercio se ve igual
     en todas sus filas.
     Los cinco son de la familia arena/naranjo y ninguno es un color de
     categoría: en este sitio esos colores SON la señalética, y usarlos de
     relleno haría creer que la baldosa dice algo. Acá no dice nada: lo que
     nombra al local es la letra y el nombre escrito al lado. */
  .placa .inicial{font:800 20px/1 var(--fuente-marca);color:var(--azul-900);
    letter-spacing:-.02em;user-select:none}
  /* object-fit:contain y no cover: un logo apaisado recortado al centro deja
     de ser el logo. El relleno de papel es del <img>, así que la banda que
     sobra a los lados es del mismo color que el resto de la placa. */
  .placa img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;background:var(--arena-50);padding:4px;
  }

  .dcto-cuerpo{min-width:0;display:flex;flex-direction:column;gap:3px}
  .dcto-arriba{display:flex;align-items:center;gap:7px;min-width:0}
  /* El día era una pastilla colgada sobre el mentón de la carita y no se
     leía. Ahora abre la línea de arriba, que es donde el ojo entra. */
  .pastilla-dia{
    flex:none;border:1.5px solid var(--borde-fuerte);border-radius:var(--r-pill);
    padding:2px 8px;font:800 10.5px/1.35 var(--fuente-marca);
    letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-suave);
  }
  .pastilla-dia.hoy{background:var(--acento-solido);color:var(--acento-contraste);
    border-color:var(--contorno)}
  /* El banco es el requisito, no el protagonista: se dice en 12px, en la
     tinta accesible de su color, y se repite en el lomo de la izquierda.
     Antes venía codificado tres veces (texto de color, carita de color y
     lomo de color) y el nombre del local —que es lo que se busca— iba en
     negro corriente sin ninguna jerarquía. */
  .dcto-banco{
    font:800 var(--t-xs)/1.35 var(--fuente-ui);letter-spacing:.04em;text-transform:uppercase;
    color:var(--banco-tinta,var(--tinta-tenue));
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dcto-linea{display:flex;align-items:baseline;gap:var(--e-3);justify-content:space-between}
  /* El nombre del local es LO MÁS GRANDE de la fila, y esa es la corrección
     de fondo de esta página: antes el nombre iba en negro corriente a 17px
     mientras el banco se decía tres veces y el porcentaje flotaba a 27px al
     otro lado. Quien entra acá busca dónde comer; el descuento y el banco
     califican esa respuesta, no la reemplazan. 21 contra 17. */
  .dcto-nombre{
    min-width:0;font:700 var(--t-lg)/1.2 var(--fuente-ui);letter-spacing:-.015em;color:var(--tinta);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* Debajo del nombre en tamaño y encima de todo lo demás en peso: es la
     única cifra de la fila, va en la letra de marca, en el café del Degú y
     con cifras de ancho fijo para que la columna quede a plomo. Se encuentra
     por color y por posición, no por ser la más grande. */
  .dcto-monto{
    flex:none;font:800 var(--t-md)/1.15 var(--fuente-marca);color:var(--c-descuento-tinta);
    font-variant-numeric:tabular-nums;
  }
  /* Un 2x1 o un combo no son un número: se dicen con palabras y en el tamaño
     de las palabras, no estirados a 27px. */
  .dcto-monto.texto{font:800 var(--t-sm)/1.3 var(--fuente-ui);max-width:104px;text-align:right}
  /* 76 convenios no publican ni porcentaje ni frase: el beneficio está en las
     condiciones, dentro de la ficha. Un guion diría "no hay nada"; esto dice
     dónde está. */
  .dcto-monto.sin-cifra{font:600 var(--t-xs)/1.3 var(--fuente-ui);color:var(--tinta-tenue);
    max-width:88px;text-align:right}
  .dcto-meta{
    font-size:var(--t-sm);color:var(--tinta-suave);line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dcto-meta .aviso{color:var(--tinta-tenue);font-style:italic}

  /* --- La ficha: sube desde abajo, y en escritorio ocupa el mismo hueco que
     el panel de la lista, como en el mapa de actividades --- */
  .ficha{
    position:absolute;inset:auto 0 0 0;background:var(--fondo-elevado);z-index:8;
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    border:2.5px solid var(--contorno);border-bottom:0;
    transform:translateY(103%);transition:transform var(--medio);
    max-height:90%;display:flex;flex-direction:column;
  }
  .ficha.visible{transform:translateY(0)}
  .ficha-scroll{overflow-y:auto;flex:1;min-height:0;padding:0 var(--e-5) var(--e-6)}
  .ficha-cabeza{
    display:flex;gap:var(--e-3);align-items:flex-start;
    padding:var(--e-5) var(--e-5) var(--e-3);position:sticky;top:0;z-index:1;
    background:var(--fondo-elevado);border-radius:var(--r-xl) var(--r-xl) 0 0;
  }
  /* La misma placa de la lista, en grande: el comercio se presenta con su
     logo y no con una mascota recoloreada. */
  .ficha-cabeza .placa{width:66px;height:66px}
  .ficha-cabeza .placa .inicial{font-size:24px}
  .ficha-cabeza h2{font-size:var(--t-xl);line-height:1.14}
  .ficha-banco{font:800 var(--t-sm)/1.3 var(--fuente-ui);color:var(--banco-tinta,var(--tinta-tenue));
    letter-spacing:.03em;text-transform:uppercase}
  .cerrar{
    margin-left:auto;flex:none;width:44px;height:44px;border-radius:var(--r-pill);
    border:2px solid var(--contorno);background:var(--fondo-elevado);color:var(--tinta);
    cursor:pointer;font-size:17px;line-height:1;box-shadow:var(--repisa-1);
  }
  .cerrar:active{transform:translateY(3px);box-shadow:none}

  /* El número grande: es lo que la persona vino a ver */
  .monto-grande{
    display:inline-flex;align-items:baseline;gap:var(--e-2);
    background:var(--c-descuento);color:var(--arena-50);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    padding:var(--e-2) var(--e-4);box-shadow:var(--repisa-2);
    font:800 var(--t-2xl)/1 var(--fuente-marca);margin-bottom:var(--e-4);
  }
  .monto-grande small{font-size:var(--t-sm);font-weight:700;opacity:.9}

  .dato{display:flex;gap:var(--e-3);padding:var(--e-3) 0;border-top:1px solid var(--borde);
    font-size:var(--t-sm);line-height:1.5}
  .dato dt{flex:none;width:96px;color:var(--tinta-tenue);font-weight:700}
  .dato dd{margin:0;flex:1;min-width:0}
  .pastillas{display:flex;flex-wrap:wrap;gap:5px}
  .pastilla{
    display:inline-block;background:var(--fondo-hundido);border:1.5px solid var(--borde-fuerte);
    border-radius:var(--r-pill);padding:2px 9px;font-size:11.5px;font-weight:700;
  }
  .pastilla.dia-on{background:var(--c-descuento);color:var(--arena-50);border-color:var(--contorno)}
  .pastilla.hoy{background:var(--acento-solido);color:var(--acento-contraste);border-color:var(--contorno)}
  .letra-chica{font-size:var(--t-xs);color:var(--tinta-suave);line-height:1.55}
  .sin-fecha{color:var(--tinta-tenue);font-style:italic}
  .ficha .boton{width:100%;margin-top:var(--e-4)}
  .enlace-lugar{color:var(--c-descuento-tinta);font-weight:700;text-decoration:none}
  .enlace-lugar:hover{text-decoration:underline}
  /* Una sucursal por renglón. Con varias, la lista se lee como una lista y no
     como un párrafo de direcciones pegadas. */
  .locales{display:flex;flex-direction:column;gap:5px}
  .enlace-lugar.local{font-weight:600;line-height:1.4}
  .mas-locales{display:flex;flex-direction:column;gap:5px;margin-top:2px}
  .mas-locales summary{cursor:pointer;font-size:var(--t-xs);font-weight:700;
    color:var(--tinta-tenue);list-style:none;padding:2px 0}
  .mas-locales summary::-webkit-details-marker{display:none}
  .mas-locales summary::before{content:"▸ "}
  .mas-locales[open] summary::before{content:"▾ "}
  .mas-locales summary:hover{color:var(--c-descuento-tinta)}
  .origen-locales{margin:var(--e-2) 0 0}
  /* En la burbuja del mapa: chico y apagado. Es una salvedad, no el titular. */
  .popup-origen{font-size:11px;font-style:italic;color:var(--tinta-tenue);margin-top:3px}
  .dato a{color:var(--tinta);text-decoration:none;font-weight:600}
  .dato a:hover{text-decoration:underline}

  @media(max-width:879px){
    .panel-lista,.ficha{bottom:var(--hueco-nav)}
    header .filtros{padding:5px var(--e-3) 7px}
    .riel-fecha{padding:var(--e-2) var(--e-3)}
    .ficha{max-height:86%}
  }
  @media(min-width:880px){
    /* En escritorio la lista vive DESPLEGADA a la derecha, en el mismo hueco
       y con el mismo ancho que en el mapa de actividades y en talleres: la
       misma persona cruza de una página a la otra y el mueble tiene que estar
       en el mismo lugar. Los 460px de margen muerto que había a cada lado de
       la columna vieja ahora son mapa. */
    .panel-lista{left:auto;right:var(--e-4);top:var(--e-4);bottom:var(--e-4);width:410px;
      height:auto!important;border-radius:var(--r-lg);max-height:none;transition:none;
      border-bottom:2.5px solid var(--contorno)}
    .tirador{display:none}
    .conteo{padding-top:var(--e-3)}
    .aviso-banco{border-radius:0 0 var(--r-lg) var(--r-lg)}
    /* La ficha se para EXACTAMENTE encima del panel: se lee como la misma
       columna dada vuelta, no como una tercera cosa. */
    .ficha{left:auto;right:var(--e-4);top:var(--e-4);bottom:var(--e-4);width:410px;
      border-radius:var(--r-lg);max-height:none;border-bottom:2.5px solid var(--contorno);
      transform:translateX(105%)}
    .ficha.visible{transform:translateX(0)}
    .ficha-cabeza{border-radius:var(--r-lg) var(--r-lg) 0 0}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="barra" id="barra"></div>
    <div class="riel-fecha">
      <div class="segmentado" id="dias" role="group"></div>
      <div class="cuenta-rango" id="cuenta"></div>
    </div>
    <div class="filtros" id="filtros" role="group"></div>
  </header>

  <main>
    <div id="mapa-descuentos"></div>
    <!-- El mapa y la lista muestran lo MISMO: los dos leen visibles(). Lo que
         no cabe en el mapa —los que el banco publica sin dirección— vive
         igual en la lista, y el panel dice cuántos son. -->
    <section class="panel-lista" id="panel" aria-labelledby="conteo-txt">
      <div class="tirador" id="tirador" role="button" tabindex="0"><div class="barra-tirador"></div></div>
      <div class="conteo"><b id="conteo">0</b> <span id="conteo-txt">descuentos</span>
        <span class="nota-geo" id="nota-geo"></span></div>
      <div class="lista" id="lista"></div>
      <p class="aviso-banco" id="aviso"></p>
    </section>

    <aside class="ficha" id="ficha" aria-hidden="true" aria-labelledby="ficha-titulo">
      <div class="ficha-cabeza" id="ficha-cabeza"></div>
      <div class="ficha-scroll" id="ficha-cuerpo"></div>
    </aside>
  </main>
</div>

<nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj"
        crossorigin="anonymous"></script>
<script src="loica.js?v=26"></script>
<script>
/* ------------------------------------------------------------------
   Estado. Tres filtros y ninguno depende del otro: el día es de una
   respuesta, el banco y la comuna se combinan.
   ------------------------------------------------------------------ */
let DATOS = {descuentos:[], comunas:[], generado:""};
let dia = "hoy", bancoFiltro = null, comunaFiltro = "", rubroFiltro = "", cocinaFiltro = "";
// Umbral mínimo de descuento, no valor exacto: quien filtra quiere "al menos
// 30%", no "exactamente 30%". 0 = sin filtro.
let minimoFiltro = 0;
let mostrando = 80;   // la lista completa son 700 botones; se sirve de a poco

// Cuatro rubros y nada más: el pipeline homologa el vocabulario de los cinco
// bancos antes de exportar (ver loica/descuentos/categorias.py). Antes acá
// había nueve claves y dos pares distintos apuntaban a la misma etiqueta, así
// que el filtro mostraba "Cafeterías" y "Gourmet" repetidos.
const RUBROS = {
  es:{restaurantes:"Restaurantes", cafeterias:"Cafeterías",
      gourmet:"Gourmet", comida_rapida:"Comida rápida"},
  en:{restaurantes:"Restaurants", cafeterias:"Cafés",
      gourmet:"Gourmet", comida_rapida:"Fast food"},
  pt:{restaurantes:"Restaurantes", cafeterias:"Cafeterias",
      gourmet:"Gourmet", comida_rapida:"Fast food"},
};
const rubro = clave => (RUBROS[IDIOMA][clave] || clave.replace(/[-_]/g, " "));

// Tipo de cocina, deducido del nombre del local. Es filtro aparte del rubro:
// "japonesa" y "restaurantes" son dos preguntas distintas.
const COCINAS = {
  es:{japonesa:"Japonesa", peruana:"Peruana", italiana:"Italiana",
      mexicana:"Mexicana", parrilla:"Parrilla", mariscos:"Mariscos",
      asiatica:"Asiática", hamburguesas:"Hamburguesas", pollo:"Pollo",
      vegetariana:"Vegetariana", panaderia:"Panadería y dulces",
      cafe:"Café", bar:"Bar", chilena:"Chilena", comida_rapida:"Comida rápida"},
  en:{japonesa:"Japanese", peruana:"Peruvian", italiana:"Italian",
      mexicana:"Mexican", parrilla:"Grill", mariscos:"Seafood",
      asiatica:"Asian", hamburguesas:"Burgers", pollo:"Chicken",
      vegetariana:"Vegetarian", panaderia:"Bakery", cafe:"Coffee",
      bar:"Bar", chilena:"Chilean", comida_rapida:"Fast food"},
  pt:{japonesa:"Japonesa", peruana:"Peruana", italiana:"Italiana",
      mexicana:"Mexicana", parrilla:"Churrasco", mariscos:"Frutos do mar",
      asiatica:"Asiática", hamburguesas:"Hambúrgueres", pollo:"Frango",
      vegetariana:"Vegetariana", panaderia:"Padaria", cafe:"Café",
      bar:"Bar", chilena:"Chilena", comida_rapida:"Fast food"},
};
const cocina = clave => (COCINAS[IDIOMA][clave] || clave.replace(/[-_]/g, " "));

pintarBarra("descuentos.html");

/* ---------- EL MAPA, SIEMPRE PRESENTE ----------
   Círculos y no marcadores del DOM: con "Hoy" puesto hay ~370 puntos y con
   "Todos" son 610, y a esa escala un elemento del DOM por punto traba el
   arrastre (la lección está en mapa.html y se repite en talleres). El tamaño
   del círculo crece con el descuento, así que el mapa igual dice de un
   vistazo dónde están los grandes; el número exacto lo da la burbuja. */
let mapa = null, hayMapa = false, popup = null;

const esOscuro = () => document.documentElement.dataset.tema === "oscuro";
const TESELAS = {
  claro:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",
  claroEtiquetas:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
  oscuro:"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
  oscuroEtiquetas:"https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",
};
const urlesTeselas = clave => ["a","b","c"].map(s =>
  TESELAS[clave].replace("{s}", s).replace("{r}", devicePixelRatio > 1.5 ? "@2x" : ""));
function estiloMapa(){
  const t = esOscuro() ? ["oscuro","oscuroEtiquetas"] : ["claro","claroEtiquetas"];
  return {version:8,
    sources:{
      base:{type:"raster", tiles:urlesTeselas(t[0]), tileSize:256,
            attribution:'© OpenStreetMap © CARTO'},
      etiquetas:{type:"raster", tiles:urlesTeselas(t[1]), tileSize:256},
    },
    /* La capa de fondo va primero y no es adorno: mientras las teselas no
       llegan, el lienzo de MapLibre es transparente y se ve el crema de la
       página, que se lee como una banda rota bajo los filtros. Con un fondo
       propio, un mapa a medio cargar se lee como un mapa a medio cargar.
       Los dos colores van escritos porque un estilo de MapLibre es JSON y no
       puede leer una variable de CSS; son --arena-200 y --azul-975, el mismo
       criterio con que mapa.html escribe el borde de sus pines. */
    layers:[{id:"papel", type:"background",
             paint:{"background-color":esOscuro() ? "#0B0F1C" : "#EDE7DE"}},
            {id:"base",type:"raster",source:"base"},
            {id:"etiquetas",type:"raster",source:"etiquetas"}]};
}

try{
  mapa = new maplibregl.Map({
    container:"mapa-descuentos", style:estiloMapa(),
    center:[-70.62,-33.44], zoom:11.4, attributionControl:{compact:true}
  });
  hayMapa = true;
}catch(e){
  /* Sin WebGL antes se caía la página entera. La lista es un producto
     completo por su cuenta y tiene que seguir en pie. */
  document.getElementById("mapa-descuentos").innerHTML =
    `<div class="vacio entra" style="padding-top:var(--e-12)">${
       cuerpo("guaren","var(--tinta-tenue)",112,{pose:"durmiendo", anima:true})}
     <p><b>${escapar({es:"Este navegador no puede dibujar el mapa",
                      en:"This browser cannot draw the map",
                      pt:"Este navegador não consegue desenhar o mapa"}[IDIOMA])}</b><br>${
        escapar({es:"La lista funciona igual.", en:"The list works anyway.",
                 pt:"A lista funciona do mesmo jeito."}[IDIOMA])}</p></div>`;
}

if(hayMapa){
  mapa.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-left");
  // El mapa nace antes de que su caja tenga tamaño final (ver mapa.html).
  (() => {
    const caja = document.getElementById("mapa-descuentos");
    let ancho = 0, alto = 0;
    new ResizeObserver(() => {
      if(caja.clientWidth === ancho && caja.clientHeight === alto) return;
      ancho = caja.clientWidth; alto = caja.clientHeight;
      mapa.resize();
    }).observe(caja);
  })();
  mapa.on("load", montarCapas);
  mapa.on("styledata", () => { if(!mapa.getSource("dctos")) montarCapas(); });
  new MutationObserver(() => mapa.setStyle(estiloMapa()))
    .observe(document.documentElement, {attributes:true, attributeFilter:["data-tema"]});
}

/* Un punto por LOCAL y no por oferta: el convenio de Dunkin' es uno y los
   lugares donde comerse la dona son veintiuno. Antes el JSON traía una fila
   por sucursal y esto era directo; ahora las sucursales cuelgan de su oferta
   y hay que aplanarlas acá. El rasgo guarda el índice del local dentro de la
   lista YA FILTRADA, que es la misma que lee la burbuja. */
function datosGeo(lista){
  return {type:"FeatureCollection", features:lista.flatMap(d =>
    localesDe(d)
      .map((l, i) => ({local: l, i}))
      .filter(({local}) => local.lat !== null && local.lon !== null)
      .map(({local, i}) => ({type:"Feature",
        geometry:{type:"Point", coordinates:[local.lon, local.lat]},
        properties:{id:d.id, sede:i, pct:d.porcentaje || 0,
                    color:banco(d.banco_id).color,
                    aprox:local.precision === "comuna" ? 1 : 0}})))};
}

function montarCapas(){
  if(!hayMapa || mapa.getSource("dctos")) return;
  mapa.addSource("dctos", {type:"geojson", data:datosGeo(visibles())});
  mapa.addLayer({id:"dctos-pin", type:"circle", source:"dctos",
    // Con traslape, el descuento más grande queda encima. Va en `layout` y
    // no en `paint`: MapLibre rechaza el estilo entero si se equivoca de
    // bolsa y la capa no se monta, así que el mapa quedaba sin un solo punto.
    layout:{"circle-sort-key":["get","pct"]},
    paint:{
      // El radio crece con el porcentaje: un 50% se ve más gordo que un 10%.
      // Los que no publican cifra caen en el mínimo, que es lo honesto.
      "circle-radius":["interpolate",["linear"],["zoom"],
        10, ["+", 3.2, ["*", .028, ["get","pct"]]],
        14, ["+", 6,   ["*", .085, ["get","pct"]]],
        17, ["+", 9,   ["*", .12,  ["get","pct"]]]],
      "circle-color":["get","color"],
      "circle-stroke-width":2,
      "circle-stroke-color":esOscuro() ? "#EDE7DE" : "#1E2A4A",
      // El punto pálido es el que está al centro de la comuna, no en su
      // dirección: dice "en algún lugar de acá", no "en esta esquina".
      "circle-opacity":["case",["==",["get","aprox"],1], .42, .9],
      "circle-stroke-opacity":["case",["==",["get","aprox"],1], .5, 1],
    }});
  mapa.on("click", "dctos-pin", e => abrirBurbuja(e.features[0], e.lngLat));
  mapa.on("mouseenter", "dctos-pin", () => mapa.getCanvas().style.cursor = "pointer");
  mapa.on("mouseleave", "dctos-pin", () => mapa.getCanvas().style.cursor = "");
  pintarMapa();
}

/* La burbuja se arma con nodos y textContent, nunca con innerHTML: el nombre
   del comercio y el del banco son texto de terceros. */
function abrirBurbuja(rasgo, lngLat){
  const d = DATOS.descuentos.find(x => x.id === rasgo.properties.id);
  if(!d) return;
  const sede = localesDe(d)[rasgo.properties.sede];
  const b = banco(d.banco_id);
  const caja = document.createElement("div");

  const lineaBanco = document.createElement("div");
  lineaBanco.className = "popup-banco";
  lineaBanco.textContent = d.banco;
  lineaBanco.style.color = b.tinta;

  const titulo = document.createElement("b");
  titulo.textContent = d.comercio;

  const monto = montoDescuento(d);
  const cifra = document.createElement("div");
  if(monto){ cifra.className = "popup-monto"; cifra.textContent = monto; }

  const donde = document.createElement("div");
  donde.textContent = sede
    ? [sede.direccion, sede.comuna].filter(Boolean).join(", ") : "";
  donde.style.cssText = "font-weight:500;font-size:12px;margin-top:2px";

  /* De dónde salió esta dirección. El banco dijo "hay descuento en Melt
     Pizzas" sin decir en cuáles, así que este punto es una sucursal de la
     cadena, no un local que el banco haya declarado. Es una diferencia real y
     el que está mirando el pin tiene derecho a saberla. */
  const fuente = document.createElement("div");
  if(sede && sede.origen){
    fuente.className = "popup-origen";
    fuente.textContent = textoOrigen(sede.origen);
  }

  const ver = document.createElement("button");
  ver.type = "button";
  ver.className = "popup-ver";
  ver.textContent = {es:"Ver el descuento", en:"See the deal",
                     pt:"Ver o desconto"}[IDIOMA] + " →";
  ver.onclick = () => { popup?.remove(); abrirFicha(d); };

  caja.append(lineaBanco, titulo, cifra, donde, fuente, ver);
  popup?.remove();
  popup = new maplibregl.Popup({closeButton:false, offset:12})
    .setLngLat(lngLat).setDOMContent(caja).addTo(mapa);
}

function pintarMapa(){
  if(!hayMapa || !mapa.getSource("dctos")) return;
  mapa.getSource("dctos").setData(datosGeo(visibles()));
}

cargarDescuentos().then(d => {
  DATOS = d;
  pintarTodo();
}).catch(() => {
  document.getElementById("lista").innerHTML =
    /* Iba sin `anima` y en español duro: el guarén quedaba congelado y un
       lector en inglés leía una frase suelta en castellano. Es el estado que
       menos se ve y por eso mismo es el que nadie revisa. */
    `<div class="vacio entra">${
       cuerpo("guaren","var(--tinta-tenue)",112,{pose:"durmiendo", anima:true})}
       <p><b>${escapar({es:"No pude cargar los descuentos",
                        en:"I could not load the discounts",
                        pt:"Não consegui carregar os descontos"}[IDIOMA])}</b><br>${
          escapar({es:"Prueba recargando la página.",
                   en:"Try reloading the page.",
                   pt:"Tente recarregar a página."}[IDIOMA])}</p></div>`;
  unSoloGuaren();
});

window.addEventListener("loica:idioma", pintarTodo);

/* ---------- FILTRADO ---------- */
/* Los locales de una oferta que el filtro deja pasar.
   Con la comuna puesta, Dunkin' deja de ser "21 locales": son los dos de
   Ñuñoa, y el mapa tiene que pintar esos dos. Pintar los veintiuno con el
   filtro de Ñuñoa encendido sería contradecir el filtro en la misma pantalla. */
const localesDe = d => (comunaFiltro
  ? d.locales.filter(l => l.comuna === comunaFiltro)
  : d.locales);

function visibles(){
  return DATOS.descuentos.filter(d =>
    (dia === "todo" || (dia === "hoy" ? correHoy(d)
                                      : (!d.dias.length || d.dias.includes(dia)))) &&
    (!bancoFiltro || d.banco_id === bancoFiltro) &&
    // Una oferta entra si CUALQUIERA de sus locales está en la comuna: el
    // convenio de Starbucks es uno solo y sirve en cuarenta comunas.
    (!comunaFiltro || d.comunas.includes(comunaFiltro)) &&
    (!rubroFiltro || d.categoria === rubroFiltro) &&
    (!cocinaFiltro || d.cocina === cocinaFiltro) &&
    // Un 2x1 o un combo no tienen porcentaje: con umbral puesto quedan
    // fuera, que es lo correcto — no se puede afirmar que lleguen al 30%.
    (!minimoFiltro || (d.porcentaje || 0) >= minimoFiltro));
}

function pintarTodo(){
  pintarDias(); pintarFiltros(); pintarLista(); pintarAviso(); pintarMapa();
  unSoloGuaren();
}

/* Un guarén en pantalla, nunca dos. Esta página tiene cuatro puertas por
   donde puede salir —el pie del panel, la lista vacía, la lista que no cargó
   y el hueco del mapa sin WebGL— y dos pueden abrirse a la vez: sin WebGL la
   lista viene llena y el animal grande ya está puesto en el mapa.
   Se queda el primero de la lista de prioridad, que va de más grande a más
   chico, y los demás esconden el suyo. El texto nunca se esconde: la letra
   chica del banco es lo único que no puede faltar.
   Corre al final de pintarTodo() y no dentro de pintarLista(), porque tiene
   que mirar el DOM ya pintado —adentro leía el del render anterior. */
function unSoloGuaren(){
  let ocupado = false;
  for(const cont of document.querySelectorAll(
        "#mapa-descuentos .vacio, #panel .vacio, #aviso")){
    const tiene = !!cont.querySelector("svg");
    cont.classList.toggle("sin-animal", tiene && ocupado);
    ocupado = ocupado || tiene;
  }
}

function pintarAviso(){
  /* Cuerpo entero y no carita: 54px es el tamaño en que se le ven la cola y
     la tarjeta que muerde, que es de lo que trata la frase de al lado. */
  document.getElementById("aviso").innerHTML =
    `${cuerpo("guaren","var(--c-descuento-tinta)",54,{anima:true})}
     <span>${escapar(t("dOjo"))}</span>`;
}

/* El riel del día. "Hoy" primero porque es la pregunta real; los siete días
   después para el que está planificando la semana. */
function pintarDias(){
  const cont = document.getElementById("dias");
  cont.setAttribute("aria-label", t("dDia"));
  const opciones = [["hoy", t("hoy"), true]]
    .concat(DIAS_CLAVE.map((k, i) => [k, t("dias")[i], false]))
    .concat([["todo", t("dTodos"), false]]);

  cont.innerHTML = opciones.map(([clave, etiqueta, destacado]) =>
    `<button type="button" data-dia="${clave}" aria-pressed="${dia === clave}"
       class="${destacado ? "destacado" : ""}">${escapar(etiqueta)}</button>`).join("");

  cont.querySelectorAll("button").forEach(b => b.onclick = () => {
    dia = b.dataset.dia; mostrando = 80; pintarTodo();
  });

  // El contador se fue al panel; la cabecera dice cuándo se revisó.
  const fecha = DATOS.generado
    ? new Date(DATOS.generado).toLocaleDateString(localeDe(), {day:"numeric", month:"long"})
    : "";
  document.getElementById("cuenta").textContent = fecha
    ? `${{es:"Revisado el",en:"Checked",pt:"Revisado em"}[IDIOMA]} ${fecha}`
    : "";
}

function pintarFiltros(){
  const cont = document.getElementById("filtros");
  cont.innerHTML = "";
  cont.setAttribute("aria-label", `${t("dBanco")} · ${t("dComuna")}`);

  // Un chip por banco, con un punto de su color
  (DATOS.bancos || []).forEach(([id, nombre]) => {
    const b = banco(id), activo = bancoFiltro === id;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.style.setProperty("--banco", b.color);
    chip.setAttribute("aria-pressed", activo);
    chip.innerHTML = `<i class="punto-banco"></i> ${escapar(nombre)}`;
    chip.onclick = () => { bancoFiltro = activo ? null : id; mostrando = 80; pintarTodo(); };
    cont.appendChild(chip);
  });

  const sep = document.createElement("span");
  sep.className = "separa-chips";
  cont.appendChild(sep);

  cont.appendChild(desplegable(t("dComuna"), DATOS.comunas.map(c => [c, c]),
    comunaFiltro, v => { comunaFiltro = v; mostrando = 80; pintarTodo(); }));

  const rubros = [...new Set(DATOS.descuentos.map(d => d.categoria))]
    .sort((a, b) => rubro(a).localeCompare(rubro(b)));
  cont.appendChild(desplegable({es:"Tipo",en:"Type",pt:"Tipo"}[IDIOMA],
    rubros.map(r => [r, rubro(r)]),
    rubroFiltro, v => { rubroFiltro = v; mostrando = 80; pintarTodo(); }));

  // "¿Qué como?" es otra pregunta que "¿en qué rubro lo puso el banco?".
  // Solo se listan las cocinas que de verdad tienen locales: los que no dieron
  // señal quedan fuera del filtro en vez de aparecer como "sin tipo".
  const cocinas = [...new Set(DATOS.descuentos.map(d => d.cocina).filter(Boolean))]
    .sort((a, b) => cocina(a).localeCompare(cocina(b)));
  if(cocinas.length){
    cont.appendChild(desplegable({es:"Cocina",en:"Cuisine",pt:"Cozinha"}[IDIOMA],
      cocinas.map(c => [c, cocina(c)]),
      cocinaFiltro, v => { cocinaFiltro = v; mostrando = 80; pintarTodo(); }));
  }

  // Sólo se ofrecen los tramos que tienen algo detrás. "50% o más" son ocho
  // descuentos y el tramo vale la pena; si un día no queda ninguno, ofrecerlo
  // sería mandar a la persona a una lista vacía.
  const desde = {es:"Desde", en:"From", pt:"A partir de"}[IDIOMA];
  const masTexto = {es:"o más", en:"or more", pt:"ou mais"}[IDIOMA];
  const tramos = [10, 20, 30, 40, 50]
    .filter(u => DATOS.descuentos.some(d => (d.porcentaje || 0) >= u))
    .map(u => [String(u), u === 50 ? `50% ${masTexto}` : `${desde} ${u}%`]);
  if(tramos.length){
    cont.appendChild(desplegable({es:"Descuento",en:"Discount",pt:"Desconto"}[IDIOMA],
      tramos, String(minimoFiltro || ""),
      v => { minimoFiltro = Number(v) || 0; mostrando = 80; pintarTodo(); }));
  }

  if(hayFiltros()){
    const limpiar = document.createElement("button");
    limpiar.type = "button";
    limpiar.className = "chip";
    limpiar.textContent = "✕ " + t("dLimpiar");
    limpiar.onclick = limpiarFiltros;
    cont.appendChild(limpiar);
  }
}

const hayFiltros = () =>
  !!(bancoFiltro || comunaFiltro || rubroFiltro || cocinaFiltro || minimoFiltro);

function limpiarFiltros(){
  bancoFiltro = null; comunaFiltro = ""; rubroFiltro = ""; cocinaFiltro = "";
  minimoFiltro = 0; mostrando = 80; pintarTodo();
}

function desplegable(etiqueta, opciones, valor, alCambiar){
  const caja = document.createElement("span");
  caja.className = "chip-select";
  // El <b> es lo que se lee; el <select> va invisible encima (ver el CSS).
  const elegida = opciones.find(([v]) => v === valor);
  caja.innerHTML = `<b>${escapar(elegida ? elegida[1] : etiqueta)}</b>
    <select aria-label="${escapar(etiqueta)}" data-vacio="${valor ? "0" : "1"}">
      <option value="">${escapar(etiqueta)}</option>
      ${opciones.map(([v, txt]) =>
        `<option value="${escapar(v)}" ${v === valor ? "selected" : ""}>${escapar(txt)}</option>`).join("")}
    </select>`;
  caja.querySelector("select").onchange = e => alCambiar(e.target.value);
  return caja;
}

/* ---------- LA PLACA DEL COMERCIO ----------
   590 de los 758 descuentos traen logo y 421 de los 538 comercios tienen uno.
   Los otros 117 —y cualquier logo que el CDN del banco deje de servir— caen
   en la misma baldosa con la inicial, que se ve puesta a propósito y no rota.

   Sobre el ancho de banda: la nota vieja de loica.js decía que no correspondía
   pedirle ochenta imágenes al servidor del banco cada vez que alguien hace
   scroll. El reparo era correcto y se resuelve, no se ignora: `loading="lazy"`
   deja fuera todo lo que no está en pantalla —en el panel entran seis filas—,
   `decoding="async"` saca la decodificación del hilo que dibuja, y a
   Contentful se le pide la miniatura y no el original. */
function logoDe(d){
  const u = urlSegura(d.logo);
  if(!u) return "";
  /* Los 332 logos de assets.bancochile.cl no se piden, y no es por gusto.
     Ese host está detrás de un Imperva que contesta 307 a la MISMA URL y
     recién sirve la imagen cuando el cliente devuelve la cookie
     `visid_incap_*`, que viaja con SameSite=None sobre .bancochile.cl. En
     una etiqueta <img> eso es una cookie de tercera parte: Safari y Firefox
     no la devuelven nunca y el navegador queda dando vueltas en el bucle de
     redirecciones hasta que corta (en Chromium sale como
     ERR_BLOCKED_BY_ORB). O sea: para una parte grande de la gente la imagen
     no existe, y para la otra el precio es aceptarle una cookie de rastreo a
     un banco en una página que no pone banner de consentimiento porque no
     usa cookies. Ese trato no se hace por un adorno de 58px.
     La baldosa con la inicial cubre esas filas. El arreglo de verdad es
     aguas arriba —espejar el archivo o dejar de exportar un logo que no se
     puede dibujar— y va anotado en el informe. */
  if(u.startsWith("https://assets.bancochile.cl/")) return "";
  /* Contentful (los logos que publica Falabella) sirve el archivo original:
     hay PNG de medio mega para una placa de 58px. Su API acepta el ancho por
     query, así que se pide 128 —el doble, por las pantallas de 2x—. Solo
     cuando la URL no trae parámetros propios: los de Ripley vienen firmados
     con token y tocarlos los rompe. */
  return (u.startsWith("https://images.ctfassets.net/") && !u.includes("?"))
    ? u + "?w=128" : u;
}

/* El monograma del local: DOS letras, no una.
   La lista va ordenada por descuento y después por nombre, así que con una
   sola letra los respaldos se apilan idénticos —Boga, Brasas del Arriero y
   Burger King daban tres "B" seguidas— y eso no se lee como un mosaico, se
   lee como un render roto. Con dos letras los vecinos alfabéticos difieren
   siempre, que es justo la propiedad que regala el orden alfabético.
   Dos palabras con peso → sus iniciales ("Burger King" → BK), que además es
   como se abrevian de verdad; una sola palabra → sus dos primeras letras
   ("Boga" → BO). Los nexos no cuentan: "Brasas del Arriero" es BA, no BD. */
const NEXOS = new Set(["de","del","la","las","el","los","y","e","al","a","con",
                       "the","of","and","da","do","dos","das"]);
function monograma(nombre){
  const palabras = String(nombre).replace(/[^\p{L}\p{N}\s]/gu, " ")
    .split(/\s+/).filter(Boolean);
  const fuertes = palabras.filter(p => !NEXOS.has(p.toLowerCase()));
  const util = fuertes.length ? fuertes : palabras;
  if(!util.length) return "··";
  /* Si la primera palabra ya es corta, ES la marca y se toma entera: "QB
     Restaurant Bar" es QB y no QR, "APPA" es AP. */
  if([...util[0]].length > 3 && util.length >= 2)
    return ([...util[0]][0] + [...util[1]][0]).toUpperCase();
  return [...util[0]].slice(0, 2).join("").toUpperCase();
}

/* Los cinco papeles del mosaico. Se elige por el nombre del comercio —no al
   azar y no por el orden de la fila— para que el mismo local salga siempre
   con el mismo papel, aunque aparezca en cuatro bancos distintos. */
const PAPELES = ["var(--c-descuento-suave)", "var(--naranjo-200)", "var(--arena-200)",
                 "var(--arena-300)", "var(--amarillo-100)"];
function papelDe(nombre){
  let s = 0;
  for(const c of String(nombre)) s = (s * 31 + c.codePointAt(0)) % 9973;
  return PAPELES[s % PAPELES.length];
}

function placa(d, clase = ""){
  const logo = logoDe(d);
  return `<span class="placa ${clase}" style="--papel:${papelDe(d.comercio)}">
    <span class="inicial" aria-hidden="true">${escapar(monograma(d.comercio))}</span>
    ${logo ? `<img src="${escapar(logo)}" alt="" width="58" height="58"
                   loading="lazy" decoding="async" onerror="this.remove()">` : ""}
  </span>`;
}

/* ---------- DE DÓNDE SALIÓ LA DIRECCIÓN ----------
   Cada local trae `origen`: vacío cuando lo publicó el propio banco y, si no,
   quién lo aportó. No es un detalle de trastienda. Santander publica "Melt
   Pizzas" a secas, sin una sola dirección, así que los nueve pines de Melt en
   el mapa son las sucursales de la cadena según OpenStreetMap y no locales
   que el banco haya declarado uno por uno. En el mapa los dos se ven igual y
   no son lo mismo: quien mira el pin tiene derecho a saber cuál está mirando. */
function textoOrigen(origen){
  if(!origen) return "";
  if(origen === "OpenStreetMap")
    return {es:"Sucursal de la cadena, según OpenStreetMap",
            en:"Chain branch, per OpenStreetMap",
            pt:"Filial da rede, segundo o OpenStreetMap"}[IDIOMA];
  return {es:`Dirección publicada por ${origen}`,
          en:`Address published by ${origen}`,
          pt:`Endereço publicado por ${origen}`}[IDIOMA];
}

const SIN_DIRECCION = {es:"Sin dirección publicada", en:"No published address",
                       pt:"Sem endereço publicado"};

/* La línea de lugar de la fila. Una oferta puede tener cuarenta locales, uno
   o ninguno, y los tres casos caen en el mismo renglón de la tarjeta.

   El caso de los cuarenta es el que motivó todo esto: con una fila por
   sucursal, la lista abría con veintiún Dunkin' seguidos y Banco de Chile
   parecía tener el triple de convenios que el resto. Tiene los mismos; lo que
   tiene de más es que dice dónde queda cada local. Acá eso se cuenta en vez
   de repetirse. */
function resumenLugar(d){
  const sedes = localesDe(d);
  if(!sedes.length) return d.region || SIN_DIRECCION[IDIOMA];
  if(sedes.length === 1)
    return [sedes[0].direccion, sedes[0].comuna].filter(Boolean).join(" · ")
           || d.region || SIN_DIRECCION[IDIOMA];

  const cuantos = {es:`${sedes.length} locales`, en:`${sedes.length} branches`,
                   pt:`${sedes.length} locais`}[IDIOMA];
  const comunas = [...new Set(sedes.map(l => l.comuna).filter(Boolean))];
  if(!comunas.length) return cuantos;
  /* Dos nombres y el resto contado. Con la lista entera el renglón se iba a
     cuatro líneas y tapaba la fila siguiente; con ninguno, "12 locales" no
     dice si alguno queda cerca. */
  const visibles = comunas.slice(0, 2).join(", ");
  const resto = comunas.length - 2;
  if(resto <= 0) return `${cuantos} · ${visibles}`;
  const mas = {es:`y ${resto} comuna${resto > 1 ? "s" : ""} más`,
               en:`and ${resto} more district${resto > 1 ? "s" : ""}`,
               pt:`e mais ${resto} comuna${resto > 1 ? "s" : ""}`}[IDIOMA];
  return `${cuantos} · ${visibles} ${mas}`;
}

/* ---------- LA FILA ---------- */
function tarjetaDcto(d){
  const b = banco(d.banco_id);
  const cinta = cintaDia(d);
  const monto = montoDescuento(d);
  /* El día se enciende en rojo solo cuando decir "hoy" agrega algo: si el
     filtro puesto YA es "Hoy", todas las filas corren hoy y encender las 437
     no informa de nada. Y "todos los días" tampoco se enciende: no es una
     promesa sobre hoy, es una sobre siempre. */
  const hoyImporta = dia !== "hoy" && d.dias.length && d.dias.includes(hoyClave());

  const lugar = resumenLugar(d);

  const boton = document.createElement("button");
  boton.className = "dcto";
  boton.type = "button";
  boton.style.setProperty("--banco", b.color);
  boton.style.setProperty("--banco-tinta", b.tinta);
  boton.innerHTML = `
    ${placa(d)}
    <span class="dcto-cuerpo">
      <span class="dcto-arriba">
        <span class="pastilla-dia${hoyImporta ? " hoy" : ""}">${escapar(cinta.texto)}</span>
        <span class="dcto-banco">${escapar(d.banco)}</span>
      </span>
      <span class="dcto-linea">
        <span class="dcto-nombre">${escapar(d.comercio)}</span>
        ${monto
          ? `<span class="dcto-monto${d.porcentaje ? "" : " texto"}">${escapar(monto)}</span>`
          : `<span class="dcto-monto sin-cifra">${escapar(
              {es:"Beneficio", en:"Perk", pt:"Benefício"}[IDIOMA])}</span>`}
      </span>
      <span class="dcto-meta">${escapar(lugar)}${d.segmentado
        ? ` <span class="aviso">· ${IDIOMA === "en" ? "segmented" : "segmentado"}</span>` : ""}</span>
    </span>`;
  boton.onclick = () => abrirFicha(d);
  return boton;
}

/* ---------- LISTA ---------- */
function pintarLista(){
  const lista = visibles();
  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  document.getElementById("conteo").textContent = lista.length;
  document.getElementById("conteo-txt").textContent =
    lista.length === 1 ? t("dCuantos1") : t("dCuantos");

  /* La deuda se dice, no se esconde. Lo primero que se cuenta son los
     locales: el número grande del panel son CONVENIOS —un Dunkin', no
     veintiuno— y sin esta línea nadie entendería por qué el mapa tiene el
     triple de puntos que filas la lista. Después, lo que el mapa no tiene:
     las ofertas que el banco publica sin dirección y sin cadena conocida
     siguen en la lista, y acá se dice cuántas son para que nadie crea que el
     mapa las tiene todas. */
  const sedes  = lista.reduce((n, d) => n + localesDe(d).length, 0);
  const sinPin = lista.filter(d => !localesDe(d).some(l => l.lat && l.lon)).length;
  const aprox  = lista.reduce((n, d) =>
    n + localesDe(d).filter(l => l.precision === "comuna").length, 0);
  const partes = [];
  if(sedes > lista.length) partes.push({es:`en ${sedes} locales`,
    en:`across ${sedes} branches`, pt:`em ${sedes} locais`}[IDIOMA]);
  if(sinPin) partes.push({es:`${sinPin} sin dirección salen solo en la lista`,
    en:`${sinPin} with no address are list-only`,
    pt:`${sinPin} sem endereço ficam só na lista`}[IDIOMA]);
  if(aprox) partes.push({es:`${aprox} al centro de su comuna`,
    en:`${aprox} pinned at their district centre`,
    pt:`${aprox} no centro da comuna`}[IDIOMA]);
  document.getElementById("nota-geo").textContent = partes.join(" · ");

  if(!lista.length){
    /* El otro lugar donde el guarén se gana el puesto: si el filtro no deja
       nada, entra corriendo desde el costado (la entrada `m-muralla` que ya
       trae) y se echa a dormir. Es una sola mascota, es grande, y explica el
       vacío mejor que la frase. */
    cont.innerHTML = `<div class="vacio entra">${
      cuerpo("guaren","var(--tinta-tenue)",112,{pose:"durmiendo", anima:true})}
      <p><b>${escapar(t("dVacio"))}</b><br>${escapar(t("dVaciopista"))}</p></div>`;
    /* El chip de limpiar vive al final del riel de filtros y con cinco puestos
       queda fuera de pantalla, que es justo cuando más se necesita. Acá el
       botón está donde está el problema. */
    if(hayFiltros()){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "boton secundario";
      b.textContent = "✕ " + t("dLimpiar");
      b.onclick = limpiarFiltros;
      cont.querySelector(".vacio").appendChild(b);
    }
    return;
  }

  const caja = document.createElement("div");
  caja.className = "lista-anima";
  lista.slice(0, mostrando).forEach(d => caja.appendChild(tarjetaDcto(d)));
  cont.appendChild(caja);

  if(lista.length > mostrando){
    const pie = document.createElement("div");
    pie.className = "fin-lista";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "boton secundario";
    b.textContent = `${t("verMas")} (${lista.length - mostrando})`;
    b.onclick = () => { mostrando += 80; pintarLista(); };
    pie.appendChild(b);
    cont.appendChild(pie);
  } else {
    const sello = document.createElement("p");
    sello.className = "sello";
    sello.textContent = {es:"Eso es todo lo que hay con esos filtros.",
                         en:"That is everything under these filters.",
                         pt:"Isso é tudo com esses filtros."}[IDIOMA];
    cont.appendChild(sello);
  }
}

/* ---------- LOS LOCALES DE LA FICHA ----------
   Acá el convenio se abre y muestra dónde se usa. Es la mitad de la respuesta
   a "hay 40% en Dunkin'": la otra mitad es cuál de los veintiuno me queda
   cerca.

   Los ocho primeros a la vista y el resto dentro de un <details>. Con la lista
   entera abierta, los 112 Starbucks empujaban las condiciones y el link al
   banco tan abajo que nadie los alcanzaba; con solo ocho y sin salida, la
   ficha escondía locales sin decirlo. El <details> es de HTML y no de
   JavaScript a propósito: funciona con teclado y con lector de pantalla sin
   que tengamos que reimplementar nada. */
const CUANTOS_A_LA_VISTA = 8;

function lineaLocal(d, l){
  const texto = [l.direccion, l.comuna].filter(Boolean).join(", ")
    || l.comuna || d.region;
  if(!texto) return "";
  const consulta = encodeURIComponent(
    `${d.comercio} ${[l.direccion, l.comuna].filter(Boolean).join(" ")} Santiago Chile`);
  return `<a class="enlace-lugar local" target="_blank" rel="noopener"
    href="https://www.google.com/maps/search/?api=1&query=${consulta}"
    >${escapar(texto)} ↗</a>`;
}

function bloqueLocales(d){
  const sedes = localesDe(d);
  if(!sedes.length) return escapar(d.region) || "—";

  const lineas = sedes.map(l => lineaLocal(d, l)).filter(Boolean);
  if(!lineas.length) return escapar(d.region) || "—";

  const visibles = lineas.slice(0, CUANTOS_A_LA_VISTA).join("");
  const resto = lineas.slice(CUANTOS_A_LA_VISTA);
  const mas = resto.length
    ? `<details class="mas-locales"><summary>${escapar(
        {es:`ver los ${resto.length} locales restantes`,
         en:`see the other ${resto.length} branches`,
         pt:`ver os outros ${resto.length} locais`}[IDIOMA])}</summary>${
        resto.join("")}</details>`
    : "";

  /* El origen se dice UNA vez por ficha y no una vez por local: repetir
     "según OpenStreetMap" treinta y siete veces no informa más y arruina la
     lectura de la lista, que es para lo que se abrió la ficha.

     Y dice dos cosas distintas según el caso, porque son dos. Si NINGUNA
     dirección la puso el banco, la frase completa: el banco publicó la cadena
     y nada más. Si algunas sí y otras se completaron, decir "el banco no
     publica en qué locales corre" sería falso — publicó varios. */
  const origenes = [...new Set(sedes.map(l => l.origen).filter(Boolean))];
  if(!origenes.length) return `<div class="locales">${visibles}${mas}</div>`;

  const todos = sedes.every(l => l.origen);
  const frase = escapar(origenes.map(textoOrigen).join(" · ")) + ". " + escapar(
    todos
      ? {es:"El banco no publica en qué locales corre el descuento.",
         en:"The bank does not publish which branches the deal applies to.",
         pt:"O banco não publica em quais locais o desconto vale."}[IDIOMA]
      : {es:"El resto de las direcciones las publica el banco.",
         en:"The remaining addresses come from the bank itself.",
         pt:"Os outros endereços são publicados pelo banco."}[IDIOMA]);

  return `<div class="locales">${visibles}${mas}
    <p class="letra-chica sin-fecha origen-locales">${frase}</p></div>`;
}

/* ---------- FICHA ---------- */
function abrirFicha(d){
  const b = banco(d.banco_id);
  const ficha = document.getElementById("ficha");
  const monto = montoDescuento(d);

  const cabeza = document.getElementById("ficha-cabeza");
  cabeza.style.setProperty("--banco-tinta", b.tinta);
  cabeza.innerHTML = `
    ${placa(d)}
    <span style="min-width:0">
      <span class="ficha-banco">${escapar(d.banco)}</span>
      <h2 id="ficha-titulo">${escapar(d.comercio)}</h2>
    </span>
    <button class="cerrar" type="button" aria-label="${escapar(t("cerrar"))}">✕</button>`;
  document.querySelector("#ficha-cabeza .cerrar").onclick = cerrarFicha;

  const hoy = hoyClave();
  const dias = d.dias.length
    ? d.dias.map(k => `<span class="pastilla ${k === hoy ? "hoy" : "dia-on"}">${
        escapar(t("diasLargos")[DIAS_CLAVE.indexOf(k)])}</span>`).join("")
    : `<span class="pastilla hoy">${escapar(t("dTodosDias"))}</span>`;

  /* La dirección va primero y como link a mapas: la pregunta que sigue a
     "hay 40%" es "¿dónde queda?", y responderla dentro de la ficha evita que
     la persona se vaya a buscarla a otra pestaña y no vuelva. */
  const filas = [
    [t("dDia"), `<div class="pastillas">${dias}</div>`],
    [t("donde"), bloqueLocales(d)],
    [{es:"Rubro",en:"Type",pt:"Tipo"}[IDIOMA], escapar(rubro(d.categoria))],
    [t("dHasta"), d.vigencia_hasta
      ? escapar(new Date(d.vigencia_hasta + "T12:00").toLocaleDateString(localeDe(),
          {day:"numeric", month:"long", year:"numeric"}))
      : `<span class="sin-fecha">${escapar(t("dSinFecha"))}</span>`],
  ];
  /* El teléfono es del local, no del convenio, así que se toma del primero
     que lo traiga. Con una cadena de veinte sucursales sería otro dato por
     local; con lo que publican los bancos hoy, o lo trae uno o no lo trae
     ninguno. */
  const telefono = (localesDe(d).find(l => l.telefono) || {}).telefono || "";
  if(telefono) filas.push([{es:"Teléfono",en:"Phone",pt:"Telefone"}[IDIOMA],
    `<a href="tel:${escapar(telefono.replace(/[^+\d]/g, ""))}">${escapar(telefono)}</a>`]);
  if(d.tope) filas.push([t("dTope"), "$" + d.tope.toLocaleString("es-CL")]);
  if(d.modalidad === "online") filas.push(["", `<b>${escapar(t("dSoloOnline"))}</b>`]);
  if(d.modalidad === "presencial") filas.push(["", `<b>${escapar(t("dSoloPresencial"))}</b>`]);
  if(d.tarjetas.length) filas.push([{es:"Tarjetas",en:"Cards",pt:"Cartões"}[IDIOMA],
    `<div class="pastillas">${d.tarjetas.map(x =>
      `<span class="pastilla">${escapar(nombreTarjeta(x))}</span>`).join("")}</div>`]);
  if(d.segmentado) filas.push(["", `<span class="sin-fecha">${escapar(t("dSegmentado"))}</span>`]);

  document.getElementById("ficha-cuerpo").innerHTML = `
    ${monto ? `<div class="monto-grande">${escapar(monto)}
        <small>${escapar({es:"de descuento",en:"off",pt:"de desconto"}[IDIOMA])}</small></div>` : ""}
    <dl style="margin:0">${filas.map(([k, v]) =>
      `<div class="dato"><dt>${escapar(k)}</dt><dd>${v}</dd></div>`).join("")}</dl>
    ${d.condiciones ? `<p class="letra-chica" style="margin-top:var(--e-4)">
        ${escapar(d.condiciones.slice(0, 420))}${d.condiciones.length > 420 ? "…" : ""}</p>` : ""}
    ${d.capturado ? `<p class="letra-chica sin-fecha">${escapar(t("dCapturado"))} ${
        escapar(new Date(d.capturado + "T12:00").toLocaleDateString(localeDe(),
          {day:"numeric", month:"long"}))}. ${escapar(t("dCapturadoPista"))}</p>` : ""}
    ${urlSegura(d.url) ? `<a class="boton" href="${escapar(urlSegura(d.url))}" target="_blank" rel="noopener nofollow">
      ${escapar(t("dVerBanco"))} →</a>` : ""}
    ${urlSegura(d.sitio_web) ? `<a class="boton secundario" href="${escapar(urlSegura(d.sitio_web))}"
        target="_blank" rel="noopener nofollow">${escapar(t("dVerLocal"))} →</a>` : ""}`;

  ficha.classList.add("visible");
  ficha.setAttribute("aria-hidden", "false");
  volarA(d);
}

/* Abrir una ficha lleva el mapa al local. Es la razón de que el mapa esté
   siempre puesto: la pregunta que sigue a "hay 40%" es "¿dónde queda?", y la
   respuesta ya está dibujada al lado. El desplazamiento deja el punto en el
   trozo de mapa que el panel no tapa. */
function volarA(d){
  if(!hayMapa) return;
  const puntos = localesDe(d).filter(l => l.lat && l.lon);
  if(!puntos.length) return;
  const anchoPanel = innerWidth >= 880 ? 426 : 0;
  const altoPanel  = innerWidth >= 880 ? 0 : document.getElementById("panel").clientHeight;
  const desvio = [-anchoPanel / 2, -altoPanel / 2];

  if(puntos.length === 1){
    mapa.easeTo({center:[puntos[0].lon, puntos[0].lat],
                 zoom:Math.max(mapa.getZoom(), 14.5),
                 offset:desvio, duration:600});
    return;
  }
  /* Con varias sucursales, acercarse a la primera es elegir una al azar y
     dejar las otras veinte fuera de pantalla. El encuadre que las contiene a
     todas responde la pregunta de verdad: dónde está esta cadena. El tope de
     zoom evita el otro extremo —dos locales en la misma cuadra dan un
     encuadre pegado a la vereda. */
  const lats = puntos.map(l => l.lat), lons = puntos.map(l => l.lon);
  mapa.fitBounds([[Math.min(...lons), Math.min(...lats)],
                  [Math.max(...lons), Math.max(...lats)]],
                 {padding:{top:40, bottom:40 + (altoPanel ? altoPanel : 0),
                           left:40, right:40 + anchoPanel},
                  maxZoom:14.5, duration:600});
}

function cerrarFicha(){
  const ficha = document.getElementById("ficha");
  ficha.classList.remove("visible");
  ficha.setAttribute("aria-hidden", "true");
}
addEventListener("keydown", e => { if(e.key === "Escape") cerrarFicha(); });

/* "visa-credito-infinite" no se le muestra a nadie así. Banco de Chile los
   publica como slugs y son el dato más útil de la ficha: dicen si TU tarjeta
   sirve o si el descuento es solo para la Signature. */
function nombreTarjeta(slug){
  return String(slug).split("-").map(p =>
    ({visa:"Visa", mastercard:"Mastercard", amex:"Amex", cmr:"CMR",
      credito:"Crédito", debito:"Débito", fan:"FAN"}[p] || p.charAt(0).toUpperCase() + p.slice(1))
  ).join(" ");
}

/* --- La hoja de la lista: cuatro topes, agarre ancho y botón de vuelta ---
   El arrastre ya no vive acá. Era el mismo bloque copiado en las cuatro
   páginas con mapa y con el mismo defecto en las cuatro: solo enganchaba en el
   tirador, que en ESTA página medía 22 px de alto —la mitad de un pulgar—
   así que arrastrar desde el contador o desde la lista no hacía nada. Ahora lo
   hace `montarHoja()` en loica.js, que suma el agarre desde la cabecera del
   contador, el tope OCULTA para ver el mapa entero y el botón flotante que la
   trae de vuelta con el conteo vivo. El contrato está en
   notas/hoja-movil-contrato.md.

   El aria-label del tirador se pone ANTES y sigue siendo de la página: la hoja
   solo pone el suyo si no encuentra ninguno, y el genérico ("más o menos de la
   lista") no dice QUÉ lista. Acá se nombra lo que se cuenta, en el idioma que
   está puesto. */
const tirador = document.getElementById("tirador");
tirador.setAttribute("aria-label", {es:"Arrastra para ver más descuentos",
  en:"Drag to see more discounts", pt:"Arraste para ver mais descontos"}[IDIOMA]);

/* El rótulo del botón lo pone ESTA página: la hoja no sabe si cuenta eventos,
   películas o descuentos, y "254" solo no es una respuesta. Sigue el mismo
   criterio de idioma que el aria-label de arriba sin repetir el diccionario,
   porque `#conteo-txt` ya lo escribe `pintarLista()` con t("dCuantos") —
   descuentos / discounts / descontos, y en singular cuando queda uno. */
const hoja = montarHoja({
  rotulo: () => `${document.getElementById("conteo").textContent} ` +
                `${document.getElementById("conteo-txt").textContent}`,
});
