<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog — Loica</title>
<meta name="description" content="El finde, lo gratis y las rutas de barrio en Santiago, revisados uno por uno y con precio real. La versión larga de Los datos del finde.">
<meta name="robots" content="index,follow" id="meta-robots">
<link rel="canonical" href="https://langab.github.io/loica/blog.html">

<!-- Open Graph básico: esto es lo que se ve al pegar el link en WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Loica">
<meta property="og:locale" content="es_CL">
<meta property="og:title" content="Blog — Loica">
<meta property="og:description" content="El finde, lo gratis y las rutas de barrio en Santiago, revisados uno por uno y con precio real.">
<meta property="og:url" content="https://langab.github.io/loica/blog.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loica.css?v=7">
<style>
  body{overflow-x:hidden}
  .contenido-blog{max-width:760px;margin:0 auto;padding:var(--e-6) var(--e-4) var(--e-12)}

  /* Mascota que "vuela" en la cabecera — mismo truco que nosotros.html */
  .volando{animation:volar 5s ease-in-out infinite}
  @keyframes volar{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* Aviso en línea: idioma, post no encontrado, etc. */
  .aviso-linea{
    display:flex;align-items:center;gap:var(--e-2);
    background:var(--fondo-elevado);border:1px solid var(--borde);border-radius:var(--r-md);
    padding:var(--e-3) var(--e-4);margin-bottom:var(--e-5);font-size:var(--t-sm);color:var(--tinta-suave);
  }
  .aviso-linea svg{flex:none}

  /* Cabecera del índice */
  .blog-cabecera{text-align:center;padding:var(--e-6) 0 var(--e-4)}
  .blog-cabecera h1{margin:var(--e-3) 0 var(--e-2)}
  .blog-cabecera p{max-width:540px;margin:0 auto;color:var(--tinta-suave);line-height:1.62;font-size:var(--t-md)}
  .blog-actualizado{display:block;margin-top:var(--e-3);font-size:var(--t-xs);color:var(--tinta-tenue);font-weight:600}

  /* Los tres formatos. Cada uno tiene animal y color propios: el lector
     aprende que la verde es la de los gratis antes de leer la etiqueta. */
  .formatos-legend{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--e-3);
    margin:var(--e-6) 0;
  }
  .formato-chip{
    display:flex;align-items:center;gap:var(--e-3);
    background:var(--suave);color:var(--azul-900);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:var(--repisa-2);padding:var(--e-3) var(--e-4);
  }
  .formato-chip .icono{
    flex:none;width:42px;height:42px;border-radius:var(--r-pill);
    background:var(--tono);border:2.5px solid var(--contorno);display:grid;place-items:center;
  }
  .formato-chip b{display:block;font-family:var(--fuente-marca);font-size:var(--t-md)}
  .formato-chip span{display:block;font-size:var(--t-xs);color:#4A5878;margin-top:1px;font-weight:600}

  /* ---------- Lista de posts ----------
     La tapa sale de la foto del primer panorama del post: no hay presupuesto
     de ilustración, pero sí hay 300 fotos de organizadores en eventos.json. */
  .lista-posts{display:grid;gap:var(--e-5);margin-top:var(--e-6)}
  .post-tarjeta{
    display:block;text-decoration:none;color:inherit;overflow:hidden;
    background:var(--fondo-elevado);border:3px solid var(--contorno);border-radius:var(--r-xl);
    box-shadow:var(--repisa-4);transition:var(--rapido);
  }
  .post-tarjeta:hover{transform:translateY(-2px)}
  .post-tarjeta:active{transform:translateY(5px);box-shadow:none}
  .post-tapa{
    position:relative;height:180px;background:var(--suave);
    border-bottom:3px solid var(--contorno);display:grid;place-items:center;overflow:hidden;
  }
  /* Los afiches suelen tener el título arriba: encuadrar al centro justo les
     corta la cabeza. Un tercio más arriba salva casi todos. */
  .post-tapa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 32%}
  .post-formato{
    position:absolute;top:var(--e-3);left:var(--e-3);z-index:1;
    display:inline-flex;align-items:center;gap:7px;
    background:var(--tono);color:#fff;border:2.5px solid var(--contorno);
    border-radius:var(--r-pill);padding:4px 14px 4px 4px;
    font:800 var(--t-sm)/1.5 var(--fuente-marca);box-shadow:var(--repisa-1);
  }
  .post-formato .bolita{
    width:28px;height:28px;border-radius:var(--r-pill);background:#FFFBF5;
    display:grid;place-items:center;
  }
  .post-tarjeta-cuerpo{padding:var(--e-5)}
  .post-tarjeta h2{font-size:var(--t-xl);line-height:1.18;margin-bottom:var(--e-2)}
  .post-tarjeta p{color:var(--tinta-suave);line-height:1.6;margin:0 0 var(--e-3)}
  .post-pie{display:flex;gap:var(--e-2);align-items:center;flex-wrap:wrap;
    font-size:var(--t-xs);color:var(--tinta-tenue);font-weight:700}
  .etiqueta-formato{
    display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:800;
    color:var(--tono-tinta,var(--acento));text-transform:uppercase;letter-spacing:.04em;
  }
  .etiqueta-destacado,.etiqueta-evergreen{
    font-size:11px;font-weight:800;padding:2px 10px;border-radius:var(--r-pill);
    background:var(--amarillo-300);color:var(--azul-900);border:2px solid var(--contorno);
  }
  .etiqueta-evergreen{background:var(--verde-200)}

  /* Vista de un post */
  .volver{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--tinta-suave);
    font-weight:600;font-size:var(--t-sm);margin:var(--e-5) 0 var(--e-4)}
  .volver:hover{color:var(--tinta)}
  .post-cabecera{padding-bottom:var(--e-5);border-bottom:1px solid var(--borde);margin-bottom:var(--e-5)}
  .post-cabecera .etiqueta-formato{margin-bottom:var(--e-2);font-size:var(--t-sm)}
  .post-cabecera h1{margin-bottom:var(--e-3)}
  .post-bajada{font-size:var(--t-md);color:var(--tinta-suave);line-height:1.6;margin:0 0 var(--e-3)}
  .post-meta{font-size:var(--t-sm);color:var(--tinta-tenue)}

  .banner-vencido{
    display:flex;gap:var(--e-3);align-items:flex-start;padding:var(--e-3) var(--e-4);
    border-radius:var(--r-md);margin-bottom:var(--e-5);font-size:var(--t-sm);line-height:1.55;
  }
  .banner-vencido.caducado{background:var(--fondo-hundido);color:var(--tinta-suave);border:1px solid var(--borde)}
  .banner-vencido.evergreen{background:var(--gratis-fondo);color:var(--tinta)}
  .banner-vencido a{color:inherit;font-weight:700;text-decoration:underline}

  .post-cuerpo{font-size:var(--t-md);line-height:1.72}
  .post-cuerpo h2{margin:var(--e-6) 0 var(--e-3);font-size:var(--t-lg)}
  .post-cuerpo p{margin:0 0 var(--e-4)}
  .post-cuerpo strong{color:var(--tinta)}

  /* ---------- Cada recomendación ----------
     La foto manda: es lo que hace que un panorama se distinga del de al lado.
     Cuando el organizador no publicó ninguna, queda el pastel de la categoría
     con su animal, que también identifica de qué se trata. */
  .eventos-post{margin-top:var(--e-10)}
  .eventos-post h2{margin-bottom:var(--e-5);font-size:var(--t-xl)}
  .lista-eventos-post{display:grid;gap:var(--e-5)}
  .reco{
    display:grid;grid-template-columns:235px 1fr;
    background:var(--fondo-elevado);border:3px solid var(--contorno);border-radius:var(--r-xl);
    box-shadow:var(--repisa-3);overflow:hidden;
  }
  .reco-foto{
    position:relative;background:var(--suave);min-height:200px;
    display:grid;place-items:center;border-right:3px solid var(--contorno);
  }
  .reco-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .reco-dia{
    position:absolute;top:9px;right:9px;z-index:1;background:var(--azul-900);color:#FFFBF5;
    border:2px solid var(--contorno);border-radius:var(--r-pill);padding:3px 10px;
    font:800 11px/1.5 var(--fuente-ui);text-transform:uppercase;letter-spacing:.05em;
  }
  .reco-dia.pronto{background:var(--rojo-500)}
  .reco-cat{
    position:absolute;left:9px;bottom:9px;z-index:1;display:inline-flex;align-items:center;gap:6px;
    background:var(--cat);color:#fff;border:2px solid var(--contorno);border-radius:var(--r-pill);
    padding:3px 12px 3px 3px;font:800 var(--t-xs)/1.7 var(--fuente-ui);
  }
  .reco-cat .bolita{
    width:23px;height:23px;border-radius:var(--r-pill);background:#FFFBF5;
    display:grid;place-items:center;
  }
  .reco-cuerpo{padding:var(--e-4) var(--e-5) var(--e-5);min-width:0}
  .reco-hora{font:800 var(--t-sm)/1 var(--fuente-ui);color:var(--cat-tinta);
    font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .reco h3{font-size:var(--t-lg);line-height:1.22;margin:5px 0 6px}
  .reco h3 a{text-decoration:none;color:var(--tinta)}
  .reco h3 a:hover{text-decoration:underline}
  .reco-donde{font-size:var(--t-sm);color:var(--tinta-suave);margin-bottom:var(--e-3)}
  .reco-precio{
    display:inline-block;background:var(--azul-900);color:#FFFBF5;border:2px solid var(--contorno);
    border-radius:var(--r-pill);padding:2px 12px;font:800 var(--t-sm)/1.6 var(--fuente-ui);
    margin-right:6px;vertical-align:middle;
  }
  .reco-precio.libre{background:var(--c-libre)}
  .bandera{
    display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;
    border-radius:var(--r-pill);background:var(--fondo-hundido);color:var(--tinta-suave);
    border:2px dashed var(--borde-fuerte);vertical-align:middle;
  }
  .bandera.bandera-agotado{background:var(--rojo-100);color:var(--rojo-700);border-style:solid;border-color:var(--rojo-700)}

  /* La nota es lo único que no sale de eventos.json: es la voz de quien
     revisó. Por eso va en globo y con el animal del formato al lado. */
  .reco-nota{
    position:relative;display:flex;gap:var(--e-3);align-items:flex-start;
    background:var(--suave);color:var(--azul-900);
    border:2.5px solid var(--contorno);border-radius:var(--r-md);
    padding:var(--e-3) var(--e-4);margin:var(--e-4) 0;
  }
  .reco-nota:before{
    content:"";position:absolute;left:20px;top:-9px;width:14px;height:14px;
    background:var(--suave);border-left:2.5px solid var(--contorno);border-top:2.5px solid var(--contorno);
    transform:rotate(45deg);
  }
  .reco-nota .quien{
    flex:none;width:32px;height:32px;border-radius:var(--r-pill);background:var(--tono);
    border:2px solid var(--contorno);display:grid;place-items:center;
  }
  .reco-nota p{margin:0;font-size:var(--t-sm);line-height:1.55;font-weight:600}
  .reco-botones{display:flex;gap:8px;flex-wrap:wrap}
  .reco-botones .boton{padding:8px 14px;font-size:var(--t-sm);box-shadow:var(--repisa-1)}
  .reco-botones .boton:active{transform:translateY(3px);box-shadow:none}
  .reco-rota{grid-template-columns:1fr;opacity:.75}
  .reco-rota-msg{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--tinta-tenue);margin:0 0 6px}

  @media(max-width:600px){
    .reco{grid-template-columns:1fr}
    .reco-foto{min-height:0;height:175px;border-right:0;border-bottom:3px solid var(--contorno)}
    .post-tapa{height:150px}
  }
</style>
</head>
<body class="con-nav-inferior">
<div class="barra" id="barra"></div>

<main class="contenido-blog" id="vista"></main>

<nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>
<script src="loica.js?v=7"></script>
<script>
/* ============================================================
   BLOG — índice + vista de post, ruteado por hash (#/p/<slug>).
   Consume blog.json y eventos.json. No modifica loica.js/loica.css,
   solo los usa (mascota, cat, t, escapar, pintarBarra, REDES, etc.)
   ============================================================ */

let BLOG = null, EVENTOS = [];
const vista = document.getElementById("vista");

const DESCRIPCION_DEFECTO = "El finde, lo gratis y las rutas de barrio en Santiago, revisados uno por uno y con precio real. La versión larga de Los datos del finde.";

// Aviso simple si el idioma global no es español. El blog no se traduce
// todavía (ver _blog_plan.md §5.5) pero las tarjetas de evento sí, porque
// esas ya son multi-idioma en todo el sitio vía cat()/t().
const AVISO_IDIOMA = {
  en: "This blog is written in Spanish for now.",
  pt: "Este blog está escrito em espanhol por enquanto.",
};

/* Paleta de cada formato: relleno fuerte, pastel de fondo y la tinta que sí
   puede tocar texto. blog.json trae un color por formato, pero el amarillo
   del culpeo da 2,4:1 sobre crema y como texto no se lee; acá se usa la
   misma familia que el animal tiene en el mapa. */
const PALETA_FORMATO = {
  finde:  {animal:"loica",  tono:"var(--rojo-500)",  suave:"var(--rojo-100)",        tinta:"var(--rojo-700)"},
  gratis: {animal:"pudu",   tono:"var(--c-libre)",   suave:"var(--c-libre-suave)",   tinta:"var(--c-libre-tinta)"},
  ruta:   {animal:"culpeo", tono:"var(--c-fiesta)",  suave:"var(--c-fiesta-suave)",  tinta:"var(--c-fiesta-tinta)"},
};
const paletaDe = post => PALETA_FORMATO[post.formato] ||
  {animal:"loica", tono:"var(--acento)", suave:"var(--rojo-100)", tinta:"var(--rojo-700)"};
/* Sobre pastel y sobre relleno fuerte —que no cambian con el tema— el
   contorno de la mascota hay que fijarlo, o de noche se queda sin borde. */
const TINTA_FIJA = {tinta:"#1E2A4A"};

/* La tapa de un post es la foto del primer panorama que tenga una. */
function fotoDePost(post){
  for(const ref of (post.eventos || [])){
    const ev = EVENTOS.find(e => e.id === ref.id);
    if(ev && ev.imagen) return ev.imagen;
  }
  return "";
}

pintarBarra("blog.html");
mostrarCargando();

Promise.all([
  fetch("blog.json").then(r => { if(!r.ok) throw new Error("blog.json"); return r.json(); }),
  cargarEventos(),
]).then(([blog, eventos]) => {
  BLOG = blog;
  EVENTOS = eventos;
  enrutar();
}).catch(() => mostrarError());

window.addEventListener("hashchange", enrutar);
window.addEventListener("loica:idioma", () => { if(BLOG) enrutar(); });

/* ---------- estados de carga y error ---------- */
function mostrarCargando(){
  vista.innerHTML = `<div class="vacio">${mascota("loica","var(--tinta-tenue)",70)}
    <p>Cargando el blog…</p></div>`;
}
function mostrarError(){
  vista.innerHTML = `<div class="vacio">${mascota("loica","var(--tinta-tenue)",70)}
    <p><b>No pude cargar el blog</b><br>
    <button class="boton secundario" style="margin-top:12px"
      onclick="location.reload()">Reintentar</button></p></div>`;
}

/* ---------- router ---------- */
function enrutar(){
  if(!BLOG) return;
  const m = location.hash.match(/^#\/p\/([^/?]+)/);
  if(m){
    const post = BLOG.posts.find(p => p.slug === decodeURIComponent(m[1]));
    if(post){ pintarPost(post); window.scrollTo(0,0); return; }
  }
  pintarIndice(!!m);
  window.scrollTo(0,0);
}

/* ---------- utilidades de fecha ---------- */
// "T12:00:00" evita que una fecha sin hora (YYYY-MM-DD) se lea como UTC
// medianoche y aparezca un día antes en huso horario de Chile.
const fechaISOaDate = iso => new Date(iso + "T12:00:00");
const fechaLarga = iso => fechaISOaDate(iso).toLocaleDateString("es-CL",
  {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const fechaCorta = iso => fechaISOaDate(iso).toLocaleDateString("es-CL",
  {day:"numeric", month:"short", year:"numeric"});

function vencido(post){
  return new Date() > new Date(post.vence + "T23:59:59");
}
function formatoDe(post){
  const f = BLOG.formatos && BLOG.formatos[post.formato];
  return f || {etiqueta: post.formato, mascota:"loica", color:"var(--acento)", cadencia:""};
}
function fijarRobots(indexar){
  const meta = document.getElementById("meta-robots");
  if(meta) meta.setAttribute("content", indexar ? "index,follow" : "noindex");
}
function actualizarMetaDescripcion(texto){
  const meta = document.querySelector('meta[name="description"]');
  if(meta) meta.setAttribute("content", texto);
}
// Se usa tanto en el índice como en la vista de un post: un link compartido
// suele caer directo en un post, así que el aviso tiene que vivir en los dos.
// Un post puede declarar su idioma ("idioma": "pt"): si coincide con el del
// lector, avisar que "el blog está en español" sería mentirle en la cara.
function avisoIdiomaHtml(post){
  if(post && post.idioma === IDIOMA) return "";
  return AVISO_IDIOMA[IDIOMA]
    ? `<div class="aviso-linea">${mascota("loica","var(--tinta-tenue)",22)}
        <span>${escapar(AVISO_IDIOMA[IDIOMA])}</span></div>`
    : "";
}
// El lang del cuerpo sale del post; es lo que hace que el corrector y el
// lector de pantalla pronuncien bien el portugués.
const langDe = post => (post && post.idioma) || "es";

/* ---------- índice del blog ---------- */
function pintarIndice(noEncontrado){
  document.title = "Blog — Loica";
  actualizarMetaDescripcion(DESCRIPCION_DEFECTO);
  fijarRobots(true);

  const visibles = BLOG.posts.filter(p => !vencido(p) || p.evergreen);
  const orden = [...visibles].sort((a,b) => {
    if(!!a.destacado !== !!b.destacado) return a.destacado ? -1 : 1;
    return fechaISOaDate(b.publicado) - fechaISOaDate(a.publicado);
  });

  const avisoNoEncontrado = noEncontrado
    ? `<div class="aviso-linea">${mascota("loica","var(--tinta-tenue)",22)}
        <span>No encontramos esa entrada del blog. Acá está todo lo que sí está publicado.</span></div>`
    : "";

  const avisoIdioma = avisoIdiomaHtml();

  const legend = Object.entries(BLOG.formatos || {}).map(([clave, f]) => {
    const p = PALETA_FORMATO[clave] || {tono:f.color, suave:"var(--fondo-hundido)", animal:f.mascota};
    return `
    <div class="formato-chip" style="--tono:${p.tono};--suave:${p.suave}">
      <div class="icono">${mascota(p.animal || f.mascota, "#FFFBF5", 26, TINTA_FIJA)}</div>
      <div><b>${escapar(f.etiqueta)}</b><span>${escapar(f.cadencia)}</span></div>
    </div>`;
  }).join("");

  const lista = orden.length
    ? orden.map(pintarTarjetaIndice).join("")
    : `<div class="vacio">${mascota("loica","var(--tinta-tenue)",64)}
        <p><b>No hay ediciones vigentes ahora mismo</b><br>
        Vuelve pronto — El finde se publica todos los jueves.</p></div>`;

  vista.innerHTML = `
    ${avisoNoEncontrado}
    ${avisoIdioma}
    <header class="blog-cabecera" lang="es">
      <div class="volando">${mascota("loica","var(--acento)",56)}</div>
      <h1>El blog</h1>
      <p>El mapa muestra todo lo que hay. Acá va lo que vale la pena y por qué: alguien
        abrió cada link, confirmó el precio real y dejó fuera lo que no daba. Tres
        formatos fijos: el finde, lo gratis y un barrio por vez.</p>
      ${BLOG.actualizado ? `<span class="blog-actualizado">Actualizado el ${fechaLarga(BLOG.actualizado)}</span>` : ""}
    </header>
    <div class="formatos-legend">${legend}</div>
    <div class="lista-posts">${lista}</div>`;
}

function pintarTarjetaIndice(post){
  const f = formatoDe(post);
  const p = paletaDe(post);
  const vencidoPost = vencido(post);
  const foto = fotoDePost(post);
  const animal = post.mascota || p.animal || f.mascota;
  const cuantos = (post.eventos || []).length;

  return `
    <a class="post-tarjeta" style="--tono:${p.tono};--suave:${p.suave};--tono-tinta:${p.tinta}"
       href="#/p/${encodeURIComponent(post.slug)}">
      <div class="post-tapa">
        ${mascota(animal, p.tono, 84, TINTA_FIJA)}
        ${foto ? `<img src="${escapar(foto)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <span class="post-formato">
          <span class="bolita">${mascota(animal, p.tono, 22, TINTA_FIJA)}</span>
          ${escapar(f.etiqueta)}
        </span>
      </div>
      <div class="post-tarjeta-cuerpo" lang="es">
        <h2>${escapar(post.titulo)}</h2>
        <p>${escapar(post.bajada)}</p>
        <div class="post-pie">
          <span>${fechaCorta(post.publicado)}</span>
          ${cuantos ? `<span>· ${cuantos} panoramas revisados</span>` : ""}
          ${post.destacado ? `<span class="etiqueta-destacado">Destacado</span>` : ""}
          ${vencidoPost && post.evergreen ? `<span class="etiqueta-evergreen">Guía vigente</span>` : ""}
        </div>
      </div>
    </a>`;
}

/* ---------- vista de un post ---------- */
function pintarPost(post){
  const f = formatoDe(post);
  const pal = paletaDe(post);
  const seo = post.seo || {};
  // seo.titulo ya viene listo para usar como <title> tal cual (algunos posts
  // incluyen "| Loica" y otros no, es criterio editorial) — no se le agrega
  // sufijo. Solo post.titulo (que nunca trae marca) necesita el " — Loica".
  document.title = seo.titulo || (post.titulo + " — Loica");
  actualizarMetaDescripcion(seo.descripcion || post.bajada);

  const vencidoPost = vencido(post);
  const expirado = vencidoPost && !post.evergreen;
  fijarRobots(!expirado);

  let banner = "";
  if(expirado){
    banner = `<div class="banner-vencido caducado">
      ${mascota("loica","var(--tinta-tenue)",22)}
      <span><b>Esta edición ya pasó.</b> Se publicó el ${fechaLarga(post.publicado)}
      y venció el ${fechaLarga(post.vence)}. Mira
      <a href="#/">las ediciones vigentes del blog</a> o <a href="mapa.html">el mapa</a>.</span>
    </div>`;
  } else if(vencidoPost && post.evergreen){
    const destino = post.barrio
      ? `qué hay ahora en <a href="mapa.html">${escapar(post.barrio)}, en el mapa</a>`
      : `<a href="mapa.html">qué hay ahora en el mapa</a>`;
    banner = `<div class="banner-vencido evergreen">
      ${mascota(post.mascota || f.mascota, f.color, 22)}
      <span>Los lugares siguen ahí; los eventos de esta lista pueden haber cambiado. Mira ${destino}.</span>
    </div>`;
  }

  const tieneEventos = Array.isArray(post.eventos) && post.eventos.length > 0;
  const eventosHtml = tieneEventos
    ? post.eventos.map(ref => tarjetaEventoPost(ref, pal, post.mascota || pal.animal)).join("")
    : "";
  const primerId = tieneEventos ? post.eventos[0].id : null;

  vista.innerHTML = `
    <a class="volver" href="#/">← Volver al blog</a>
    ${avisoIdiomaHtml(post)}
    <article class="post">
      <header class="post-cabecera" style="--tono:${pal.tono};--tono-tinta:${pal.tinta}" lang="${langDe(post)}">
        <span class="etiqueta-formato">${mascota(post.mascota || pal.animal, pal.tinta, 22)} ${escapar(f.etiqueta)}</span>
        <h1>${escapar(post.titulo)}</h1>
        <p class="post-bajada">${escapar(post.bajada)}</p>
        <div class="post-meta">${fechaLarga(post.publicado)}
          ${post.barrio ? ` · ${escapar(post.barrio)}` : ""} · revisado a mano, uno por uno</div>
      </header>

      ${banner}

      <div class="post-cuerpo" lang="${langDe(post)}">${pintarCuerpo(post.cuerpo || [])}</div>

      ${tieneEventos ? `
        <section class="eventos-post" lang="${langDe(post)}">
          <h2>Los panoramas, uno por uno</h2>
          <div class="lista-eventos-post">${eventosHtml}</div>
        </section>
        <a class="boton bloque" style="margin-top:var(--e-5)"
           href="index.html#/e/${encodeURIComponent(primerId)}">
           Ver ${post.eventos.length === 1 ? "este panorama" : "los " + post.eventos.length + " panoramas"} en el mapa</a>
      ` : ""}

      <div id="compartir-post" style="margin-top:var(--e-6)"></div>
    </article>`;

  document.getElementById("compartir-post").appendChild(compartirPost(post));
}

/* Un string por párrafo. "## " al inicio = subtítulo. *cursiva* y **negrita**,
   nada más — igual que dice el esquema en _blog_plan.md §2.2. */
function formatearParrafo(texto){
  let s = escapar(texto);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
  return s;
}
function pintarCuerpo(cuerpo){
  return cuerpo.map(parrafo =>
    parrafo.startsWith("## ")
      ? `<h2>${formatearParrafo(parrafo.slice(3))}</h2>`
      : `<p>${formatearParrafo(parrafo)}</p>`
  ).join("");
}

/* Tarjeta de un evento referenciado por el post: busca el evento real en
   eventos.json (fecha, lugar, precio, foto) y le suma la nota del editor y
   la bandera de honestidad, que son lo único que no sale de eventos.json. */
function tarjetaEventoPost(ref, pal, animalNota){
  const ev = EVENTOS.find(e => e.id === ref.id);
  if(!ev){
    // Defensivo: si algún día un id queda huérfano, no se rompe la página
    // (ver _blog_plan.md §2.4, chequeo 1 — esto no debería pasar nunca).
    return `<article class="reco reco-rota" style="--tono:${pal.tono};--suave:${pal.suave}">
      <div class="reco-cuerpo">
        <p class="reco-rota-msg">${mascota("loica","var(--tinta-tenue)",20)}
          Este panorama ya no está en la base de datos.</p>
        ${ref.nota ? `<p>${escapar(ref.nota)}</p>` : ""}
      </div>
    </article>`;
  }

  const info = cat(ev.categoria);
  const dia = etiquetaDia(ev.fecha);
  const hora = (ev.fecha.getHours() || ev.fecha.getMinutes()) ? horaDe(ev.fecha) : "";
  const precio = ev.gratis ? t("gratis") : (ev.precio ? "$" + ev.precio.toLocaleString("es-CL") : "—");
  const banderaTexto = ref.bandera && BLOG.banderas && BLOG.banderas[ref.bandera];

  return `
    <article class="reco" style="--tono:${pal.tono};--suave:${pal.suave};--cat:${info.hex};--cat-tinta:${info.tinta}">
      <div class="reco-foto" style="--suave:${info.hex}22">
        ${mascota(info.mascota, info.hex, 76, TINTA_FIJA)}
        ${ev.imagen ? `<img src="${escapar(ev.imagen)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <span class="reco-dia${dia.pronto ? " pronto" : ""}">${dia.texto}</span>
        <span class="reco-cat">
          <span class="bolita">${mascota(info.mascota, info.hex, 19, TINTA_FIJA)}</span>
          ${escapar(info[IDIOMA] || info.es)}
        </span>
      </div>
      <div class="reco-cuerpo">
        ${hora ? `<div class="reco-hora">${hora}</div>` : ""}
        <h3><a href="e/${encodeURIComponent(ev.id)}.html">${escapar(ev.titulo)}</a></h3>
        <div class="reco-donde">${escapar(ev.lugar)}${ev.comuna ? " · " + escapar(ev.comuna) : ""}</div>
        <div>
          <span class="reco-precio${ev.gratis ? " libre" : ""}">${precio}</span>
          ${banderaTexto ? `<span class="bandera${ref.bandera === "agotado" ? " bandera-agotado" : ""}">${escapar(banderaTexto)}</span>` : ""}
        </div>
        ${ref.nota ? `<div class="reco-nota" lang="es">
          <span class="quien">${mascota(animalNota, "#FFFBF5", 22, TINTA_FIJA)}</span>
          <p>${escapar(ref.nota)}</p>
        </div>` : ""}
        <div class="reco-botones">
          <a class="boton secundario" href="index.html#/e/${encodeURIComponent(ev.id)}">${t("verMapa")}</a>
          <a class="boton secundario" href="${escapar(ev.url)}" target="_blank" rel="noopener">${t("ir")} ↗</a>
        </div>
      </div>
    </article>`;
}

/* ---------- compartir un post ----------
   Paralelo a botonesCompartir(ev) de loica.js (que asume forma de evento,
   no de post). Reutiliza REDES y copiarLink tal cual — solo cambia el texto
   y la URL, como pide _blog_plan.md §4.3. */
function compartirPost(post){
  const url = `${SITIO}/blog.html#/p/${post.slug}`;
  const texto = `${post.titulo}\n${post.bajada}`;
  const etiqueta = {es:"Compartir", en:"Share", pt:"Compartilhar"}[IDIOMA];

  const caja = document.createElement("div");
  caja.className = "compartir";
  caja.innerHTML = `<span class="compartir-titulo">${etiqueta}</span><div class="compartir-botones"></div>`;
  const fila = caja.querySelector(".compartir-botones");

  const boton = (clase, nombre, color, icono, alPulsar) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "red " + clase;
    b.style.setProperty("--red", color);
    b.setAttribute("aria-label", `${etiqueta} — ${nombre}`);
    b.title = nombre;
    b.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">${icono}</svg>`;
    b.onclick = alPulsar;
    fila.appendChild(b);
    return b;
  };

  for(const [clave, red] of Object.entries(REDES)){
    boton(clave, red.nombre, red.color, red.icono,
          () => window.open(red.url(url, texto), "_blank", "noopener,width=620,height=560"));
  }

  const iconoIg = `<rect x="3" y="3" width="18" height="18" rx="5.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
    <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.9"/>
    <circle cx="17.2" cy="6.8" r="1.25" fill="currentColor"/>`;
  if(navigator.share){
    boton("instagram", "Instagram / " + etiqueta, "#E1306C", iconoIg,
          () => navigator.share({title: post.titulo, text: texto, url}).catch(() => {}));
  } else {
    boton("instagram", "Instagram — " + {es:"copiar link", en:"copy link", pt:"copiar link"}[IDIOMA],
          "#E1306C", iconoIg, e => copiarLink(url, e.currentTarget));
  }

  boton("copiar", {es:"Copiar link", en:"Copy link", pt:"Copiar link"}[IDIOMA],
        "var(--tinta-suave)",
        `<path d="M9.5 14.5l5-5M8 12l-2 2a3.5 3.5 0 105 5l2-2M16 12l2-2a3.5 3.5 0 10-5-5l-2 2"
          fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>`,
        e => copiarLink(url, e.currentTarget));

  return caja;
}
</script>
