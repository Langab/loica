<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Red de seguridad, no la seguridad. Lo que de verdad impide una inyeccion es
     que todo lo que se pinta pase por escapar() y urlSegura(); esto es lo que
     queda en pie si algun dia se escapa uno. Notas:
     - `img-src https:` va abierto a proposito: las fotos son de los
       organizadores y viven en cientos de dominios que no se pueden listar.
     - `'unsafe-inline'` en script-src es obligatorio mientras las paginas
       tengan su logica en un <script> inline. Aun asi la CSP sirve: bloquea
       cargar un script de OTRO dominio y bloquea que algo inyectado mande los
       datos afuera (connect-src 'self').
     - `frame-ancestors` NO va: en un <meta> el navegador lo ignora, solo
       funciona como cabecera HTTP y GitHub Pages no deja poner cabeceras.
     - `upgrade-insecure-requests` tampoco va: en Pages no hace nada (https +
       HSTS) y en el servidor local abierto desde el celular por la IP de la
       red subía loica.js y loica.css a un https:// inexistente, y la página
       quedaba en blanco. El detalle está en mapa.html.
     - Esta página no agrega ningún dominio: las cifras salen de eventos.json,
       talleres.json y cine.json, que son del propio sitio (connect-src 'self'). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Quién hace Loica</title>
<meta name="description" content="Loica es un mapa de lo que está pasando en Santiago. Acá está por qué existe, cómo se llena y qué todavía no funciona.">
<link rel="canonical" href="https://loicasantiago.cl/nosotros.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loica.css?v=28">
<style>
  body{overflow-x:hidden}

  /* ============================================================
     RITMO DE LA PÁGINA
     La página explica un proceso, así que se lee de arriba abajo una sola
     vez. Para que el ojo tenga dónde parar, las secciones NO tienen todas la
     misma densidad ni el mismo fondo: columna angosta de prosa → diagrama en
     tres escenas → banda de cifras a ancho completo → dos columnas → grilla
     densa → cierre. Los cambios de fondo (fondo / elevado / hundido) son lo
     que separa una sección de otra; el hueco vertical es el mismo en todas y
     ya no hay que llenarlo con 200 px de nada.
     ============================================================ */
  .seccion{max-width:880px;margin:0 auto;padding:var(--e-10) var(--e-5)}
  .seccion.ancha{max-width:1060px}
  /* Medida de lectura. Cada bloque de prosa la declara (`.sub`, `.entrada p`,
     `.principio p`, `.guia p`, `.cierre p`): 54ch, que en Manrope caen en unos
     65 caracteres. Antes la línea llegaba a 95 a 1280 px, y el rango cómodo
     es 60-75. El `ch` engaña: mide el ancho del CERO, que en esta fuente es
     más ancho que la letra promedio, así que 62ch daban 75 caracteres. */
  .cabeza-seccion h2{font-size:var(--t-2xl);line-height:1.14}
  .cabeza-seccion{margin-bottom:var(--e-6)}
  .sub{color:var(--tinta-suave);margin:var(--e-3) 0 0;font-size:var(--t-md);
       line-height:1.55;max-width:54ch}
  /* Bandas a ancho completo: son el respiro entre bloques de texto y la única
     razón por la que la página no se lee como una columna de cajas. */
  .banda{border-top:2.5px solid var(--contorno);border-bottom:2.5px solid var(--contorno)}
  .banda.elevada{background:var(--fondo-elevado)}

  /* ---------- PORTADA ---------- */
  .portada{
    position:relative;padding:var(--e-12) var(--e-5) 0;overflow:hidden;
    background:linear-gradient(170deg,var(--fondo-hundido) 0%,var(--fondo) 62%);
  }
  .portada-interior{position:relative;z-index:2;max-width:660px;margin:0 auto;text-align:center}
  .portada h1{font-size:clamp(31px,6.8vw,var(--t-3xl));line-height:1.06;margin-bottom:var(--e-6)}
  /* La entrada se alinea a la IZQUIERDA aunque el bloque esté centrado: un
     párrafo de cinco líneas centrado no se lee, se adivina. */
  .entrada{text-align:left;max-width:54ch;margin:0 auto}
  .entrada p{font-size:var(--t-md);color:var(--tinta-suave);line-height:1.62;margin:0}
  .entrada p + p{margin-top:var(--e-4)}
  /* La frase política de la entrada va marcada con destacador, como en un
     panfleto. `--destacado` y `--destacado-tinta` son el único par del sistema
     que NO cambia con el tema y que ya viene calculado sobre 4,5:1, así que
     sirve igual de día y de noche. `box-decoration-break:clone` es lo que hace
     que el amarillo envuelva cada línea y no una sola caja larga. */
  .marcado{margin:var(--e-5) 0}
  .marcado b{
    font:800 var(--t-lg)/1.75 var(--fuente-marca);letter-spacing:-.01em;
    background:var(--destacado);color:var(--destacado-tinta);
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
    padding:3px 9px;border-radius:7px;
  }
  /* La anfitriona. Llega volando (`entra` → m-vuelo-llega) y una vez posada se
     queda ladeando la cabeza, que es el tic propio de la Loica: el gesto de
     quien escucha una pregunta. Los dos están escritos en loica.css; acá solo
     se encienden. El flote es del contenedor, así que no pelea con el tic del
     SVG. */
  .volando{margin:0 auto var(--e-5);animation:volar 5s ease-in-out infinite}
  .volando svg{width:clamp(104px,17vw,168px);height:auto;margin:0 auto}
  @keyframes volar{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @media (prefers-reduced-motion:reduce){.volando{animation:none}}

  /* ---------- EL DESFILE ----------
     Cierra la portada: son la señalética del mapa, así que se presentan antes
     de que alguien lea una línea. Tres cosas que antes no hacían:
       - salen ENTEROS (cuerpo, no carita) y parados en la cordillera, como en
         la portada. Antes eran doce cabezas de 30 px metidas en doce nidos
         iguales: el nido es lo que los volvía stickers.
       - cada uno hace su tic de reposo ({anima:true}) y entra con SU entrada
         (`entra` + --d): el Chincol a saltos, el Guarén desde la muralla, la
         Cabra llega tarde, el Quiltro no entra porque ya estaba.
       - cada uno es un ENLACE a su ficha del elenco, que es la pregunta que
         uno se hace mirando la fila ("¿y este quién es?").
     El retardo entre uno y otro son 20 ms con tope de 240 (la regla del
     stagger, _direccion_visual.md 8.4). Con eso el escalonamiento no lo pone
     el retardo sino las entradas mismas, que duran entre 0,5 y 1,3 s y traen
     su propio desfase: la Chinchilla llega 0,9 s tarde y la Cabra 0,15. */
  /* La franja se sale del relleno lateral de la portada: la cordillera tiene
     que llegar a los dos bordes de la pantalla o deja de ser el horizonte. */
  .paseo{
    position:relative;height:clamp(126px,15vw,178px);margin-top:var(--e-8);
    margin-left:calc(var(--e-5) * -1);margin-right:calc(var(--e-5) * -1);
  }
  .paseo #cordillera{position:absolute;inset:0}
  .desfile{
    position:absolute;inset:auto 0 12px 0;z-index:2;
    display:flex;align-items:flex-end;justify-content:center;
    gap:clamp(2px,1.4vw,14px);padding:0 var(--e-3);
  }
  .desfile a{
    display:block;transform-origin:bottom center;transition:transform var(--rebote);
    border-radius:8px;
  }
  .desfile a:hover{transform:translateY(-9px) scale(1.07)}
  .desfile svg{width:clamp(27px,6.2vw,62px);height:auto;display:block}
  /* Con el dedo cada animal medía 27 px de ancho. Doce celdas de 44 no caben
     en 390 px, así que se reparte el ancho entero entre los doce: quedan
     pegados y con 48 px de alto tocable, que es todo lo que da la pantalla.
     El dibujo no cambia; crece la caja. Mismo arreglo que en la portada. */
  @media (max-width:640px) and (pointer:coarse){
    .desfile{gap:0;padding:0 var(--e-2)}
    .desfile a{flex:1;min-width:0;min-height:48px;
               display:flex;align-items:flex-end;justify-content:center}
  }

  /* ---------- CÓMO SE LLENA EL MAPA: EL DIAGRAMA ----------
     Esta página explicaba un proceso de tres pasos sin mostrarlo. Ahora cada
     paso trae su escena dibujada con el mismo lenguaje del resto del sitio
     —contorno grueso, tinta plana, cero degradado— y una regla de color que
     vale para las tres: la MÁQUINA va en tinta (`--contorno` sobre papel) y lo
     que SE MUEVE va en rojo (`--acento`). Así el ojo sigue el rojo de escena
     en escena: las agujas del reloj, el lápiz, el link que vuelve.

     Los dibujos no llevan una sola palabra a propósito: se entienden sin leer
     y no hay que traducirlos tres veces. El texto de al lado dice lo mismo.
     Los dos colores salen de tokens, así que el diagrama funciona igual en
     claro y en oscuro sin una sola regla aparte. */
  .linea{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--e-6);
         list-style:none;margin:0;padding:0}
  /* La tarjeta NO recorta: la flecha que la une con la siguiente vive fuera de
     ella. Por eso las esquinas de arriba de la escena se redondean a mano en
     vez de con overflow:hidden. */
  .paso{
    position:relative;display:flex;flex-direction:column;
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);
    border-radius:var(--r-xl);box-shadow:var(--repisa-2);
  }
  .escena{
    background:var(--fondo);border-bottom:2.5px solid var(--contorno);padding:var(--e-3);
    border-radius:calc(var(--r-xl) - 3px) calc(var(--r-xl) - 3px) 0 0;
  }
  .escena svg{display:block;width:100%;height:auto}
  .paso-texto{padding:var(--e-4) var(--e-5) var(--e-5)}
  .paso b{display:block;font-family:var(--fuente-marca);font-size:var(--t-lg);
          line-height:1.18;margin-bottom:var(--e-2)}
  .paso p{margin:0;color:var(--tinta-suave);font-size:var(--t-base);line-height:1.6}
  /* La flecha entre paso y paso vive en el hueco de la grilla. En escritorio
     apunta a la derecha; en celular, donde la línea se apila, apunta abajo. */
  .paso::after{
    content:"";position:absolute;width:15px;height:15px;
    border-right:4px solid var(--contorno);border-top:4px solid var(--contorno);
    right:-20px;top:76px;transform:rotate(45deg);
  }
  .paso:last-child::after{content:none}
  @media (max-width:860px){
    .linea{grid-template-columns:1fr;gap:var(--e-8)}
    .paso::after{right:auto;top:auto;left:50%;bottom:-27px;
                 transform:translateX(-50%) rotate(135deg)}
  }

  /* ---------- RECUENTO ----------
     Las cifras salen del MISMO JSON que el mapa, en el momento de cargar la
     página. Escritas a mano envejecen y quedan mintiendo, que es justo lo
     contrario de lo que dice esta página. Mientras viajan se ve un guion
     latiendo; si el archivo no llega, la banda entera se esconde: mejor sin
     cifra que con una inventada. */
  .recuento{padding:var(--e-8) var(--e-5)}
  .recuento[hidden]{display:none}
  .recuento-interior{max-width:1060px;margin:0 auto;display:grid;gap:var(--e-6)}
  .gran-cifra{display:flex;align-items:center;gap:var(--e-4)}
  .gran-cifra svg{flex:none}
  .gran-cifra b{
    display:block;font-family:var(--fuente-marca);font-size:clamp(46px,10vw,76px);
    line-height:.92;color:var(--acento);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  }
  .gran-cifra span{display:block;font-size:var(--t-sm);color:var(--tinta-suave);
                   font-weight:600;line-height:1.35;max-width:17ch;margin-top:4px}
  .cifras{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--e-4)}
  .cifra{display:flex;align-items:flex-start;gap:var(--e-2)}
  .cifra svg{flex:none;margin-top:2px}
  .cifra b{display:block;font-family:var(--fuente-marca);font-size:var(--t-2xl);line-height:1;
           color:var(--tono,var(--tinta));font-variant-numeric:tabular-nums}
  .cifra span{display:block;font-size:var(--t-xs);color:var(--tinta-tenue);
              font-weight:600;line-height:1.3;max-width:17ch;margin-top:3px}
  .revisado{margin:0;font-size:var(--t-xs);color:var(--tinta-tenue);font-weight:600}
  @media (min-width:820px){
    .recuento-interior{grid-template-columns:auto 1fr;align-items:center;
                       column-gap:var(--e-12);row-gap:var(--e-5)}
    .revisado{grid-column:1/-1}
  }
  @media (max-width:560px){
    /* `grid-auto-flow:row` explícito: arriba la fila es de columnas automáticas
       y sin esto las dos columnas declaradas acá se llenarían de lado, no de
       arriba abajo, y saldría una tercera columna fuera de pantalla. */
    .cifras{grid-auto-flow:row;grid-template-columns:1fr 1fr;gap:var(--e-4) var(--e-3)}
    .cifra b{font-size:var(--t-xl)}
  }

  /* ---------- PRINCIPIOS ----------
     Tinta plana, contorno grueso y repisa dura, como el resto de la app.
     Cada principio lleva el animal de la categoría que le corresponde: no es
     adorno, es la misma señalética del mapa repetida acá. El pastel y la
     tinta azul no cambian con el tema, por eso el texto va fijo.

     El animal va SIEMPRE a la izquierda. Antes alternaba izquierda/derecha
     con `direction:rtl` y no había ninguna razón detrás: se leía como un
     error de maquetación, no como una decisión. Y el párrafo ya no vive en
     una columna angosta al lado del animal: el animal y el título hacen la
     cabecera, y la prosa corre debajo a lo ancho, con su medida acotada. */
  .principios{display:grid;gap:var(--e-5)}
  .principio{
    background:var(--suave);color:var(--azul-900);
    border:3px solid var(--contorno);border-radius:var(--r-xl);
    box-shadow:var(--repisa-4);padding:var(--e-5);
  }
  .principio-cabeza{
    display:flex;align-items:center;gap:var(--e-4);
    padding-bottom:var(--e-4);margin-bottom:var(--e-4);
    border-bottom:2.5px solid rgba(30,42,74,.18);
  }
  .principio-animal{
    flex:none;width:76px;height:76px;border-radius:var(--r-pill);display:grid;place-items:center;
    background:var(--tono);border:3px solid var(--contorno);box-shadow:var(--repisa-2);
  }
  .principio-animal svg{width:52px;height:52px}
  .principio h3{
    font-family:var(--fuente-marca);font-size:var(--t-xl);line-height:1.12;
    color:var(--azul-900);
  }
  .principio p{margin:0;line-height:1.65;color:#2C3A5C;max-width:54ch}
  @media (max-width:560px){
    .principio{padding:var(--e-4)}
    .principio-cabeza{gap:var(--e-3);padding-bottom:var(--e-3);margin-bottom:var(--e-3)}
    .principio-animal{width:60px;height:60px;border-width:2.5px}
    .principio-animal svg{width:42px;height:42px}
    .principio h3{font-size:var(--t-lg)}
  }

  /* Dos columnas: la cabecera de la sección se queda al costado mientras los
     tres principios pasan. Es el único bloque de la página con esta forma, y
     por eso corta el ritmo de "otra pila de cajas". */
  .dos-columnas{display:grid;gap:var(--e-6)}
  @media (min-width:940px){
    .dos-columnas{grid-template-columns:minmax(210px,268px) 1fr;gap:var(--e-10)}
    .dos-columnas .cabeza-seccion{position:sticky;top:var(--e-6);align-self:start;margin:0}
  }

  /* ---------- LO QUE NO FUNCIONA ----------
     Acá el color se apaga a propósito: es la sección honesta, no la vitrina.

     Todo el resto del sitio se LEVANTA con la repisa dura. Estas fichas hacen
     exactamente lo contrario y se HUNDEN en la página: mismo lenguaje de
     tinta, corrido al revés. La sombra va por dentro y arriba, que es donde
     cae cuando algo está metido en la hoja en vez de apoyado encima, y el
     fondo es el hundido —más oscuro que la página en los dos temas—. Así el
     bloque dice "esto todavía no está" con la misma gramática con la que el
     resto dice "esto sí", y no con una barra de color al costado. */
  .fallas{display:grid;gap:var(--e-3);grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
  .falla{
    background:var(--fondo-hundido);
    border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:inset 0 3px 0 var(--contorno);
    padding:var(--e-5);
  }
  .falla h3{font-family:var(--fuente-ui);font-size:var(--t-md);font-weight:800;margin-bottom:6px}
  .falla p{margin:0;color:var(--tinta-suave);line-height:1.6;font-size:var(--t-base)}

  /* La cabecera de la sección lleva a la Loica dormida: la misma pose de los
     estados vacíos, en el mismo nido contorneado del desfile. Es la lista de
     lo que la guía todavía no alcanza a hacer, así que la guía está durmiendo
     al lado. Un solo elemento torcido en la página, que es lo que permite la
     dirección visual (±2°, nunca en datos). */
  .falta-cabeza{
    display:grid;grid-template-columns:1fr auto;gap:var(--e-5);
    align-items:center;margin-bottom:var(--e-6);
  }
  .falta-cabeza .sub{margin-top:var(--e-3)}
  /* El pastel y la tinta azul del SVG NO cambian con el tema: por eso el
     animal va con tinta fija (var(--contorno) se vuelve crema de noche y la
     Loica se quedaría sin contorno sobre el amarillo). */
  .dormida{
    flex:none;width:88px;height:88px;border-radius:var(--r-pill);
    display:grid;place-items:center;background:var(--c-otros-suave);
    border:3px solid var(--contorno);box-shadow:var(--repisa-2);
    transform:rotate(-2deg);
  }
  .dormida svg{width:60px;height:60px}
  /* En celular NO se apila: el nido se achica y se queda al lado del título.
     Apilada, la Loica quedaba sola en medio de dos huecos y se leía como un
     sticker suelto; al lado del título es la guía de la sección. */
  @media (max-width:560px){
    .falta-cabeza{gap:var(--e-4);align-items:start}
    .dormida{width:68px;height:68px;border-width:2.5px}
    .dormida svg{width:46px;height:46px}
    .falla{padding:var(--e-4)}
  }

  /* ---------- ANIMALES GUÍA ----------
     Es la leyenda del mapa, no doce tarjetas de producto: por eso va densa,
     en dos o tres columnas, con el animal a la izquierda y el texto alineado
     a la izquierda. Antes eran doce fichas de ancho completo con el texto
     centrado, que es la peor forma de leer un párrafo.

     La Loica va aparte y a lo ancho porque no es una categoría: es la
     anfitriona. Once animales son señalética; ella es la casa. */
  .elenco{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:var(--e-4)}
  .guia{
    display:grid;grid-template-columns:auto 1fr;align-items:stretch;
    background:var(--fondo);border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:var(--repisa-2);overflow:hidden;text-align:left;scroll-margin-top:var(--e-6);
  }
  /* El animal sale ENTERO y grande (§6.5 de la dirección visual: "Nosotros es
     la página donde el mascotario se explica") y hace su tic de reposo. Va
     sobre el pastel de su familia, con tinta azul fija: el pastel no cambia
     con el tema y var(--contorno) sí, así que de noche el animal se quedaría
     sin contorno. */
  .guia-animal{
    display:grid;place-items:center;padding:var(--e-3);
    background:var(--suave);border-right:2.5px solid var(--contorno);
  }
  .guia-animal svg{width:88px;height:88px}
  .guia-texto{padding:var(--e-4) var(--e-5) var(--e-5) var(--e-4)}
  .guia b{display:block;font-family:var(--fuente-marca);font-size:var(--t-lg);line-height:1.2}
  /* La pastilla usa la versión OSCURA del color de la familia y no el relleno
     fuerte: con el relleno, el naranjo del Chincol daba 2,4:1 en blanco y el
     turquesa 4,05:1, o sea que la etiqueta que dice de qué se hace cargo cada
     animal era ilegible (hallazgo de la auditoría del 22-08-2026). Estos hex
     vienen de ELENCO y están calculados para pasar 4,5:1 con texto blanco;
     como no dependen del tema, sirven igual de noche. */
  .guia .rol{
    display:inline-block;margin:5px 0 var(--e-2);padding:3px 10px;border-radius:var(--r-pill);
    background:var(--rol-fondo);color:#fff;border:2px solid var(--contorno);
    font:800 var(--t-xs)/1.5 var(--fuente-ui);text-transform:uppercase;letter-spacing:.05em;
  }
  .guia p{margin:0;font-size:var(--t-base);color:var(--tinta-suave);line-height:1.58;max-width:52ch}
  .guia.anfitriona{grid-column:1/-1;border-width:3px;box-shadow:var(--repisa-4)}
  .guia.anfitriona .guia-animal{padding:var(--e-4) var(--e-5)}
  .guia.anfitriona .guia-animal svg{width:132px;height:132px}
  .guia.anfitriona b{font-size:var(--t-2xl)}

      ["chungungo","O Chungungo","Esporte","Lontra pequena de costa rochosa que mesmo assim aparece nadando no Mapocho. Ficou com o esporte: correr, pedalar, subir morro."],
      ["pinguino","O Pinguim","Palestras","Um Humboldt, desta costa, e sempre de gala. Ficou com as palestras, os seminários e a gente que sabe."],
      ["quiltro","O Vira-lata","Comer","O cachorro de rua chileno: sem raça e com dono na vila inteira. Barrigudo porque metade do bairro dá comida, e sempre deitado na porta do lugar antes de você chegar. Ficou com os lugares de comer: não os descontos, mas a mesa à qual se volta."],
    ],
    tCie:"Organiza alguma coisa?", sCie:"Se você dá aula numa praça, toca, monta uma peça, faz uma feira ou convoca uma corrida, sobe aqui. É de graça e vai continuar sendo. Quem revisa é uma pessoa, então demora entre dois e quatro dias. Se passar uma semana e não aparecer, insista: passou batido.",
    cta1:"Publicar um rolê", cta2:"Abrir o mapa",
    pie:"Isto é feito por uma pessoa só, em Santiago, fora do horário de trabalho. Se tiver algo errado, me avise que eu conserto.",
  },
};
const x = k => TX[IDIOMA][k];

/* Dos frases del texto afirmaban cantidades escritas a mano —"casi un tercio"
   de lo gratis y "más de cien" en la categoría otros— y las dos habían
   envejecido: eran 19% y 75. En cualquier página sería un descuido; en ÉSTA,
   que existe para explicar por qué se puede confiar en el sitio, es el peor
   lugar posible para una cifra falsa. Y el rediseño lo empeoraba, porque la
   banda de cifras muestra los dos números arriba del párrafo: la resta queda
   a la vista.

   Se calculan del dato, como todo lo demás de esta página. La proporción se
   dice "uno de cada N" y no en porcentaje porque es la voz de la casa y
   porque un entero redondo envejece mejor que un decimal. Mientras el
   catastro no llegue, la frase se pinta sin la cifra en vez de arriesgar una
   inventada. */
const NUMEROS = {
  es:["", "", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez"],
  en:["", "", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"],
  pt:["", "", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez"],
};
function cifrasVivas(txt){
  if(!RECUENTO) return txt.replace(/\s*\{unoDeCada\}\s*/g, " ").replace(/\{otros\}/g, "");
  const total = RECUENTO.panoramas + RECUENTO.talleres;
  const n = RECUENTO.gratis ? Math.round(total / RECUENTO.gratis) : 0;
  const palabra = NUMEROS[IDIOMA][n] || String(n);
  const proporcion = n >= 2 && n <= 10
    ? {es:`una de cada ${palabra} cosas que aparecen`,
       en:`one in ${palabra}`,   // la frase en inglés ya trae "of what you see"
       pt:`uma em cada ${palabra} coisas que aparecem`}[IDIOMA]
    : {es:"parte de lo que aparece", en:"part",
       pt:"parte do que aparece"}[IDIOMA];
  return txt.replace(/\{unoDeCada\}/g, proporcion)
            .replace(/\{otros\}/g, RECUENTO.otros.toLocaleString(localeDe()));
}

/* ---------- PALETA ----------
   Los colores de cada animal salen de ELENCO (loica.js), que es el registro
   que comparten las nueve páginas: si allá cambia un color, acá cambia solo.
   Tres papeles y cada uno tiene un solo trabajo:
     tono  → relleno fuerte. Medallón, pin. Siempre con contorno.
     tinta → el mismo color oscurecido hasta pasar 4,5:1 con blanco encima.
             Es el ÚNICO que puede ir detrás de texto (la pastilla del rol).
     suave → el pastel del fondo, con tinta azul encima.
   `hex` y `tinta` son fijos y no cambian con el tema, que es lo correcto acá:
   el animal se dibuja en crema sobre el relleno fuerte, y con un token que se
   aclara de noche (--gratis, por ejemplo) el Degú quedaba crema sobre verde
   claro y desaparecía. */
const PASTEL = {
  loica:"var(--rojo-100)",             condor:"var(--c-musica-suave)",
  culpeo:"var(--c-fiesta-suave)",      chinchilla:"var(--c-cultura-suave)",
  cabra:"var(--c-cine-suave)",         chincol:"var(--c-clases-suave)",
  pudu:"var(--c-libre-suave)",         degu:"var(--verde-200)",
  guaren:"var(--c-descuento-suave)",   chungungo:"var(--c-deporte-suave)",
  pinguino:"var(--c-charla-suave)",    quiltro:"var(--c-comer-suave)",
};
const FICHA = Object.fromEntries(ELENCO.map(a => [a.clave, a]));
/* El desfile y el elenco recorren claves que viven en loica.js. Cuando allá
   entra un animal nuevo, acá todavía no tiene color: sin este respaldo la
   página entera queda en blanco, porque pintar() muere antes de llegar al
   resto. Un animal sin color se ve con el amarillo de "otros"; una página
   vacía no se ve. */
const paleta = clave => {
  const a = FICHA[clave];
  return {
    tono:  a ? a.hex   : "#FFB61F",
    tinta: a ? a.tinta : "#7E5900",
    suave: PASTEL[clave] || "var(--c-otros-suave)",
  };
};
/* Qué animal acompaña a cada principio: el degú cuida lo gratis, la loica es
   la casa y el chungungo no para quieto. Mismo criterio que en el mapa. */
const ANIMAL_PRINCIPIO = ["degu","loica","chungungo"];
/* El contorno de la mascota es var(--contorno) y en oscuro se vuelve crema.
   Sobre pastel o sobre relleno fuerte —que no cambian con el tema— hay que
   fijarlo a tinta azul o el animal se queda sin borde de noche. */
const TINTA_FIJA = {tinta:"#1E2A4A"};

/* ---------- CIFRAS EN VIVO ----------
   Salen del mismo JSON que el mapa. Escritas a mano se vuelven mentira en una
   semana, y esta es justo la página que promete no mentir. Se piden UNA vez y
   quedan en memoria: cambiar de idioma repinta, no vuelve a bajar 3 MB. */
let RECUENTO = null;   // {panoramas, talleres, gratis, fecha}
let CINES = null;      // número de cines catastrados

function pintarRecuento(){
  const caja = document.getElementById("recuento");
  if(!RECUENTO){ return; }
  caja.hidden = false;

  const numero = n => n.toLocaleString(localeDe());
  document.getElementById("rec-mayor").innerHTML =
    `<div>${carita("loica", "#E8442E", 40)}</div>
     <div><b>${numero(RECUENTO.panoramas)}</b>
     <span>${escapar(t("pTotalD"))}</span></div>`;

  const cifra = ([n, txt, tono, masc]) =>
    `<div class="cifra" style="--tono:${tono}">
       ${carita(masc, tono, 30)}
       <div><b>${numero(n)}</b><span>${escapar(txt)}</span></div>
     </div>`;
  /* La cifra cuyo archivo no llegó simplemente NO se dibuja. Un guion latiendo
     para siempre es una cifra que promete y no cumple, y el cine viaja aparte
     justo para que su caída no arrastre a las otras tres. */
  document.getElementById("rec-cifras").innerHTML = [
    [RECUENTO.talleres, x("recTalleres"), "var(--c-clases-tinta)", "chincol"],
    [RECUENTO.gratis,   x("recGratis"),   "var(--gratis)",         "degu"],
    [CINES,             x("recCines"),    "var(--c-cine-tinta)",   "cabra"],
  ].filter(([n]) => typeof n === "number").map(cifra).join("");

  /* Solo el día: la corrida ya no siempre es a las seis (ahora la dispara
     GitHub Actions) y una hora en pantalla contradiría al paso 1. */
  document.getElementById("rec-revisado").textContent =
    `${x("revisado")} ${RECUENTO.fecha.toLocaleDateString(localeDe(), {day:"numeric", month:"long"})}`;
}

/* La banda nace escondida y solo aparece cuando llegaron los dos catastros
   grandes. Si fallan, se queda escondida: mejor sin cifra que con una
   inventada. El cine viaja aparte —es el archivo chico— así que si se cae,
   los otros tres números se pintan igual. */
Promise.all([cargarEventos(), cargarTalleres()]).then(([evs, tls]) => {
  RECUENTO = {
    panoramas: evs.length,
    talleres:  tls.length,
    gratis:    evs.filter(e => e.gratis).length + tls.filter(e => e.gratis).length,
    otros:     evs.filter(e => e.categoria === "otros").length,
    fecha:     new Date(),
  };
  return fetch("eventos.json", {cache:"no-cache"}).then(r => r.json()).then(d => {
    const f = new Date(d.generado);
    if(!isNaN(f)) RECUENTO.fecha = f;
  }).catch(() => {});
}).then(() => { pintarRecuento(); pintar(); })   // repinta: las dos frases
  .catch(() => {});                              // con cifra viva la esperaban

fetch("cine.json", {cache:"no-cache"}).then(r => r.json()).then(d => {
  CINES = Array.isArray(d.cines) ? d.cines.length : null;
  if(RECUENTO) pintarRecuento();
}).catch(() => {});

pintarBarra("nosotros.html");

/* Enciende una entrada y la apaga cuando termina. Hay que apagarla: las
   entradas y los tics de reposo se disputan el mismo `animation` del SVG y la
   entrada gana por orden en la hoja, así que mientras `entra` esté puesta la
   Loica no ladea la cabeza ni el Chincol salta. Mismo relevo que en la
   portada y en habla. */
function entrar(caja, ms){
  if(!caja || caja.dataset.entro) return;
  caja.dataset.entro = "1";
  caja.classList.add("entra");
  setTimeout(() => caja.classList.remove("entra"), ms);
}

function pintar(){
  const grande = document.getElementById("loica-grande");
  grande.innerHTML = cuerpo("loica", "var(--rojo-500)", 168, {anima:true});
  document.getElementById("tit").textContent = x("tit");
  document.getElementById("entrada").innerHTML = x("entrada").map((p, i) =>
    i === 1 ? `<p class="marcado"><b>${escapar(p)}</b></p>` : `<p>${escapar(p)}</p>`).join("");
  entrar(grande, 1500);   // m-vuelo-llega dura 1,1 s

  document.getElementById("cordillera").innerHTML = cordillera();

  /* El desfile: los doce enteros, parados en la cordillera, cada uno con su
     retardo para que entren de a uno y no parpadeen todos juntos. Cada animal
     es un enlace a su ficha del elenco, más abajo. */
  const desfile = document.getElementById("desfile");
  desfile.setAttribute("aria-label",
    {es:"Los animales guía", en:"The guide animals", pt:"Os animais-guia"}[IDIOMA]);
  desfile.innerHTML = ELENCO.map((a, i) =>
    `<a href="#guia-${escapar(a.clave)}" style="--d:${Math.min(i, 11) * 20}ms"
        aria-label="${escapar(a[IDIOMA][0])} — ${escapar(a[IDIOMA][1])}"
        title="${escapar(a[IDIOMA][0])}">${cuerpo(a.clave, a.hex, 62, {anima:true})}</a>`).join("");
  entrar(desfile, 1900);  // 240 ms de retardo + la entrada más larga (1,3 s + 0,24)

  document.getElementById("t-como").textContent = x("tCom");
  document.getElementById("s-como").textContent = x("sCom");
  document.getElementById("pasos").innerHTML = x("pasos").map(([tit,desc],i) =>
    `<li class="paso">
       <div class="escena">${ESCENAS[i] || ""}</div>
       <div class="paso-texto"><b>${escapar(tit)}</b><p>${escapar(desc)}</p></div>
     </li>`).join("");

  pintarRecuento();

  document.getElementById("t-creencias").textContent = x("tCre");
  document.getElementById("s-creencias").textContent = x("sCre");
  document.getElementById("creencias").innerHTML = x("cre").map(([tit,desc],i) => {
    const clave = ANIMAL_PRINCIPIO[i], p = paleta(clave);
    return `<article class="principio" style="--tono:${p.tono};--suave:${p.suave}">
      <div class="principio-cabeza">
        <div class="principio-animal">${
          cuerpo(clave, "#FFFBF5", 52, {...TINTA_FIJA, anima:true})}</div>
        <h3>${escapar(cifrasVivas(tit))}</h3>
      </div>
      <p>${escapar(cifrasVivas(desc))}</p>
    </article>`;
  }).join("");

  document.getElementById("t-falta").textContent = x("tFal");
  document.getElementById("s-falta").textContent = x("sFal");
  /* La única mascota de la página SIN {anima:true}, y es a propósito: está
     durmiendo. La Loica se mueve donde trabaja —llega volando a la portada,
     ladea la cabeza, encabeza el elenco— y se queda quieta en la sección de
     lo que todavía no alcanza a hacer. Ese contraste es el chiste. */
  document.getElementById("loica-dormida").innerHTML =
    cuerpo("loica", "var(--rojo-500)", 60, {tinta:"#1E2A4A", pose:"durmiendo"});
  document.getElementById("falta").innerHTML = x("fal").map(([tit,desc]) =>
    `<article class="falla"><h3>${escapar(cifrasVivas(tit))}</h3><p>${escapar(cifrasVivas(desc))}</p></article>`).join("");

  document.getElementById("t-elenco").textContent = x("tEle");
  document.getElementById("s-elenco").textContent = x("sEle");
  /* Cada animal sale entero y grande, con el id al que apunta el desfile.
     Los once NO llevan tic: la fila de la portada ya los presenta en
     movimiento y una leyenda es una tabla de referencia, no un escenario.
     Además evita dejar doce animaciones infinitas dentro de una grilla
     (_direccion_visual.md 8.3). La única que se mueve acá es la Loica, que es
     la anfitriona y la encargada de esta página. */
  document.getElementById("elenco").innerHTML = x("ele").map(([clave,nombre,rol,desc],i) => {
    const p = paleta(clave), anfitriona = i === 0;
    return `<article class="guia${anfitriona ? " anfitriona" : ""}" id="guia-${escapar(clave)}"
                     style="--suave:${p.suave};--rol-fondo:${p.tinta}">
      <div class="guia-animal">${
        cuerpo(clave, p.tono, anfitriona ? 132 : 88, {...TINTA_FIJA, anima:anfitriona})}</div>
      <div class="guia-texto"><b>${escapar(nombre)}</b><div class="rol">${escapar(rol)}</div>
      <p>${escapar(desc)}</p></div>
    </article>`;
  }).join("");

  document.getElementById("t-cierre").textContent = x("tCie");
  document.getElementById("s-cierre").textContent = x("sCie");
  document.getElementById("cta1").textContent = x("cta1");
  document.getElementById("cta2").textContent = x("cta2");
  document.getElementById("pie").textContent = x("pie");
}
pintar();
window.addEventListener("loica:idioma", pintar);
</script>
