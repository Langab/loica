<title>Quién hace Loica</title>
<meta name="description" content="Loica es un mapa de lo que está pasando en Santiago. Acá está por qué existe, cómo se llena y qué todavía no funciona.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  body{overflow-x:hidden}

  /* ---------- PORTADA ---------- */
  .portada{
    position:relative;padding:var(--e-12) var(--e-5) var(--e-10);text-align:center;overflow:hidden;
    background:linear-gradient(170deg,var(--fondo-hundido) 0%,var(--fondo) 62%);
  }
  .portada .cerros{position:absolute;inset:auto 0 0 0;width:100%;height:130px;opacity:.5}
  .portada-interior{position:relative;max-width:700px;margin:0 auto}
  .portada h1{font-size:clamp(30px,7vw,var(--t-3xl));margin-bottom:var(--e-4)}
  .portada .entrada{font-size:var(--t-md);color:var(--tinta-suave);line-height:1.62}
  .volando{margin:0 auto var(--e-5);animation:volar 5s ease-in-out infinite}
  @keyframes volar{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @media (prefers-reduced-motion:reduce){.volando{animation:none}}

  /* La fila de animales guía cierra la portada: son la señalética del mapa,
     así que aparecen antes de que alguien lea una sola línea. */
  .desfile{
    position:relative;display:flex;justify-content:center;flex-wrap:wrap;
    gap:var(--e-2);margin-top:var(--e-6);
  }
  .desfile span{
    width:46px;height:46px;border-radius:var(--r-pill);display:grid;place-items:center;
    background:var(--suave);border:2.5px solid var(--contorno);box-shadow:var(--repisa-1);
  }
  .desfile svg{width:30px;height:30px}

  section{max-width:820px;margin:0 auto;padding:var(--e-10) var(--e-5)}
  section > h2{margin-bottom:var(--e-2)}
  section > .sub{color:var(--tinta-suave);margin:0 0 var(--e-6);font-size:var(--t-md);max-width:62ch}

  /* ---------- PRINCIPIOS ----------
     Tinta plana, contorno grueso y repisa dura, como el resto de la app.
     Cada principio lleva el animal de la categoría que le corresponde: no es
     adorno, es la misma señalética del mapa repetida acá. El pastel y la
     tinta azul no cambian con el tema, por eso el texto va fijo. */
  .principios{display:grid;gap:var(--e-5)}
  .principio{
    position:relative;display:grid;grid-template-columns:auto 1fr;gap:var(--e-4);align-items:start;
    background:var(--suave);color:var(--azul-900);
    border:3px solid var(--contorno);border-radius:var(--r-xl);
    box-shadow:var(--repisa-4);padding:var(--e-5);
  }
  .principio:nth-child(even){direction:rtl}
  .principio:nth-child(even) > *{direction:ltr}
  .principio-animal{
    width:84px;height:84px;border-radius:var(--r-pill);display:grid;place-items:center;
    background:var(--tono);border:3px solid var(--contorno);box-shadow:var(--repisa-2);
  }
  .principio-animal svg{width:58px;height:58px}
  .principio h3{
    font-family:var(--fuente-marca);font-size:var(--t-xl);line-height:1.15;
    margin-bottom:var(--e-2);color:var(--azul-900);
  }
  .principio p{margin:0;line-height:1.62;color:#2C3A5C}
  @media (max-width:560px){
    .principio{gap:var(--e-3);padding:var(--e-4)}
    .principio-animal{width:62px;height:62px}
    .principio-animal svg{width:44px;height:44px}
    .principio h3{font-size:var(--t-lg)}
  }

  /* ---------- PASOS ---------- */
  .pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--e-4)}
  .paso{
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:var(--repisa-2);padding:var(--e-5) var(--e-4);text-align:center;
  }
  .paso .num{
    width:46px;height:46px;border-radius:var(--r-pill);background:var(--tono);color:#fff;
    border:2.5px solid var(--contorno);box-shadow:var(--repisa-1);
    display:grid;place-items:center;margin:0 auto var(--e-3);
    font:800 var(--t-md)/1 var(--fuente-marca);
  }
  .paso b{display:block;margin-bottom:6px;font-family:var(--fuente-marca);font-size:var(--t-md)}
  .paso span{color:var(--tinta-suave);font-size:var(--t-sm);line-height:1.55}

  /* ---------- LO QUE NO FUNCIONA ----------
     Acá el color se apaga a propósito: es la sección honesta, no la vitrina. */
  .fallas{display:grid;gap:var(--e-3)}
  .falla{
    background:var(--fondo-elevado);border:2px dashed var(--borde-fuerte);border-radius:var(--r-lg);
    padding:var(--e-4) var(--e-5);border-left:6px solid var(--amarillo-300);
  }
  .falla h3{font-family:var(--fuente-ui);font-size:var(--t-md);font-weight:800;margin-bottom:6px}
  .falla p{margin:0;color:var(--tinta-suave);line-height:1.6}

  /* ---------- ANIMALES GUÍA ---------- */
  .elenco{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--e-4)}
  .guia{
    background:var(--fondo-elevado);border:2.5px solid var(--contorno);border-radius:var(--r-lg);
    box-shadow:var(--repisa-2);overflow:hidden;transition:var(--rapido);text-align:center;
  }
  .guia:hover{transform:translateY(-2px);box-shadow:var(--repisa-4)}
  .guia-cabeza{
    background:var(--suave);border-bottom:2.5px solid var(--contorno);
    padding:var(--e-4) var(--e-3) var(--e-3);
  }
  .guia-cabeza svg{width:64px;height:64px;margin:0 auto}
  .guia-cuerpo{padding:var(--e-4) var(--e-4) var(--e-5)}
  .guia b{display:block;font-family:var(--fuente-marca);font-size:var(--t-lg);line-height:1.2}
  .guia .rol{
    display:inline-block;margin:6px 0 var(--e-2);padding:3px 11px;border-radius:var(--r-pill);
    background:var(--tono);color:#fff;border:2px solid var(--contorno);
    font:800 var(--t-xs)/1.5 var(--fuente-ui);
  }
  .guia span{display:block;font-size:var(--t-sm);color:var(--tinta-suave);line-height:1.55}

  /* ---------- CIERRE ---------- */
  .cierre{
    position:relative;background:var(--azul-cordillera);color:#F3EDE1;text-align:center;
    padding:var(--e-12) var(--e-5) var(--e-10);margin-top:var(--e-8);overflow:hidden;
  }
  .cierre h2{color:#fff;margin-bottom:var(--e-3)}
  .cierre p{max-width:560px;margin:0 auto var(--e-6);opacity:.88;line-height:1.62}
  .cierre .boton.secundario{color:#F3EDE1;border-color:rgba(243,237,225,.45);background:transparent}
  .cierre .boton.secundario:hover{background:rgba(243,237,225,.12)}
  .botones{display:flex;gap:var(--e-3);justify-content:center;flex-wrap:wrap}
  .pie{text-align:center;padding:var(--e-6) var(--e-5);color:var(--tinta-tenue);font-size:var(--t-xs);
       max-width:560px;margin:0 auto;line-height:1.6}
</style>
</head>

    tEle:"Os animais-guia", sEle:"Cada categoria tem um animal chileno. Dá para saber do que se trata sem ler uma palavra: ajuda na pressa e ajuda mais ainda se você não fala espanhol. Os desenhos são caseiros e dá para notar.",
    ele:[
      ["loica","A Loica","A anfitriã","O pássaro que dá nome a isto. Peito vermelho aceso, pousada nos arames de qualquer estrada de campo do Chile. É o pin que você vê no mapa."],
      ["condor","O Cóndor","Música","Três metros de asa e horas planando sem bater nenhuma, olhando de cima. Ficou com os shows, os concertos e os festivais."],
      ["culpeo","O Culpeo","Festas","A raposa grande do Chile: sai de noite e circula por onde ninguém está olhando. Ficou com as festas."],
      ["chinchilla","A Chinchilla","Cultura","Chilena, noturna e ameaçada; tem a pelagem mais densa entre os mamíferos terrestres, dezenas de pelos saindo de um mesmo folículo. Ficou com o teatro, o cinema, a arte e as palestras."],
      ["chincol","O Chincol","Bairro","Canta em qualquer praça de Santiago às sete da manhã, você tendo pedido ou não. Bem onde acontecem as aulas, as oficinas e as feiras."],
      ["pudu","O Pudú","De graça","O menor cervo do mundo: não chega a meio metro. Cuida do que não custa nada."],
      ["chungungo","O Chungungo","Esporte","Lontra pequena de costa rochosa que mesmo assim aparece nadando no Mapocho. Ficou com o esporte: correr, pedalar, subir morro."],
    ],
    tCie:"Organiza alguma coisa?", sCie:"Se você dá aula numa praça, toca, monta uma peça, faz uma feira ou convoca uma corrida, sobe aqui. É de graça e vai continuar sendo. Quem revisa é uma pessoa, então demora entre dois e quatro dias. Se passar uma semana e não aparecer, insista: passou batido.",
    cta1:"Publicar um rolê", cta2:"Abrir o mapa",
    pie:"Isto é feito por uma pessoa só, em Santiago, fora do horário de trabalho. Se tiver algo errado, me avise que eu conserto.",
  },
};
const x = k => TX[IDIOMA][k];

/* Paleta de la página: cada bloque toma prestada una familia del mapa.
   tono = el relleno fuerte, suave = el pastel de fondo. */
const PALETA = {
  loica:     {tono:"var(--rojo-500)",   suave:"var(--rojo-100)"},
  condor:    {tono:"var(--c-musica)",   suave:"var(--c-musica-suave)"},
  culpeo:    {tono:"var(--c-fiesta)",   suave:"var(--c-fiesta-suave)"},
  chinchilla:{tono:"var(--c-cultura)",  suave:"var(--c-cultura-suave)"},
  chincol:   {tono:"var(--c-clases)",   suave:"var(--c-clases-suave)"},
  pudu:      {tono:"var(--c-libre)",    suave:"var(--c-libre-suave)"},
  chungungo: {tono:"var(--c-deporte)",  suave:"var(--c-deporte-suave)"},
  pinguino:  {tono:"var(--c-charla)",   suave:"var(--c-charla-suave)"},
};
/* Qué animal acompaña a cada principio: el pudú cuida lo gratis, la loica es
   la casa y el chungungo no para quieto. Mismo criterio que en el mapa. */
const ANIMAL_PRINCIPIO = ["pudu","loica","chungungo"];
const COLOR_PASO = ["var(--c-clases)","var(--c-cultura)","var(--c-fiesta)"];
/* El contorno de la mascota es var(--contorno) y en oscuro se vuelve crema.
   Sobre pastel o sobre relleno fuerte —que no cambian con el tema— hay que
   fijarlo a tinta azul o el animal se queda sin borde de noche. */
const TINTA_FIJA = {tinta:"#1E2A4A"};

pintarBarra("nosotros.html");

function pintar(){
  document.getElementById("loica-grande").innerHTML = mascota("loica","var(--rojo-500)",96);
  document.getElementById("tit").textContent = x("tit");
  document.getElementById("entrada").textContent = x("entrada");

  document.getElementById("desfile").innerHTML = ELENCO.map(a =>
    `<span style="--suave:${PALETA[a.clave].suave}">${mascota(a.clave,a.hex,30,TINTA_FIJA)}</span>`).join("");

  document.getElementById("t-creencias").textContent = x("tCre");
  document.getElementById("s-creencias").textContent = x("sCre");
  document.getElementById("creencias").innerHTML = x("cre").map(([t,d],i) => {
    const clave = ANIMAL_PRINCIPIO[i], p = PALETA[clave];
    return `<article class="principio" style="--tono:${p.tono};--suave:${p.suave}">
      <div class="principio-animal">${mascota(clave,"#FFFBF5",58,TINTA_FIJA)}</div>
      <div class="principio-texto"><h3>${t}</h3><p>${d}</p></div>
    </article>`;
  }).join("");

  document.getElementById("t-como").textContent = x("tCom");
  document.getElementById("s-como").textContent = x("sCom");
  document.getElementById("pasos").innerHTML = x("pasos").map(([t,d],i) =>
    `<div class="paso" style="--tono:${COLOR_PASO[i]}"><div class="num">${i+1}</div><b>${t}</b><span>${d}</span></div>`).join("");

  document.getElementById("t-falta").textContent = x("tFal");
  document.getElementById("s-falta").textContent = x("sFal");
  document.getElementById("falta").innerHTML = x("fal").map(([t,d]) =>
    `<article class="falla"><h3>${t}</h3><p>${d}</p></article>`).join("");

  document.getElementById("t-elenco").textContent = x("tEle");
  document.getElementById("s-elenco").textContent = x("sEle");
  document.getElementById("elenco").innerHTML = x("ele").map(([clave,nombre,rol,desc]) => {
    const p = PALETA[clave];
    return `<article class="guia" style="--tono:${p.tono};--suave:${p.suave}">
      <div class="guia-cabeza">${mascota(clave, p.tono, 64, TINTA_FIJA)}</div>
      <div class="guia-cuerpo"><b>${nombre}</b><div class="rol">${rol}</div><span>${desc}</span></div>
    </article>`;
  }).join("");

  document.getElementById("t-cierre").textContent = x("tCie");
  document.getElementById("s-cierre").textContent = x("sCie");
  document.getElementById("cta1").textContent = x("cta1");
  document.getElementById("cta2").textContent = x("cta2");
  document.getElementById("pie").textContent = x("pie");
}
pintar();
window.addEventListener("loica:idioma", pintar);
</script>
</body>
</html>
