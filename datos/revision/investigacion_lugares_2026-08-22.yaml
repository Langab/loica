# Investigación web de lugares sin pin exacto — 22 de agosto de 2026.
#
# Los 339 lugares que caían al centro de su comuna (o a ninguna parte) se
# ordenaron por cuántos eventos arregla cada uno y se buscaron en internet:
# la ficha del evento en la ticketera, el sitio del recinto, el registro
# oficial de juntas de vecinos, el directorio municipal. Cada dirección de
# acá salió de una página que se puede abrir y leer — `fuente_url` — y no de
# la memoria de nadie.
#
# ESTE ARCHIVO NO SE APLICA SOLO. Es el insumo del doble check:
#     python3 scripts/verificar_lugares.py            # contrasta y muestra
#     python3 scripts/verificar_lugares.py --escribir # deja el YAML aprobado
# que cruza cada dirección contra el catastro local de OpenStreetMap. Solo lo
# que las dos vías confirman entra a config/correcciones/lugares.yaml; lo que
# discrepa queda anotado acá para que alguien lo mire, porque un pin puesto a
# ojo manda a una persona a una esquina donde no hay nada.
#
# resultado: encontrado | no_encontrado | ambiguo | no_es_lugar
# confianza: alta (sitio oficial o ticketera con dirección completa)
#            media (directorio, red social, nota de prensa)
#            baja (la fuente no coincide o no se pudo confirmar el número)

