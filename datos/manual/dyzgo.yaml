# Fiestas de DyzGO (app.dyzgo.com), capturadas a mano el 16-08-2026.
#
# POR QUÉ ESTO NO ES UNA FUENTE AUTOMÁTICA
# ========================================
# DyzGO es una app de fiestas cuyo catálogo vive DENTRO de la app nativa. Su
# web no es un catálogo: app.dyzgo.com es una landing que dice "descarga la
# app" y abajo aclara su propósito real —"¿Tienes un link de evento? Ábrelo
# aquí y compra sin app"—, o sea que es un manejador de deep-links. No hay
# listado que recorrer ni paginación que seguir: para abrir un evento hay que
# tener su link de antemano.
#
# Lo que sí publican para máquinas es su sitemap.xml, y ahí exponen SOLO diez
# URLs (tres eventos y siete páginas de productoras). Estos son esos tres.
#
# Lo verificado el 16-08-2026, para no volver a investigarlo:
#   - robots.txt de app.dyzgo.com es permisivo: `Allow: /` y solo prohíbe las
#     rutas de pago (select-tickets, guest-info, payment). Declara sitemap.
#   - Toda ruta devuelve el mismo cascarón de 1.211 bytes: es una SPA de
#     Expo/React Native. Sin JSON-LD, sin Open Graph, sin datos en el HTML.
#   - El backend es Supabase (kovkkdhnmgavnqyjbqzd.supabase.co). Leerlo
#     directo exige sacar la credencial del bundle de JavaScript, y eso es
#     ir por detrás de lo que ellos publican en la web. Es la misma regla por
#     la que se apagó la fuente automática de Passline el mismo día: el
#     proyecto no evade controles de acceso ni usa credenciales ajenas.
#   - No tienen API pública documentada.
#
# El camino bueno es pedirles acceso: Loica les manda tráfico y siempre
# enlaza de vuelta a la fuente. Mientras tanto, esto.
#
# Los tres son "informativos" según la propia ficha ("No hay sistema de venta
# ni compra de entradas asociado... Toda la información publicada es solo
# referencial"), y la venta es EXTERNA, así que `link_entradas` no se pone:
# apuntaría a un botón que deriva a otra parte.

