# Descuentos de restaurantes de Banco Santander — captura MANUAL.
#
# Por qué no está en la corrida automática:
# banco.santander.cl responde 403 a cualquier petición que no venga de un
# navegador, y bloquea incluso /robots.txt — o sea, ni siquiera se puede leer
# qué permite y qué no. Con cabeceras completas de navegador devuelve un
# desafío de 4 KB en vez del contenido. Eso es mitigación de bots activa, y
# rodearla sería evadir un control que el banco puso a propósito. Este
# proyecto pide permiso antes de leer (ver loica/red.py); no va a hacer la
# excepción justo acá.
#
# Entonces esto es lo que haría una persona: abrir la página, mirarla y
# anotar lo que dice. Mismo criterio que datos/manual/ para los eventos que
# no se pueden rastrear.
#
# Como es una foto y no un flujo, ENVEJECE. Santander arma su calendario por
# campaña mensual, así que esto dura semanas, no meses. `run_descuentos.py`
# avisa cuando la captura pasa de 45 días y la página muestra la fecha en
# cada ficha. Para actualizar: abrir la fuente de abajo y rehacer la lista.

