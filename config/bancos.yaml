# Registro de bancos del catastro de descuentos.
# El sondeo completo (qué banco sirve, cuál está tras WAF y por qué) está en
# notas/catastro_descuentos_bancos.md
#
# adaptador: bancochile | bci | falabella
# Los tres endpoints son públicos y no piden credencial de usuario. Ninguno
# usa modelo de lenguaje: es Python leyendo JSON.

bancos:
- id: bancochile
  nombre: Banco de Chile
  # Edwards emite con la misma plataforma y los descuentos son los mismos
  emisor: Banco de Chile y Banco Edwards
  adaptador: bancochile
  url_base: https://sitiospublicos.bancochile.cl
  endpoint: /api/content/spaces/personas/types/beneficios/entries
  url_detalle: https://sitiospublicos.bancochile.cl/personas/beneficios/detalle/{slug}
  por_pagina: 100
  # El CMS entrega las 829 entradas de beneficios; nos quedamos con las de
  # comer. El resto (salud, belleza, deportes) es otro producto.
  categorias:
  - beneficios/sabores/restaurantes-y-bares
  - beneficios/sabores/sabores-gourmet
  - beneficios/sabores/cafeterias
  - beneficios/sabores/40-de-descuento-visa
  crawl_delay_seg: 1.5
  activo: true
  notas: 'La mejor fuente del catastro. 250 restaurantes y bares, 247 con el día de la semana en
    las etiquetas, y `Tarjetas Permitidas` como lista de slugs limpios. Sin token y sin WAF.

    '

- id: bci
  nombre: Bci
  emisor: Bci
  adaptador: bci
  # bci.cl/beneficios responde 403 (WAF). El portal de contenidos es abierto.
  url_base: https://www.vivirconbeneficios.cl
  endpoint: /descuentos/{categoria}/promotions.json
  por_pagina: 100
  categorias:
  - sabores/restaurantes
  - sabores/cafeteria
  - sabores/comida-rapida
  - sabores/gourmet-y-delicatessen
  crawl_delay_seg: 2
  activo: true
  notas: 'Mucho volumen (2.296 promociones en total) pero ni el día ni el porcentaje son campos:
    hay que sacarlos del HTML de `description` y `options.conditions`. Ese HTML es regular —usa
    clases `direccion` y `telefono`—, así que se parsea con selectores estables. Publica
    promociones sin tocar desde 2021: el filtro de vigencia acá no es opcional.

    '

- id: falabella
  nombre: Banco Falabella
  emisor: Banco Falabella · CMR
  adaptador: falabella
  # Contentful. El token es el Content Delivery de solo lectura que el propio
  # sitio trae incrustado en su bundle de JavaScript: es público por diseño.
  # Si algún día deja de responder, se saca de nuevo del bundle de /beneficios.
  url_base: https://cdn.contentful.com
  espacio: p6eyia4djstu
  entorno: master
  tipo_contenido: descuentos
  token_lectura: 560c0ddde9630e43122ef3e7879d69013844ee3d48c566d4ba93125924f080dd
  url_detalle: https://www.bancofalabella.cl/descuentos/detalle/{slug}
  por_pagina: 100
  # `categoriaV2` es la clasificación del banco. Antojos y Restaurantes son las
  # dos gastronómicas.
  categorias:
  - Restaurantes
  - Antojos
  crawl_delay_seg: 1.5
  activo: true
  # No son locales: son la portada de una cuponera. Colados entre los
  # restaurantes y con 50% encima, la lista abría prometiendo un lugar donde
  # comer que no existe.
  excluir_comercios:
  - Cuponera Generica
  - Cuponera Gastronómica
  notas: 'El único que trae el día como campo propio (`diasDescuento`) y la vigencia como fecha
    ISO real (`fechaTerminoV2`), así que no hay que parsear prosa para saber si sigue viva.

    '

- id: santander
  nombre: Santander
  emisor: Banco Santander
  # NO se rastrea. banco.santander.cl responde 403 a todo lo que no sea un
  # navegador y bloquea hasta /robots.txt, así que ni siquiera se puede leer
  # qué permite. Rodear eso sería evadir un control puesto a propósito.
  # El catálogo se anota a mano en el archivo de abajo, con su fecha.
  adaptador: santander
  archivo: datos/manual/descuentos_santander.yaml
  # Días desde la captura a partir de los cuales la corrida avisa que hay que
  # rehacerla. Santander arma campañas mensuales: 45 días ya es viejo.
  avisar_dias: 45
  activo: true
  notas: 'El mejor catálogo del mercado y el único que no se puede automatizar. 83 restaurantes,
    casi todos con día declarado, pero sin dirección ni link por local: Santander solo publica
    región y tipo de tarjeta (Amex y Limited son de gama alta, así que van marcados como
    segmentados).

    '

- id: cencosud
  nombre: Cencosud
  emisor: Cencosud Scotiabank
  adaptador: cencosud
  url_base: https://www.tarjetacencosud.cl
  url_agenda: https://www.tarjetacencosud.cl/publico/beneficios/landing/la-ruta-del-sabor
  # `categories` del JSON incrustado. "comida" es la única gastronómica.
  categorias:
  - comida
  crawl_delay_seg: 2
  activo: true
  notas: 'El catálogo va incrustado en la página como `window.CardsAPI`: no hay endpoint aparte,
    es un GET normal y un JSON dentro de un <script>. Aporta poco (de 83 beneficios, la categoría
    comida son 14 y ahí adentro hay cine y viajes) pero es abierto y sale barato.

    '

- id: ripley
  nombre: Banco Ripley
  emisor: Banco Ripley · CAR S.A.
  adaptador: ripley
  # Todo el back de Ripley pasa por un solo endpoint y el recurso concreto se
  # pide en la cabecera `x-path-api`. Es público y sin credencial: lo llama su
  # propia web abierta y robots.txt no lo prohíbe.
  url_base: https://www.bancoripley.cl
  endpoint: /api/call-sp-api
  ruta_api: /api/sp/beneficios/get-activeBox-beneficio
  seccion: restofans
  url_agenda: https://www.bancoripley.cl/beneficios-y-promociones
  crawl_delay_seg: 2
  activo: true
  notas: 'Restofans. El segundo mejor dato del catastro después de Banco de Chile: 73 restaurantes
    con día declarado en campo propio (`txtValidezBeneficio`), dirección con calle y número, tipo
    de cocina puesto por el banco (`txtSubtitulo`) y tope en el texto legal. Todos con 40% (50%
    para clientes Gold). La campaña es mensual y el nombre de la caja lo dice ("Restofans Agosto
    2026"), así que si un mes deja de aparecer no es que se cayó el adaptador: se acabó la campaña.

    '

- id: security
  nombre: Banco Security
  # Las dos marcas son el mismo emisor: la letra chica de los 80 beneficios
  # gastronómicos dice "Banco BICE, continuador legal de Banco Security".
  emisor: Banco Security · Banco BICE
  adaptador: security
  # JSON:API de Drupal, abierto y sin token. Ojo con el host: el sitio real es
  # personas.bancosecurity.cl; www.bancosecurity.cl es un ASP legacy cuyo
  # sitemap está fechado en 2012 y que ni siquiera sirve un robots.txt.
  url_base: https://personas.bancosecurity.cl
  endpoint: /jsonapi/node/beneficio
  # page[limit] tiene tope 50 en el propio Drupal; pedir más no trae más.
  por_pagina: 50
  # Términos del vocabulario `beneficios` de su propio Drupal, EN ORDEN DE
  # PRIORIDAD: un beneficio puede llevar dos y manda el primero que calce.
  # "Gourmet" va al final porque en Security NO es un rubro fino sino el
  # nombre de la sección de comida entera —su propia agenda vive en
  # /beneficios/gourmet y ahí adentro hay pizzerías, Rappi y una heladería—,
  # así que es el cajón grande. 27 de los 80 llevan Gourmet y Restaurantes a
  # la vez y se quedan con Restaurantes, que es lo que el banco agregó; con el
  # orden al revés el catálogo entero salía como gourmet (114 de 115 filas).
  # El vocabulario tiene además "Vinos y Licores" y "Saludable", hoy sin un
  # solo beneficio publicado; el resto (Viajes, Shopping y servicios,
  # Entretención, Bienestar) es otro producto.
  categorias:
  - Comida Rápida
  - Restaurantes
  - Gourmet
  crawl_delay_seg: 2
  activo: true
  # No son locales: son la portada de una cuponera, igual que las dos de
  # Falabella. Prometen un lugar donde comer que no existe, y encima entran
  # con el porcentaje en cero.
  excluir_comercios:
  - Mastercard - App Copec
  - The Mastercard Collection
  notas: 'La mejor fuente nueva desde Banco de Chile: los 80 beneficios gastronómicos traen el día
    en taxonomía propia (80 de 80) y la vigencia en fecha ISO. Son de barrio alto y de tarjeta de
    gama alta —Vitacura, Las Condes, Providencia y Lo Barnechea con Black y Black One—, así que
    todo el catálogo va marcado como segmentado.

    La campaña es mensual y eso se nota: 66 de los 80 vencen el 30 y el 31 de agosto de 2026. Si
    la corrida de septiembre trae cero o todo vencido no es que se rompió el adaptador, es que se
    acabó la campaña y Security todavía no publica la del mes; mismo criterio que Restofans de
    Ripley.

    Riesgo de mediano plazo: la letra chica dice "Banco BICE, continuador legal de Banco
    Security", o sea que este catálogo es el del grupo BICE-Security y entra por la única puerta
    abierta —banco.bice.cl está tras un desafío de Cloudflare y quedó fuera del catastro—. El día
    que la marca Security se apague y el contenido migre a bice.cl, esta fuente se pierde.

    '

- id: entel
  nombre: Entel
  emisor: Club Entel
  adaptador: entel
  url_base: https://www.entel.cl
  url_agenda: https://www.entel.cl/beneficios/
  # Las secciones del CMS. "Beneficios Comida" es la gastronómica; el resto es
  # ropa, viajes y entradas a eventos, que son otro producto.
  categorias:
  - Beneficios Comida
  crawl_delay_seg: 2
  activo: true
  notas: 'No es un banco sino una telco, pero el descuento funciona igual y la pregunta del usuario
    ("es martes, ¿dónde como?") no distingue quién lo emite. Aporta poco volumen —la sección de
    comida son unos pocos locales— pero casi todos traen el día en el texto ("25% dcto los días
    miércoles"). El catálogo va como JSON incrustado en el HTML (CMS Modyo), igual que Cencosud.
    No publica dirección ni comuna: esos locales dependen del préstamo entre bancos o de la
    memoria de correcciones para caer en el mapa.

    '
