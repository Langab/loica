# Correcciones de RESTORANES con descuento: un local → cocina, rubro,
# dirección, comuna y coordenadas.
#
# Los bancos publican el nombre del local y poco más. Acá se completa lo que
# ellos no dicen: qué tipo de cocina es (cuando el nombre no lo delata) y
# dónde queda (cuando ningún banco da la dirección). Aplica al mismo local en
# TODOS los bancos que lo publiquen.
#
# La clave es el nombre del comercio en minúsculas y sin tildes, y el match es
# EXACTO a propósito: "sushi home" no corrige a "Sushi Home Ñuñoa", que es
# otro local. Si la cadena tiene varios locales, una entrada por local tal
# como lo escribe el banco.
#
# Cocinas que entiende la página: japonesa, peruana, italiana, mexicana,
# parrilla, mariscos, asiatica, hamburguesas, pollo, vegetariana, panaderia,
# cafe, bar, chilena, comida_rapida.
# Rubros: restaurantes, cafeterias, gourmet, comida_rapida.
#
# Ejemplo:
#
#

# Las entradas de abajo las propuso scripts/mapear_restoranes.py cruzando el
# nombre del local contra el catastro local de OSM, y entraron por tener un
# calce único CON dirección: un negocio realmente mapeado, no un punto suelto.
# Las cadenas quedan fuera a propósito — la corrección se guarda por nombre y
# una sola ficha de "Starbucks" mandaría sus 135 locales a la misma esquina.

# Resueltos en Google Maps con el navegador, uno por uno. Se acepta solo
# cuando Maps devuelve UNA ficha de lugar con su dirección; si devuelve una
# lista de resultados el nombre es ambiguo y se deja sin pin (le pasó a
# "La Maestranza", con seis candidatos).
