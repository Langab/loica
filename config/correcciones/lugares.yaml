  # ---------------------------------------------------------------
  # Investigación web + doble check contra OSM — 22/23 de agosto de 2026
  # (scripts/verificar_lugares.py; la evidencia con URL de cada dirección
  #  está en datos/revision/investigacion_lugares_2026-08-22.yaml)
  #
  # Los 339 lugares que caían al centro de su comuna se ordenaron por impacto
  # y se buscaron uno por uno: la ficha del evento en la ticketera, el sitio
  # del recinto, el Registro Central de Colaboradores del Estado para las
  # juntas de vecinos. Cada dirección salió de una página citable, y después
  # se contrastó contra el catastro local de OpenStreetMap, que es un testigo
  # que no habló con el primero. Ninguna de las 95 discrepó por más de 1 km.
  #
  # Las entradas SIN lat/lon no son un olvido: son las direcciones que el
  # catastro no conoce (pasajes de población, sedes vecinales, cruces sin
  # número). Entran igual porque una dirección corregida mejora la búsqueda
  # de la corrida siguiente, y poner un pin a ojo sería justo lo que este
  # archivo existe para evitar.
  # ---------------------------------------------------------------
