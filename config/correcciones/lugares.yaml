# Correcciones de LUGARES: un lugar → su dirección, comuna y coordenadas.
#
# Es la memoria de arreglos de georreferenciación. El circuito:
# revisar_extraccion.py lista los lugares que concentran eventos sin ubicación
# exacta → una persona o una sesión de Claude verifica las coordenadas → se
# anotan acá UNA vez → aplican solas en todas las corridas futuras
# (exportar_web.py las lee antes de geocodificar).
#
# OJO: estas entradas MANDAN sobre el índice local de OSM (datos/indice_osm.db),
# así que solo se anota lo verificado. Si el índice ya resuelve la dirección
# del lugar, la entrada sirve igual para completar dirección/comuna que la
# fuente no publica — pero las coordenadas tienen que salir verificadas
# (Google Maps o el propio índice), no estimadas a ojo.
#
# La clave es el nombre del lugar (se normaliza sola: minúsculas, sin tildes)
# y matchea por contención: "sala master" le pega a "Sala Master — Radio U.
# de Chile". Las coordenadas deben caer en la RM (lat -34.05 a -33.00,
# lon -71.30 a -70.30). Cada entrada lleva `nota` con el origen del dato.

