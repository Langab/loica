               tributo, tributos, banda homenaje, banda tributo, homenaje a,
               gira, pregira, fin de gira, tour, world tour, latam tour,
               lanzamiento del disco, lanzamiento de disco, lanzamiento ep,
               lanzamiento single, listening party, release party,
               cantos y danzas, noche criolla, is back, big band, big-band]
    sin: [taller, curso, clase, clases, workshop, escuela de, academia,
           tour virtual, visita guiada, museo y tour, tour en el, tour por]
    donde: titulo
    categoria: musica
    nota: "el formato escrito en el título gana sobre cualquier otra palabra; 'tour' se excluye cuando es una visita guiada (Tour Claro Arena) porque eso no es una gira (2026-08-22)"

