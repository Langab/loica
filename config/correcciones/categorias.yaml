# Memoria de CATEGORÍAS: palabras en contexto → categoría.
#
# Es la memoria del clasificador (loica/clasificar.py). El clasificador tiene
# sus patrones en el código y funciona sin este archivo; lo que va acá es lo
# que la revisión aprendió mirando eventos de verdad: "Magallanes" al lado de
# "vs" es un partido, "maratón" al lado de "película" es cine, "Edo Caroe" es
# stand-up aunque lo vendan en una sala de conciertos. Cada regla vale para
# los eventos de hoy y para los que lleguen mañana con las mismas palabras.
#
# Cómo se lee una regla:
#   - nombre: qué es (aparece en la auditoría y en el informe)
#     palabras: [...]     alguna tiene que aparecer (frase completa, con límite
#                         de palabra; sin tildes ni mayúsculas, da lo mismo)
#     contexto: [...]     opcional: además, alguna de estas tiene que aparecer
#                         en el mismo texto. Es lo que hace segura a una
#                         palabra ambigua ("magallanes" + "vs")
#     sin: [...]          opcional: ninguna de estas puede aparecer
#     donde: titulo       titulo = etiqueta de la fuente + título (lo normal)
#                         texto  = título + descripción (ojo: trae ruido)
#                         lugar  = nombre del recinto + de la fuente; SOLO
#                                  opina cuando el texto no dijo nada, como el
#                                  prior de recinto del código
#     categoria: ...      idiomas familia feria deporte fiesta cine teatro
#                         musica arte clases aire_libre charla otros
#                         — o `descartar`: no es un panorama, no se publica
#     subcategoria: ...   opcional; también vale para una regla que solo
#                         corrige el segundo nivel (la categoría tiene que ser
#                         la que ya tiene el evento)
#     nota: por qué       el caso que la motivó y la fecha
#
# Orden: la PRIMERA regla que calza gana, y la memoria se consulta ANTES que
# los patrones del código. Lo específico va arriba. Una regla demasiado ancha
# se lleva eventos que estaban bien: antes de agregar una, medirla con
#     python3 scripts/auditar_categorias.py --comparar
# que muestra qué eventos cambian y hacia dónde, en las dos direcciones.
#
# Si una regla pide lógica (un orden, una excepción por recinto) o se repite
# con variantes, el arreglo de verdad va en loica/clasificar.py.

reglas:

  # ---------------------------------------------------------------
  # EL FORMATO DICHO EN EL TÍTULO manda sobre todo lo demás
  # Van primero porque son la señal más limpia que existe: el organizador
  # escribió qué es. Antes de esto, "Concierto de Fiestas Patrias" se iba a
  # fiesta por "fiestas patrias", "Concierto N°20 • Poemas, Danzas y Gloria"
  # a teatro por "danzas" y "TRIBUTO A BUENA VISTA SOCIAL CLUB" a fiesta por
  # "club" — en los tres el título ya decía la respuesta y el clasificador
  # miraba la otra palabra.
  # ---------------------------------------------------------------
  - nombre: el título dice que es un concierto
    palabras: [concierto, conciertos, recital, recitales, tocata, tocatas,
