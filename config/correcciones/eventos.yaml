# Correcciones de EVENTOS puntuales: un evento (por su id) → lo que haya que
# arreglarle. Es el bisturí; para arreglar un LUGAR completo usa lugares.yaml,
# que corrige todos sus eventos de una vez.
#
# La clave es el id del evento (hash_dedup, el mismo que aparece en
# web/eventos.json y en la revisión diaria). OJO: el id nace de
# título+fecha+lugar, así que si el organizador cambia la fecha, el evento
# vuelve con OTRO id y la corrección queda huérfana — por eso el bisturí es
# el último recurso y lo general va en lugares.yaml.
#
# Campos: categoria (idiomas, familia, feria, deporte, fiesta, cine, teatro,
# musica, arte, clases, aire_libre, charla, otros), publico (ninos,
# adolescentes, adultos, todos), lugar, direccion, comuna, lat, lon,
# descartar (true = no es un panorama, no se exporta), nota.

