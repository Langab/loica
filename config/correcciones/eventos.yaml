# Correcciones de EVENTOS puntuales: un evento (por su id) → lo que haya que
# arreglarle. Es el bisturí; para arreglar un LUGAR completo usa lugares.yaml,
# que corrige todos sus eventos de una vez.
#
# La clave es el id del evento (hash_dedup, el mismo que aparece en
# web/eventos.json y en la revisión diaria). OJO: el id nace de
# título+fecha+lugar, así que si el organizador cambia la fecha, el evento
# vuelve con OTRO id y la corrección queda huérfana — por eso el bisturí es
# el último recurso y lo general va en lugares.yaml.
#
# Campos: categoria (idiomas, familia, feria, deporte, fiesta, cine, teatro,
# musica, arte, clases, aire_libre, charla, otros), publico (ninos,
# adolescentes, adultos, todos), lugar, direccion, comuna, lat, lon,
# descartar (true = no es un panorama, no se exporta), nota.
#
# Y el segundo nivel, que solo existe en cinco categorías:
#   subcategoria  fiesta:  reggaeton electronica cumbia latina brasilera pop
#                          rock ochentera urbano
#                 teatro:  obra comedia danza circo performance
#                 clases:  cocina danza manualidades musica artes_visuales
#                          bienestar escritura tecnologia idiomas oficios
#                 musica:  rock urbano clasica jazz folclor cumbia pop tributo
#                          metal electronica
#                 deporte: futbol natacion running ciclismo artes_marciales
#                          gimnasia baile_fitness raqueta equipo
#   escala        masivo | under
# Los dos pueden salir vacíos del clasificador y eso es correcto. Una
# corrección solo sirve para poner un valor, no para borrarlo: si el
# clasificador está etiquetando de más, el arreglo va en loica/clasificar.py.
# La escala conviene corregirla en lugares.yaml — es del recinto, no del
# evento— y así vale para todas sus funciones.

