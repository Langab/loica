    "cf-mitigated: challenge", que es un Cloudflare Managed Challenge. Se probó con nuestro user-agent
    identificado, con uno de navegador y con uno que dice "bot": los tres dan 403, o sea NO es un filtro
    por user-agent como el de chilecultura, es puntaje de IP/huella TLS.

    Se deja configurada igual, SIN ninguna evasión, porque Cloudflare puntúa distinto cada red: desde
    la casa del curador puede pasar. Si el challenge responde, la fuente registra el error como cualquier
    otra y la corrida sigue. Lo que NO se hace es disfrazar el user-agent ni resolver el desafío: seria
    evadir un control de acceso explicito.

    Si queda bloqueada de forma permanente, las vias son dos: pedirle acceso a Passline (como intermediario
    les llevamos compradores a su checkout) o cargar eventos puntuales por datos/manual/*.yaml. Ademas
    varios recintos que venden por Passline publican el link en su propio sitio: club_chocolate ya aporta
