# Catastro de talleres permanentes de Santiago
# ============================================
#
# Lo que este archivo arregla: hasta el 24-08-2026 el 96% de las 1.879 clases
# publicadas venían de TRES corporaciones municipales de deportes (Ñuñoa 1.247,
# Huechuraba 384, Santiago 190) y el resto de la ciudad —la cerámica, el
# grabado, el teatro, la danza, los cursos para personas mayores— no aparecía.
# No es que no exista: es que un taller de barrio no publica agenda. Su clase
# de los martes a las 19:00 lleva años igual y no tiene nada que anunciar, así
# que no hay feed, ni JSON, ni calendario: hay una página que dice "Martes de
# 11:00 a 13:30 hrs" en prosa.
#
# Eso se cataloga a mano, una vez, como las salas de cine en `cines.yaml`.
# `loica/fuentes/talleres.py` lo convierte en una sesión por día y el export
# las junta en una tarjeta con sus días, que es lo que la página de talleres
# sabe filtrar.
#
# CÓMO SE AGREGA UN LUGAR
# -----------------------
#   - id: nombre-corto            # sin tildes ni espacios, único
#     nombre: Cómo se llama       # sale en la tarjeta y en la atribución
#     lugar: Centro de Extensión UC  # opcional: dónde se dicta, si no es el mismo
#                                    # nombre. Es lo que geocodifica el índice OSM.
#     url: https://...            # OBLIGATORIO: la página donde está el dato
#     direccion: Calle 1234       # como la escribe el lugar
#     comuna: Providencia
#     disciplina: ceramica        # informativo; la categoría la decide el clasificador
#     verificado: 2026-08-24      # el día que alguien MIRÓ la página
#     vigente_hasta: 2026-12-31   # opcional; por defecto verificado + 120 días
#     activo: true                # false = catastrado pero fuera del sitio
#     nota: ...                   # por qué está apagado, qué falta, qué avisar
#     talleres:
#       - titulo: Taller de xilografía
#         dias: [jueves]          # "lunes", "martes"... los lee recurrencia.py
#         hora_inicio: "15:00"
#         hora_fin: "19:00"
#         precio_texto: $120.000 por 4 clases
#         precio_clp: 120000      # opcional, si el precio es un número limpio
#         gratis: true            # opcional
#         vigente_desde: 2026-10-05   # opcional: temporadas que empiezan después
#
# LAS TRES REGLAS
# ---------------
# 1. Nada se inventa. Un taller entra con los días y la hora que su sitio
#    publica, citados de ahí. El que no los publica queda con `activo: false`
#    y una nota: existe, se sabe dónde está, y alguien puede llamar y
#    completarlo. Un horario inventado manda a una persona a una puerta cerrada.
# 2. Todo caduca. `verificado` + `vigente_hasta` mandan: pasada esa fecha el
#    lugar deja de emitir sesiones y la corrida avisa en su registro. Cuatro
#    meses es el largo de una temporada de talleres en Chile. Y ojo con las
#    páginas que no caducan solas: si un sitio anuncia "los domingos 5, 12, 19
#    y 26 de octubre", hay que revisar que esos días calcen con el año — en
#    2026 el 5 de octubre cae lunes, así que ese ciclo es de 2025 (le pasó a
#    Centro Cerámica, que por eso está apagado).
# 3. La atribución manda. Sin `url` no se publica. La tarjeta existe para
#    mandar gente al taller, no para reemplazarlo.
#
# Las direcciones de este catastro se contrastaron una por una contra el índice
# local de OpenStreetMap (`datos/indice_osm.db`): todas las de los lugares
# activos calzan calle+número en la comuna declarada, así que sus pines son
# exactos y no el centro de la comuna.

