name: Catastro diario de descuentos

# El pipeline de eventos corre en el Mac con launchd, y un Mac apagado no corre
# nada. Este corre en GitHub, así que no depende de que el computador esté
# despierto. Es Python leyendo JSON público: no llama a ningún modelo de
# lenguaje, no consume tokens y no cuesta nada.
on:
  schedule:
    # 03:00 en Chile continental, y ese horario lo manda la corrida de
    # eventos: desde el 24-08-2026 arranca a las 06:00 y dura ~105 minutos, y
    # regenera este mismo JSON en su paso 2/7. Si las dos se cruzaran habría
    # dos workflows empujando web/descuentos.json a la vez. Corriendo tres
    # horas antes no se pisan, y esto queda de red de seguridad: si la corrida
    # grande falla, los descuentos igual se actualizaron esa mañana.
    #
    # GitHub usa UTC y no sabe de horario de verano, así que se programan las
    # dos horas posibles: en invierno (UTC-4) la buena es la de las 07:00 UTC
    # y en verano (UTC-3) la de las 06:00. La otra encuentra el JSON idéntico
    # y no commitea nada. (La nota anterior tenía las estaciones al revés:
    # Chile está en UTC-4 en invierno y UTC-3 en verano, no al contrario.)
    #
    # Minuto 23 y no 0, igual que corrida.yml: las crons "en punto" se encolan
    # detrás de todo GitHub y estas venían arrancando entre 4 y 6 horas tarde
    # (las del 02-09-2026 corrieron a las 06:38 y 08:02 de Chile, encima de la
    # corrida grande). Fuera de la hora en punto la espera baja a minutos.
    - cron: "23 6 * * *"
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write    # para avisarle a pages.yml después de publicar

concurrency:
  group: descuentos
  cancel-in-progress: false

jobs:
  catastrar:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA y no por etiqueta: `@v4` es móvil y quien controle el
      # repositorio de la acción podría reapuntarla a otro commit, que correría
      # acá con permiso de escribir en main. El comentario dice qué versión es.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # El índice de OSM no es opcional acá desde que existen las cadenas.
      # `loica/descuentos/cadenas.py` lo usa para saber dónde quedan los Melt
      # Pizzas y los Burger King que el banco publica sin ninguna dirección, y
      # el geocodificador lo usa para resolver las calles. Sin él la corrida
      # NO falla: degrada en silencio y publica unos 400 locales menos que la
      # corrida grande de las 06:00, que sí lo baja. Dos corridas del mismo
      # día dejaban el sitio con catastros distintos según cuál corrió última.
      - name: Bajar el índice local de OpenStreetMap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download indice-osm --pattern indice_osm.db --dir datos --clobber
          python3 -c "import sqlite3; c = sqlite3.connect('datos/indice_osm.db'); print('locales en el índice:', c.execute('select count(*) from locales').fetchone()[0])"

      # Sin caché: en el runner la carpeta datos/cache viene vacía igual, y
      # dejarlo explícito evita que un día alguien la cachee y publiquemos
      # descuentos de la semana pasada.
      - name: Revisar los bancos
        run: python3 run_descuentos.py --sin-cache

      # Si un banco se cae, el JSON queda con menos descuentos pero no vacío.
      # Publicar una página vacía es peor que publicar la de ayer.
      #
      # Son DOS pisos porque son dos formas distintas de romperse. `total`
      # cuenta convenios y se cae cuando un banco deja de responder; `locales`
      # cuenta las sucursales del mapa, que es un catastro aparte —un convenio
      # puede traer veintiún pines o ninguno— y se vacía sin que el primer
      # número se entere, porque los convenios siguen todos ahí.
      # Hoy son 580 convenios y 1.626 locales. Los mismos números y el mismo
      # razonamiento están en verificar_web.py (MIN_LOCALES_DESCUENTOS): si se
      # tocan acá, se tocan allá.
      - name: No publicar si quedó vacío
        run: |
          leer() { python3 -c "import json;print(json.load(open('web/descuentos.json'))['$1'])"; }
          total=$(leer total); locales=$(leer locales)
          echo "Convenios: $total · locales: $locales"
          if [ "$total" -lt 100 ]; then
            echo "::error::Solo $total convenios. Algo se cayó — no se publica."
            exit 1
          fi
          if [ "$locales" -lt 1000 ]; then
            echo "::error::Solo $locales locales en el mapa. Se cayó el préstamo de sucursales entre bancos y el índice OSM a la vez — no se publica."
            exit 1
          fi

      - name: Publicar
        run: |
          git config user.name  "loica-bot"
          git config user.email "bot@loica.cl"
          # Solo el JSON: `informes/` está en .gitignore y el log de la corrida
          # ya queda en la pestaña de Actions.
          git add web/descuentos.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Descuentos al $(date -u +%Y-%m-%d)"
            git push
            echo "publicado=true" >> "$GITHUB_ENV"
          fi

      # Un push hecho con el token del workflow NO dispara pages.yml (la regla
      # de GitHub contra los bucles). Hasta el 02-09-2026 este commit se
      # quedaba en main sin llegar al sitio: la página seguía con los
      # descuentos del día en que alguien publicó a mano por última vez.
      - name: Avisar a Pages
        if: env.publicado == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
          fi
